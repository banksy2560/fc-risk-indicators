typology:
  id: BC-KLEPTO
  name: Kleptocracy and Grand Corruption Proceeds
  domain: bribery_corruption
  description: Laundering of funds misappropriated or extracted by senior officials and their networks,
    often through complex corporate structures, family members, luxury assets and international banking.
    Detection depends on PEP risk management, source-of-wealth understanding and scrutiny of unexplained
    wealth relative to official income.
  exposure:
    channels:
    - face_to_face_professional
    payment_rails:
    - wire_swift
    - loan_early_payout
    customer_segments:
    - pep_related
    - private_wealth
    - non_resident
    - third_party_funder
    products:
    - transaction_account
    - investment_securities
    - correspondent_account
    - personal_loan
    - home_loan_fixed
    - home_loan_variable
    basis: ai_inferred
    rationale: PEP-network proceeds via offshore structures, private banking, cross-border wires and property
      purchases.
    consumer:
      relevant: true
      products:
      - transaction_account
      - savings_account
      - term_deposit
      - home_loan_fixed
      - home_loan_variable
      channels:
      - branch
      - online_banking
      basis: ai_inferred
      rationale: PEP family and associates park proceeds in deposits and buy property with large unexplained
        deposits; handled mainly face to face or via online banking.
  sectors:
  - banking
  - securities
  - real_estate
  - corporate_services
  - art_luxury
  sources:
  - FATF, Laundering the Proceeds of Corruption (2011) <https://www.fatf-gafi.org/en/publications/Methodsandtrends/Laundering-the-proceeds-of-corruption.html>
    [agent-reviewed]
  - FATF, Guidance on Politically Exposed Persons (Recommendations 12 and 22) (2013) <https://www.fatf-gafi.org/en/publications/Fatfrecommendations/Peps-r12-r22.html>
    [agent-reviewed]
  - 'World Bank StAR and UNODC, Politically Exposed Persons: Preventive Measures for the Banking Sector
    (2010) [unverified]'
  - World Bank StAR, The Puppet Masters (2011) [unverified]
  indicators:
  - ref: IND-CUS-001
    legacy_id: BC-KLEPTO-001
    context: A PEP or close associate holds assets, accounts or lifestyle spending far exceeding legitimate
      known earnings.
    name_in_typology: Wealth disproportionate to official income
    false_positive_context: Wealth can come from inheritance, prior private career or family business.
    controls:
    - CTL-013
    - CTL-025
  - ref: IND-CUS-015
    legacy_id: BC-KLEPTO-002
    context: Funds and assets move through spouses, children, in-laws or business partners who have no
      obvious independent source of wealth.
    false_positive_context: Families commonly share finances and businesses.
    controls:
    - CTL-028
    - CTL-048
  - ref: IND-OWN-002
    legacy_id: BC-KLEPTO-003
    context: PEP-linked funds sit in multi-jurisdiction companies, foundations or trusts with nominee
      directors and no clear business purpose.
    name_in_typology: Layered offshore entities and trusts
    false_positive_context: Wealth planning and estate structures are often legitimately multi-layered.
    controls:
    - CTL-008
    - CTL-032
  - ref: IND-TXN-041
    legacy_id: BC-KLEPTO-004
    context: Funds from government bodies or state enterprises arrive at private or personal accounts
      with no apparent contractual basis.
    false_positive_context: State suppliers and contractors receive government funds legitimately.
    controls:
    - CTL-058
    - CTL-026
    - CTL-042
  - ref: IND-PRD-001
    legacy_id: BC-KLEPTO-005
    context: Acquisition of high-value property abroad through companies or relatives, inconsistent with
      declared means.
    false_positive_context: Wealthy individuals legitimately invest in overseas property.
    controls:
    - CTL-026
    - CTL-005
  - ref: IND-CUS-003
    legacy_id: BC-KLEPTO-006
    context: Credible reporting or enforcement action links the customer or associates to misappropriation
      of state funds.
    name_in_typology: Adverse media on embezzlement or procurement fraud
    false_positive_context: Media can be politically motivated or inaccurate, especially in repressive
      jurisdictions.
    controls:
    - CTL-032
    - CTL-033
  - ref: IND-TXN-042
    legacy_id: BC-KLEPTO-007
    context: Large sums move quickly through several banks and jurisdictions after arrival, with no hold
      period.
    false_positive_context: Treasury and liquidity management can cause fast movements.
    controls:
    - CTL-040
    - CTL-105
  - ref: IND-BEH-026
    legacy_id: BC-KLEPTO-008
    context: High-value purchases of yachts, jets, art, jewellery or education by a PEP-linked customer
      not explained by known income.
    false_positive_context: Some customers have undeclared legitimate wealth sources not yet documented.
    controls:
    - CTL-043
