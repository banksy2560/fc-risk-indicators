typology:
  id: FR-TFIN
  name: Trade and Invoice Financing Fraud
  domain: fraud
  description: Borrowers finance the same receivable or goods more than once, forge invoices, or obtain
    advances on fictitious trade. Fraud may involve connected parties and weak verification of underlying
    transactions.
  exposure:
    channels:
    - broker_intermediary
    - online_banking
    payment_rails:
    - trade_instruments
    - wire_swift
    customer_segments:
    - sme
    - corporate
    products:
    - trade_finance
    - loan_mortgage
    basis: ai_inferred
    rationale: Duplicate/fictitious receivable and trade financing.
  sectors:
  - banking
  - corporate_services
  sources:
  - 'FATF and Egmont Group, Trade-Based Money Laundering: Trends and Developments (2020) <https://www.fatf-gafi.org/en/publications/Methodsandtrends/Trade-based-money-laundering-trends-and-developments.html>
    [agent-reviewed]'
  - ICC, trade finance fraud and BAFT guidance (general) [too vague, unverified]
  - 'ACFE, Occupational Fraud 2024: A Report to the Nations (2024) <https://www.acfe.com/report-to-the-nations/2024>
    [corrected, agent-reviewed]'
  indicators:
  - ref: IND-DOC-038
    legacy_id: FR-TFIN-001
    context: Duplicate financing detected by registry or internal matching.
    name_in_typology: Same invoice or bill of lading presented to multiple financiers
    false_positive_context: Reassignments.
    controls:
    - CTL-087
    - CTL-086
    - CTL-083
    references:
    - 'FATF and Egmont Group, Trade-Based Money Laundering: Trends and Developments (2020)'
  - ref: IND-CPT-029
    legacy_id: FR-TFIN-002
    context: Counterparties share ownership and amounts look artificial.
    false_positive_context: Group trading.
    controls:
    - CTL-086
    - CTL-049
    - CTL-087
    references:
    - 'FATF and Egmont Group, Trade-Based Money Laundering: Trends and Developments (2020)'
  - ref: IND-CPT-030
    legacy_id: FR-TFIN-003
    context: Obligor verification fails.
    false_positive_context: Admin lag.
    controls:
    - CTL-086
    - CTL-070
    - CTL-175
    references:
    - 'FATF and Egmont Group, Trade-Based Money Laundering: Trends and Developments (2020)'
  - ref: IND-TXN-082
    legacy_id: FR-TFIN-004
    context: Revolving structure where old invoices are settled with new drawings.
    false_positive_context: Working-capital cycles.
    controls:
    - CTL-037
    - CTL-175
    - CTL-014
    references:
    - 'FATF and Egmont Group, Trade-Based Money Laundering: Trends and Developments (2020)'
  - ref: IND-DOC-020
    legacy_id: FR-TFIN-005
    context: Dates, weights, ports or vessel details do not align.
    name_in_typology: Shipping documents inconsistent with goods or route
    severity_in_typology: medium
    false_positive_context: Clerical errors.
    controls:
    - CTL-086
    - CTL-002
    - CTL-175
    references:
    - 'FATF and Egmont Group, Trade-Based Money Laundering: Trends and Developments (2020)'
  - ref: IND-TXN-083
    legacy_id: FR-TFIN-006
    context: Facility usage rises faster than turnover.
    false_positive_context: Genuine expansion.
    controls:
    - CTL-014
    - CTL-037
    - CTL-175
    references:
    - 'FATF and Egmont Group, Trade-Based Money Laundering: Trends and Developments (2020)'
  - ref: IND-TXN-084
    legacy_id: FR-TFIN-007
    context: Proceeds sent to parties outside the trade.
    false_positive_context: Group treasury.
    controls:
    - CTL-037
    - CTL-086
    - CTL-083
    references:
    - 'FATF and Egmont Group, Trade-Based Money Laundering: Trends and Developments (2020)'
  - ref: IND-BEH-082
    legacy_id: FR-TFIN-008
    context: Obstructive behaviour.
    false_positive_context: Confidentiality concerns.
    controls:
    - CTL-086
    - CTL-170
    - CTL-175
    references:
    - 'FATF and Egmont Group, Trade-Based Money Laundering: Trends and Developments (2020)'
