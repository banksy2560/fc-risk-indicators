typology:
  id: TX-VATFRAUD
  name: VAT and Carousel Fraud
  domain: tax_evasion
  description: Missing-trader and carousel schemes exploit VAT refund and cross-border zero-rating rules
    by creating chains of invoices and trades where the VAT collected is never remitted. Common goods
    include electronics, metals, and emissions allowances; flows are fast, circular and between thinly
    capitalised companies.
  exposure:
    channels:
    - online_banking
    payment_rails:
    - wire_swift
    - fast_payments
    customer_segments:
    - sme
    - corporate
    products:
    - transaction_account
    - trade_finance
    basis: ai_inferred
    rationale: Missing-trader chains between thin companies with same-day circular flows of VAT-bearing
      payments.
  sectors:
  - banking
  - payments
  - corporate_services
  sources:
  - Europol and EU bodies, public material on missing trader intra-community (MTIC) fraud [replacement
    suggested, unverified]
  - OECD, Technology Tools to Tackle Tax Evasion and Tax Fraud (2017) [unverified]
  - FATF/OECD, Money Laundering Awareness Handbook for Tax Examiners and Tax Auditors (2012) [replacement
    suggested, unverified]
  - Council Directive 2006/112/EC on the common system of value added tax [replacement suggested, unverified]
  indicators:
  - ref: IND-CUS-010
    legacy_id: TX-VATFRAUD-001
    context: Company with minimal history, few staff and basic premises records large intra-EU or cross-border
      turnover quickly.
    name_in_typology: Newly formed company with rapid high-value cross-border trading
    false_positive_context: Fast-growing start-ups and trading vehicles exist.
    controls:
    - CTL-010
    - CTL-054
  - ref: IND-TXN-015
    legacy_id: TX-VATFRAUD-002
    context: Funds return to origin after passing through several companies in a chain within days.
    name_in_typology: Circular payment flows among related counterparties
    false_positive_context: Group treasury or back-to-back trading may be similar.
    controls:
    - CTL-047
    - CTL-095
  - ref: IND-TYP-053
    legacy_id: TX-VATFRAUD-003
    context: Trade in mobile phones, chips, precious metals, or CO2 allowances with no storage or transport
      evidence.
    false_positive_context: These goods are legitimate high-volume trade lines.
    controls:
    - CTL-015
    - CTL-125
  - ref: IND-TXN-144
    legacy_id: TX-VATFRAUD-004
    context: Funds received from buyer are paid onward to supplier, often same day, leaving little retained.
    false_positive_context: Distributors and agents may operate on thin margins and pass-through.
    controls:
    - CTL-040
    - CTL-055
  - ref: IND-GEO-019
    legacy_id: TX-VATFRAUD-005
    context: Counterparties are in different countries from the goods' origin or destination, often via
      third-country accounts.
    name_in_typology: Payments to or from jurisdictions unrelated to goods
    false_positive_context: Complex supply chains cause legitimate triangulation.
    controls:
    - CTL-045
    - CTL-046
  - ref: IND-OWN-009
    legacy_id: TX-VATFRAUD-006
    context: Officers or premises previously appeared in VAT-defaulting entities or liquidations.
    name_in_typology: Directors or addresses linked to prior defaulted VAT companies
    false_positive_context: Directors can have genuine business failures.
    controls:
    - CTL-032
    - CTL-049
  - ref: IND-DOC-066
    legacy_id: TX-VATFRAUD-007
    context: Documents share templates, wording or bank accounts across different companies.
    false_positive_context: Accounting software may produce similar templates.
    controls:
    - CTL-087
    - CTL-123
  - ref: IND-BEH-113
    legacy_id: TX-VATFRAUD-008
    context: Account activity ceases and balances drain just before VAT returns fall due.
    false_positive_context: Seasonal businesses may pause trading.
    controls:
    - CTL-017
    - CTL-096
