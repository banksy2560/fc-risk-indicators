typology:
  id: ML-PMLN
  name: Professional Money Laundering Networks
  domain: money_laundering
  description: Specialists who launder criminal proceeds for others as a service, for a fee or commission,
    using networks of couriers, brokers, front companies, accounts and informal value transfer. They run
    structured, repeatable laundering infrastructure serving multiple criminal clients.
  exposure:
    channels:
    - broker_intermediary
    - online_banking
    payment_rails:
    - wire_swift
    - cross_border_remittance
    - cash
    - informal_value_transfer
    - fast_payments
    customer_segments:
    - professional_intermediary
    - msb_remitter
    - sme
    - corporate
    products:
    - transaction_account
    basis: ai_inferred
    rationale: Specialist networks use front-company accounts, MSBs, couriers and informal value transfer
      with mirror transactions across jurisdictions.
    consumer:
      relevant: true
      products:
      - transaction_account
      - savings_account
      channels:
      - mobile_app
      - online_banking
      - branch
      basis: ai_inferred
      rationale: Professional launderers recruit or run multiple personal accounts for third-party flows
        with fee retention; commercial and trade elements excluded.
  stage:
  - placement
  - layering
  - integration
  sectors:
  - banking
  - mvts
  - corporate_services
  - dnfbp
  sources:
  - FATF, Professional Money Laundering (2018) [unverified]
  - FATF, Professional Money Laundering (2018); FATF and Egmont, Concealment of Beneficial Ownership (2018)
    <https://www.fatf-gafi.org/en/publications/Methodsandtrends/Professional-money-laundering.html> [corrected,
    agent-reviewed]
  - Europol, European Union Serious and Organised Crime Threat Assessment (EU SOCTA) (specify 2021 or
    2025) <https://www.europol.europa.eu/> [corrected, agent-reviewed]
  indicators:
  - ref: IND-OWN-010
    legacy_id: ML-PMLN-001
    context: Multiple accounts or companies linked to the same controllers are used for flows of different,
      unrelated parties.
    name_in_typology: Accounts serving many unrelated clients with common controller
    severity_in_typology: high
    false_positive_context: Payment agents and accountants hold client money legitimately.
    controls:
    - CTL-119
    - CTL-048
  - ref: IND-TXN-115
    legacy_id: ML-PMLN-002
    context: Recurring small percentage retained from inbound flows consistent with fee-taking by an intermediary.
    false_positive_context: Brokers and payment agents charge fees.
    controls:
    - CTL-040
    - CTL-112
  - ref: IND-TXN-016
    legacy_id: ML-PMLN-003
    context: Payments in one country are balanced by payments elsewhere without movement of funds between
      them.
    severity_in_typology: high
    false_positive_context: Netting and bank-to-bank settlement may look similar.
    controls:
    - CTL-047
    - CTL-052
  - ref: IND-OWN-007
    legacy_id: ML-PMLN-004
    context: Large number of newly formed companies cycle funds with vague trade descriptions.
    name_in_typology: Use of numerous shell companies with generic activity
    false_positive_context: Corporate groups have many subsidiaries.
    controls:
    - CTL-010
    - CTL-008
  - ref: IND-CPT-058
    legacy_id: ML-PMLN-005
    context: Payers settle obligations of others without clear relationship, often in trade or loan context.
    name_in_typology: Third-party payments for unrelated debts or purchases
    false_positive_context: Guarantors or group treasury pay for others.
    controls:
    - CTL-046
  - ref: IND-CPT-059
    legacy_id: ML-PMLN-006
    context: Counterparties or controllers appear in law-enforcement notices, adverse media or intelligence.
    name_in_typology: Links to known launderers or adverse media
    false_positive_context: Name matches may be false.
    controls:
    - CTL-032
    - CTL-097
  - ref: IND-TYP-038
    legacy_id: ML-PMLN-007
    context: One flow touches cash, remitters, trade invoices, crypto and corporate accounts in a short
      time.
    false_positive_context: Complex corporate treasury flows exist.
    controls:
    - CTL-039
    - CTL-095
  - ref: IND-BEH-003
    legacy_id: ML-PMLN-008
    context: Controllers cannot explain commercial purpose or counterparties.
    name_in_typology: Customer lacks understanding of the transactions it executes
    severity_in_typology: medium
    false_positive_context: New clients may be inexperienced.
    controls:
    - CTL-011
    - CTL-170
  - ref: IND-PRD-046
    legacy_id: ML-PMLN-009
    context: Cash movement is blended with bank transfers via associated money service businesses.
    name_in_typology: Frequent use of cash couriers or exchange houses alongside bank flows
    false_positive_context: MSB use is common in some communities.
    controls:
    - CTL-024
    - CTL-055
