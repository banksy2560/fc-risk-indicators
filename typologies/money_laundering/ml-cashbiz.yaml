typology:
  id: ML-CASHBIZ
  name: Cash-Intensive Businesses
  domain: money_laundering
  description: Use of businesses that naturally handle large cash volumes, such as restaurants, car washes,
    laundromats, vending, convenience stores and nail salons, to blend illicit cash with legitimate takings.
    Deposits are inflated to fit the business's apparent scale.
  stage:
  - placement
  - layering
  sectors:
  - banking
  - payments
  - dnfbp
  sources:
  - 'FATF, Money Laundering Typologies: cash-intensive business guidance (general)'
  - FinCEN, SAR Activity Review on cash-intensive businesses (general)
  - JMLSG Guidance Part II, sector guidance on cash-intensive customers (general)
  indicators:
  - ref: IND-TXN-100
    legacy_id: ML-CASHBIZ-001
    context: Declared turnover or deposits are higher than the premises size, staffing, opening hours
      or stock purchases would support.
    false_positive_context: New or fast-growing businesses can legitimately outperform peers.
    controls:
    - CTL-064
    - CTL-055
  - ref: IND-TXN-101
    legacy_id: ML-CASHBIZ-002
    context: Cash takings are high but there are few payments to suppliers, rent, wages or tax authorities.
    false_positive_context: Cash-paid suppliers or off-account costs may exist.
    controls:
    - CTL-055
    - CTL-065
  - ref: IND-TXN-102
    legacy_id: ML-CASHBIZ-003
    context: Step-change in deposit values or frequency without explanation such as new outlets or season.
    false_positive_context: Expansion, promotion or events can explain growth.
    controls:
    - CTL-042
    - CTL-022
  - ref: IND-TYP-030
    legacy_id: ML-CASHBIZ-004
    context: Cash business operating where demand appears limited, with few visible customers or irregular
      hours.
    false_positive_context: Online-only operations or early-stage businesses may appear quiet.
    controls:
    - CTL-010
  - ref: IND-CPT-058
    legacy_id: ML-CASHBIZ-005
    context: Deposits include cheques, transfers or cash from persons unconnected to trading, or rotated
      across several business accounts.
    name_in_typology: Cash deposits mixed with unrelated third-party funds
    false_positive_context: Owners may inject funds legitimately as capital.
    controls:
    - CTL-055
    - CTL-012
  - ref: IND-OWN-005
    legacy_id: ML-CASHBIZ-006
    context: Unclear beneficial owners, nominee directors or frequent ownership change in a cash business.
    name_in_typology: Ownership or management opaque for cash business
    false_positive_context: Family businesses may have informal arrangements.
    controls:
    - CTL-005
    - CTL-014
  - ref: IND-TXN-103
    legacy_id: ML-CASHBIZ-007
    context: Cash is repeatedly withdrawn and redeposited, or round-tripped with associated accounts.
    false_positive_context: Float management for tills may look similar.
    controls:
    - CTL-047
    - CTL-011
  - ref: IND-OWN-010
    legacy_id: ML-CASHBIZ-008
    context: Common owners or addresses across several cash businesses with cross-funding.
    name_in_typology: Multiple cash businesses controlled by same people
    false_positive_context: Franchise or serial entrepreneurs are common.
    controls:
    - CTL-049
    - CTL-039
