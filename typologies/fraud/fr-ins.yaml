typology:
  id: FR-INS
  name: Insurance Fraud
  domain: fraud
  description: Fraud may be opportunistic (inflated claims) or organised (staged accidents, ghost brokers,
    fake policies). Insurers and banks may see related payments, claimants and repairers.
  sectors:
  - insurance
  - banking
  sources:
  - Insurance Fraud Bureau (UK), published guidance on fraud trends (general)
  - Association of British Insurers, annual detected fraud statistics (general)
  - ACFE, Report to the Nations (published biennially)
  indicators:
  - ref: IND-TYP-025
    legacy_id: FR-INS-001
    context: Loss occurs soon after purchase or upgrade of cover.
    false_positive_context: Genuine early loss.
    controls:
    - CTL-084
    - CTL-085
    - CTL-083
    references:
    - Insurance Fraud Bureau (UK), published guidance on fraud trends (general)
  - ref: IND-CPT-023
    legacy_id: FR-INS-002
    context: Same people, vehicles or addresses appear in multiple claims.
    false_positive_context: Coincidental similarity.
    controls:
    - CTL-083
    - CTL-085
    - CTL-049
    references:
    - Insurance Fraud Bureau (UK), published guidance on fraud trends (general)
  - ref: IND-DOC-030
    legacy_id: FR-INS-003
    context: Statements, evidence and photos do not match.
    false_positive_context: Memory differences.
    controls:
    - CTL-085
    - CTL-170
    - CTL-002
    references:
    - Insurance Fraud Bureau (UK), published guidance on fraud trends (general)
  - ref: IND-CPT-024
    legacy_id: FR-INS-004
    context: Providers submit pattern-bearing invoices with unusual pricing.
    false_positive_context: Legitimate specialist providers.
    controls:
    - CTL-085
    - CTL-175
    - CTL-049
    references:
    - Insurance Fraud Bureau (UK), published guidance on fraud trends (general)
  - ref: IND-BEH-071
    legacy_id: FR-INS-005
    context: Claimant urges payment and resists documentation.
    false_positive_context: Genuine hardship.
    controls:
    - CTL-170
    - CTL-085
    - CTL-070
    references:
    - Insurance Fraud Bureau (UK), published guidance on fraud trends (general)
  - ref: IND-PRD-036
    legacy_id: FR-INS-006
    context: 'Victim-side: customer pays for cover that does not exist or is under false details.'
    false_positive_context: Cheap but genuine policy.
    controls:
    - CTL-074
    - CTL-082
    - CTL-084
    references:
    - Insurance Fraud Bureau (UK), published guidance on fraud trends (general)
  - ref: IND-TXN-024
    legacy_id: FR-INS-007
    context: Claim proceeds are redirected via mule accounts.
    name_in_typology: Payments from claims to unrelated third parties
    severity_in_typology: medium
    false_positive_context: Assignment to repairers.
    controls:
    - CTL-051
    - CTL-037
    - CTL-083
    references:
    - Insurance Fraud Bureau (UK), published guidance on fraud trends (general)
  - ref: IND-TYP-026
    legacy_id: FR-INS-008
    context: Low-impact incidents with multiple occupants, witness and similar circumstances.
    false_positive_context: Genuine busy-road incidents.
    controls:
    - CTL-085
    - CTL-049
    - CTL-083
    references:
    - Insurance Fraud Bureau (UK), published guidance on fraud trends (general)
  - ref: IND-DOC-031
    legacy_id: FR-INS-009
    context: Details given at quote differ from actual use.
    false_positive_context: Honest oversight.
    controls:
    - CTL-084
    - CTL-083
    - CTL-085
    references:
    - Insurance Fraud Bureau (UK), published guidance on fraud trends (general)
