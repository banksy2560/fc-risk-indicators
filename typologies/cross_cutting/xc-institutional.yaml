typology:
  id: XC-INSTITUTIONAL
  name: Institutional Control Environment Risk
  domain: cross_cutting
  description: Indicators that the institution's own control environment may be weakened, increasing residual
    exposure to financial crime. Covers governance, alert backlogs, tuning gaps, insider risk, data quality
    and outsourcing. Intended for the control-effectiveness side of an enterprise-wide risk assessment.
  exposure:
    channels: []
    payment_rails: []
    customer_segments: []
    products: []
    basis: ai_inferred
    rationale: Institution's own control environment; not an exposure of a channel, rail, segment or product.
    consumer:
      relevant: true
      products: []
      channels: []
      basis: ai_inferred
      rationale: Cross-cutting risk factor; applies across all consumer products and channels. Bank control-environment
        weaknesses.
  sectors:
  - all
  sources:
  - FATF, Guidance for a Risk-Based Approach (sector-specific guidance series, general principles) [too
    vague, unverified]
  - FATF Recommendations, Recommendation 1 and Interpretive Note (assessing risks and applying a risk-based
    approach) <https://www.fatf-gafi.org/en/publications/Fatfrecommendations/Fatf-recommendations.html>
    [agent-reviewed]
  - Wolfsberg Group, Guidance on a Risk Based Approach for Managing Money Laundering Risks (2006) <https://wolfsberg-group.org/resources/rba>
    [corrected, agent-reviewed]
  indicators:
  - ref: IND-BEH-029
    legacy_id: XC-INSTITUTIONAL-001
    context: Board and senior management receive limited or irregular financial crime reporting and there
      is unclear accountability.
    false_positive_context: Small firms may have lean but effective governance.
    controls:
    - CTL-155
    - CTL-156
    - CTL-175
    - CTL-157
  - ref: IND-BEH-030
    legacy_id: XC-INSTITUTIONAL-002
    context: Monitoring or screening alerts stay unreviewed beyond service levels.
    false_positive_context: Temporary spikes follow list changes.
    controls:
    - CTL-160
    - CTL-099
    - CTL-175
  - ref: IND-BEH-031
    legacy_id: XC-INSTITUTIONAL-003
    context: Rules and models have not been calibrated, tested or reviewed against current risk.
    false_positive_context: Stable portfolios may need little change.
    controls:
    - CTL-159
    - CTL-052
    - CTL-175
  - ref: IND-BEH-019
    legacy_id: XC-INSTITUTIONAL-004
    context: Employees show unusual relationships with customers, override controls or access records
      without need.
    name_in_typology: Staff collusion or insider risk indicators
    false_positive_context: Many access anomalies are benign.
    controls:
    - CTL-177
    - CTL-163
  - ref: IND-BEH-032
    legacy_id: XC-INSTITUTIONAL-005
    context: Missing, inconsistent or incorrectly mapped data weakens screening and monitoring.
    false_positive_context: Legacy systems carry known gaps.
    controls:
    - CTL-176
    - CTL-110
    - CTL-175
  - ref: IND-BEH-033
    legacy_id: XC-INSTITUTIONAL-006
    context: Screening, onboarding or investigation tasks are outsourced with limited oversight.
    false_positive_context: Outsourcing is common and manageable.
    controls:
    - CTL-115
  - ref: IND-BEH-034
    legacy_id: XC-INSTITUTIONAL-007
    context: Customer reviews exceed scheduled dates, particularly for high-risk customers.
    false_positive_context: Short delays can happen.
    controls:
    - CTL-014
    - CTL-160
  - ref: IND-BEH-035
    legacy_id: XC-INSTITUTIONAL-008
    context: Risk assessment is stale, unscoped, or not used to drive controls.
    false_positive_context: Cycles vary by firm size.
    controls:
    - CTL-157
    - CTL-015
    - CTL-052
  - ref: IND-BEH-036
    legacy_id: XC-INSTITUTIONAL-009
    context: Staff cannot recognise red flags, late completion of training, high error rates in quality
      checks.
    false_positive_context: New joiners are temporarily untrained.
    controls:
    - CTL-169
    - CTL-175
  - ref: IND-BEH-037
    legacy_id: XC-INSTITUTIONAL-010
    context: Reports are filed late, are thin in content or the volume is out of line with peers.
    false_positive_context: Volumes depend on portfolio.
    controls:
    - CTL-099
    - CTL-175
    - CTL-098
  - ref: IND-BEH-038
    legacy_id: XC-INSTITUTIONAL-011
    context: Previous findings remain open or recur.
    false_positive_context: Remediation can be long-running by design.
    controls:
    - CTL-161
    - CTL-175
    - CTL-155
