typology:
  id: PF-MARITIME
  name: 'Maritime Evasion: Flag Hopping, AIS Manipulation and Ship-to-Ship Transfers'
  domain: proliferation_financing
  description: Vessels linked to proliferation-sensitive trade may change flags, ownership and names,
    disable or falsify identification signals, and conduct cargo transfers at sea. Maritime due diligence
    uses vessel history, tracking data and ownership analysis to identify these behaviours without relying
    only on documents.
  sectors:
  - banking
  - trade_finance
  - insurance
  sources:
  - FATF, Guidance on Counter Proliferation Financing (2018)
  - US Department of State, Treasury and Coast Guard, Global Maritime Advisory on sanctions evasion (2020)
  - Reports of the UN Panel of Experts on the DPRK (issuing body general reference)
  indicators:
  - ref: IND-TYP-047
    legacy_id: PF-MARITIME-001
    context: Vessel stops transmitting position data for extended periods near ports or transhipment areas
      of concern.
    false_positive_context: Poor coverage and equipment faults cause gaps.
    controls:
    - CTL-143
    - CTL-126
    - CTL-138
  - ref: IND-TYP-048
    legacy_id: PF-MARITIME-002
    context: Short intervals between flag changes or use of open registries with poor enforcement.
    false_positive_context: Sale and commercial reasons motivate flag changes.
    controls:
    - CTL-143
    - CTL-154
  - ref: IND-TYP-049
    legacy_id: PF-MARITIME-003
    context: Vessel meets others at sea away from regular transfer zones, followed by changed destination.
    name_in_typology: Ship-to-ship transfers outside designated areas
    false_positive_context: STS operations are routine in certain trades.
    controls:
    - CTL-143
    - CTL-135
    - CTL-036
  - ref: IND-OWN-009
    legacy_id: PF-MARITIME-004
    context: Vessel owner or manager changes frequently, with newly formed companies and shared addresses.
    name_in_typology: Ownership and management by shell entities with rapid changes
    false_positive_context: Single-ship companies are normal in shipping.
    controls:
    - CTL-005
    - CTL-048
  - ref: IND-DOC-056
    legacy_id: PF-MARITIME-005
    context: Physical details, IMO or name do not match registry records, or signs of identity spoofing.
    false_positive_context: Data entry errors occur.
    controls:
    - CTL-143
    - CTL-126
    - CTL-142
  - ref: IND-GEO-025
    legacy_id: PF-MARITIME-006
    context: Vessel declares destinations inconsistent with subsequent movements.
    false_positive_context: Cargo routing changes frequently.
    controls:
    - CTL-143
  - ref: IND-TXN-023
    legacy_id: PF-MARITIME-007
    context: Operating costs paid by third parties unconnected to the shipowner or charterer.
    name_in_typology: Payments for bunkers, port fees or crew from unrelated parties
    false_positive_context: Ship agents pay on behalf of owners.
    controls:
    - CTL-046
  - ref: IND-DOC-057
    legacy_id: PF-MARITIME-008
    context: Cover is cancelled, provided by unknown insurers or classification society changes.
    false_positive_context: Cover changes with market conditions.
    controls:
    - CTL-143
