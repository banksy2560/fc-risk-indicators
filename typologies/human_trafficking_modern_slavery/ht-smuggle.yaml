typology:
  id: HT-SMUGGLE
  name: Migrant Smuggling
  domain: human_trafficking_modern_slavery
  description: Facilitation of illegal border crossings for payment, typically organised by networks which
    collect fees from migrants or their families, often through informal value transfer, and spend on
    transport, documents and accommodation. Unlike trafficking, consent is initial, but exploitation and
    abuse are common risks.
  sectors:
  - banking
  - mvts
  - payments
  - fintech
  sources:
  - FATF, Money Laundering Risks from Migrant Smuggling (2022)
  - UNODC, Global Study on Smuggling of Migrants
  - FATF, Money Laundering Risks Arising from Trafficking in Human Beings and Smuggling of Migrants (2011)
  - Europol and Interpol, public material on migrant smuggling networks
  indicators:
  - ref: IND-TXN-093
    legacy_id: HT-SMUGGLE-001
    context: Repeated transfers from diaspora senders to third-country individuals with messages about
      journeys or guarantees.
    false_positive_context: Families fund legitimate travel and relocation.
    controls:
    - CTL-030
    - CTL-041
  - ref: IND-PRD-040
    legacy_id: HT-SMUGGLE-002
    context: Funds held by an agent and released only upon arrival, sometimes via hawala-type providers.
    false_positive_context: Informal remittance is used widely for legitimate reasons.
    controls:
    - CTL-021
    - CTL-052
  - ref: IND-TXN-094
    legacy_id: HT-SMUGGLE-003
    context: Purchases of inflatable boats, engines, vans or lorries paid in cash by individuals with
      no business purpose.
    false_positive_context: Hobbyists and small businesses buy boats and engines.
    controls:
    - CTL-173
    - CTL-052
  - ref: IND-GEO-013
    legacy_id: HT-SMUGGLE-004
    context: Account in border or transit area receives funds from multiple foreign senders and cash is
      withdrawn within hours.
    name_in_typology: Accounts receiving numerous small deposits then immediate withdrawals near borders
    false_positive_context: Cross-border traders and workers may cluster.
    controls:
    - CTL-045
    - CTL-064
  - ref: IND-TXN-095
    legacy_id: HT-SMUGGLE-005
    context: Short stays booked for many persons, paid by one individual or cash.
    false_positive_context: Tourism, events and tour operators.
    controls:
    - CTL-052
    - CTL-173
  - ref: IND-CPT-032
    legacy_id: HT-SMUGGLE-006
    context: Payments to document brokers, translators and forged document suppliers.
    false_positive_context: Legitimate translation and visa agencies exist.
    controls:
    - CTL-116
    - CTL-096
  - ref: IND-CUS-006
    legacy_id: HT-SMUGGLE-007
    context: A single recipient collects funds from many unrelated senders in different countries.
    name_in_typology: Individuals receiving funds from many senders without family relation
    severity_in_typology: medium
    false_positive_context: Community leaders and aid groups may collect donations.
    controls:
    - CTL-041
    - CTL-022
  - ref: IND-PRD-027
    legacy_id: HT-SMUGGLE-008
    context: Informal operators promote crossing services and collect fees through payment apps or crypto.
    name_in_typology: Social-media-advertised travel services using payment apps
    severity_in_typology: medium
    false_positive_context: Genuine travel agents use social platforms.
    controls:
    - CTL-032
    - CTL-145
  - ref: IND-BEH-088
    legacy_id: HT-SMUGGLE-009
    context: Customer reveals owing large sums to a facilitator, or being pressured to repay.
    false_positive_context: Customers may be owing legitimate loans.
    controls:
    - CTL-100
    - CTL-170
