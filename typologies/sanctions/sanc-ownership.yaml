typology:
  id: SANC-OWNERSHIP
  name: Sanctions Evasion via Shell and Ownership Layering (50% Rule Circumvention)
  domain: sanctions
  description: Designated persons may retain control of assets by reducing recorded ownership below aggregation
    thresholds, using nominees, trusts, family members or layered holding companies. Detection depends
    on ownership and control analysis that looks beyond percentage holdings to influence, funding and
    benefit.
  exposure:
    channels:
    - face_to_face_professional
    - digital_onboarding
    payment_rails:
    - wire_swift
    customer_segments:
    - designated_person
    - corporate
    - private_wealth
    - professional_intermediary
    products:
    - transaction_account
    - company_formation_services
    basis: ai_inferred
    rationale: Designated persons holding control via nominees, relatives and layered holding companies;
      exposed at onboarding and ownership screening.
  sectors:
  - banking
  - corporate_services
  - securities
  - all
  sources:
  - OFAC, Guidance on Entities Owned by Persons Whose Property and Interests in Property Are Blocked (50
    Percent Rule) (2014) [unverified]
  - OFSI, UK Financial Sanctions General Guidance (ownership and control section) [replacement suggested,
    unverified]
  - FATF, Guidance on Beneficial Ownership of Legal Persons (2023) [unverified]
  indicators:
  - ref: IND-OWN-026
    legacy_id: SANC-OWNERSHIP-001
    context: Shareholdings are transferred or diluted shortly before or after a designation, often to
      relatives or associates.
    false_positive_context: Genuine succession planning or restructuring can coincide.
    controls:
    - CTL-034
    - CTL-031
  - ref: IND-OWN-027
    legacy_id: SANC-OWNERSHIP-002
    context: Several designated parties each hold stakes that together reach but are individually below
      the threshold, or holdings sit at just under the limit.
    false_positive_context: Minority stakes are routine in investments.
    controls:
    - CTL-034
    - CTL-005
    - CTL-031
  - ref: IND-OWN-001
    legacy_id: SANC-OWNERSHIP-003
    context: Registered officers appear to act on instruction, serve many entities or have no business
      connection.
    name_in_typology: Nominee shareholders, directors or trustees with limited independent role
    severity_in_typology: medium
    false_positive_context: Professional nominees are lawful in many jurisdictions.
    controls:
    - CTL-007
    - CTL-049
  - ref: IND-CPT-052
    legacy_id: SANC-OWNERSHIP-004
    context: Relatives or known associates assume ownership or management of designated person's holdings.
    false_positive_context: Family businesses commonly pass to relatives.
    controls:
    - CTL-028
    - CTL-034
  - ref: IND-OWN-002
    legacy_id: SANC-OWNERSHIP-005
    context: Layers across secrecy-prone jurisdictions with trusts or foundations and no clear commercial
      purpose.
    name_in_typology: Complex multi-jurisdiction holding chain without economic rationale
    severity_in_typology: medium
    false_positive_context: Tax and legal planning can be legitimate.
    controls:
    - CTL-008
    - CTL-005
  - ref: IND-TXN-137
    legacy_id: SANC-OWNERSHIP-006
    context: Capital injections, loans or guarantees come from entities linked to a designated party.
    false_positive_context: Group financing is common.
    controls:
    - CTL-034
    - CTL-029
  - ref: IND-BEH-001
    legacy_id: SANC-OWNERSHIP-007
    context: Evasive, delayed or inconsistent explanations about owners, controllers or purpose.
    name_in_typology: Customer unwilling or unable to explain ownership or control
    severity_in_typology: medium
    false_positive_context: Complex family businesses can take time to document.
    controls:
    - CTL-006
    - CTL-036
  - ref: IND-OWN-028
    legacy_id: SANC-OWNERSHIP-008
    context: Entities share contact details, advisers or bank accounts with designated persons.
    false_positive_context: Registered-agent addresses are widely shared.
    controls:
    - CTL-049
    - CTL-171
