typology:
  id: ML-PMLN
  name: Professional Money Laundering Networks
  domain: money_laundering
  description: Specialists who launder criminal proceeds for others as a service, for a fee or commission,
    using networks of couriers, brokers, front companies, accounts and informal value transfer. They run
    structured, repeatable laundering infrastructure serving multiple criminal clients.
  stage:
  - placement
  - layering
  - integration
  sectors:
  - banking
  - mvts
  - corporate_services
  - dnfbp
  sources:
  - FATF, Professional Money Laundering (2018)
  - FATF and Egmont Group, Professional Money Laundering Networks reports (general)
  - Europol, Serious and Organised Crime Threat Assessment (general)
  indicators:
  - id: ML-PMLN-001
    name: Accounts serving many unrelated clients with common controller
    description: Multiple accounts or companies linked to the same controllers are used for flows of different,
      unrelated parties.
    category: ownership_structure
    severity: high
    detection_type:
    - investigator_judgement
    - transaction_monitoring
    data_sources:
    - transaction_data
    - corporate_registry
    false_positive_notes: Payment agents and accountants hold client money legitimately.
    controls:
    - id: ML-PMLN-001-C1
      name: Client money account verification
      type: preventive
      description: Confirm legitimate client-account status and licensing.
      implementation: process
      effectiveness: medium
    - id: ML-PMLN-001-C2
      name: Network analytics on shared controllers
      type: detective
      description: Link entities by directors, addresses, signatories and devices.
      implementation: model
      effectiveness: high
  - id: ML-PMLN-002
    name: Funds move in fixed commission-like deductions
    description: Recurring small percentage retained from inbound flows consistent with fee-taking by
      an intermediary.
    category: transaction
    severity: high
    detection_type:
    - transaction_monitoring
    - investigator_judgement
    data_sources:
    - transaction_data
    false_positive_notes: Brokers and payment agents charge fees.
    controls:
    - id: ML-PMLN-002-C1
      name: Retained-percentage pattern analytics
      type: detective
      description: Detect consistent retention ratios in pass-through flows.
      implementation: model
      effectiveness: medium
    - id: ML-PMLN-002-C2
      name: Intermediary purpose review
      type: preventive
      description: Document service basis for intermediaries.
      implementation: process
      effectiveness: medium
  - id: ML-PMLN-003
    name: Mirror or offsetting transactions between jurisdictions
    description: Payments in one country are balanced by payments elsewhere without movement of funds
      between them.
    category: transaction
    severity: high
    detection_type:
    - transaction_monitoring
    - investigator_judgement
    data_sources:
    - transaction_data
    - wire_data
    false_positive_notes: Netting and bank-to-bank settlement may look similar.
    controls:
    - id: ML-PMLN-003-C1
      name: Offset-flow detection
      type: detective
      description: Compare reciprocal flows across linked accounts and jurisdictions.
      implementation: model
      effectiveness: medium
    - id: ML-PMLN-003-C2
      name: Typology-based scenarios
      type: detective
      description: Scenarios derived from published professional ML typologies.
      implementation: rule
      effectiveness: medium
  - id: ML-PMLN-004
    name: Use of numerous shell companies with generic activity
    description: Large number of newly formed companies cycle funds with vague trade descriptions.
    category: ownership_structure
    severity: high
    detection_type:
    - kyc_review
    - transaction_monitoring
    data_sources:
    - corporate_registry
    false_positive_notes: Corporate groups have many subsidiaries.
    controls:
    - id: ML-PMLN-004-C1
      name: Shell indicator scoring
      type: detective
      description: Score substance and registration patterns of corporate customers.
      implementation: model
      effectiveness: medium
    - id: ML-PMLN-004-C2
      name: EDD on serial-entity customers
      type: preventive
      description: Obtain structure charts and rationale.
      implementation: process
      effectiveness: high
  - id: ML-PMLN-005
    name: Third-party payments for unrelated debts or purchases
    description: Payers settle obligations of others without clear relationship, often in trade or loan
      context.
    category: counterparty
    severity: medium
    detection_type:
    - transaction_monitoring
    - document_review
    data_sources:
    - transaction_data
    false_positive_notes: Guarantors or group treasury pay for others.
    controls:
    - id: ML-PMLN-005-C1
      name: Third-party payer rule
      type: detective
      description: Alert on payers not party to contracts.
      implementation: rule
      effectiveness: medium
    - id: ML-PMLN-005-C2
      name: Relationship evidence requirement
      type: preventive
      description: Request evidence for third-party funding.
      implementation: process
      effectiveness: medium
  - id: ML-PMLN-006
    name: Links to known launderers or adverse media
    description: Counterparties or controllers appear in law-enforcement notices, adverse media or intelligence.
    category: counterparty
    severity: high
    detection_type:
    - screening
    - external_intel
    data_sources:
    - adverse_media
    - intelligence_feeds
    false_positive_notes: Name matches may be false.
    controls:
    - id: ML-PMLN-006-C1
      name: Adverse media screening
      type: preventive
      description: Screen parties and associated persons.
      implementation: technology
      effectiveness: high
    - id: ML-PMLN-006-C2
      name: Law-enforcement intelligence integration
      type: detective
      description: Integrate typology and entity notices from FIUs and partners.
      implementation: process
      effectiveness: medium
  - id: ML-PMLN-007
    name: Complex use of multiple services for single flow
    description: One flow touches cash, remitters, trade invoices, crypto and corporate accounts in a
      short time.
    category: typology_specific
    severity: medium
    detection_type:
    - investigator_judgement
    - transaction_monitoring
    data_sources:
    - transaction_data
    - cross_channel_logs
    false_positive_notes: Complex corporate treasury flows exist.
    controls:
    - id: ML-PMLN-007-C1
      name: Cross-channel linkage
      type: detective
      description: Join data across products to view end-to-end flow.
      implementation: technology
      effectiveness: medium
    - id: ML-PMLN-007-C2
      name: Case investigation playbook
      type: corrective
      description: Structured network investigation procedure.
      implementation: process
      effectiveness: medium
  - id: ML-PMLN-008
    name: Customer lacks understanding of the transactions it executes
    description: Controllers cannot explain commercial purpose or counterparties.
    category: behavioural
    severity: medium
    detection_type:
    - customer_behaviour
    - investigator_judgement
    data_sources:
    - relationship_manager_notes
    false_positive_notes: New clients may be inexperienced.
    controls:
    - id: ML-PMLN-008-C1
      name: Purpose-of-relationship interviews
      type: preventive
      description: Structured questions on business model and counterparties.
      implementation: process
      effectiveness: medium
    - id: ML-PMLN-008-C2
      name: Relationship manager training
      type: preventive
      description: Teach challenge techniques.
      implementation: training
      effectiveness: low
  - id: ML-PMLN-009
    name: Frequent use of cash couriers or exchange houses alongside bank flows
    description: Cash movement is blended with bank transfers via associated money service businesses.
    category: product_channel
    severity: medium
    detection_type:
    - transaction_monitoring
    data_sources:
    - cash_data
    - mvts_data
    false_positive_notes: MSB use is common in some communities.
    controls:
    - id: ML-PMLN-009-C1
      name: MSB customer risk controls
      type: preventive
      description: Apply enhanced diligence to money services business customers.
      implementation: process
      effectiveness: high
    - id: ML-PMLN-009-C2
      name: Cash movement reconciliation
      type: detective
      description: Reconcile cash volumes with declared business.
      implementation: process
      effectiveness: medium
