typology:
  id: FR-ADV
  name: Mass-Marketing and Advance-Fee Scams
  domain: fraud
  description: Victims are lured by promises of prizes, inheritances, jobs or loans and asked to pay fees
    in advance. Scam networks operate across borders using mass communications and mule accounts.
  sectors:
  - banking
  - payments
  - mvts
  sources:
  - UK Finance, Annual Fraud Report (published annually)
  - FinCEN, advisories on fraud typologies (general)
  - FATF, guidance on proceeds of fraud (general)
  indicators:
  - ref: IND-TXN-028
    legacy_id: FR-ADV-001
    context: 'Victim-side: repeated small payments for taxes, fees or insurance.'
    name_in_typology: Payments for fees to release prize, loan or inheritance
    false_positive_context: Legitimate fees.
    controls:
    - CTL-068
    - CTL-170
    - CTL-074
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-BEH-022
    legacy_id: FR-ADV-002
    context: 'Victim-side: overpayment style approach.'
    name_in_typology: Cheque or money-order received from unknown party
    severity_in_typology: medium
    false_positive_context: Genuine refunds.
    controls:
    - CTL-074
    - CTL-079
    - CTL-170
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-GEO-009
    legacy_id: FR-ADV-003
    context: Money services used for ad hoc transfers to unknown beneficiaries.
    false_positive_context: Remittances.
    controls:
    - CTL-068
    - CTL-037
    - CTL-074
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-PRD-028
    legacy_id: FR-ADV-004
    context: 'Victim-side: buying vouchers and reading out codes.'
    false_positive_context: Gifts.
    controls:
    - CTL-170
    - CTL-068
    - CTL-074
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-CUS-027
    legacy_id: FR-ADV-005
    context: 'Mule-side: individuals recruited through job adverts receive and forward funds.'
    false_positive_context: Genuine gig workers.
    controls:
    - CTL-051
    - CTL-083
    - CTL-014
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-BEH-058
    legacy_id: FR-ADV-006
    context: 'Victim-side: explanations show belief in unsolicited windfall.'
    false_positive_context: Genuine lottery winners.
    controls:
    - CTL-170
    - CTL-075
    - CTL-068
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-TXN-062
    legacy_id: FR-ADV-007
    context: 'Victim-side: sunk-cost pattern.'
    false_positive_context: Recurring bills.
    controls:
    - CTL-091
    - CTL-068
    - CTL-094
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-TYP-023
    legacy_id: FR-ADV-008
    context: External intelligence indicates active campaigns.
    false_positive_context: False reports.
    controls:
    - CTL-082
    - CTL-083
    - CTL-074
    references:
    - UK Finance, Annual Fraud Report (published annually)
