typology:
  id: CY-MIXER
  name: Virtual Asset Laundering via Mixers, Tumblers and Chain-Hopping
  domain: cyber_enabled
  description: Criminals obscure the trail of virtual asset proceeds by routing them through mixing services,
    privacy-enhancing tools and rapid conversions between assets and blockchains. The aim is to break
    the link between illicit source and final cash-out point. Regulated platforms see this as exposure
    to mixers, layered swaps and unusually fast pass-through.
  stage:
  - layering
  sectors:
  - crypto
  - fintech
  sources:
  - 'FATF, Virtual Assets: Red Flag Indicators of Money Laundering and Terrorist Financing (2020) <https://www.fatf-gafi.org/content/fatf-gafi/en/publications/Methodsandtrends/Virtual-assets-red-flag-indicators.html>
    [agent-reviewed]'
  - FATF, Updated Guidance for a Risk-Based Approach to Virtual Assets and Virtual Asset Service Providers
    (2021) [unverified]
  - FinCEN, Advisory on Illicit Activity Involving Convertible Virtual Currency (FIN-2019-A003, 2019)
    [unverified]
  - FinCEN, Proposal of Special Measure Regarding Convertible Virtual Currency Mixing as a Class of Transactions
    of Primary Money Laundering Concern, Notice of Proposed Rulemaking, 88 FR 72701 (23 Oct 2023) <https://www.fincen.gov/resources/statutes-regulations/federal-register-notices/proposal-special-measure-regarding>
    [corrected, agent-reviewed]
  indicators:
  - ref: IND-TYP-012
    legacy_id: CY-MIXER-001
    context: Incoming virtual asset transfers trace to known mixer or tumbler clusters within a small
      number of hops.
    false_positive_context: Users of privacy tools for lawful privacy reasons, or exposure via a long,
      diluted transaction chain.
    controls:
    - CTL-145
    - CTL-029
    - CTL-093
  - ref: IND-TXN-052
    legacy_id: CY-MIXER-002
    context: Funds received are swapped through several tokens or stablecoins in quick succession with
      no apparent trading rationale before withdrawal.
    false_positive_context: Active traders, arbitrageurs and market makers.
    controls:
    - CTL-037
    - CTL-145
    - CTL-093
  - ref: IND-TXN-018
    legacy_id: CY-MIXER-003
    context: Assets are deposited, then moved across blockchains via bridges or wrapped tokens within
      minutes or hours.
    name_in_typology: Chain-hopping through bridges shortly after deposit
    false_positive_context: Legitimate multi-chain users and liquidity providers.
    controls:
    - CTL-145
    - CTL-037
    - CTL-093
  - ref: IND-TYP-005
    legacy_id: CY-MIXER-004
    context: Customer converts mainstream assets into anonymity-enhanced coins and withdraws them, or
      requests such assets despite a simple stated purpose.
    name_in_typology: Preference for privacy-enhanced coins with no commercial rationale
    severity_in_typology: medium
    false_positive_context: Privacy-conscious users; genuine holdings of such assets.
    controls:
    - CTL-023
    - CTL-037
    - CTL-171
  - ref: IND-TXN-005
    legacy_id: CY-MIXER-005
    context: Balances are split into many near-identical outputs sent to newly created wallets (peeling
      or splitting pattern).
    name_in_typology: Withdrawals to many fresh addresses in fixed amounts
    false_positive_context: Payroll, airdrops or wallet-hygiene practices.
    controls:
    - CTL-145
    - CTL-048
    - CTL-037
  - ref: IND-BEH-045
    legacy_id: CY-MIXER-006
    context: Sessions originate from Tor, rotating proxies or VPNs inconsistent with declared residence,
      combined with high-value transfers.
    false_positive_context: Widespread lawful VPN use for privacy or security.
    controls:
    - CTL-092
    - CTL-091
    - CTL-023
  - ref: IND-TXN-001
    legacy_id: CY-MIXER-007
    context: 'Account behaves as a pass-through: most inbound value leaves within hours with minimal balance
      retained.'
    name_in_typology: Very short holding time between receipt and exit
    severity_in_typology: medium
    false_positive_context: Custodial arbitrage and treasury operations.
    controls:
    - CTL-037
    - CTL-051
    - CTL-093
  - ref: IND-CPT-011
    legacy_id: CY-MIXER-008
    context: Withdrawals go to addresses attributed to exchanges that lack licensing or effective AML
      controls.
    name_in_typology: Cash-out to high-risk or unregistered exchanges
    false_positive_context: Attribution errors; unlicensed status may be unknown to user.
    controls:
    - CTL-145
    - CTL-149
    - CTL-146
  - ref: IND-BEH-003
    legacy_id: CY-MIXER-009
    context: Explanations for layered transfers are vague, inconsistent or shift when challenged.
    name_in_typology: Customer unable to explain transaction purpose or origin
    severity_in_typology: medium
    false_positive_context: Inexperienced users who do not understand the tooling.
    controls:
    - CTL-023
    - CTL-093
    - CTL-171
  - ref: IND-TYP-009
    legacy_id: CY-MIXER-010
    context: Transfers touch addresses designated by sanctions authorities or flagged in official advisories.
    name_in_typology: Interaction with addresses linked to sanctioned or designated mixers
    false_positive_context: Inadvertent contact through dusting attacks.
    controls:
    - CTL-029
    - CTL-145
    - CTL-103
