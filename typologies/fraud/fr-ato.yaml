typology:
  id: FR-ATO
  name: Account Takeover
  domain: fraud
  description: Criminals gain control of customer accounts through phishing, credential stuffing, SIM
    swap or malware, then change details and extract funds. Early detection relies on login, device and
    change-of-details signals.
  sectors:
  - banking
  - payments
  - crypto
  - fintech
  sources:
  - UK Finance, Annual Fraud Report (published annually)
  - FinCEN, advisories on cyber-enabled crime (general)
  - FFIEC, authentication and access guidance (general)
  indicators:
  - ref: IND-BEH-008
    legacy_id: FR-ATO-001
    context: Session originates from unfamiliar infrastructure, possibly using an emulator or anonymising
      proxy.
    name_in_typology: Login from new device, country or emulator
    false_positive_context: Travel and new phones.
    controls:
    - CTL-090
    - CTL-073
    - CTL-091
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-BEH-009
    legacy_id: FR-ATO-002
    context: Credential stuffing or brute force pattern preceding successful access.
    false_positive_context: Forgotten passwords.
    controls:
    - CTL-073
    - CTL-090
    - CTL-037
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-CUS-014
    legacy_id: FR-ATO-003
    context: Email, phone or address updated minutes before outbound transactions.
    name_in_typology: Contact details or phone number changed then high-value payment
    false_positive_context: Genuine moves.
    controls:
    - CTL-088
    - CTL-073
    - CTL-091
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-BEH-010
    legacy_id: FR-ATO-004
    context: Telecom signals show recent SIM change before OTP-protected actions.
    name_in_typology: SIM swap or number port detected
    false_positive_context: Phone upgrades.
    controls:
    - CTL-073
    - CTL-090
    - CTL-088
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-TXN-064
    legacy_id: FR-ATO-005
    context: Attacker adds beneficiaries and transfers most of the balance in one session.
    false_positive_context: Genuine house or business payments.
    controls:
    - CTL-071
    - CTL-091
    - CTL-037
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-BEH-059
    legacy_id: FR-ATO-006
    context: Self-service reset triggered from an unfamiliar environment.
    false_positive_context: Lost devices.
    controls:
    - CTL-073
    - CTL-088
    - CTL-090
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-PRD-029
    legacy_id: FR-ATO-007
    context: Attacker requests cards or tokens to alternate addresses.
    false_positive_context: Genuine moves.
    controls:
    - CTL-088
    - CTL-073
    - CTL-037
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-TXN-003
    legacy_id: FR-ATO-008
    context: Receiving accounts show forward-and-cash-out behaviour.
    name_in_typology: Mule accounts receiving compromised funds
    false_positive_context: Merchant accounts.
    controls:
    - CTL-051
    - CTL-083
    - CTL-103
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-BEH-060
    legacy_id: FR-ATO-009
    context: Non-human timing, headless browser or scripted API calls.
    false_positive_context: Accessibility tools.
    controls:
    - CTL-091
    - CTL-090
    - CTL-073
    references:
    - UK Finance, Annual Fraud Report (published annually)
