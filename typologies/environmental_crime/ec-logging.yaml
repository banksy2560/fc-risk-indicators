typology:
  id: EC-LOGGING
  name: Illegal Logging and Timber Trafficking
  domain: environmental_crime
  description: Harvesting, transport or trade of timber in breach of national law or concession rules,
    including logging in protected areas and mislabelled species or origin. Proceeds often pass through
    timber traders, export companies and shipping firms, with laundered volumes blended into legal supply.
  exposure:
    channels: []
    payment_rails:
    - wire_swift
    - trade_instruments
    - cash
    customer_segments:
    - corporate
    - sme
    - pep_related
    products:
    - trade_finance
    - transaction_account
    basis: ai_inferred
    rationale: Timber exporters and traders; cash to informal suppliers, trade documents and payments
      to officials for permits.
    consumer:
      relevant: false
      products: []
      channels: []
      basis: ai_inferred
      rationale: Timber trade and concession flows run through corporate and trade-finance relationships,
        not retail products.
  sectors:
  - banking
  - corporate_services
  - payments
  sources:
  - FATF, Money Laundering from Environmental Crime (2021) <https://www.fatf-gafi.org/content/fatf-gafi/en/publications/Environmentalcrime/Money-laundering-from-environmental-crime.html>
    [agent-reviewed]
  - 'UNEP and INTERPOL, The Rise of Environmental Crime: A Growing Threat to Natural Resources, Peace,
    Development and Security (2016) <https://wedocs.unep.org/20.500.11822/7662> [corrected, agent-reviewed]'
  - Regulation (EU) No 995/2010 (EUTR) and Regulation (EU) 2023/1115 (EUDR) [replacement suggested, unverified]
  - OECD, Due Diligence Guidance for Responsible Business Conduct (2018) <https://www.oecd.org/en/publications/oecd-due-diligence-guidance-for-responsible-business-conduct_15f5f4b3-en.html>
    [agent-reviewed]
  indicators:
  - ref: IND-TXN-014
    legacy_id: EC-LOGGING-001
    context: Export volumes from a client are higher than its licensed harvest area could plausibly yield.
    name_in_typology: Timber exports exceeding documented concession capacity
    false_positive_context: Stocks and purchases from other licensed sources may explain.
    controls:
    - CTL-139
    - CTL-135
  - ref: IND-DOC-020
    legacy_id: EC-LOGGING-002
    context: Shipping, customs and invoices mention different species, origin or volumes.
    name_in_typology: Species or origin descriptions inconsistent across documents
    false_positive_context: Descriptions of mixed woods often vary.
    controls:
    - CTL-123
    - CTL-131
  - ref: IND-GEO-004
    legacy_id: EC-LOGGING-003
    context: Exports declared from a country with little domestic timber supply, indicating laundering
      of origin.
    false_positive_context: Processing hubs import and re-export timber lawfully.
    controls:
    - CTL-139
    - CTL-135
  - ref: IND-TXN-022
    legacy_id: EC-LOGGING-004
    context: Large cash withdrawals followed by purchases of raw logs from informal suppliers.
    name_in_typology: Cash payments to local loggers and chain-saw operators
    false_positive_context: Informal logging is lawful in some community forestry.
    controls:
    - CTL-064
    - CTL-135
  - ref: IND-OWN-009
    legacy_id: EC-LOGGING-005
    context: Several short-lived timber exporters share directors, addresses and bank signatories.
    name_in_typology: Shell exporters opened for short period with identical directors
    false_positive_context: Groups restructure for commercial reasons.
    controls:
    - CTL-049
    - CTL-005
  - ref: IND-CPT-018
    legacy_id: EC-LOGGING-006
    context: Payments to forestry or customs officials linked to licences or clearances.
    name_in_typology: Payments to officials for permits or to bypass inspections
    false_positive_context: Fees and official services are lawfully paid.
    controls:
    - CTL-028
    - CTL-097
  - ref: IND-GEO-005
    legacy_id: EC-LOGGING-007
    context: Customer's supply is sourced from areas with legal restrictions or conflicts reported.
    false_positive_context: Boundaries can be disputed.
    controls:
    - CTL-138
    - CTL-136
  - ref: IND-CUS-003
    legacy_id: EC-LOGGING-008
    context: Customer is named in seizure, sanction or investigation news.
    name_in_typology: Adverse media on illegal logging or enforcement notices
    false_positive_context: Reports may be unrelated.
    controls:
    - CTL-032
    - CTL-016
