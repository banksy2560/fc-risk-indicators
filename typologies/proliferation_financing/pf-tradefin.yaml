typology:
  id: PF-TRADEFIN
  name: Trade Finance and Transshipment Obfuscation for Proliferation
  domain: proliferation_financing
  description: Proliferation procurement uses letters of credit, open-account trade and transshipment
    hubs to obscure origin, destination and end use of controlled items. Document inconsistencies and
    unusual routing are the principal observable indicators for trade finance teams.
  exposure:
    channels:
    - broker_intermediary
    - branch
    payment_rails:
    - trade_instruments
    - wire_swift
    customer_segments:
    - corporate
    - sme
    products:
    - trade_finance
    - correspondent_account
    basis: ai_inferred
    rationale: LCs, open-account trade and transshipment documentary inconsistencies.
  sectors:
  - banking
  - trade_finance
  sources:
  - FATF, Guidance on Counter Proliferation Financing (2018) [unverified]
  - FATF, Guidance on Proliferation Financing Risk Assessment and Mitigation (2021) [unverified]
  - 'FATF/Egmont, Trade-Based Money Laundering: Trends and Developments (2020) [unverified]'
  indicators:
  - ref: IND-GEO-041
    legacy_id: PF-TRADEFIN-001
    context: Goods travel through third-country ports with no commercial need and are reloaded or relabelled.
    name_in_typology: Routing via transshipment hubs unconnected to buyer or seller
    severity_in_typology: high
    false_positive_context: Hubs are efficient routes for many legitimate exporters.
    controls:
    - CTL-126
    - CTL-154
  - ref: IND-DOC-058
    legacy_id: PF-TRADEFIN-002
    context: Frequent amendments to beneficiary, destination or description, or acceptance of discrepant
      documents.
    false_positive_context: Amendments occur in ordinary trade.
    controls:
    - CTL-132
    - CTL-123
  - ref: IND-DOC-050
    legacy_id: PF-TRADEFIN-003
    context: Documents use generic terms such as 'machinery' or 'parts' where technical specifics would
      be expected.
    name_in_typology: Goods description vague or generic for high-risk categories
    false_positive_context: Commercial shorthand is common.
    controls:
    - CTL-123
    - CTL-130
  - ref: IND-DOC-020
    legacy_id: PF-TRADEFIN-004
    context: Certificate of origin, invoice and shipping data disagree on country of origin or consignee.
    name_in_typology: Inconsistent origin and destination across documents
    severity_in_typology: medium
    false_positive_context: Clerical errors are frequent.
    controls:
    - CTL-123
    - CTL-002
  - ref: IND-TXN-023
    legacy_id: PF-TRADEFIN-005
    context: Settlement arrives from unrelated entity or country relative to the trade parties.
    name_in_typology: Payments by parties in different jurisdictions with no trade link
    false_positive_context: Third-party settlement is not unusual in supply chains.
    controls:
    - CTL-046
    - CTL-045
  - ref: IND-TXN-128
    legacy_id: PF-TRADEFIN-006
    context: New relationships with large unsecured trade flows to or from countries of proliferation
      concern.
    false_positive_context: Genuine market entry occurs.
    controls:
    - CTL-027
    - CTL-133
  - ref: IND-DOC-059
    legacy_id: PF-TRADEFIN-007
    context: Transport documents lack vessel identifiers or show impossible voyage timing.
    false_positive_context: Booking details can change before departure.
    controls:
    - CTL-143
    - CTL-002
  - ref: IND-BEH-106
    legacy_id: PF-TRADEFIN-008
    context: Importer reorders and quickly re-exports technical items to another country.
    false_positive_context: Distribution businesses re-export normally.
    controls:
    - CTL-129
