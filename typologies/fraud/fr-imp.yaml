typology:
  id: FR-IMP
  name: Impersonation, Vishing and Smishing
  domain: fraud
  description: Fraudsters pose as banks, police, tax authorities or delivery firms by phone, SMS or email,
    harvesting credentials or inducing customers to move money. The criminal often spoofs numbers and
    uses urgency and fear.
  sectors:
  - banking
  - payments
  - fintech
  sources:
  - UK Finance, Annual Fraud Report (specify year, e.g. 2025) <https://www.ukfinance.org.uk/> [corrected,
    agent-reviewed]
  - FCA, consumer warnings on impersonation fraud (general) [too vague, unverified]
  - FinCEN, advisories on cyber-enabled fraud (general) [too vague, unverified]
  indicators:
  - ref: IND-BEH-069
    legacy_id: FR-IMP-001
    context: 'Victim-side: contact claims to be from the bank''s fraud team and requests action, codes
      or transfers.'
    false_positive_context: Genuine outbound contact.
    controls:
    - CTL-074
    - CTL-082
    - CTL-070
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-BEH-070
    legacy_id: FR-IMP-002
    context: 'Victim-side: authentication codes are read out or entered while the customer is on a live
      call.'
    false_positive_context: Genuine support calls.
    controls:
    - CTL-091
    - CTL-073
    - CTL-068
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-BEH-008
    legacy_id: FR-IMP-003
    context: 'Attacker-side: credentials harvested via a fake site are used on an unfamiliar device or
      location.'
    name_in_typology: Login from new device shortly after phishing click
    false_positive_context: Customers changing phones.
    controls:
    - CTL-090
    - CTL-073
    - CTL-091
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-PRD-033
    legacy_id: FR-IMP-004
    context: Outbound spoofing makes calls appear genuine; call-detail records reveal the discrepancy.
    false_positive_context: Legitimate forwarding.
    controls:
    - CTL-082
    - CTL-074
    - CTL-170
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-TYP-024
    legacy_id: FR-IMP-005
    context: Bank brand impersonation campaigns observed in threat feeds and customer reports.
    false_positive_context: Legitimate notices.
    controls:
    - CTL-082
    - CTL-074
    - CTL-083
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-TXN-071
    legacy_id: FR-IMP-006
    context: 'Victim-side: pretext of protection leads to transfers to unfamiliar accounts.'
    false_positive_context: Genuine account moves.
    controls:
    - CTL-069
    - CTL-068
    - CTL-170
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-TXN-003
    legacy_id: FR-IMP-007
    context: Receiving accounts withdraw cash or buy crypto promptly after credits.
    name_in_typology: Mule accounts receiving phished funds then cashing out
    false_positive_context: Cash-heavy businesses.
    controls:
    - CTL-051
    - CTL-083
    - CTL-103
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-PRD-034
    legacy_id: FR-IMP-008
    context: 'Victim-side: card details given verbally are used for online purchases or wallet provisioning.'
    false_positive_context: Customer purchases.
    controls:
    - CTL-080
    - CTL-090
    - CTL-068
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-PRD-035
    legacy_id: FR-IMP-009
    context: Attacker provisions the card to multiple wallets after obtaining one-time codes.
    false_positive_context: Multiple devices owned by customer.
    controls:
    - CTL-073
    - CTL-090
    - CTL-037
    references:
    - UK Finance, Annual Fraud Report (published annually)
