typology:
  id: ML-HAWALA
  name: Hawala, Underground Banking and Informal Value Transfer
  domain: money_laundering
  description: Informal value transfer systems that move value without or alongside formal banking, settling
    through netting, trade or cash, with limited records. They serve legitimate remittance needs but are
    also abused for laundering and for evasion of controls.
  exposure:
    channels:
    - agent_network
    - branch
    payment_rails:
    - informal_value_transfer
    - cross_border_remittance
    - cash
    customer_segments:
    - msb_remitter
    - retail
    - sme
    - non_resident
    products:
    - transaction_account
    basis: ai_inferred
    rationale: Informal operators settling by netting, trade or cash, using pooled bank accounts as collection
      points.
  stage:
  - layering
  sectors:
  - mvts
  - banking
  - payments
  sources:
  - FATF, The Role of Hawala and Other Similar Service Providers in ML/TF (2013) <https://www.fatf-gafi.org/en/publications/Methodsandtrends/Role-hawalas-in-ml-tf.html>
    [agent-reviewed]
  - FATF, Guidance for a Risk-Based Approach for Money or Value Transfer Services (2016) <https://www.fatf-gafi.org/en/publications/Fatfrecommendations/Rba-money-or-value-transfer.html>
    [corrected, agent-reviewed]
  - FATF, Money Laundering Through Money Remittance and Currency Exchange Providers (2010) <https://www.fatf-gafi.org/en/publications/Methodsandtrends/Moneylaunderingthroughmoneyremittanceandcurrencyexchangeproviders.html>
    [agent-reviewed]
  indicators:
  - ref: IND-CUS-006
    legacy_id: ML-HAWALA-001
    context: Personal or business accounts used as collection point for many senders without licence.
    name_in_typology: Unlicensed operator accounts receive many unrelated deposits
    false_positive_context: Family collections and community groups.
    controls:
    - CTL-061
    - CTL-116
  - ref: IND-TXN-108
    legacy_id: ML-HAWALA-002
    context: Cash received and paid out to numerous parties abroad or locally.
    false_positive_context: Payroll for distributed workers.
    controls:
    - CTL-041
    - CTL-022
  - ref: IND-TYP-034
    legacy_id: ML-HAWALA-003
    context: Balancing between brokers is done through goods, invoices or precious metals.
    false_positive_context: Real trade also exists.
    controls:
    - CTL-140
  - ref: IND-TXN-016
    legacy_id: ML-HAWALA-004
    context: Payments in and out between linked accounts without a direct transfer.
    name_in_typology: Reciprocal payments between operators across countries
    false_positive_context: Netting among banks.
    controls:
    - CTL-047
    - CTL-095
  - ref: IND-DOC-041
    legacy_id: ML-HAWALA-005
    context: No ledger of clients, with limited or no identification.
    false_positive_context: Informal community use.
    controls:
    - CTL-174
    - CTL-175
  - ref: IND-PRD-046
    legacy_id: ML-HAWALA-006
    context: Multiple MSB transactions and exchange houses, often similar amounts.
    name_in_typology: Frequent use of money service businesses and exchange houses by the same account
    false_positive_context: Migrant workers send regularly.
    controls:
    - CTL-039
    - CTL-061
  - ref: IND-GEO-044
    legacy_id: ML-HAWALA-007
    context: Payments linked to countries or regions where hawala is prevalent and controls are weak.
    name_in_typology: Flows to or from corridors known for informal transfer
    false_positive_context: Legitimate corridors.
    controls:
    - CTL-154
    - CTL-027
  - ref: IND-BEH-091
    legacy_id: ML-HAWALA-008
    context: Refuses to describe how payments are made or settled.
    false_positive_context: Confidentiality concerns.
    controls:
    - CTL-011
    - CTL-016
  - ref: IND-TXN-008
    legacy_id: ML-HAWALA-009
    context: Many small transfers avoid thresholds.
    name_in_typology: Structured transfers below record-keeping thresholds
    false_positive_context: Regular small remittances.
    controls:
    - CTL-038
    - CTL-039
