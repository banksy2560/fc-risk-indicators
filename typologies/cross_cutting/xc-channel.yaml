typology:
  id: XC-CHANNEL
  name: Delivery Channel Risk
  domain: cross_cutting
  description: Inherent-risk factors in how customers are acquired and served. Covers non-face-to-face
    relationships, intermediaries and introducers, remote onboarding and reliance on third parties.
  exposure:
    channels:
    - online_banking
    - mobile_app
    - broker_intermediary
    - api_open_banking
    payment_rails: []
    customer_segments:
    - new_to_bank
    products:
    - transaction_account
    basis: ai_inferred
    rationale: 'Generic channel risk: non-face-to-face onboarding, introducers and third-party reliance.'
    consumer:
      relevant: true
      products: []
      channels: []
      basis: ai_inferred
      rationale: Cross-cutting risk factor; applies across all consumer products and channels. Covers
        remote onboarding and introducers.
  sectors:
  - all
  sources:
  - FATF, Guidance for a Risk-Based Approach (sector-specific guidance series, general principles) [too
    vague, unverified]
  - FATF Recommendations, Recommendation 1 and Interpretive Note (assessing risks and applying a risk-based
    approach) <https://www.fatf-gafi.org/en/publications/Fatfrecommendations/Fatf-recommendations.html>
    [agent-reviewed]
  - Wolfsberg Group, Guidance on a Risk Based Approach for Managing Money Laundering Risks (2006) <https://wolfsberg-group.org/resources/rba>
    [corrected, agent-reviewed]
  indicators:
  - ref: IND-PRD-002
    legacy_id: XC-CHANNEL-001
    context: Customer is onboarded and serviced without any in-person contact.
    false_positive_context: Digital channels are the norm for many.
    controls:
    - CTL-001
    - CTL-020
  - ref: IND-PRD-003
    legacy_id: XC-CHANNEL-002
    context: Customers originate from agents, brokers or introducers who may not apply adequate checks.
    false_positive_context: Intermediaries are standard in many industries.
    controls:
    - CTL-019
    - CTL-114
    - CTL-120
  - ref: IND-PRD-004
    legacy_id: XC-CHANNEL-003
    context: Institution relies on another entity's due diligence without testing it.
    false_positive_context: Reliance is permitted when conditions are met.
    controls:
    - CTL-019
    - CTL-175
    - CTL-120
  - ref: IND-DOC-004
    legacy_id: XC-CHANNEL-004
    context: Onboarding relies on a single image or unverified selfie, with no database check.
    false_positive_context: Quality devices vary.
    controls:
    - CTL-001
    - CTL-002
  - ref: IND-PRD-005
    legacy_id: XC-CHANNEL-005
    context: Unusual surge of accounts via one channel, introducer, IP range or device.
    name_in_typology: High volume of onboarding from single source
    false_positive_context: Campaigns and partnerships cause legitimate spikes.
    controls:
    - CTL-037
    - CTL-090
  - ref: IND-PRD-006
    legacy_id: XC-CHANNEL-006
    context: Use of VPN, proxy, anonymising tools or emulators when accessing services.
    false_positive_context: Privacy tools are widely used.
    controls:
    - CTL-090
    - CTL-073
  - ref: IND-PRD-007
    legacy_id: XC-CHANNEL-007
    context: Distributed agents operate with inconsistent controls or limited supervision.
    false_positive_context: Networks vary in maturity.
    controls:
    - CTL-021
    - CTL-114
    - CTL-175
  - ref: IND-PRD-008
    legacy_id: XC-CHANNEL-008
    context: Application completed by someone other than the customer without clear authority.
    false_positive_context: Guardians and professional representatives act lawfully.
    controls:
    - CTL-018
    - CTL-070
  - ref: IND-BEH-027
    legacy_id: XC-CHANNEL-009
    context: Customer uses channels atypical for them, such as a distant branch or sudden switch to digital.
    false_positive_context: Convenience and travel explain many cases.
    controls:
    - CTL-091
    - CTL-070
  - ref: IND-PRD-009
    legacy_id: XC-CHANNEL-010
    context: Intermediaries trade or transact on behalf of undisclosed underlying clients.
    false_positive_context: Omnibus structures are routine in securities.
    controls:
    - CTL-118
    - CTL-112
