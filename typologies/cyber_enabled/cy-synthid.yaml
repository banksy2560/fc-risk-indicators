typology:
  id: CY-SYNTHID
  name: Synthetic and AI-Generated Identity and Deepfake Onboarding
  domain: cyber_enabled
  description: Fraudsters combine real and fabricated data, or use generative tools to create faces, voices
    and documents, to pass remote onboarding. The accounts then bear credit abuse, mule activity or laundering.
    Detection depends on layered identity proofing and behavioural signals across the customer lifecycle.
  stage:
  - placement
  sectors:
  - banking
  - fintech
  - crypto
  - payments
  sources:
  - FinCEN, Alert on Fraud Schemes Involving Deepfake Media Targeting Financial Institutions (FIN-2024-Alert004,
    2024)
  - FATF, Guidance on Digital ID (2020)
  - NIST, Digital Identity Guidelines (SP 800-63)
  indicators:
  - ref: IND-DOC-009
    legacy_id: CY-SYNTHID-001
    context: Identifiers appear in few databases, with recent first use and mixed data elements.
    name_in_typology: Identity with thin or recently created credit and data footprint
    false_positive_context: Young adults and new arrivals.
    controls:
    - CTL-002
    - CTL-004
  - ref: IND-DOC-016
    legacy_id: CY-SYNTHID-002
    context: Liveness checks reveal artefacts, virtual cameras or replayed streams.
    false_positive_context: Poor lighting or low-quality cameras.
    controls:
    - CTL-001
    - CTL-002
    - CTL-091
  - ref: IND-DOC-010
    legacy_id: CY-SYNTHID-003
    context: Multiple applications use near-identical layouts or reused photos.
    name_in_typology: Document images share templates, fonts or backgrounds across applicants
    false_positive_context: Common issuance templates.
    controls:
    - CTL-002
    - CTL-048
    - CTL-004
  - ref: IND-BEH-050
    legacy_id: CY-SYNTHID-004
    context: Geolocation, language or voice biometrics inconsistent with the stated identity.
    false_positive_context: Travel and expatriates.
    controls:
    - CTL-091
    - CTL-092
    - CTL-001
  - ref: IND-CUS-007
    legacy_id: CY-SYNTHID-005+CY-SYNTHID-008
    context: 'Phone or email repeated under varied names or birthdates.

      Many identities share one address or commercial drop.'
    name_in_typology: Same contact details used with different identities
    false_positive_context: Family contact sharing. Student halls.
    controls:
    - CTL-004
    - CTL-048
    - CTL-002
    - CTL-023
  - ref: IND-TXN-026
    legacy_id: CY-SYNTHID-006
    context: Account builds limits quickly then draws maximum funds.
    name_in_typology: Rapid credit build then bust or large cash-out
    false_positive_context: Genuine growth.
    controls:
    - CTL-037
    - CTL-051
    - CTL-103
  - ref: IND-BEH-051
    legacy_id: CY-SYNTHID-007
    context: Callers using cloned voices or video deepfakes during high-value requests.
    false_positive_context: Poor audio.
    controls:
    - CTL-073
    - CTL-001
    - CTL-093
  - ref: IND-BEH-052
    legacy_id: CY-SYNTHID-009
    context: Repeated retries altering one data element until approval.
    false_positive_context: Genuine typos.
    controls:
    - CTL-004
    - CTL-091
    - CTL-093
  - ref: IND-DOC-017
    legacy_id: CY-SYNTHID-010
    context: Authoritative checks fail or show multiple identities on one number.
    false_positive_context: Registry delays.
    controls:
    - CTL-002
    - CTL-004
    - CTL-093
