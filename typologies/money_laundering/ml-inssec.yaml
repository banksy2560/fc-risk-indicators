typology:
  id: ML-INSSEC
  name: Insurance and Securities Layering
  domain: money_laundering
  description: Use of insurance products and securities markets to place and layer funds, for example
    single-premium policies cancelled early, or trading, wash trades and account transfers that obscure
    source and ownership.
  exposure:
    channels:
    - broker_intermediary
    payment_rails:
    - insurance_premium_claim
    - securities_settlement
    customer_segments:
    - private_wealth
    - corporate
    products:
    - insurance_pension
    - investment_securities
    basis: ai_inferred
    rationale: Single-premium policy cancellation and securities trading layering through brokers.
  stage:
  - placement
  - layering
  sectors:
  - insurance
  - securities
  sources:
  - 'FATF, Guidance for a Risk-Based Approach: Life Insurance Sector (2018) <https://www.fatf-gafi.org/en/publications/Fatfrecommendations/Rba-life-insurance.html>
    [agent-reviewed]'
  - FATF, Money Laundering and Terrorist Financing in the Securities Sector (2009) <https://www.fatf-gafi.org/en/publications/Methodsandtrends/Moneylaunderingandterroristfinancinginthesecuritiessector.html>
    [agent-reviewed]
  - IAIS, Application Paper on Combating Money Laundering and Terrorist Financing (2013; revised 2021)
    <https://www.iaisweb.org/> [corrected, agent-reviewed]
  indicators:
  - ref: IND-TXN-109
    legacy_id: ML-INSSEC-001
    context: Policy funded with lump sum and cancelled soon after, with refund to third party.
    false_positive_context: Policyholder circumstances change.
    controls:
    - CTL-150
    - CTL-089
  - ref: IND-CPT-058
    legacy_id: ML-INSSEC-002
    context: Payers have no insurable interest or link.
    name_in_typology: Premiums paid by unrelated third parties
    false_positive_context: Employer or family payment.
    controls:
    - CTL-046
  - ref: IND-BEH-092
    legacy_id: ML-INSSEC-003
    context: Rapid loans, assignments or beneficiary changes.
    false_positive_context: Estate planning.
    controls:
    - CTL-150
  - ref: IND-TXN-110
    legacy_id: ML-INSSEC-004
    context: Paid in excess of required premium then withdrawn.
    false_positive_context: Misestimates happen.
    controls:
    - CTL-150
    - CTL-089
  - ref: IND-TYP-014
    legacy_id: ML-INSSEC-005
    context: Same securities traded between related accounts at unrealistic prices.
    name_in_typology: Wash or matched trades between connected accounts
    false_positive_context: Market making.
    controls:
    - CTL-150
    - CTL-049
  - ref: IND-TXN-111
    legacy_id: ML-INSSEC-006
    context: Shares deposited and moved with no market activity.
    false_positive_context: Custody moves.
    controls:
    - CTL-150
    - CTL-135
  - ref: IND-PRD-047
    legacy_id: ML-INSSEC-007
    context: Illiquid instruments used to move value.
    false_positive_context: Genuine investors.
    controls:
    - CTL-150
    - CTL-141
  - ref: IND-OWN-022
    legacy_id: ML-INSSEC-008
    context: Positions hidden via omnibus or nominee structure.
    false_positive_context: Custodians.
    controls:
    - CTL-118
    - CTL-005
    - CTL-040
  - ref: IND-BEH-015
    legacy_id: ML-INSSEC-009
    context: Accepts losses or penalties readily.
    name_in_typology: Customer indifferent to investment performance or fees
    false_positive_context: Wealthy customers.
    controls:
    - CTL-011
    - CTL-169
