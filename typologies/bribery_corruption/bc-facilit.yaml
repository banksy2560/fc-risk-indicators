typology:
  id: BC-FACILIT
  name: Facilitation Payments and Third-Party Intermediaries
  domain: bribery_corruption
  description: Small unofficial payments to speed routine government actions, and wider use of agents,
    customs brokers, distributors or joint-venture partners who may pass value to officials. These flows
    are often small, cash-heavy and poorly documented, so detection relies on expense analytics, supplier
    controls and awareness.
  exposure:
    channels: []
    payment_rails:
    - cash
    - wire_swift
    - trade_instruments
    customer_segments:
    - corporate
    - professional_intermediary
    products:
    - transaction_account
    - trade_finance
    basis: ai_inferred
    rationale: Petty cash and intermediary/broker fees paid by corporates, often to personal accounts
      or in cash; customs broker trade flows.
    consumer:
      relevant: false
      products: []
      channels: []
      basis: ai_inferred
      rationale: Corporate facilitation payments and intermediary fees; not a retail product pattern.
  sectors:
  - banking
  - payments
  - corporate_services
  sources:
  - OECD, Good Practice Guidance on Internal Controls, Ethics, and Compliance (2010) [unverified]
  - OECD, UNODC and World Bank, Anti-Corruption Ethics and Compliance Handbook for Business (2013) [unverified]
  - Wolfsberg Group, Anti-Bribery and Corruption Compliance Programme Guidance (2017) <https://wolfsberg-group.org/resources>
    [agent-reviewed]
  - US DOJ and SEC, A Resource Guide to the U.S. Foreign Corrupt Practices Act, Second Edition (2020)
    [corrected, unverified]
  indicators:
  - ref: IND-TXN-036
    legacy_id: BC-FACILIT-001
    context: Repeated low-value cash disbursements or petty cash entries labelled 'expediting', 'facilitation'
      or 'processing' at ports, borders or ministries.
    false_positive_context: Some official fees are legitimately paid in cash with receipts.
    controls:
    - CTL-168
    - CTL-060
  - ref: IND-CPT-001
    legacy_id: BC-FACILIT-002
    context: Broker invoices include large unitemised 'disbursements' or 'duties' that exceed published
      tariffs.
    false_positive_context: Duties vary with classification and valuation disputes.
    controls:
    - CTL-060
    - CTL-112
  - ref: IND-CPT-002
    legacy_id: BC-FACILIT-003
    context: Intermediary resists contractual anti-corruption clauses, books-and-records access, or certification.
    false_positive_context: Small suppliers may lack formal policies but cooperate otherwise.
    controls:
    - CTL-120
    - CTL-016
  - ref: IND-TXN-024
    legacy_id: BC-FACILIT-004
    context: Intermediary asks that fees be paid in cash, via third parties, or into a personal rather
      than corporate account.
    name_in_typology: Payment requested in cash or to personal account
    false_positive_context: Individual consultants sometimes invoice from personal accounts.
    controls:
    - CTL-069
    - CTL-078
  - ref: IND-CPT-003
    legacy_id: BC-FACILIT-005
    context: A government contact recommends or demands a specific agent, with limited competitive selection.
    false_positive_context: Local requirements may legitimately mandate local partners.
    controls:
    - CTL-112
    - CTL-114
    - CTL-120
  - ref: IND-BEH-023
    legacy_id: BC-FACILIT-006
    context: Employee expenses for gifts, meals or travel for officials around inspections, permits or
      renewals.
    false_positive_context: Business courtesies are normal within policy limits.
    controls:
    - CTL-168
  - ref: IND-TXN-037
    legacy_id: BC-FACILIT-007
    context: Distributor discounts or rebates are unusually large without commercial rationale, leaving
      room for onward payments.
    false_positive_context: Volume discounts and market entry may justify higher margins.
    controls:
    - CTL-060
  - ref: IND-OWN-012
    legacy_id: BC-FACILIT-008
    context: Local partner's owners include officials or relatives without disclosure or fair valuation
      of their contribution.
    false_positive_context: State-linked partners are common in some sectors and not inherently improper.
    controls:
    - CTL-112
    - CTL-114
