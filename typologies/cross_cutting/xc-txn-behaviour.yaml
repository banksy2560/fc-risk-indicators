typology:
  id: XC-TXN-BEHAVIOUR
  name: Generic Transaction Behaviour
  domain: cross_cutting
  description: Typology-agnostic transaction red flags applicable across all crime types. Covers rapid
    movement of funds, absent economic rationale, activity out of line with profile, dormant account reactivation,
    round amounts and third-party payments.
  sectors:
  - all
  sources:
  - FATF, Guidance for a Risk-Based Approach (sector-specific guidance series, general principles)
  - FATF Recommendations, Recommendation 1 and Interpretive Note (assessing risks and applying a risk-based
    approach)
  - Wolfsberg Group, Guidance on a Risk Based Approach for Managing Money Laundering Risks
  indicators:
  - ref: IND-TXN-001
    legacy_id: XC-TXN-BEHAVIOUR-001
    context: Funds are received and moved on within a short period, leaving little residual balance.
    name_in_typology: Rapid in-and-out movement of funds
    false_positive_context: Payment processors, escrow and pass-through business accounts behave this
      way legitimately.
    controls:
    - CTL-040
    - CTL-042
  - ref: IND-TXN-043
    legacy_id: XC-TXN-BEHAVIOUR-002
    context: Transactions lack commercial logic given the customer's business or relationship.
    false_positive_context: Atypical but genuine one-off deals occur.
    controls:
    - CTL-093
    - CTL-022
    - CTL-011
    - CTL-042
  - ref: IND-TXN-013
    legacy_id: XC-TXN-BEHAVIOUR-003
    context: Turnover, counterparties or products exceed or depart from expected behaviour.
    severity_in_typology: medium
    false_positive_context: Life events and growth change behaviour.
    controls:
    - CTL-042
    - CTL-014
  - ref: IND-TXN-011
    legacy_id: XC-TXN-BEHAVIOUR-004
    context: Long-inactive account receives sudden large or high-velocity activity.
    name_in_typology: Dormant account suddenly reactivated
    severity_in_typology: medium
    false_positive_context: Seasonal use and inheritance can reactivate accounts.
    controls:
    - CTL-017
  - ref: IND-TXN-010
    legacy_id: XC-TXN-BEHAVIOUR-005
    context: Frequent round-sum amounts without related invoices or obligations.
    severity_in_typology: low
    false_positive_context: Rent, salaries and gifts often use round numbers.
    controls:
    - CTL-044
    - CTL-042
  - ref: IND-CPT-058
    legacy_id: XC-TXN-BEHAVIOUR-006
    context: Funds regularly sent or received from parties with no clear link to the customer.
    name_in_typology: Frequent third-party payments
    severity_in_typology: high
    false_positive_context: Family support, agents and platforms use third parties.
    controls:
    - CTL-053
    - CTL-046
  - ref: IND-TXN-006
    legacy_id: XC-TXN-BEHAVIOUR-007
    context: Series of transactions sized to remain just below limits.
    name_in_typology: Structuring below reporting or monitoring thresholds
    false_positive_context: Habitual amounts may coincide with limits.
    controls:
    - CTL-038
    - CTL-039
  - ref: IND-TXN-012
    legacy_id: XC-TXN-BEHAVIOUR-008
    context: Abrupt step change in value or count without explanation.
    false_positive_context: Business seasonality and one-off sales.
    controls:
    - CTL-042
    - CTL-022
  - ref: IND-TXN-015
    legacy_id: XC-TXN-BEHAVIOUR-009
    context: Funds return to origin or pass through linked parties in loops.
    name_in_typology: Circular or back-to-back flows
    false_positive_context: Refunds and intercompany settlements.
    controls:
    - CTL-047
    - CTL-048
    - CTL-049
  - ref: IND-TXN-044
    legacy_id: XC-TXN-BEHAVIOUR-010
    context: Customer spreads activity across many accounts, products or institutions.
    false_positive_context: Customers separate budgets legitimately.
    controls:
    - CTL-039
    - CTL-049
  - ref: IND-CPT-059
    legacy_id: XC-TXN-BEHAVIOUR-011
    context: Payments to or from parties linked to adverse media, sanctions or higher-risk sectors.
    name_in_typology: Transactions with high-risk counterparties
    false_positive_context: Counterparty names can be ambiguous.
    controls:
    - CTL-029
    - CTL-053
