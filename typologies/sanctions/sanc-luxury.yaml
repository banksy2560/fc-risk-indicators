typology:
  id: SANC-LUXURY
  name: Luxury Goods and Real-Asset Hiding by Designated Persons
  domain: sanctions
  description: Designated persons may convert financial assets into yachts, aircraft, art, jewellery,
    property or collectibles held through intermediaries to avoid freezing. Detection is relevant to banks,
    art and luxury dealers, brokers, registries and corporate service providers.
  sectors:
  - art_luxury
  - real_estate
  - dnfbp
  - banking
  sources:
  - OFAC, FinCEN, Alert on potential sanctions evasion via luxury and high-value assets (general reference)
  - FATF, Money Laundering and Terrorist Financing in the Art and Antiquities Market (2023)
  - OFSI, guidance on asset freezing (general reference)
  indicators:
  - ref: IND-OWN-003
    legacy_id: SANC-LUXURY-001+SANC-LUXURY-006
    context: 'Yacht, aircraft, art or property is bought through a company with unclear beneficial owners.

      Real estate held by shell companies with nominee directors.'
    name_in_typology: Purchase of high-value assets by newly formed entities with opaque owners
    false_positive_context: Privacy-driven structures are common among wealthy buyers. Privacy legislation
      applies.
    controls:
    - CTL-005
    - CTL-142
    - CTL-167
    - CTL-157
    severity_in_typology: medium
  - ref: IND-TXN-134
    legacy_id: SANC-LUXURY-002
    context: Titles move to relatives, trusts or associates around designation dates.
    false_positive_context: Estate planning occurs.
    controls:
    - CTL-142
    - CTL-031
  - ref: IND-TXN-023
    legacy_id: SANC-LUXURY-003
    context: Running costs of an asset are paid by persons unconnected to the registered owner.
    name_in_typology: Maintenance, crew or insurance costs paid by third parties
    false_positive_context: Managers pay on behalf of owners.
    controls:
    - CTL-046
    - CTL-112
  - ref: IND-PRD-053
    legacy_id: SANC-LUXURY-004
    context: Works are acquired and stored without display or documented purpose.
    name_in_typology: Art or collectibles purchased with no evidence of buyer interest and stored in free
      ports
    false_positive_context: Storage is common for collectors.
    controls:
    - CTL-135
    - CTL-127
  - ref: IND-TXN-021
    legacy_id: SANC-LUXURY-005
    context: Large purchase settled via irregular channels.
    name_in_typology: Cash or quick settlement of purchases with source of funds unclear
    severity_in_typology: medium
    false_positive_context: Large purchases may use intermediaries.
    controls:
    - CTL-012
    - CTL-062
  - ref: IND-TYP-050
    legacy_id: SANC-LUXURY-007
    context: Registration choices obscure the true owner.
    false_positive_context: Flags of convenience are mainstream.
    controls:
    - CTL-142
    - CTL-143
  - ref: IND-CPT-051
    legacy_id: SANC-LUXURY-008
    context: Single broker or lawyer appears across several linked purchases.
    name_in_typology: Advisers or agents who act for multiple designated-linked clients
    severity_in_typology: medium
    false_positive_context: Advisers have many clients.
    controls:
    - CTL-117
    - CTL-047
