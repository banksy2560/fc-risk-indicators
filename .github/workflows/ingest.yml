name: Ingest publications

on:
  schedule:
    # Sunday 20:00 UTC is Monday morning in Sydney.
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ingest dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch and de-duplicate
        run: python tools/ingest.py .

      - name: Decide whether anything is new
        id: detect
        run: |
          set -euo pipefail
          DATE=$(date -u +%F)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          NEW="ingest/new/${DATE}.json"
          if [ -f "$NEW" ]; then
            COUNT=$(python -c "import json,sys; print(len(json.load(open(sys.argv[1], encoding='utf-8')).get('items') or []))" "$NEW")
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
            echo "has_new=true" >> "$GITHUB_OUTPUT"
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "has_new=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit seen and quarantine updates to main
        if: steps.detect.outputs.has_new != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ingest/seen.json
          if [ -d ingest/quarantine ]; then
            git add ingest/quarantine
          fi
          if git diff --cached --quiet; then
            echo "No seen.json or quarantine changes to commit."
            exit 0
          fi
          git commit -m "Ingest: no new publications (${{ steps.detect.outputs.date }})"
          git push origin HEAD:main

      - name: Open an ingest pull request
        if: steps.detect.outputs.has_new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATE="${{ steps.detect.outputs.date }}"
          COUNT="${{ steps.detect.outputs.count }}"
          BRANCH="ingest/${DATE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep the ingest output across the branch switch. checkout would otherwise
          # refuse or drop files that differ from the existing ingest branch.
          rm -rf /tmp/ingest-snapshot
          mkdir -p /tmp/ingest-snapshot
          cp -a ingest/. /tmp/ingest-snapshot/
          git checkout -- ingest || true
          git clean -fd ingest >/dev/null || true
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi
          rm -rf ingest
          mkdir -p ingest
          cp -a /tmp/ingest-snapshot/. ingest/
          git add "ingest/new/${DATE}.json" ingest/seen.json
          if [ -d ingest/quarantine ]; then
            git add ingest/quarantine
          fi
          if git diff --cached --quiet; then
            echo "Ingest branch already contains this run."
          else
            git commit -m "Ingest: ${COUNT} new publications (${DATE})"
            git push -u origin "HEAD:${BRANCH}"
          fi
          gh label create new-publications \
            --description "New public publications found by the weekly ingest" \
            --color 1D76DB || true
          python tools/ingest.py --pr-body "ingest/new/${DATE}.json" > /tmp/ingest-pr.md
          if gh pr view "$BRANCH" --json url --jq .url >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --title "Ingest: ${COUNT} new publications (${DATE})" --body-file /tmp/ingest-pr.md
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Ingest: ${COUNT} new publications (${DATE})" \
              --label new-publications \
              --body-file /tmp/ingest-pr.md
          fi
