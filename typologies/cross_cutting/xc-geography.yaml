typology:
  id: XC-GEOGRAPHY
  name: Geographic Risk
  domain: cross_cutting
  description: Inherent-risk factors linked to the countries and regions connected to a customer, product
    or transaction. Covers FATF-listed jurisdictions, secrecy havens, conflict areas, high-corruption
    environments and trade-diversion hubs.
  sectors:
  - all
  sources:
  - FATF, Guidance for a Risk-Based Approach (sector-specific guidance series, general principles)
  - FATF Recommendations, Recommendation 1 and Interpretive Note (assessing risks and applying a risk-based
    approach)
  - Wolfsberg Group, Guidance on a Risk Based Approach for Managing Money Laundering Risks
  indicators:
  - ref: IND-GEO-036
    legacy_id: XC-GEOGRAPHY-001
    context: Customer, owner or counterparty is connected to a jurisdiction subject to a FATF call for
      action.
    false_positive_context: Humanitarian, diaspora and long-standing commercial links exist.
    controls:
    - CTL-027
    - CTL-035
    - CTL-045
  - ref: IND-GEO-037
    legacy_id: XC-GEOGRAPHY-002
    context: Connection to a jurisdiction under increased monitoring for strategic deficiencies.
    false_positive_context: Listed jurisdictions change and many controls are improving.
    controls:
    - CTL-154
    - CTL-027
  - ref: IND-GEO-038
    legacy_id: XC-GEOGRAPHY-003
    context: Entities, accounts or assets booked in a jurisdiction offering strong secrecy or limited
      ownership registers.
    name_in_typology: Secrecy or low-transparency jurisdiction
    false_positive_context: Established financial centres host legitimate funds and holdings.
    controls:
    - CTL-154
    - CTL-027
  - ref: IND-GEO-039
    legacy_id: XC-GEOGRAPHY-004
    context: Activity involves regions with armed conflict, weak governance or active terrorist groups.
    false_positive_context: Aid agencies, journalists and remittance senders operate there lawfully.
    controls:
    - CTL-045
    - CTL-024
  - ref: IND-GEO-040
    legacy_id: XC-GEOGRAPHY-005
    context: Source of wealth or funds linked to jurisdictions with high perceived corruption.
    false_positive_context: Perception indices are broad and many clients are legitimate.
    controls:
    - CTL-154
    - CTL-013
  - ref: IND-GEO-041
    legacy_id: XC-GEOGRAPHY-006
    context: Flows or goods route through hubs commonly used to reroute goods or avoid restrictions.
    name_in_typology: Trade-diversion or transshipment hub
    false_positive_context: Hubs handle huge volumes of legitimate trade.
    controls:
    - CTL-126
    - CTL-130
  - ref: IND-GEO-042
    legacy_id: XC-GEOGRAPHY-007
    context: Customer or flows are located in or adjacent to comprehensively sanctioned areas.
    false_positive_context: Border communities lawfully trade.
    controls:
    - CTL-035
    - CTL-030
  - ref: IND-GEO-019
    legacy_id: XC-GEOGRAPHY-008
    context: Transactions concentrate in countries with no link to the customer's residence, business
      or stated purpose.
    name_in_typology: Mismatch between customer location and activity geography
    false_positive_context: Travel, new suppliers and migration can explain changes.
    controls:
    - CTL-011
    - CTL-045
  - ref: IND-GEO-043
    legacy_id: XC-GEOGRAPHY-009
    context: Funds booked or routed via offshore centres with minimal client ties.
    false_positive_context: Offshore centres serve legitimate wealth planning.
    controls:
    - CTL-154
    - CTL-066
  - ref: IND-GEO-044
    legacy_id: XC-GEOGRAPHY-010
    context: Payments to or from corridors identified in public typology reports as high abuse.
    false_positive_context: Corridors also carry legitimate migrant remittances.
    controls:
    - CTL-154
    - CTL-045
