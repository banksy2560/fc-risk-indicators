typology:
  id: EC-MINING
  name: Illegal Mining and Precious Metals Laundering
  domain: environmental_crime
  description: Extraction of gold, diamonds, coltan and other minerals without licence or in breach of
    law, and the laundering of resulting metals through scrap dealers, refiners, jewellers and traders.
    Linkages to armed groups, environmental damage and forced labour raise the stakes.
  exposure:
    channels:
    - face_to_face_professional
    payment_rails:
    - cash
    - wire_swift
    - trade_instruments
    customer_segments:
    - sme
    - corporate
    - regulated_nonbank_dnfbp
    - professional_intermediary
    products:
    - trade_finance
    - transaction_account
    - real_assets
    basis: ai_inferred
    rationale: Gold and gem dealers, refiners and scrap buyers pay cash to informal miners, then deposit
      and export; metals are real assets.
  sectors:
  - banking
  - dnfbp
  - art_luxury
  - payments
  sources:
  - FATF, Money Laundering from Environmental Crime (2021) <https://www.fatf-gafi.org/content/fatf-gafi/en/publications/Environmentalcrime/Money-laundering-from-environmental-crime.html>
    [agent-reviewed]
  - OECD, OECD Due Diligence Guidance for Responsible Supply Chains of Minerals from Conflict-Affected
    and High-Risk Areas, Third Edition (2016) [corrected, unverified]
  - FATF and APG, Money Laundering and Terrorist Financing Risks and Vulnerabilities Associated with Gold
    (2015) <https://www.fatf-gafi.org/content/fatf-gafi/en/publications/Methodsandtrends/Ml-tf-risks-and-vulnerabilities-gold.html>
    [corrected, agent-reviewed]
  - UN Security Council expert panel reports on illicit mineral trade [too vague, unverified]
  indicators:
  - ref: IND-DOC-021
    legacy_id: EC-MINING-001
    context: Customer sells gold or concentrate with no mine licence, assay or chain-of-custody documents.
    name_in_typology: Gold of unclear origin sold to refiners or exporters
    false_positive_context: Artisanal miners often lack formal paperwork.
    controls:
    - CTL-135
    - CTL-136
    - CTL-131
  - ref: IND-TXN-014
    legacy_id: EC-MINING-002
    context: Quantities exported by a country or trader exceed credible domestic production.
    name_in_typology: Exports exceeding official production of origin country
    false_positive_context: Trade statistics can have timing differences.
    controls:
    - CTL-139
    - CTL-154
  - ref: IND-TXN-022
    legacy_id: EC-MINING-003
    context: Dealer pays cash at remote sites and deposits to bank accounts mixed with legitimate sales.
    name_in_typology: Large cash purchases from informal miners and traders
    false_positive_context: Artisanal mining economies are cash based.
    controls:
    - CTL-055
    - CTL-012
  - ref: IND-CUS-005
    legacy_id: EC-MINING-004
    context: Licence-holder 'rents' licence to others or licences conflict with location.
    name_in_typology: Dealer with no licence or with licences used by third parties
    false_positive_context: Brokerage structures sometimes lawful.
    controls:
    - CTL-134
    - CTL-116
    - CTL-136
  - ref: IND-PRD-026
    legacy_id: EC-MINING-005
    context: Surge in 'scrap' or 'recycled' gold from small sellers with no records.
    false_positive_context: Scrap markets are legitimate.
    controls:
    - CTL-135
    - CTL-139
  - ref: IND-GEO-006
    legacy_id: EC-MINING-006
    context: Mining or trade in territories controlled by armed groups with payments to checkpoints.
    name_in_typology: Links to armed groups or sanctioned parties in conflict areas
    false_positive_context: Local taxes may be legitimate.
    controls:
    - CTL-157
    - CTL-029
  - ref: IND-TYP-022
    legacy_id: EC-MINING-007
    context: Purchase of dredges, mercury or bulk chemicals by unlicensed persons.
    false_positive_context: Industrial users buy chemicals.
    controls:
    - CTL-057
    - CTL-173
  - ref: IND-TXN-060
    legacy_id: EC-MINING-008
    context: Stones traded at prices off market, flowing through several traders and returning to origin.
    false_positive_context: Valuation of stones is subjective.
    controls:
    - CTL-141
    - CTL-047
