typology:
  id: ML-GATEKEEPER
  name: Legal-Sector and Accountant Gatekeeper Misuse
  domain: money_laundering
  description: Misuse of lawyers, notaries, accountants and similar professionals, witting or unwitting,
    to create structures, hold or move client funds, buy assets or lend credibility to transactions. Client
    accounts and professional privilege are used to distance funds from their source.
  exposure:
    channels:
    - face_to_face_professional
    payment_rails:
    - wire_swift
    - cash
    customer_segments:
    - regulated_nonbank_dnfbp
    - professional_intermediary
    - corporate
    - private_wealth
    products:
    - transaction_account
    - company_formation_services
    basis: ai_inferred
    rationale: Lawyers, notaries and accountants run client accounts, form structures and buy assets for
      clients; fees or deposits sometimes in cash.
  stage:
  - layering
  - integration
  sectors:
  - dnfbp
  - banking
  sources:
  - FATF, Money Laundering and Terrorist Financing Vulnerabilities of Legal Professionals (2013) <https://www.fatf-gafi.org/en/publications/Methodsandtrends/ML-and-TF-vulnerabilities-legal-professionals.html>
    [agent-reviewed]
  - FATF, Guidance for a Risk-Based Approach for Legal Professionals (2019) <https://www.fatf-gafi.org/en/publications/Fatfrecommendations/Risk-based-approach-legal-professionals.html>
    [agent-reviewed]
  - FATF, Guidance for a Risk-Based Approach for the Accounting Profession (2019) <https://www.fatf-gafi.org/en/publications/Fatfrecommendations/Risk-based-approach-accounting-profession.html>
    [agent-reviewed]
  indicators:
  - ref: IND-TXN-035
    legacy_id: ML-GATEKEEPER-001
    context: Funds pass through client account without a legal service.
    name_in_typology: Client account used with no underlying legal work
    false_positive_context: Deposits pending completion.
    controls:
    - CTL-119
    - CTL-117
    - CTL-040
  - ref: IND-CPT-058
    legacy_id: ML-GATEKEEPER-002
    context: Sudden redirection of funds to unrelated beneficiaries.
    name_in_typology: Instructions to transfer funds to third parties without explanation
    severity_in_typology: high
    false_positive_context: Settlement structures.
    controls:
    - CTL-070
    - CTL-046
  - ref: IND-OWN-002
    legacy_id: ML-GATEKEEPER-003
    context: Creation of layered entities and trusts.
    name_in_typology: Complex structures with no commercial reason
    false_positive_context: Tax planning.
    controls:
    - CTL-008
    - CTL-025
  - ref: IND-TXN-106
    legacy_id: ML-GATEKEEPER-004
    context: Deals cancelled and money sent to different parties.
    false_positive_context: Deals collapse.
    controls:
    - CTL-089
  - ref: IND-BEH-018
    legacy_id: ML-GATEKEEPER-005
    context: Pressure to bypass checks.
    name_in_typology: Client insists on speed or secrecy
    false_positive_context: Urgency exists.
    controls:
    - CTL-098
    - CTL-169
  - ref: IND-CUS-039
    legacy_id: ML-GATEKEEPER-006
    context: Refuses details of beneficial owner or source.
    false_positive_context: Privacy.
    controls:
    - CTL-016
    - CTL-117
  - ref: IND-TXN-107
    legacy_id: ML-GATEKEEPER-007
    context: Fees or deposits in cash.
    false_positive_context: Small firms.
    controls:
    - CTL-062
    - CTL-134
  - ref: IND-TYP-033
    legacy_id: ML-GATEKEEPER-008
    context: Professional acts as nominee, director, or intermediary beyond normal remit.
    false_positive_context: Trust services.
    controls:
    - CTL-117
    - CTL-007
  - ref: IND-GEO-016
    legacy_id: ML-GATEKEEPER-009
    context: No reason to use this adviser.
    false_positive_context: Specialist advice.
    controls:
    - CTL-011
    - CTL-154
