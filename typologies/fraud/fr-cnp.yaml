    - id: FR-CNP-007-C2
      name: Chargeback and merchant-risk analytics
      type: detective
      description: Monitors dispute ratios, refund patterns and merchant behaviour, and identifies repeat
        disputers and friendly fraud.
      implementation: model
      effectiveness: medium
    - id: FR-CNP-007-C3
      name: Consortium and shared fraud data
      type: detective
      description: Matches accounts, devices, identifiers and beneficiaries against industry fraud-intelligence
        sharing to catch known bad actors early.
      implementation: technology
      effectiveness: high
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - id: FR-CNP-008
    name: Account created and used within minutes
    description: New account follows rapid purchase flow.
    category: behavioural
    severity: medium
    detection_type:
    - customer_behaviour
    data_sources:
    - session_telemetry
    false_positive_notes: Impulse buys.
    controls:
    - id: FR-CNP-008-C1
      name: Device and network intelligence
      type: detective
      description: Fingerprints devices, IPs and emulators to link applications or sessions and flag anomalous
        or shared infrastructure.
      implementation: technology
      effectiveness: high
    - id: FR-CNP-008-C2
      name: Behavioural and session analytics
      type: detective
      description: Scores session behaviour (typing, navigation, remote-access tooling, call-in-progress
        signals, deviation from baseline) to surface coached or controlled activity.
      implementation: model
      effectiveness: high
    - id: FR-CNP-008-C3
      name: Document and biometric identity verification
      type: preventive
      description: Verifies identity documents and liveness at onboarding or high-risk events, with checks
        against authoritative data sources.
      implementation: technology
      effectiveness: high
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - id: FR-CNP-009
    name: 3-D Secure bypass or failed authentication retried
    description: Attempts changed to non-authenticated channels.
    category: product_channel
    severity: medium
    detection_type:
    - transaction_monitoring
    data_sources:
    - authentication_logs
    false_positive_notes: Technical failure.
    controls:
    - id: FR-CNP-009-C1
      name: 3-D Secure and tokenisation
      type: preventive
      description: Authenticates the cardholder on online purchases and replaces card data with tokens
        to shift liability and block misuse.
      implementation: technology
      effectiveness: high
    - id: FR-CNP-009-C2
      name: Velocity and threshold rules
      type: detective
      description: Rules on count, value, geography and timing alert analysts to bursts or structured
        activity.
      implementation: rule
      effectiveness: medium
