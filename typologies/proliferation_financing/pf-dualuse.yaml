typology:
  id: PF-DUALUSE
  name: Dual-Use Goods Procurement via Front Companies
  domain: proliferation_financing
  description: Proliferation networks seek controlled or dual-use items through front companies, brokers
    and intermediaries that disguise the true end user. Financial institutions mainly see this through
    payments and trade documents, so detection depends on matching customer profile, goods and destination.
  sectors:
  - banking
  - trade_finance
  - corporate_services
  sources:
  - FATF, Guidance on Counter Proliferation Financing (2018) [unverified]
  - FATF, Guidance on Proliferation Financing Risk Assessment and Mitigation (2021) [unverified]
  - UN Security Council Resolution 1540 (2004) [unverified]
  indicators:
  - ref: IND-CUS-049
    legacy_id: PF-DUALUSE-001
    context: Trading or logistics firm with no technical background transacts in items with possible weapons
      or missile applications.
    false_positive_context: Distributors do handle technical goods outside their main specialty.
    controls:
    - CTL-011
    - CTL-133
    - CTL-130
  - ref: IND-DOC-054
    legacy_id: PF-DUALUSE-002
    context: Customer or counterparty is evasive about final destination, use or end-user certificate.
    name_in_typology: End user vague, missing or reluctant to provide details
    false_positive_context: Commercial confidentiality can explain limited detail.
    controls:
    - CTL-128
    - CTL-016
  - ref: IND-GEO-027
    legacy_id: PF-DUALUSE-003
    context: Goods shipped to a forwarder, bonded zone or residential address rather than the end user.
    name_in_typology: Delivery to freight forwarder, free-trade zone or address unrelated to the buyer
    false_positive_context: Forwarders are standard in trade.
    controls:
    - CTL-126
  - ref: IND-OWN-006
    legacy_id: PF-DUALUSE-004
    context: Recently formed company with minimal premises or staff, shared address or officers with other
      trading firms, and large-value technical trades.
    name_in_typology: Front company characteristics
    severity_in_typology: medium
    false_positive_context: Start-ups and virtual offices are legitimate.
    controls:
    - CTL-049
    - CTL-024
  - ref: IND-TXN-023
    legacy_id: PF-DUALUSE-005
    context: Invoices are settled by firms that are not named in trade documents, often from high-risk
      or diversion-prone jurisdictions.
    name_in_typology: Payments from third parties unrelated to the trade
    false_positive_context: Treasury centres and group payment arrangements are common.
    controls:
    - CTL-046
  - ref: IND-DOC-055
    legacy_id: PF-DUALUSE-006
    context: Equipment priced far above or below market, or specifications altered to fall below control
      thresholds.
    false_positive_context: Prices vary with customisation and volume.
    controls:
    - CTL-130
    - CTL-124
  - ref: IND-TYP-046
    legacy_id: PF-DUALUSE-007
    context: Goods, parties or addresses match published alerts by export-control or enforcement authorities.
    false_positive_context: List data may be dated or generic.
    controls:
    - CTL-130
    - CTL-102
  - ref: IND-BEH-017
    legacy_id: PF-DUALUSE-008
    context: Shipments are re-routed or re-invoiced through successive parties.
    name_in_typology: Use of multiple intermediaries or repeated changes of consignee
    false_positive_context: Resale and drop-shipping are common.
    controls:
    - CTL-123
    - CTL-132
