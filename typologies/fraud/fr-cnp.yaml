typology:
  id: FR-CNP
  name: Card-Not-Present and Chargeback Fraud
  domain: fraud
  description: Stolen card details are used online or by phone where the physical card is not checked,
    and some customers or merchants abuse the chargeback system. Fraud rings test cards at low value before
    large purchases.
  sectors:
  - payments
  - banking
  - fintech
  sources:
  - UK Finance, Annual Fraud Report (published annually)
  - EMVCo and card scheme guidance on 3-D Secure and chargebacks (general)
  - FinCEN, advisories on cyber-enabled fraud (general)
  indicators:
  - id: FR-CNP-001
    name: Card testing with many small authorisations
    description: Bursts of low-value attempts across cards, many declined, followed by a successful larger
      purchase.
    category: transaction
    severity: high
    detection_type:
    - transaction_monitoring
    data_sources:
    - authorisation_data
    false_positive_notes: Merchant retries.
    controls:
    - id: FR-CNP-001-C1
      name: Velocity and threshold rules
      type: detective
      description: Rules on count, value, geography and timing alert analysts to bursts or structured
        activity.
      implementation: rule
      effectiveness: medium
    - id: FR-CNP-001-C2
      name: 3-D Secure and tokenisation
      type: preventive
      description: Authenticates the cardholder on online purchases and replaces card data with tokens
        to shift liability and block misuse.
      implementation: technology
      effectiveness: high
    - id: FR-CNP-001-C3
      name: Device and network intelligence
      type: detective
      description: Fingerprints devices, IPs and emulators to link applications or sessions and flag anomalous
        or shared infrastructure.
      implementation: technology
      effectiveness: high
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - id: FR-CNP-002
    name: Shipping address differs from billing and is a reshipper
    description: Goods sent to a freight forwarder or address linked to previous fraud.
    category: geographic
    severity: medium
    detection_type:
    - transaction_monitoring
    data_sources:
    - order_data
    false_positive_notes: Gifts.
    controls:
    - id: FR-CNP-002-C1
      name: 3-D Secure and tokenisation
      type: preventive
      description: Authenticates the cardholder on online purchases and replaces card data with tokens
        to shift liability and block misuse.
      implementation: technology
      effectiveness: high
    - id: FR-CNP-002-C2
      name: Device and network intelligence
      type: detective
      description: Fingerprints devices, IPs and emulators to link applications or sessions and flag anomalous
        or shared infrastructure.
      implementation: technology
      effectiveness: high
    - id: FR-CNP-002-C3
      name: Consortium and shared fraud data
      type: detective
      description: Matches accounts, devices, identifiers and beneficiaries against industry fraud-intelligence
        sharing to catch known bad actors early.
      implementation: technology
      effectiveness: high
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - id: FR-CNP-003
    name: Multiple cards used from one device or IP
    description: One endpoint presents many card numbers.
    category: behavioural
    severity: high
    detection_type:
    - customer_behaviour
    data_sources:
    - device_data
    false_positive_notes: Shared devices in shops.
    controls:
    - id: FR-CNP-003-C1
      name: Device and network intelligence
      type: detective
      description: Fingerprints devices, IPs and emulators to link applications or sessions and flag anomalous
        or shared infrastructure.
      implementation: technology
      effectiveness: high
    - id: FR-CNP-003-C2
      name: Consortium and shared fraud data
      type: detective
      description: Matches accounts, devices, identifiers and beneficiaries against industry fraud-intelligence
        sharing to catch known bad actors early.
      implementation: technology
      effectiveness: high
    - id: FR-CNP-003-C3
      name: Velocity and threshold rules
      type: detective
      description: Rules on count, value, geography and timing alert analysts to bursts or structured
        activity.
      implementation: rule
      effectiveness: medium
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - id: FR-CNP-004
    name: High-value purchases of resalable goods
    description: Electronics, gift cards or digital goods with quick delivery.
    category: transaction
    severity: medium
    detection_type:
    - transaction_monitoring
    data_sources:
    - order_data
    false_positive_notes: Genuine retail demand.
    controls:
    - id: FR-CNP-004-C1
      name: Velocity and threshold rules
      type: detective
      description: Rules on count, value, geography and timing alert analysts to bursts or structured
        activity.
      implementation: rule
      effectiveness: medium
    - id: FR-CNP-004-C2
      name: 3-D Secure and tokenisation
      type: preventive
      description: Authenticates the cardholder on online purchases and replaces card data with tokens
        to shift liability and block misuse.
      implementation: technology
      effectiveness: high
    - id: FR-CNP-004-C3
      name: Behavioural and session analytics
      type: detective
      description: Scores session behaviour (typing, navigation, remote-access tooling, call-in-progress
        signals, deviation from baseline) to surface coached or controlled activity.
      implementation: model
      effectiveness: high
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - id: FR-CNP-005
    name: Cardholder disputes shortly after delivery despite genuine session
    description: 'Friendly fraud: cardholder denies a transaction made from their own device.'
    category: behavioural
    severity: medium
    detection_type:
    - customer_behaviour
    - transaction_monitoring
    data_sources:
    - dispute_data
    false_positive_notes: Genuine disputes.
    controls:
    - id: FR-CNP-005-C1
      name: Chargeback and merchant-risk analytics
      type: detective
      description: Monitors dispute ratios, refund patterns and merchant behaviour, and identifies repeat
        disputers and friendly fraud.
      implementation: model
      effectiveness: medium
    - id: FR-CNP-005-C2
      name: Device and network intelligence
      type: detective
      description: Fingerprints devices, IPs and emulators to link applications or sessions and flag anomalous
        or shared infrastructure.
      implementation: technology
      effectiveness: high
    - id: FR-CNP-005-C3
      name: Case management and fraud MI governance
      type: governance
      description: Outcomes, losses and false positives are tracked and fed back into rule tuning and
        risk appetite.
      implementation: process
      effectiveness: medium
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - id: FR-CNP-006
    name: Merchant chargeback ratio above scheme thresholds
    description: 'Merchant-side: high disputes and refunds.'
    category: counterparty
    severity: high
    detection_type:
    - transaction_monitoring
    data_sources:
    - merchant_data
    false_positive_notes: Seasonal peaks.
    controls:
    - id: FR-CNP-006-C1
      name: Chargeback and merchant-risk analytics
      type: detective
      description: Monitors dispute ratios, refund patterns and merchant behaviour, and identifies repeat
        disputers and friendly fraud.
      implementation: model
      effectiveness: medium
    - id: FR-CNP-006-C2
      name: Merchant onboarding and monitoring
      type: preventive
      description: Verifies merchants and monitors for transaction laundering, bust-out and dubious business
        models.
      implementation: process
      effectiveness: medium
    - id: FR-CNP-006-C3
      name: Case management and fraud MI governance
      type: governance
      description: Outcomes, losses and false positives are tracked and fed back into rule tuning and
        risk appetite.
      implementation: process
      effectiveness: medium
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - id: FR-CNP-007
    name: Transaction laundering via a front merchant
    description: Merchant processes sales for undisclosed businesses.
    category: counterparty
    severity: high
    detection_type:
    - transaction_monitoring
    - investigator_judgement
    data_sources:
    - merchant_data
    false_positive_notes: Aggregators.
    controls:
    - id: FR-CNP-007-C1
      name: Merchant onboarding and monitoring
      type: preventive
      description: Verifies merchants and monitors for transaction laundering, bust-out and dubious business
