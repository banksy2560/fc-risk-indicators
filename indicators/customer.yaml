  severity: medium
  detection_type:
  - kyc_review
  data_sources:
  - kyc_profile
  - address_data
  false_positive_notes: Expatriates, students, property investors and cross-border workers often have
    legitimate need.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-CUS-018
