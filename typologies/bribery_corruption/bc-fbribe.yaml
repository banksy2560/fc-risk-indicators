typology:
  id: BC-FBRIBE
  name: Bribery of Foreign Public Officials
  domain: bribery_corruption
  description: Payments or benefits offered to foreign public officials to obtain or retain business or
    an improper advantage, typically disguised as consultancy, marketing, or commission payments routed
    through third parties or offshore entities. Financial institutions see the flows as unusual payments
    to or from intermediaries, officials' relatives, or shell companies.
  exposure:
    channels: []
    payment_rails:
    - wire_swift
    customer_segments:
    - corporate
    - pep_related
    - professional_intermediary
    products:
    - transaction_account
    - correspondent_account
    basis: ai_inferred
    rationale: Commission/consultancy payments to agents or shells for foreign official benefit via international
      wires.
    consumer:
      relevant: false
      products: []
      channels: []
      basis: ai_inferred
      rationale: Commission payments to agents for foreign officials via international wires; corporate
        and correspondent flows.
  sectors:
  - banking
  - corporate_services
  - payments
  sources:
  - 'FATF, Specific Risk Factors in the Laundering of Proceeds of Corruption: Assistance to Reporting
    Institutions (2012) <https://www.fatf-gafi.org/content/fatf-gafi/en/publications/Methodsandtrends/Specificriskfactorsinthelaunderingofproceedsofcorruption-assistancetoreportinginstitutions.html>
    [corrected, agent-reviewed]'
  - OECD, Convention on Combating Bribery of Foreign Public Officials in International Business Transactions
    and related guidance [unverified]
  - OECD, UNODC and World Bank, Anti-Corruption Ethics and Compliance Handbook for Business (2013) [unverified]
  - Wolfsberg Group, Anti-Bribery and Corruption Compliance Programme Guidance (2017) <https://wolfsberg-group.org/resources>
    [agent-reviewed]
  indicators:
  - ref: IND-TXN-038
    legacy_id: BC-FBRIBE-001
    context: Large success-based or commission payments to a consultant or agent tied to winning a contract
      with a state body in a high-corruption-risk jurisdiction.
    false_positive_context: Genuine commercial agents are commonly paid success fees; rates in some sectors
      are legitimately high.
    controls:
    - CTL-060
    - CTL-114
    - CTL-077
  - ref: IND-GEO-019
    legacy_id: BC-FBRIBE-002
    context: Intermediary asks for payment to a bank account in a jurisdiction where neither the service
      nor the intermediary operates.
    name_in_typology: Payment to account in third country unrelated to services
    severity_in_typology: high
    false_positive_context: Treasury centralisation or tax-driven structures can place accounts in other
      countries.
    controls:
    - CTL-045
    - CTL-078
  - ref: IND-OWN-006
    legacy_id: BC-FBRIBE-003
    context: Consultant is a recently formed company with no website, staff, or track record yet receives
      large fees from a firm bidding for government work.
    name_in_typology: Intermediary shell with no operating footprint
    false_positive_context: Start-ups and sole-trader specialists may have a limited online presence.
    controls:
    - CTL-112
    - CTL-005
  - ref: IND-CPT-004
    legacy_id: BC-FBRIBE-004
    context: Agent or its owners are relatives, associates or former colleagues of an official with influence
      over the relevant decision.
    false_positive_context: Small markets mean many people have family ties to government; links alone
      are not wrongdoing.
    controls:
    - CTL-028
    - CTL-164
  - ref: IND-DOC-001
    legacy_id: BC-FBRIBE-005
    context: Invoices describe 'consulting', 'marketing support' or 'liaison services' without deliverables,
      timesheets or reports.
    false_positive_context: Early-stage or informal advisers may keep thin paperwork.
    controls:
    - CTL-060
  - ref: IND-TXN-039
    legacy_id: BC-FBRIBE-006
    context: Payments for luxury travel, tuition, medical treatment or property for officials or relatives,
      booked via a vendor or card.
    false_positive_context: Official delegations legitimately receive modest hospitality and reasonable
      travel for site visits.
    controls:
    - CTL-168
    - CTL-043
  - ref: IND-BEH-024
    legacy_id: BC-FBRIBE-007
    context: Cluster of payments to an intermediary just before or after a tender decision, licence grant
      or regulatory approval.
    false_positive_context: Milestone payments often legitimately align with contract events.
    controls:
    - CTL-059
    - CTL-071
  - ref: IND-TXN-009
    legacy_id: BC-FBRIBE-008
    context: Payments to an intermediary are repeatedly broken into amounts just under internal authorisation
      thresholds.
    name_in_typology: Round-sum payments split below approval limits
    false_positive_context: Budget cycles and instalment schedules can create similar patterns.
    controls:
    - CTL-038
    - CTL-169
