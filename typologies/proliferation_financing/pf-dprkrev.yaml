typology:
  id: PF-DPRKREV
  name: 'DPRK-Style Revenue Generation: Cyber Theft and Overseas IT Workers (Indicator Level)'
  domain: proliferation_financing
  description: State-linked actors may raise revenue through cyber-enabled theft of virtual assets and
    funds, and through overseas IT workers who conceal identity and location. This typology is described
    only at indicator level to support detection and screening, without operational detail.
  sectors:
  - banking
  - crypto
  - fintech
  - payments
  sources:
  - FATF, Guidance on Counter Proliferation Financing (2018) [unverified]
  - FATF, Targeted Update on Implementation of the FATF Standards on Virtual Assets and VASPs (annual,
    2019 onward) [corrected, unverified]
  - US State/Treasury/FBI, Guidance on the Democratic People's Republic of Korea Information Technology
    Workers (May 2022); US Government, Guidance on the North Korean Cyber Threat (April 2020) [replacement
    suggested, unverified]
  indicators:
  - ref: IND-CUS-009
    legacy_id: PF-DPRKREV-001
    context: Remote worker profile shows mismatched documents, geolocation and payment details.
    name_in_typology: Freelancer or contractor accounts with identity and location inconsistencies
    false_positive_context: Remote workers legitimately use VPNs and travel.
    controls:
    - CTL-001
    - CTL-092
  - ref: IND-TXN-017
    legacy_id: PF-DPRKREV-002
    context: Earnings are routed to accounts of unrelated people or to multiple wallets, then consolidated.
    name_in_typology: Payments to accounts held by third parties on behalf of workers
    false_positive_context: Agencies and family members sometimes receive payments.
    controls:
    - CTL-046
    - CTL-040
    - CTL-173
  - ref: IND-CPT-050
    legacy_id: PF-DPRKREV-003
    context: Deposits with direct or near-direct exposure to addresses attributed to major thefts.
    name_in_typology: Inflows of stolen virtual assets traced by analytics
    false_positive_context: Exposure may be indirect and unknowing.
    controls:
    - CTL-145
    - CTL-103
    - CTL-097
  - ref: IND-TXN-018
    legacy_id: PF-DPRKREV-004
    context: Assets are swapped across chains and tokens in quick succession before off-ramp.
    name_in_typology: Rapid chain-hopping and conversion following inbound funds
    false_positive_context: DeFi users also swap frequently.
    controls:
    - CTL-145
    - CTL-072
  - ref: IND-CPT-015
    legacy_id: PF-DPRKREV-005
    context: Large conversions to fiat at OTC desks outside strong supervision.
    name_in_typology: Off-ramp via over-the-counter brokers in higher-risk jurisdictions
    false_positive_context: OTC desks serve legitimate clients.
    controls:
    - CTL-149
    - CTL-012
  - ref: IND-OWN-011
    legacy_id: PF-DPRKREV-006
    context: Customer matches or is linked to designated persons or front entities in public lists.
    name_in_typology: Entities and individuals linked to sanctioned networks
    false_positive_context: Name matching produces false positives.
    controls:
    - CTL-029
    - CTL-034
  - ref: IND-CUS-011
    legacy_id: PF-DPRKREV-007
    context: Foreign IT-services firm has limited verifiable clients and unclear service delivery.
    name_in_typology: Bank accounts opened for IT-services companies with minimal footprint
    severity_in_typology: medium
    false_positive_context: New IT consultancies exist.
    controls:
    - CTL-010
    - CTL-157
  - ref: IND-DOC-053
    legacy_id: PF-DPRKREV-008
    context: Documents, employment history or references show signs of fabrication.
    false_positive_context: Document quality varies.
    controls:
    - CTL-002
