typology:
  id: CY-DEFI
  name: DeFi, Bridge and Cross-Chain Laundering
  domain: cyber_enabled
  description: Decentralised protocols, automated market makers and cross-chain bridges let value move
    without a central intermediary performing customer checks. Criminals including hackers exploit these
    to swap, pool and hop assets before reaching a regulated off-ramp. Obligated entities usually observe
    this only at on- and off-ramps through exposure analysis and behaviour.
  stage:
  - layering
  sectors:
  - crypto
  - fintech
  sources:
  - 'FATF, Virtual Assets: Red Flag Indicators of Money Laundering and Terrorist Financing (2020)'
  - FATF, Updated Guidance for a Risk-Based Approach to Virtual Assets and Virtual Asset Service Providers
    (2021)
  - US Department of the Treasury, Illicit Finance Risk Assessment of Decentralized Finance (2023)
  indicators:
  - ref: IND-TYP-008
    legacy_id: CY-DEFI-001
    context: Deposits have provenance in a smart-contract exploit, bridge hack or theft attributed by
      analytics providers.
    false_positive_context: Funds returned under a bounty or recovered legitimately.
    controls:
    - CTL-145
    - CTL-083
    - CTL-103
  - ref: IND-TXN-047
    legacy_id: CY-DEFI-002
    context: On-chain history shows repeated swaps and bridge crossings with no yield or trading logic
      before arrival at the platform.
    false_positive_context: Yield farmers and aggregators routing automatically.
    controls:
    - CTL-145
    - CTL-037
    - CTL-093
  - ref: IND-TXN-048
    legacy_id: CY-DEFI-003
    context: Chain of new wallets each funded by the previous one before depositing to a regulated service.
    false_positive_context: Wallet hygiene and per-protocol wallets.
    controls:
    - CTL-145
    - CTL-048
    - CTL-037
  - ref: IND-TYP-009
    legacy_id: CY-DEFI-004
    context: History includes contracts, pools or relayers sanctioned or advised against by authorities.
    name_in_typology: Interaction with sanctioned or high-risk smart contracts
    false_positive_context: Indirect exposure via shared liquidity.
    controls:
    - CTL-029
    - CTL-145
    - CTL-103
  - ref: IND-TXN-049
    legacy_id: CY-DEFI-005
    context: Assets arriving via bridge are sold into fiat or stablecoin and withdrawn within a short
      window.
    false_positive_context: Normal arbitrage.
    controls:
    - CTL-037
    - CTL-145
    - CTL-072
  - ref: IND-TXN-050
    legacy_id: CY-DEFI-006
    context: Customer accepts clearly unfavourable swap prices or uses thin-liquidity tokens, suggesting
      priority on obscuring origin.
    false_positive_context: Illiquid-market inexperience.
    controls:
    - CTL-037
    - CTL-093
    - CTL-171
  - ref: IND-CPT-009
    legacy_id: CY-DEFI-007
    context: Flows route through aggregators or bridges without KYC and with no governance accountability.
    false_positive_context: Many such services are used by mainstream traders.
    controls:
    - CTL-149
    - CTL-145
    - CTL-162
  - ref: IND-TYP-005
    legacy_id: CY-DEFI-008
    context: Value passes through pools designed to hide linkage, immediately before or after platform
      activity.
    name_in_typology: Use of privacy-preserving or zero-knowledge pools
    false_positive_context: Privacy-minded users.
    controls:
    - CTL-145
    - CTL-029
    - CTL-093
  - ref: IND-CUS-019
    legacy_id: CY-DEFI-009
    context: Large treasury-type movements from a stated protocol with no verifiable entity, audits or
      governance record.
    false_positive_context: Pseudonymous but legitimate teams.
    controls:
    - CTL-023
    - CTL-012
    - CTL-093
  - ref: IND-BEH-043
    legacy_id: CY-DEFI-010
    context: Retail customers with no on-chain history send large sums directly to bridges or DeFi contracts.
    false_positive_context: Newly curious customers.
    controls:
    - CTL-037
    - CTL-068
    - CTL-171
