typology:
  id: BC-KICKBACK
  name: Procurement Kickbacks and Bid Rigging
  domain: bribery_corruption
  description: Improper payments or favours linked to public or private procurement, including kickbacks
    to buyers, inflated contract prices, bid rigging and phantom suppliers. Banks and corporates can detect
    patterns in supplier payments, related parties and post-award flows.
  sectors:
  - banking
  - corporate_services
  - payments
  sources:
  - OECD, Recommendation of the Council on Public Procurement (2015) [unverified]
  - OECD, Preventing Corruption in Public Procurement (2016) [unverified]
  - OECD, Guidelines for Fighting Bid Rigging in Public Procurement (2009) [unverified]
  - FATF, Laundering the Proceeds of Corruption (2011) <https://www.fatf-gafi.org/en/publications/Methodsandtrends/Laundering-the-proceeds-of-corruption.html>
    [agent-reviewed]
  indicators:
  - ref: IND-TXN-020
    legacy_id: BC-KICKBACK-001
    context: Awarded price materially exceeds engineers' estimates or comparable contracts without justification.
    name_in_typology: Contract price well above market or estimate
    severity_in_typology: medium
    false_positive_context: Complexity, scope change and inflation can legitimately inflate prices.
    controls:
    - CTL-124
    - CTL-059
  - ref: IND-BEH-025
    legacy_id: BC-KICKBACK-002
    context: One supplier repeatedly wins just below competitors or in rotation among a small group.
    false_positive_context: Niche markets may have few capable bidders.
    controls:
    - CTL-059
    - CTL-097
  - ref: IND-TXN-040
    legacy_id: BC-KICKBACK-003
    context: Winning supplier transfers funds to persons or companies connected to the procuring official
      shortly after payment.
    false_positive_context: Supplier subcontracting may pay related parties innocently.
    controls:
    - CTL-058
    - CTL-048
  - ref: IND-OWN-013
    legacy_id: BC-KICKBACK-004
    context: Awardee has no relevant staff, assets or experience and subcontracts nearly all work.
    false_positive_context: Project vehicles are often newly formed and sub-contract widely.
    controls:
    - CTL-010
    - CTL-121
  - ref: IND-DOC-002
    legacy_id: BC-KICKBACK-005
    context: Scope and price rise significantly through repeated amendments shortly after award.
    false_positive_context: Genuine scope changes are common in construction and IT.
    controls:
    - CTL-059
  - ref: IND-DOC-003
    legacy_id: BC-KICKBACK-006
    context: Use of urgency or sole-source exceptions for non-urgent purchases.
    false_positive_context: Real emergencies exist and justify fast awards.
    controls:
    - CTL-059
  - ref: IND-CPT-005
    legacy_id: BC-KICKBACK-007
    context: Vendor with no verifiable address, tax number or deliveries shares details with an employee
      or another vendor.
    name_in_typology: Phantom or fictitious supplier on vendor master
    false_positive_context: Data entry errors can create apparent duplicates.
    controls:
    - CTL-049
    - CTL-113
  - ref: IND-TXN-024
    legacy_id: BC-KICKBACK-008
    context: Supplier asks to redirect payments to accounts held by third parties, often after award.
    name_in_typology: Rapid bank account changes or payments to unrelated accounts for suppliers
    severity_in_typology: medium
    false_positive_context: Suppliers legitimately change banks or factor receivables.
    controls:
    - CTL-070
    - CTL-069
