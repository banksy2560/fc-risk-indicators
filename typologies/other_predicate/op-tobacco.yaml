typology:
  id: OP-TOBACCO
  name: Illicit Tobacco and Excise Evasion
  domain: other_predicate
  description: Smuggling, counterfeit and illegal manufacture of tobacco and other excise goods to avoid
    duty, including diversion from duty suspension, undeclared transit and sale through informal retail.
    Cash proceeds are layered via small shops, wholesalers and cross-border transfers.
  sectors:
  - banking
  - payments
  - mvts
  - corporate_services
  sources:
  - FATF, Illicit Tobacco Trade (2012)
  - WHO, Protocol to Eliminate Illicit Trade in Tobacco Products
  - OECD and EUIPO, public material on illicit trade
  - World Customs Organization, public material on tobacco smuggling
  indicators:
  - id: OP-TOBACCO-001
    name: Wholesaler purchases far exceed local market demand
    description: Volumes of cigarettes or alcohol bought by a retailer or distributor exceed plausible
      consumption.
    category: transaction
    severity: high
    detection_type:
    - transaction_monitoring
    - investigator_judgement
    data_sources:
    - invoices
    - sector_data
    false_positive_notes: Border areas and tourism cause higher sales.
    controls:
    - id: OP-TOBACCO-001-C1
      name: Demand plausibility modelling
      type: detective
      description: Compare volumes to local market size.
      implementation: model
      effectiveness: medium
    - id: OP-TOBACCO-001-C2
      name: Distributor due diligence
      type: preventive
      description: Verify licences and customers.
      implementation: process
      effectiveness: high
  - id: OP-TOBACCO-002
    name: Goods in transit declared to low-tax or non-EU destinations but not arriving
    description: Duty-suspended shipments disappear or end up in domestic markets.
    category: document
    severity: high
    detection_type:
    - document_review
    - investigator_judgement
    data_sources:
    - transit_documents
    - customs_data
    false_positive_notes: Documentation delays occur.
    controls:
    - id: OP-TOBACCO-002-C1
      name: Transit document reconciliation
      type: detective
      description: Reconcile declared and arrived shipments.
      implementation: process
      effectiveness: high
    - id: OP-TOBACCO-002-C2
      name: Trade finance red-flag checks
      type: preventive
      description: Screen excise goods in trade finance.
      implementation: process
      effectiveness: medium
  - id: OP-TOBACCO-003
    name: Cash-heavy small shops with large tobacco turnover and little card use
    description: Convenience stores with cash deposits not matching stock purchases.
    category: customer
    severity: medium
    detection_type:
    - transaction_monitoring
    - kyc_review
    data_sources:
    - cash_data
    - stock_invoices
    false_positive_notes: Cash trade is normal.
    controls:
    - id: OP-TOBACCO-003-C1
      name: Cash versus purchases reconciliation
      type: detective
      description: Compare deposits with documented stock.
      implementation: rule
      effectiveness: medium
    - id: OP-TOBACCO-003-C2
      name: Retail sector EDD
      type: preventive
      description: Apply targeted EDD.
      implementation: process
      effectiveness: medium
  - id: OP-TOBACCO-004
    name: Payments to or from free-trade zones and tax-free ports
    description: Transfers linked to zones known for tobacco diversion.
    category: geographic
    severity: medium
    detection_type:
    - transaction_monitoring
    - external_intel
    data_sources:
    - swift_messages
    false_positive_notes: Zones host legitimate trade.
    controls:
    - id: OP-TOBACCO-004-C1
      name: Free zone transaction rules
      type: detective
      description: Monitor payments to zones.
      implementation: rule
      effectiveness: medium
    - id: OP-TOBACCO-004-C2
      name: Zone counterparties due diligence
      type: preventive
      description: Verify counterparties.
      implementation: process
      effectiveness: medium
  - id: OP-TOBACCO-005
    name: Counterfeit or unbranded cigarettes sold with 'cheap' pricing
    description: Prices well below duty-paid minimums.
    category: product_channel
    severity: medium
    detection_type:
    - external_intel
    - investigator_judgement
    data_sources:
    - open_source
    - price_data
    false_positive_notes: Promotions exist but not below duty.
    controls:
    - id: OP-TOBACCO-005-C1
      name: Price floor analytics
      type: detective
      description: Flag sale prices below duty minimum.
      implementation: rule
      effectiveness: medium
    - id: OP-TOBACCO-005-C2
      name: Retailer awareness
      type: preventive
      description: Educate retailers on legal prices.
      implementation: training
      effectiveness: low
  - id: OP-TOBACCO-006
    name: Illegal factory equipment or leaf purchases
    description: Orders for tobacco-making machinery, paper, filters.
    category: counterparty
    severity: high
    detection_type:
    - transaction_monitoring
    - investigator_judgement
    data_sources:
    - invoices
    - merchant_data
    false_positive_notes: Roll-your-own firms are lawful.
    controls:
    - id: OP-TOBACCO-006-C1
      name: Equipment end-user checks
      type: preventive
      description: Verify licences and sites.
      implementation: process
      effectiveness: high
    - id: OP-TOBACCO-006-C2
      name: Supplier red-flag reporting
      type: governance
      description: Provide reporting channels.
      implementation: process
      effectiveness: medium
  - id: OP-TOBACCO-007
    name: Cross-border cash and remittance flows from retailers to overseas suppliers
    description: Regular remittances to suppliers in source countries without invoices.
    category: transaction
    severity: medium
    detection_type:
    - transaction_monitoring
    - investigator_judgement
    data_sources:
    - remittance_data
    false_positive_notes: Diaspora shops import goods.
    controls:
    - id: OP-TOBACCO-007-C1
      name: Remittance versus trade profile
      type: detective
      description: Compare transfers to documented trade.
      implementation: rule
      effectiveness: medium
    - id: OP-TOBACCO-007-C2
      name: Informal supplier review
      type: preventive
      description: Request invoices.
      implementation: process
      effectiveness: medium
  - id: OP-TOBACCO-008
    name: Vehicle or container rental by small firms for bulk transport
    description: Frequent rental or purchase of vans and containers.
    category: behavioural
    severity: low
    detection_type:
    - transaction_monitoring
    - investigator_judgement
    data_sources:
    - card_data
    false_positive_notes: Logistics firms rent vehicles.
    controls:
    - id: OP-TOBACCO-008-C1
      name: Logistics pattern review
      type: detective
      description: Review rental patterns.
      implementation: process
      effectiveness: low
    - id: OP-TOBACCO-008-C2
      name: Customs liaison
      type: governance
      description: Coordinate with customs.
      implementation: process
      effectiveness: medium
