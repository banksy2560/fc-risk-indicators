typology:
  id: TF-STATESPONSOR
  name: State Sponsorship and Commodity Trading Funding of Terrorism
  domain: terrorist_financing
  description: Terrorist organisations may receive support from state actors or raise revenue by controlling
    and trading commodities such as oil, minerals, antiquities and agricultural goods. Trade finance,
    front companies and commodity brokers can be used to convert resources into funds and move them to
    the group.
  sectors:
  - banking
  - trade_finance
  - corporate_services
  sources:
  - FATF, Financing of the Terrorist Organisation Islamic State in Iraq and the Levant (ISIL) (2015) [corrected,
    unverified]
  - FATF, Financing of Recruitment for Terrorist Purposes (2018) [unverified]
  - FATF, Terrorist Financing Risk Assessment Guidance (2019) [unverified]
  indicators:
  - ref: IND-GEO-006
    legacy_id: TF-STATESPONSOR-001
    context: Shipments of oil, minerals, scrap or agricultural goods with origin documentation tied to
      territory where terrorist groups operate.
    name_in_typology: Commodity trade originating from areas controlled by armed groups
    false_positive_context: Legitimate producers in border regions can have mixed supply chains.
    controls:
    - CTL-135
    - CTL-126
    - CTL-167
  - ref: IND-CUS-010
    legacy_id: TF-STATESPONSOR-002
    context: Newly formed broker handles large commodity payments, has little physical presence and uses
      third-country accounts.
    name_in_typology: Trading company with no operational history receives or sends commodity payments
    severity_in_typology: medium
    false_positive_context: Start-up traders do exist.
    controls:
    - CTL-010
    - CTL-054
  - ref: IND-TXN-153
    legacy_id: TF-STATESPONSOR-003
    context: Commodity proceeds are settled through agents or companies in jurisdictions adjacent to conflict
      areas and then forwarded onward.
    false_positive_context: Regional hubs are common commercial centres.
    controls:
    - CTL-040
    - CTL-112
  - ref: IND-PRD-068
    legacy_id: TF-STATESPONSOR-004
    context: Trade in antiquities or artefacts with gaps in provenance linked to conflict-zone origin.
    false_positive_context: Older collections may have incomplete but benign provenance.
    controls:
    - CTL-135
    - CTL-171
  - ref: IND-CPT-056
    legacy_id: TF-STATESPONSOR-005
    context: Counterparties publicly linked, by credible reports, to government support for terrorist
      organisations.
    false_positive_context: Government-owned entities are widely used in legitimate trade.
    controls:
    - CTL-028
    - CTL-026
  - ref: IND-DOC-020
    legacy_id: TF-STATESPONSOR-006
    context: Quantity, price, consignee or route differs across documents in commodity transactions.
    name_in_typology: Discrepancies between invoice, shipment and payment details
    severity_in_typology: medium
    false_positive_context: Errors and commercial renegotiation are routine.
    controls:
    - CTL-123
    - CTL-124
  - ref: IND-TXN-154
    legacy_id: TF-STATESPONSOR-007
    context: Settlement via cash, barter or netting arrangements without documentation.
    false_positive_context: Barter and cash remain used in some commodity markets.
    controls:
    - CTL-062
    - CTL-140
  - ref: IND-TYP-059
    legacy_id: TF-STATESPONSOR-008
    context: Payments from state or quasi-state entities to private firms or individuals lacking evident
      services.
    false_positive_context: Grants and subsidies to private recipients are common.
    controls:
    - CTL-058
