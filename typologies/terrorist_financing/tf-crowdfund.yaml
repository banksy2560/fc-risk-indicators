typology:
  id: TF-CROWDFUND
  name: Crowdfunding and Social Media Fundraising for Terrorist Financing
  domain: terrorist_financing
  description: Online fundraising platforms, social media appeals and messaging channels can be used to
    solicit small donations across many jurisdictions for violent groups, often presenting as humanitarian
    or community causes. Detection combines campaign content intelligence with payment patterns across
    payment processors, banks and platforms.
  sectors:
  - payments
  - fintech
  - crypto
  - banking
  sources:
  - FATF, Crowdfunding for Terrorism Financing (2023) [corrected, unverified]
  - FATF, Emerging Terrorist Financing Risks (2015) [unverified]
  - FATF, Terrorist Financing Risk Assessment Guidance (2019) [unverified]
  indicators:
  - ref: IND-TYP-054
    legacy_id: TF-CROWDFUND-001
    context: Fundraising page, post or channel references violent groups, glorifies violence or is linked
      to accounts removed for extremism.
    false_positive_context: Political or religious speech, and news reporting, may reference the same
      topics lawfully.
    controls:
    - CTL-097
    - CTL-076
    - CTL-082
  - ref: IND-TXN-145
    legacy_id: TF-CROWDFUND-002
    context: Large numbers of low-value contributions from many countries into one recipient account that
      then withdraws promptly.
    false_positive_context: Viral humanitarian appeals and memorial funds show similar patterns.
    controls:
    - CTL-041
    - CTL-076
  - ref: IND-CPT-010
    legacy_id: TF-CROWDFUND-003
    context: Funds are paid to third-party accounts, prepaid cards or wallets that do not match the organiser's
      verified identity.
    name_in_typology: Payout to account unrelated to organiser or declared beneficiary
    severity_in_typology: medium
    false_positive_context: Campaigns for medical treatment are often paid to relatives or institutions.
    controls:
    - CTL-046
    - CTL-088
  - ref: IND-BEH-114
    legacy_id: TF-CROWDFUND-004
    context: Organiser moves between platforms or handles, closes campaigns and restarts under new names
      after scrutiny.
    false_positive_context: Privacy-conscious users and harassment victims also change handles.
    controls:
    - CTL-049
    - CTL-004
  - ref: IND-PRD-063
    legacy_id: TF-CROWDFUND-005
    context: Appeal asks for crypto transfers or direct contact on encrypted channels instead of regulated
      payment methods.
    false_positive_context: Crypto donations are legitimate in some communities.
    controls:
    - CTL-145
    - CTL-167
  - ref: IND-BEH-115
    legacy_id: TF-CROWDFUND-006
    context: Appeals created immediately after conflict or disaster events with no known organisation
      behind them and no verifiable delivery route.
    false_positive_context: Genuine rapid-response efforts frequently emerge informally.
    controls:
    - CTL-076
    - CTL-074
  - ref: IND-GEO-031
    legacy_id: TF-CROWDFUND-007
    context: Collected funds are cashed out near conflict zones or high-risk borders shortly after payout.
    name_in_typology: Funds withdrawn as cash or via ATM in higher-risk border regions
    false_positive_context: Residents and aid workers also transact in those regions.
    controls:
    - CTL-045
    - CTL-072
  - ref: IND-CUS-009
    legacy_id: TF-CROWDFUND-008
    context: Organiser identity documents, contact details or IP geolocation do not align with claimed
      location or purpose.
    name_in_typology: Organiser account shows identity inconsistencies
    false_positive_context: VPN use and travel create geolocation mismatches.
    controls:
    - CTL-001
    - CTL-092
