typology:
  id: ML-SHELL
  name: Shell and Front Companies
  domain: money_laundering
  description: Use of companies with no or minimal real operations to hold, move or obscure criminal funds,
    or of operating businesses used as a front to mix illicit and legitimate income. Complex structures
    and nominee arrangements hide beneficial ownership.
  stage:
  - layering
  - integration
  sectors:
  - banking
  - corporate_services
  - dnfbp
  sources:
  - FATF, Concealment of Beneficial Ownership (2018)
  - FATF, Guidance on Transparency and Beneficial Ownership (2014)
  - Egmont Group, Concealment of Beneficial Ownership (2018)
  indicators:
  - id: ML-SHELL-001
    name: No evidence of real operations
    description: Company lacks staff, premises, website, supplier payments or payroll despite substantial
      turnover.
    category: customer
    severity: high
    detection_type:
    - kyc_review
    - transaction_monitoring
    data_sources:
    - kyc_file
    - transaction_data
    - open_source_data
    false_positive_notes: Holding companies and start-ups have little activity.
    controls:
    - id: ML-SHELL-001-C1
      name: Substance assessment
      type: preventive
      description: 'Review economic substance evidence: premises, staff, contracts, tax filings.'
      implementation: process
      effectiveness: high
    - id: ML-SHELL-001-C2
      name: Dormant-to-active monitoring
      type: detective
      description: Detect accounts activating abruptly or running without operating costs.
      implementation: rule
      effectiveness: medium
  - id: ML-SHELL-002
    name: Registered address shared with many companies
    description: Address is a mass-registration or virtual office used by large numbers of entities.
    category: ownership_structure
    severity: medium
    detection_type:
    - kyc_review
    - screening
    data_sources:
    - corporate_registry
    false_positive_notes: Formation agents' offices are legitimate hosts.
    controls:
    - id: ML-SHELL-002-C1
      name: Address density screening
      type: detective
      description: Match addresses to known mass-registration data.
      implementation: technology
      effectiveness: medium
    - id: ML-SHELL-002-C2
      name: Physical presence verification
      type: preventive
      description: Verify operating location for higher-risk clients.
      implementation: process
      effectiveness: medium
  - id: ML-SHELL-003
    name: Nominee directors or shareholders
    description: Directors or shareholders appear to act for undisclosed principals.
    category: ownership_structure
    severity: high
    detection_type:
    - kyc_review
    data_sources:
    - corporate_registry
    - kyc_file
    false_positive_notes: Nominees are lawful in some jurisdictions for privacy or administration.
    controls:
    - id: ML-SHELL-003-C1
      name: Nominee declaration requirement
      type: preventive
      description: Require disclosure of nominee arrangements and the principals.
      implementation: policy
      effectiveness: high
    - id: ML-SHELL-003-C2
      name: UBO verification via independent sources
      type: preventive
      description: Verify through registers and reliable documents.
      implementation: process
      effectiveness: high
  - id: ML-SHELL-004
    name: Layered ownership across multiple jurisdictions
    description: Chains of entities in secrecy or low-transparency jurisdictions without commercial need.
    category: ownership_structure
    severity: high
    detection_type:
    - kyc_review
    data_sources:
    - ownership_charts
    false_positive_notes: Tax-neutral fund or group structures may be normal.
    controls:
    - id: ML-SHELL-004-C1
      name: Structure rationale review
      type: preventive
      description: Obtain and assess documented commercial rationale.
      implementation: process
      effectiveness: high
    - id: ML-SHELL-004-C2
      name: Senior approval for complex structures
      type: governance
      description: Require compliance sign-off for opaque structures.
      implementation: policy
      effectiveness: medium
  - id: ML-SHELL-005
    name: Pass-through flows with minimal balance
    description: Funds enter and leave quickly in similar amounts with no operating cost.
    category: transaction
    severity: high
    detection_type:
    - transaction_monitoring
    data_sources:
    - transaction_data
    false_positive_notes: Payment intermediaries and agents have pass-through flows.
    controls:
    - id: ML-SHELL-005-C1
      name: Pass-through detection rule
      type: detective
      description: Alert on high through-flow with low retained balance.
      implementation: rule
      effectiveness: high
    - id: ML-SHELL-005-C2
      name: Flow-versus-purpose review
      type: preventive
      description: Compare flows with stated business.
      implementation: process
      effectiveness: medium
  - id: ML-SHELL-006
    name: Payments to or from unrelated high-risk jurisdictions
    description: Payments involve countries with no link to declared business.
    category: geographic
    severity: medium
    detection_type:
    - transaction_monitoring
    - screening
    data_sources:
    - transaction_data
    false_positive_notes: Diaspora and project-specific payments occur.
    controls:
    - id: ML-SHELL-006-C1
      name: Geographic mismatch rule
      type: detective
      description: Compare counterparty countries with expected profile.
      implementation: rule
      effectiveness: medium
    - id: ML-SHELL-006-C2
      name: Country risk EDD
      type: preventive
      description: Apply enhanced review to listed jurisdictions.
      implementation: process
      effectiveness: medium
  - id: ML-SHELL-007
    name: Generic or inconsistent business activity
    description: Vague business descriptions such as consulting or general trading; documents inconsistent
      with the activity.
    category: document
    severity: medium
    detection_type:
    - kyc_review
    - document_review
    data_sources:
    - kyc_file
    false_positive_notes: Genuine small consultancies are common.
    controls:
    - id: ML-SHELL-007-C1
      name: Activity description quality standard
      type: preventive
      description: Require specific and verifiable activity description at onboarding.
      implementation: policy
      effectiveness: medium
    - id: ML-SHELL-007-C2
      name: Document authenticity checks
      type: preventive
      description: Validate documents with registries or issuers.
      implementation: process
      effectiveness: medium
  - id: ML-SHELL-008
    name: Company formed very recently before large transactions
    description: Rapid account use shortly after incorporation, with no history.
    category: behavioural
    severity: medium
    detection_type:
    - kyc_review
    - transaction_monitoring
    data_sources:
    - corporate_registry
    - transaction_data
    false_positive_notes: New ventures start quickly.
    controls:
    - id: ML-SHELL-008-C1
      name: New entity enhanced monitoring
      type: detective
      description: Apply tighter thresholds during initial months.
      implementation: rule
      effectiveness: medium
    - id: ML-SHELL-008-C2
      name: Funding source evidence
      type: preventive
      description: Request capital source proof.
      implementation: process
      effectiveness: medium
  - id: ML-SHELL-009
    name: Loans or invoices with related parties lacking documentation
    description: Intercompany loans or invoices with no agreements, interest or repayment.
    category: document
    severity: medium
    detection_type:
    - document_review
    - investigator_judgement
    data_sources:
    - intercompany_documents
    false_positive_notes: Informal group funding is common in small groups.
    controls:
    - id: ML-SHELL-009-C1
      name: Related-party transaction review
      type: detective
      description: Review related-party flows with supporting documents.
      implementation: process
      effectiveness: medium
    - id: ML-SHELL-009-C2
      name: Agreement requirement
      type: preventive
      description: Require written agreements for loans over a threshold.
      implementation: policy
      effectiveness: medium
