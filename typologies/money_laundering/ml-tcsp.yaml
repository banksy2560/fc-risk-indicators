typology:
  id: ML-TCSP
  name: Trust and Company Service Provider Misuse
  domain: money_laundering
  description: Misuse of trust and company service providers, including formation agents and nominee or
    registered-office services, to create, administer or obscure companies and trusts used for laundering.
    TCSPs may be witting, negligent or exploited.
  stage:
  - layering
  - integration
  sectors:
  - corporate_services
  - dnfbp
  sources:
  - FATF, Concealment of Beneficial Ownership (2018)
  - FATF, Guidance for a Risk-Based Approach for Trust and Company Service Providers (2019)
  - FATF, Money Laundering Using Trust and Company Service Providers (2010)
  indicators:
  - id: ML-TCSP-001
    name: Bulk company formation for undisclosed clients
    description: TCSP forms large numbers of entities with little client information.
    category: typology_specific
    severity: high
    detection_type:
    - kyc_review
    - investigator_judgement
    data_sources:
    - registry_data
    false_positive_notes: Formation agents serve volume clients.
    controls:
    - id: ML-TCSP-001-C1
      name: TCSP due diligence
      type: preventive
      description: Review licensing, CDD and sample files.
      implementation: process
      effectiveness: high
    - id: ML-TCSP-001-C2
      name: Formation volume monitoring
      type: detective
      description: Monitor formation volumes by agent.
      implementation: rule
      effectiveness: medium
  - id: ML-TCSP-002
    name: Nominee services without disclosure of principal
    description: Nominee directors or shareholders with no record of beneficial owner.
    category: ownership_structure
    severity: high
    detection_type:
    - kyc_review
    data_sources:
    - kyc_file
    false_positive_notes: Lawful nominee regimes exist.
    controls:
    - id: ML-TCSP-002-C1
      name: Nominee disclosure requirement
      type: preventive
      description: Require principals to be identified.
      implementation: policy
      effectiveness: high
    - id: ML-TCSP-002-C2
      name: Nominee register verification
      type: preventive
      description: Verify with registers.
      implementation: process
      effectiveness: medium
  - id: ML-TCSP-003
    name: Introduced customers with no direct contact
    description: Client business introduced through TCSP with no face-to-face contact and little data.
    category: customer
    severity: medium
    detection_type:
    - kyc_review
    data_sources:
    - onboarding_data
    false_positive_notes: Remote introductions are common.
    controls:
    - id: ML-TCSP-003-C1
      name: Reliance due diligence
      type: preventive
      description: Test introducer CDD.
      implementation: process
      effectiveness: medium
    - id: ML-TCSP-003-C2
      name: Direct contact for high risk
      type: preventive
      description: Verify directly.
      implementation: process
      effectiveness: medium
  - id: ML-TCSP-004
    name: Structures lack commercial rationale
    description: Multi-layer vehicles for simple business.
    category: ownership_structure
    severity: high
    detection_type:
    - kyc_review
    data_sources:
    - ownership_charts
    false_positive_notes: Tax planning.
    controls:
    - id: ML-TCSP-004-C1
      name: Rationale assessment
      type: preventive
      description: Assess and record rationale.
      implementation: process
      effectiveness: high
    - id: ML-TCSP-004-C2
      name: Complexity escalation
      type: governance
      description: Escalate to senior compliance.
      implementation: policy
      effectiveness: medium
  - id: ML-TCSP-005
    name: Registered address or mailbox shared by many entities
    description: Same address serves numerous unrelated entities.
    category: ownership_structure
    severity: medium
    detection_type:
    - kyc_review
    data_sources:
    - corporate_registry
    false_positive_notes: Virtual offices.
    controls:
    - id: ML-TCSP-005-C1
      name: Address clustering
      type: detective
      description: Cluster entities by address.
      implementation: technology
      effectiveness: medium
    - id: ML-TCSP-005-C2
      name: Substance check
      type: preventive
      description: Verify presence.
      implementation: process
      effectiveness: medium
  - id: ML-TCSP-006
    name: Frequent changes of directors, names or owners
    description: Entities rapidly change identity.
    category: behavioural
    severity: medium
    detection_type:
    - kyc_review
    data_sources:
    - registry_changes
    false_positive_notes: Corporate restructuring.
    controls:
    - id: ML-TCSP-006-C1
      name: Change monitoring
      type: detective
      description: Alert on registry changes.
      implementation: technology
      effectiveness: medium
    - id: ML-TCSP-006-C2
      name: Re-verification
      type: preventive
      description: Refresh CDD on change.
      implementation: process
      effectiveness: medium
  - id: ML-TCSP-007
    name: Bank accounts opened or operated by TCSP staff
    description: TCSP is signatory or conduit for client funds.
    category: counterparty
    severity: high
    detection_type:
    - kyc_review
    - transaction_monitoring
    data_sources:
    - account_mandates
    false_positive_notes: Administration services.
    controls:
    - id: ML-TCSP-007-C1
      name: Signatory review
      type: preventive
      description: Assess authority and need.
      implementation: process
      effectiveness: high
    - id: ML-TCSP-007-C2
      name: Pooled account monitoring
      type: detective
      description: Monitor pooled client accounts.
      implementation: rule
      effectiveness: medium
  - id: ML-TCSP-008
    name: Reluctance to provide beneficial owner information
    description: TCSP resists or delays beneficial ownership details.
    category: behavioural
    severity: high
    detection_type:
    - kyc_review
    - customer_behaviour
    data_sources:
    - kyc_file
    false_positive_notes: Confidentiality concerns.
    controls:
    - id: ML-TCSP-008-C1
      name: Beneficial ownership information gate
      type: preventive
      description: Block onboarding or activity until beneficial owner data is provided and verified;
        escalate refusals to compliance.
      implementation: process
      effectiveness: high
    - id: ML-TCSP-008-C2
      name: Exit policy
      type: corrective
      description: Terminate where unresolved.
      implementation: policy
      effectiveness: medium
  - id: ML-TCSP-009
    name: Activity in secrecy jurisdictions without links
    description: Entity uses secrecy jurisdictions unrelated to operations.
    category: geographic
    severity: medium
    detection_type:
    - kyc_review
    - screening
    data_sources:
    - corporate_registry
    false_positive_notes: Tax-neutral hubs.
    controls:
    - id: ML-TCSP-009-C1
      name: Jurisdiction risk rating
      type: preventive
      description: Rate and apply EDD.
      implementation: policy
      effectiveness: medium
    - id: ML-TCSP-009-C2
      name: Purpose verification
      type: preventive
      description: Verify link.
      implementation: process
      effectiveness: medium
