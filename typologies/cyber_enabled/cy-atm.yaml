typology:
  id: CY-ATM
  name: Crypto ATM and Kiosk Abuse
  domain: cyber_enabled
  description: Virtual asset kiosks let users convert cash to crypto with light verification, making them
    attractive for scam victims forced to pay and for criminals placing cash. Risk centres on structuring,
    repeated high-value use, third-party direction and destination wallets tied to scams or mixers.
  stage:
  - placement
  sectors:
  - crypto
  - mvts
  sources:
  - FinCEN, Notice on Scams Involving Convertible Virtual Currency Kiosks (2025) <https://www.fincen.gov/sites/default/files/shared/FinCEN-Notice-CVCKIOSK.pdf>
    [agent-reviewed]
  - 'FATF, Virtual Assets: Red Flag Indicators of Money Laundering and Terrorist Financing (2020) <https://www.fatf-gafi.org/content/fatf-gafi/en/publications/Methodsandtrends/Virtual-assets-red-flag-indicators.html>
    [agent-reviewed]'
  - FATF, Updated Guidance for a Risk-Based Approach to Virtual Assets and Virtual Asset Service Providers
    (2021) [unverified]
  indicators:
  - ref: IND-TXN-006
    legacy_id: CY-ATM-001
    context: The same user or phone number uses a kiosk several times in a short period at sizes below
      verification tiers.
    name_in_typology: Repeated cash deposits just below ID or reporting thresholds
    false_positive_context: Frequent small purchases by regular users.
    controls:
    - CTL-072
    - CTL-037
    - CTL-048
  - ref: IND-TYP-001
    legacy_id: CY-ATM-002
    context: Many different kiosk customers direct funds to one address.
    name_in_typology: Multiple users sending to the same destination wallet
    false_positive_context: Merchant or charity address.
    controls:
    - CTL-145
    - CTL-048
    - CTL-093
  - ref: IND-BEH-039
    legacy_id: CY-ATM-003
    context: First-time, elderly user deposits large sums, often on a phone call, consistent with scam
      coercion.
    false_positive_context: Informed investors.
    controls:
    - CTL-072
    - CTL-068
  - ref: IND-TYP-002
    legacy_id: CY-ATM-004
    context: Receiving address is attributed to investment, romance or impersonation scams.
    false_positive_context: Attribution lag.
    controls:
    - CTL-145
    - CTL-029
    - CTL-103
  - ref: IND-BEH-040
    legacy_id: CY-ATM-005
    context: User travels between machines to avoid limits or detection.
    false_positive_context: Commuters; machine outages.
    controls:
    - CTL-037
    - CTL-048
    - CTL-072
  - ref: IND-DOC-008
    legacy_id: CY-ATM-006
    context: Same identifiers appear for apparently unrelated users or reused after refusal.
    name_in_typology: Shared phone number or ID across unrelated transactions
    severity_in_typology: medium
    false_positive_context: Household sharing.
    controls:
    - CTL-004
    - CTL-048
    - CTL-093
  - ref: IND-PRD-021
    legacy_id: CY-ATM-007
    context: Machines in venues with weak oversight show disproportionate high-risk activity.
    false_positive_context: Foot-traffic driven volume.
    controls:
    - CTL-072
    - CTL-162
    - CTL-083
  - ref: IND-BEH-006
    legacy_id: CY-ATM-008
    context: Staff or footage note user following directions while depositing cash.
    name_in_typology: Customer on phone while transacting or reading from instructions
    severity_in_typology: medium
    false_positive_context: Customer using a guide or helper.
    controls:
    - CTL-072
    - CTL-171
    - CTL-068
  - ref: IND-TXN-045
    legacy_id: CY-ATM-009
    context: Large volumes of small or bundled notes deposited in sequence.
    false_positive_context: Cash-based businesses.
    controls:
    - CTL-072
    - CTL-037
    - CTL-171
  - ref: IND-TYP-003
    legacy_id: CY-ATM-010
    context: Operator fails to monitor wallets, refunds or complaints, allowing patterns to persist.
    false_positive_context: Early-stage operators.
    controls:
    - CTL-162
    - CTL-145
    - CTL-093
