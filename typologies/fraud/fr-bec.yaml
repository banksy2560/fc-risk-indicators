typology:
  id: FR-BEC
  name: Business Email Compromise and Invoice Redirection
  domain: fraud
  description: Criminals compromise or spoof email accounts to impersonate executives or suppliers and
    redirect payments to accounts they control. Typical outcomes are urgent wire requests or changed bank
    details on genuine invoices.
  sectors:
  - banking
  - payments
  - corporate_services
  sources:
  - FinCEN, Updated Advisory on Email Compromise Fraud Schemes Targeting Vulnerable Business Processes,
    FIN-2019-A005 (2019) <https://www.fincen.gov/resources/advisories/fincen-advisory-fin-2019-a005> [corrected,
    agent-reviewed]
  - 'FBI IC3, Business E-Mail Compromise: The $55 Billion Scam (PSA I-091124-PSA, 2024) [replacement suggested,
    unverified]'
  - UK Finance, Annual Fraud Report (specify year, e.g. 2025) <https://www.ukfinance.org.uk/> [corrected,
    agent-reviewed]
  indicators:
  - ref: IND-CPT-020
    legacy_id: FR-BEC-001
    context: 'Victim-side: supplier payment details are altered shortly before an invoice is due, via
      email or portal.'
    false_positive_context: Real supplier bank migrations.
    controls:
    - CTL-078
    - CTL-070
    - CTL-069
    references:
    - FinCEN, Advisory on Email Compromise Fraud Schemes (2019)
  - ref: IND-BEH-013
    legacy_id: FR-BEC-002
    context: 'Victim-side: finance staff receive a request, often outside normal workflow, to wire funds
      quickly and not discuss it.'
    name_in_typology: Urgent confidential payment request from a senior executive
    false_positive_context: Genuine time-critical deals.
    controls:
    - CTL-070
    - CTL-077
    - CTL-170
    references:
    - FinCEN, Advisory on Email Compromise Fraud Schemes (2019)
  - ref: IND-DOC-025
    legacy_id: FR-BEC-003
    context: Spoofed email domain or reply-to differs subtly from the genuine counterparty.
    false_positive_context: Marketing or third-party senders.
    controls:
    - CTL-082
    - CTL-170
    - CTL-070
    references:
    - FinCEN, Advisory on Email Compromise Fraud Schemes (2019)
  - ref: IND-GEO-010
    legacy_id: FR-BEC-004
    context: 'Victim-side: payment to a new account, often foreign, unrelated to the supplier''s usual
      country.'
    false_positive_context: New suppliers or overseas expansion.
    controls:
    - CTL-069
    - CTL-078
    - CTL-091
    references:
    - FinCEN, Advisory on Email Compromise Fraud Schemes (2019)
  - ref: IND-TXN-002
    legacy_id: FR-BEC-005
    context: 'Mule-side: a recipient account (often newly opened or a shell) forwards BEC proceeds within
      hours.'
    name_in_typology: Business account receives funds then moves them offshore or to crypto quickly
    false_positive_context: Trading accounts with legitimate turnover.
    controls:
    - CTL-051
    - CTL-103
    - CTL-083
    references:
    - FinCEN, Advisory on Email Compromise Fraud Schemes (2019)
  - ref: IND-DOC-026
    legacy_id: FR-BEC-006
    context: 'Victim-side: genuine-looking invoice has altered layout, round figures or inconsistent references.'
    false_positive_context: Billing system changes.
    controls:
    - CTL-078
    - CTL-002
    - CTL-170
    references:
    - FinCEN, Advisory on Email Compromise Fraud Schemes (2019)
  - ref: IND-BEH-061
    legacy_id: FR-BEC-007
    context: 'Victim-side: bypass of the usual purchase order or approval, or approver working remotely
      at odd hours.'
    false_positive_context: Emergency payments with proper sign-off.
    controls:
    - CTL-077
    - CTL-091
    - CTL-094
    references:
    - FinCEN, Advisory on Email Compromise Fraud Schemes (2019)
  - ref: IND-OWN-006
    legacy_id: FR-BEC-008
    context: 'Mule-side: beneficiary has little trading footprint, a virtual office or recent incorporation.'
    name_in_typology: Shell or newly formed company receiving corporate payments
    severity_in_typology: medium
    false_positive_context: Start-ups.
    controls:
    - CTL-032
    - CTL-001
    - CTL-083
    references:
    - FinCEN, Advisory on Email Compromise Fraud Schemes (2019)
  - ref: IND-BEH-062
    legacy_id: FR-BEC-009
    context: 'Compromise indicator: mailbox forwarding rules and unfamiliar logins precede payment fraud.'
    false_positive_context: Travel and VPN use.
    controls:
    - CTL-073
    - CTL-091
    - CTL-082
    references:
    - FinCEN, Advisory on Email Compromise Fraud Schemes (2019)
