typology:
  id: FR-PROC
  name: Procurement and Government Benefit Fraud
  domain: fraud
  description: Fraud against public bodies and large buyers includes bid rigging, inflated invoices, fictitious
    suppliers and false benefit claims. Collusion between suppliers and officials is a recurring pattern.
  exposure:
    channels:
    - online_banking
    payment_rails:
    - wire_swift
    - payroll_expense
    customer_segments:
    - public_sector
    - corporate
    - sme
    - pep_related
    products:
    - transaction_account
    basis: ai_inferred
    rationale: Fraud against public bodies and large buyers via bid rigging, fictitious suppliers and
      false benefit claims; officials collude with suppliers; payments flow through procurement/purchasing.
    consumer:
      relevant: false
      products: []
      channels: []
      basis: ai_inferred
      rationale: Bid rigging, fictitious suppliers and public procurement are corporate or public-sector;
        benefit fraud is covered under tax and identity typologies.
  sectors:
  - all
  sources:
  - OECD, Guidelines for Fighting Bid Rigging in Public Procurement (2009, rev. 2025) <https://www.oecd.org/en/topics/sub-issues/fighting-bid-rigging-in-public-procurement.html>
    [corrected, agent-reviewed]
  - UK Government Counter Fraud Function, Public Sector Fraud Authority publications [replacement suggested,
    unverified]
  - 'ACFE, Occupational Fraud 2024: A Report to the Nations (2024) <https://www.acfe.com/report-to-the-nations/2024>
    [corrected, agent-reviewed]'
  indicators:
  - ref: IND-DOC-035
    legacy_id: FR-PROC-001
    context: Bids contain shared errors, formatting or pricing relationships.
    false_positive_context: Industry standard templates.
    controls:
    - CTL-059
    - CTL-175
    - CTL-085
    references:
    - OECD, guidelines for fighting bid rigging in public procurement (general)
  - ref: IND-CPT-027
    legacy_id: FR-PROC-002
    context: Contracts win in turn across a small group.
    false_positive_context: Small specialist market.
    controls:
    - CTL-059
    - CTL-175
    - CTL-083
    references:
    - OECD, guidelines for fighting bid rigging in public procurement (general)
  - ref: IND-TXN-009
    legacy_id: FR-PROC-003
    context: Series of awards just below tender limits.
    name_in_typology: Contract splitting to avoid thresholds
    false_positive_context: Genuine phased work.
    controls:
    - CTL-059
    - CTL-037
    - CTL-175
    references:
    - OECD, guidelines for fighting bid rigging in public procurement (general)
  - ref: IND-OWN-006
    legacy_id: FR-PROC-004
    context: Registered address and staff do not match the supply.
    name_in_typology: Supplier is shell company with no footprint
    false_positive_context: New suppliers.
    controls:
    - CTL-032
    - CTL-078
    - CTL-175
    references:
    - OECD, guidelines for fighting bid rigging in public procurement (general)
  - ref: IND-DOC-036
    legacy_id: FR-PROC-005
    context: Payment is approved without delivery evidence.
    false_positive_context: Timing delays.
    controls:
    - CTL-086
    - CTL-175
    - CTL-077
    references:
    - OECD, guidelines for fighting bid rigging in public procurement (general)
  - ref: IND-CPT-028
    legacy_id: FR-PROC-006
    context: Conflict of interest appears from registry or declarations.
    false_positive_context: Common surnames.
    controls:
    - CTL-163
    - CTL-175
    - CTL-059
    references:
    - OECD, guidelines for fighting bid rigging in public procurement (general)
  - ref: IND-CUS-007
    legacy_id: FR-PROC-007
    context: Many claims route to same accounts or addresses.
    name_in_typology: Benefit claimants share bank accounts or addresses
    severity_in_typology: high
    false_positive_context: Households.
    controls:
    - CTL-049
    - CTL-083
    - CTL-089
    references:
    - OECD, guidelines for fighting bid rigging in public procurement (general)
  - ref: IND-DOC-037
    legacy_id: FR-PROC-008
    context: Declared circumstances conflict with data.
    name_in_typology: Claim details contradict income or residency evidence
    false_positive_context: Late updates.
    controls:
    - CTL-084
    - CTL-083
    references:
    - OECD, guidelines for fighting bid rigging in public procurement (general)
  - ref: IND-PRD-005
    legacy_id: FR-PROC-009
    context: Unusual volume tied to intermediary.
    name_in_typology: Spike in claims via one agent or channel
    false_positive_context: Outreach campaigns.
    controls:
    - CTL-085
    - CTL-175
    - CTL-094
    references:
    - OECD, guidelines for fighting bid rigging in public procurement (general)
