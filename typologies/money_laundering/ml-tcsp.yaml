typology:
  id: ML-TCSP
  name: Trust and Company Service Provider Misuse
  domain: money_laundering
  description: Misuse of trust and company service providers, including formation agents and nominee or
    registered-office services, to create, administer or obscure companies and trusts used for laundering.
    TCSPs may be witting, negligent or exploited.
  stage:
  - layering
  - integration
  sectors:
  - corporate_services
  - dnfbp
  sources:
  - FATF, Concealment of Beneficial Ownership (2018)
  - FATF, Guidance for a Risk-Based Approach for Trust and Company Service Providers (2019)
  - FATF, Money Laundering Using Trust and Company Service Providers (2010)
  indicators:
  - ref: IND-TYP-041
    legacy_id: ML-TCSP-001
    context: TCSP forms large numbers of entities with little client information.
    false_positive_context: Formation agents serve volume clients.
    controls:
    - CTL-117
    - CTL-049
    - CTL-004
  - ref: IND-OWN-001
    legacy_id: ML-TCSP-002
    context: Nominee directors or shareholders with no record of beneficial owner.
    name_in_typology: Nominee services without disclosure of principal
    false_positive_context: Lawful nominee regimes exist.
    controls:
    - CTL-007
    - CTL-005
    - CTL-006
  - ref: IND-CUS-042
    legacy_id: ML-TCSP-003
    context: Client business introduced through TCSP with no face-to-face contact and little data.
    false_positive_context: Remote introductions are common.
    controls:
    - CTL-019
    - CTL-070
  - ref: IND-OWN-002
    legacy_id: ML-TCSP-004
    context: Multi-layer vehicles for simple business.
    name_in_typology: Structures lack commercial rationale
    false_positive_context: Tax planning.
    controls:
    - CTL-008
    - CTL-005
    - CTL-010
  - ref: IND-OWN-008
    legacy_id: ML-TCSP-005
    context: Same address serves numerous unrelated entities.
    name_in_typology: Registered address or mailbox shared by many entities
    false_positive_context: Virtual offices.
    controls:
    - CTL-049
    - CTL-010
  - ref: IND-BEH-016
    legacy_id: ML-TCSP-006
    context: Entities rapidly change identity.
    name_in_typology: Frequent changes of directors, names or owners
    false_positive_context: Corporate restructuring.
    controls:
    - CTL-014
  - ref: IND-CPT-040
    legacy_id: ML-TCSP-007
    context: TCSP is signatory or conduit for client funds.
    false_positive_context: Administration services.
    controls:
    - CTL-018
    - CTL-118
  - ref: IND-BEH-001
    legacy_id: ML-TCSP-008
    context: TCSP resists or delays beneficial ownership details.
    name_in_typology: Reluctance to provide beneficial owner information
    false_positive_context: Confidentiality concerns.
    controls:
    - CTL-006
    - CTL-016
  - ref: IND-GEO-038
    legacy_id: ML-TCSP-009
    context: Entity uses secrecy jurisdictions unrelated to operations.
    name_in_typology: Activity in secrecy jurisdictions without links
    severity_in_typology: medium
    false_positive_context: Tax-neutral hubs.
    controls:
    - CTL-027
    - CTL-011
