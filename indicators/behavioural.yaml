indicators:
- id: IND-BEH-001
  name: Reluctance to disclose beneficial ownership or control
  description: Customer or intermediary is vague, delayed or inconsistent when asked who owns, controls
    or ultimately benefits from an account, entity or funds.
  category: behavioural
  severity: high
  detection_type:
  - kyc_review
  - customer_behaviour
  - investigator_judgement
  data_sources:
  - kyc_file
  - ownership_records
  - case_notes
  false_positive_notes: Complex but legitimate structures and slow third-party registries can cause delay;
    weigh against documentary support.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-BEH-002
  name: Refusal or delay in answering due diligence requests
  description: Customer or counterparty delays, refuses or gives incomplete or evasive responses to KYC,
    refresh or request-for-information enquiries.
  category: behavioural
  severity: high
  detection_type:
  - kyc_review
  - customer_behaviour
  - investigator_judgement
  data_sources:
  - kyc_file
  - rfi_logs
  - case_notes
  false_positive_notes: Genuine administrative delay or language barriers can look similar; check for
    repeat patterns.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-BEH-003
  name: Unable or unwilling to explain transaction purpose or origin
  description: When asked about a transaction, the customer gives vague, rehearsed, inconsistent or shifting
    explanations of its purpose, source or counterparties.
  category: behavioural
  severity: high
  detection_type:
  - kyc_review
  - customer_behaviour
  - investigator_judgement
  data_sources:
  - case_notes
  - transaction_data
  - kyc_file
  false_positive_notes: Unsophisticated customers may explain poorly; compare explanation with documents
    and profile.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-BEH-004
  name: Customer accompanied, directed or coached by a third party
  description: Another person speaks for, accompanies or dictates instructions to the customer, who may
    appear fearful, scripted or unable to explain the activity.
  category: behavioural
  severity: high
  detection_type:
  - customer_behaviour
  - investigator_judgement
  data_sources:
  - branch_observations
  - contact_centre_notes
  - cctv_footage
  false_positive_notes: Carers, relatives or interpreters may legitimately assist; assess the customer's
    autonomy.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-BEH-005
  name: Account controlled or used by someone other than the holder
  description: Signs that a third party holds the card, PIN, credentials or device, or that funds and
    activity belong to someone other than the named holder.
  category: behavioural
  severity: high
  detection_type:
  - transaction_monitoring
  - customer_behaviour
  - investigator_judgement
  data_sources:
  - device_logs
  - transaction_data
  - account_mandates
  - kyc_file
  false_positive_notes: Family members, agents and authorised signatories may legitimately operate accounts.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-BEH-006
  name: Customer on a live call while transacting
  description: Customer is on an active phone call, hesitant or following dictated instructions while
    depositing cash or making an online payment.
  category: behavioural
  severity: high
  detection_type:
  - customer_behaviour
  - investigator_judgement
  data_sources:
  - session_logs
  - branch_observations
  - cctv_footage
  false_positive_notes: Customers often use phones for ordinary reasons; stronger when combined with unusual
    payments.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-BEH-007
  name: Remote-access, emulator or automation tools in session
  description: Remote-desktop, screen-sharing, emulator or scripted-control tools are detected during
    onboarding, login or payment sessions.
  category: behavioural
  severity: high
  detection_type:
  - transaction_monitoring
  - customer_behaviour
  data_sources:
  - device_logs
  - session_logs
  false_positive_notes: IT support and accessibility tools can trigger detections.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-BEH-008
  name: Login from unfamiliar device, location or infrastructure
  description: Session originates from a device, country, emulator or network not previously associated
    with the customer, including shortly after a phishing event.
  category: behavioural
  severity: high
  detection_type:
  - transaction_monitoring
  - customer_behaviour
  data_sources:
  - device_logs
  - ip_geolocation
  - session_logs
  false_positive_notes: Travel, new phones and VPN use are common legitimate causes.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-BEH-009
  name: Multiple failed logins followed by success
  description: Repeated failed authentication attempts, often across accounts from one source, followed
    by successful access.
  category: behavioural
  severity: medium
  detection_type:
  - transaction_monitoring
  - customer_behaviour
  data_sources:
  - authentication_logs
  - device_logs
  false_positive_notes: Customers forgetting passwords produce similar patterns.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-BEH-010
  name: SIM swap or number port before transfers
  description: Mobile number is ported or SIM replaced shortly before one-time-passcode-protected actions
    or outbound transfers.
  category: behavioural
  severity: high
  detection_type:
  - transaction_monitoring
  - external_intel
  data_sources:
  - telecom_signals
  - transaction_data
  - authentication_logs
  false_positive_notes: Customers legitimately replace lost or upgraded phones.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-BEH-011
  name: Credential or contact change followed by new payee and payments
  description: Password, email or phone details are changed, followed in the same session or day by a
    new payee and large outbound payments.
  category: behavioural
  severity: high
  detection_type:
  - transaction_monitoring
  - customer_behaviour
  data_sources:
  - authentication_logs
  - transaction_data
  - device_logs
  false_positive_notes: Customers may update details and pay a new supplier at the same time.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-BEH-012
  name: Shared device, contact or address data across many applicants or senders
  description: The same device fingerprint, IP, phone, email or address appears across many applications,
    claims or apparent customers.
  category: behavioural
  severity: high
  detection_type:
  - transaction_monitoring
  - customer_behaviour
  data_sources:
  - device_logs
  - application_data
  - ip_geolocation
  false_positive_notes: Households, shared workplaces and shared devices can explain overlaps.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-BEH-013
  name: Urgent payment instruction or payment-detail change outside normal process
  description: Staff receive urgent, confidential requests, or changes to beneficiary details, directing
    payment to a new beneficiary outside normal workflow.
  category: behavioural
  severity: high
  detection_type:
  - transaction_monitoring
  - customer_behaviour
  - investigator_judgement
  data_sources:
  - payment_instructions
  - email_records
  - transaction_data
  false_positive_notes: Genuine urgent business payments and supplier bank changes occur; verify via a
    known channel.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-BEH-014
  name: Rapid resale or return of recently acquired asset
  description: An asset is bought and quickly resold or returned for a refund in a different payment form,
    with no apparent reason or improvement.
  category: behavioural
  severity: medium
  detection_type:
  - transaction_monitoring
  - investigator_judgement
  data_sources:
  - transaction_data
  - asset_registry
  - sales_records
  false_positive_notes: Genuine market changes or buyer remorse can cause quick resale.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-BEH-015
  name: Customer indifferent to cost, return or value
  description: Customer readily accepts poor terms, fees, losses, penalties or prices, showing little
    interest in performance, provenance or negotiation.
  category: behavioural
  severity: medium
  detection_type:
  - customer_behaviour
  - investigator_judgement
  data_sources:
  - case_notes
  - transaction_data
  false_positive_notes: Wealthy or inexperienced customers may be less price sensitive.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-BEH-016
  name: Frequent changes of customer or entity details
  description: Customer or entity repeatedly changes name, address, contact details, directors, signatories
    or ownership.
  category: behavioural
  severity: medium
  detection_type:
  - kyc_review
  - customer_behaviour
  - investigator_judgement
  data_sources:
  - kyc_file
  - corporate_registry
  - change_logs
  false_positive_notes: Restructurings and growth-related changes are common for young businesses.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-BEH-017
  name: Repeated change of consignee or buyer in transit
  description: Shipments or cargoes are re-routed, re-invoiced or have ownership shifted through successive
    parties without clear commercial reason.
  category: behavioural
  severity: medium
  detection_type:
  - transaction_monitoring
  - investigator_judgement
  data_sources:
  - trade_documents
  - shipping_data
  - transaction_data
  false_positive_notes: Commodity trading legitimately involves resale in transit.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-BEH-018
  name: Pressure to speed up or bypass checks
  description: Customer or intermediary urges rapid completion, secrecy or bypassing of checks, or leans
    on personal connections.
  category: behavioural
  severity: medium
  detection_type:
  - customer_behaviour
  - investigator_judgement
  data_sources:
  - case_notes
  - onboarding_records
  false_positive_notes: Time-critical commercial deals create genuine urgency.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-BEH-019
  name: Staff override of controls or excessive record access
  description: Employees override approvals, alter records, access records without need or show unusual
    relationships with customers.
  category: behavioural
  severity: high
  detection_type:
  - investigator_judgement
  - transaction_monitoring
  data_sources:
  - access_logs
  - audit_trails
  - hr_records
  false_positive_notes: Privileged roles and emergency fixes legitimately involve overrides; require documented
    approval.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-BEH-020
  name: New account or entity with sudden high activity
  description: A recently opened account or newly formed entity with little history abruptly sees large
    or numerous payments unrelated to its profile.
  category: behavioural
  severity: high
  detection_type:
  - transaction_monitoring
  - kyc_review
  data_sources:
  - transaction_data
  - account_opening_records
  - corporate_registry
  false_positive_notes: New businesses may ramp up quickly; assess against stated plans.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-BEH-021
  name: Customer disputes legitimate transactions
  description: Customer falsely claims non-receipt or unauthorised use for transactions they made, often
    from their own device.
  category: behavioural
  severity: medium
  detection_type:
  - transaction_monitoring
  - investigator_judgement
  data_sources:
  - dispute_records
  - device_logs
  - delivery_records
  false_positive_notes: Genuine fraud and merchant errors also produce disputes.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-BEH-022
  name: Overpayment by cheque or money order from an unknown party
  description: A cheque or money order from an unknown party exceeds the amount due and a refund of the
    excess is requested before clearance.
  category: behavioural
  severity: high
  detection_type:
  - transaction_monitoring
  - customer_behaviour
  data_sources:
  - cheque_images
  - transaction_data
  - customer_reports
  false_positive_notes: Genuine overpayments occur but rarely with refund pressure.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-BEH-023
  name: Expense claims with unusual gifts or entertainment near licence events
  description: Employee expenses for gifts, meals or travel for officials around inspections, permits
    or renewals.
  category: behavioural
  severity: medium
  detection_type:
  - customer_behaviour
  - investigator_judgement
  data_sources:
  - customer_profile
  - transaction_data
  - case_notes
  false_positive_notes: May have innocent explanations; assess in context of customer profile and other
    indicators.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-BEH-024
  name: Payments timed around contract award
