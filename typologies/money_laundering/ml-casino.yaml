typology:
  id: ML-CASINO
  name: Casinos and Gaming
  domain: money_laundering
  description: Use of casinos, online gaming and betting to convert illicit cash into seemingly legitimate
    winnings or cheques, to move value between parties, or to obscure its origin through chips, accounts
    and junkets. Minimal play with high buy-ins is a classic sign.
  exposure:
    channels:
    - face_to_face_professional
    payment_rails:
    - cash
    - cheque
    - wire_swift
    - fast_payments
    - bnpl_cash_like
    customer_segments:
    - retail
    - private_wealth
    - non_resident
    products:
    - transaction_account
    basis: ai_inferred
    rationale: Casino chip purchase/cash-out, deposit accounts, junkets; funded by cash and bank sources.
    consumer:
      relevant: true
      products:
      - transaction_account
      - credit_card
      channels:
      - mobile_app
      - online_banking
      basis: ai_inferred
      rationale: Consumers fund gambling and cash out winnings via Everyday account payments and card
        spend; casino-floor chips and junkets are out of scope.
  stage:
  - placement
  - layering
  sectors:
  - casino_gaming
  - dnfbp
  sources:
  - FATF, Vulnerabilities of Casinos and Gaming Sector (2009) <https://www.fatf-gafi.org/en/publications/Methodsandtrends/Vulnerabilitiesofcasinosandgamingsector.html>
    [agent-reviewed]
  - FATF, Guidance on the Risk-Based Approach for Casinos (2008) <https://www.fatf-gafi.org/> [agent-reviewed]
  - FATF, Risks of Gaming and Gambling (Red Flag Risk Indicators) (2026-09-09) <https://www.fatf-gafi.org/en/publications/Methodsandtrends/risks-of-gaming-and-gambling.html>
    [agent-retrieved 2026-11-27]
  indicators:
  - ref: IND-TXN-027
    legacy_id: ML-CASINO-001
    context: Customer buys chips with cash, plays little, and cashes out.
    name_in_typology: Large cash buy-in with minimal gambling
    false_positive_context: Recreational customers may stop early.
    controls:
    - CTL-153
    - CTL-152
  - ref: IND-BEH-089
    legacy_id: ML-CASINO-002
    context: Chips transferred between customers or cashed by third parties.
    false_positive_context: Social play occurs.
    controls:
    - CTL-153
    - CTL-152
  - ref: IND-PRD-043
    legacy_id: ML-CASINO-003
    context: Casino deposit accounts used like bank accounts.
    false_positive_context: Players keep balances.
    controls:
    - CTL-153
    - CTL-012
  - ref: IND-CUS-008
    legacy_id: ML-CASINO-004
    context: Same person plays under different names or accounts.
    name_in_typology: Use of multiple identities or accounts
    false_positive_context: Players own several accounts.
    controls:
    - CTL-153
    - CTL-039
  - ref: IND-CPT-058
    legacy_id: ML-CASINO-005
    context: Funds from third parties or unusual bank sources pay for play.
    name_in_typology: Third-party funding of play
    false_positive_context: Gifted funds.
    controls:
    - CTL-046
  - ref: IND-TYP-031
    legacy_id: ML-CASINO-006
    context: Junket arrangements shift large funds without clear play.
    false_positive_context: Genuine VIP markets.
    controls:
    - CTL-112
    - CTL-153
  - ref: IND-PRD-044
    legacy_id: ML-CASINO-007
    context: Multiple payment instruments for an account with low play.
    false_positive_context: Shared cards.
    controls:
    - CTL-153
  - ref: IND-DOC-040
    legacy_id: ML-CASINO-008
    context: Requests for win certificates or cheques not matching records.
    false_positive_context: Documentation requests are genuine.
    controls:
    - CTL-152
  - ref: IND-TYP-032
    legacy_id: ML-CASINO-009
    context: Players lose deliberately to a counterpart.
    false_positive_context: Rare coincidence.
    controls:
    - CTL-153
  - ref: IND-CUS-056
    context: Online betting or casino account details differ from the owner of the funding or withdrawal
      payment method.
    controls:
    - CTL-152
    - CTL-153
    references:
    - FATF, Risks of Gaming and Gambling (Red Flag Risk Indicators) (2026-09-09) <https://www.fatf-gafi.org/en/publications/Methodsandtrends/risks-of-gaming-and-gambling.html>
      [agent-retrieved 2026-11-27]
  - ref: IND-BEH-126
    context: Players conceal identity or location using VPNs, multiple devices or mismatched residence.
    controls:
    - CTL-092
    - CTL-090
    references:
    - FATF, Risks of Gaming and Gambling (Red Flag Risk Indicators) (2026-09-09) <https://www.fatf-gafi.org/en/publications/Methodsandtrends/risks-of-gaming-and-gambling.html>
      [agent-retrieved 2026-11-27]
