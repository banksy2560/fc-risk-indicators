typology:
  id: XC-PRODUCT
  name: Product and Service Risk
  domain: cross_cutting
  description: Inherent-risk factors relating to the products and services offered. Covers private banking,
    correspondent relationships, trade finance, prepaid instruments, virtual assets, safe deposit boxes
    and cash services.
  exposure:
    channels: []
    payment_rails:
    - cross_border_remittance
    - trade_instruments
    - stored_value_wallet
    customer_segments:
    - private_wealth
    - fintech_psp
    products:
    - correspondent_account
    - trade_finance
    - prepaid_stored_value
    - crypto_custody
    - safe_deposit_custody
    basis: ai_inferred
    rationale: 'Generic product-risk list: private banking, correspondent, trade, prepaid, virtual assets,
      safe deposit.'
  sectors:
  - all
  sources:
  - FATF, Guidance for a Risk-Based Approach (sector-specific guidance series, general principles) [too
    vague, unverified]
  - FATF Recommendations, Recommendation 1 and Interpretive Note (assessing risks and applying a risk-based
    approach) <https://www.fatf-gafi.org/en/publications/Fatfrecommendations/Fatf-recommendations.html>
    [agent-reviewed]
  - Wolfsberg Group, Guidance on a Risk Based Approach for Managing Money Laundering Risks (2006) <https://wolfsberg-group.org/resources/rba>
    [corrected, agent-reviewed]
  indicators:
  - ref: IND-PRD-010
    legacy_id: XC-PRODUCT-001
    context: High-net-worth relationships with bespoke structures, discretion expectations and large flows.
    false_positive_context: Most wealth clients are wholly legitimate.
    controls:
    - CTL-023
    - CTL-164
  - ref: IND-PRD-011
    legacy_id: XC-PRODUCT-002
    context: Provision of accounts or payment services to other financial institutions that process on
      behalf of unknown customers.
    false_positive_context: Correspondents are essential infrastructure.
    controls:
    - CTL-104
    - CTL-105
  - ref: IND-PRD-012
    legacy_id: XC-PRODUCT-003
    context: Products reliant on documentation that can be manipulated, with pricing and goods difficult
      to verify.
    false_positive_context: Documents vary legitimately by sector.
    controls:
    - CTL-123
    - CTL-124
  - ref: IND-PRD-013
    legacy_id: XC-PRODUCT-004
    context: Anonymous or lightly verified instruments with high load limits or cross-border use.
    name_in_typology: Prepaid and stored-value instruments
    severity_in_typology: medium
    false_positive_context: Prepaid cards serve the unbanked.
    controls:
    - CTL-072
    - CTL-037
  - ref: IND-PRD-014
    legacy_id: XC-PRODUCT-005
    context: Provision of services enabling conversion, custody or transfer of virtual assets.
    false_positive_context: Adoption of virtual assets for legitimate investment is widespread.
    controls:
    - CTL-145
    - CTL-146
  - ref: IND-PRD-015
    legacy_id: XC-PRODUCT-006
    context: Physical storage of unknown assets with limited visibility.
    false_positive_context: Customers store documents and heirlooms.
    controls:
    - CTL-150
    - CTL-024
  - ref: IND-PRD-016
    legacy_id: XC-PRODUCT-007
    context: Services involving large cash deposits, withdrawals, currency exchange or cash-in-transit.
    false_positive_context: Cash remains legitimate for many.
    controls:
    - CTL-039
    - CTL-012
  - ref: IND-PRD-017
    legacy_id: XC-PRODUCT-008
    context: Services such as payable-through accounts, pooled accounts or payment agent facilities.
    name_in_typology: Product enabling third-party payments
    severity_in_typology: medium
    false_positive_context: Pooled accounts are standard for professionals.
    controls:
    - CTL-118
    - CTL-011
  - ref: IND-PRD-018
    legacy_id: XC-PRODUCT-009
    context: Product launched without documented ML/TF risk assessment or controls.
    false_positive_context: Minor variants may be assessed under existing products.
    controls:
    - CTL-158
    - CTL-150
    - CTL-072
  - ref: IND-PRD-019
    legacy_id: XC-PRODUCT-010
    context: Services moving value across borders quickly through multiple intermediaries.
    false_positive_context: Remittances support families.
    controls:
    - CTL-030
    - CTL-045
  - ref: IND-PRD-020
    legacy_id: XC-PRODUCT-011
    context: Products permitting use without full identification, such as mixers, bearer-like instruments
      or unverified top-ups.
    false_positive_context: Privacy features can be sought for lawful reasons.
    controls:
    - CTL-072
    - CTL-158
