typology:
  id: ML-PEP
  name: PEP and High-Risk Person Laundering
  domain: money_laundering
  description: Laundering of proceeds of corruption or other crimes by or on behalf of politically exposed
    persons, relatives, close associates and other high-risk individuals, often through intermediaries,
    companies and foreign accounts. Such flows may be integrated through property, luxury assets and investments.
  stage:
  - layering
  - integration
  sectors:
  - banking
  - dnfbp
  - securities
  sources:
  - FATF, Guidance on Politically Exposed Persons (Recommendations 12 and 22) (2013) <https://www.fatf-gafi.org/en/publications/Fatfrecommendations/Peps-r12-r22.html>
    [agent-reviewed]
  - FATF, Laundering the Proceeds of Corruption (2011) <https://www.fatf-gafi.org/en/publications/Methodsandtrends/Laundering-the-proceeds-of-corruption.html>
    [agent-reviewed]
  - Wolfsberg Group, Wolfsberg Guidance on Politically Exposed Persons (PEPs) (2017) <https://wolfsberg-group.org/>
    [corrected, agent-reviewed]
  indicators:
  - ref: IND-CUS-001
    legacy_id: ML-PEP-001
    context: Assets and flows clearly exceed the legitimate income expected for the individual's official
      position.
    name_in_typology: Wealth inconsistent with official income
    false_positive_context: Family wealth and prior career can explain.
    controls:
    - CTL-013
    - CTL-025
  - ref: IND-OWN-023
    legacy_id: ML-PEP-002
    context: Accounts or assets held by family or associates who have limited own means.
    false_positive_context: Families pool wealth legitimately.
    controls:
    - CTL-028
    - CTL-048
  - ref: IND-OWN-004
    legacy_id: ML-PEP-003
    context: Foundations, trusts or companies hide PEP's interest.
    name_in_typology: Opaque structures for PEP-connected assets
    false_positive_context: Estate planning is legitimate.
    controls:
    - CTL-005
    - CTL-008
  - ref: IND-CPT-038
    legacy_id: ML-PEP-004
    context: Receipts from government bodies, state-owned firms or contractors linked to PEP's remit.
    false_positive_context: Legitimate fees from state-owned firms.
    controls:
    - CTL-058
    - CTL-026
    - CTL-042
  - ref: IND-GEO-040
    legacy_id: ML-PEP-005
    context: Flows linked to countries with high corruption or secrecy.
    name_in_typology: Transfers to or from jurisdictions of high corruption risk
    false_positive_context: Business operations abroad.
    controls:
    - CTL-045
    - CTL-012
  - ref: IND-CUS-040
    legacy_id: ML-PEP-006
    context: Customer becomes PEP after onboarding without update.
    false_positive_context: Appointments follow election cycles.
    controls:
    - CTL-028
    - CTL-014
  - ref: IND-TXN-114
    legacy_id: ML-PEP-007
    context: High-value purchases by PEPs or associates abroad.
    false_positive_context: Wealthy PEPs may buy property.
    controls:
    - CTL-043
    - CTL-032
  - ref: IND-BEH-094
    legacy_id: ML-PEP-008
    context: Customer denies or omits political role despite evidence.
    false_positive_context: Misunderstanding of definition.
    controls:
    - CTL-026
    - CTL-016
  - ref: IND-CPT-039
    legacy_id: ML-PEP-009
    context: Lawyers, brokers or fixers move funds on behalf of PEP.
    false_positive_context: Professionals commonly act for wealthy clients.
    controls:
    - CTL-112
    - CTL-046
