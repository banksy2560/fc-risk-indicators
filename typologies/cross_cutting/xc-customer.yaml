typology:
  id: XC-CUSTOMER
  name: Customer Type and Behaviour Risk
  domain: cross_cutting
  description: Inherent-risk factors relating to who the customer is and how they behave towards the institution.
    Covers politically exposed persons, non-residents, cash-intensive businesses, complex structures,
    reluctance to provide information and negative news. Used as the customer-risk dimension of an enterprise-wide
    or customer risk assessment.
  sectors:
  - all
  sources:
  - FATF, Guidance for a Risk-Based Approach (sector-specific guidance series, general principles) [too
    vague, unverified]
  - FATF Recommendations, Recommendation 1 and Interpretive Note (assessing risks and applying a risk-based
    approach) <https://www.fatf-gafi.org/en/publications/Fatfrecommendations/Fatf-recommendations.html>
    [agent-reviewed]
  - Wolfsberg Group, Guidance on a Risk Based Approach for Managing Money Laundering Risks (2006) <https://wolfsberg-group.org/resources/rba>
    [corrected, agent-reviewed]
  indicators:
  - ref: IND-CUS-016
    legacy_id: XC-CUSTOMER-001
    context: The customer, a beneficial owner or a controller is a domestic or foreign PEP, or a family
      member or close associate of one.
    false_positive_context: Many PEPs, particularly domestic or low-level officials, are lawfully wealthy
      and low risk once source of wealth is understood.
    controls:
    - CTL-028
    - CTL-026
  - ref: IND-CUS-017
    legacy_id: XC-CUSTOMER-002
    context: Customer resides outside the institution's market and cannot explain why they need an account
      or service here.
    false_positive_context: Expatriates, students, property investors and cross-border workers often have
      legitimate need.
    controls:
    - CTL-011
    - CTL-015
  - ref: IND-CUS-013
    legacy_id: XC-CUSTOMER-003
    context: Customer's business model relies heavily on cash receipts (e.g. retail, restaurants, car
      washes, vending), making revenue hard to verify.
    false_positive_context: Cash-heavy trades are common and legitimate; indicator only grows with volume
      out of line with peers.
    controls:
    - CTL-064
    - CTL-015
  - ref: IND-OWN-002
    legacy_id: XC-CUSTOMER-004
    context: Customer is part of a multi-layer or multi-jurisdiction structure without an evident commercial
      purpose.
    name_in_typology: Complex or unnecessarily layered structure
    false_positive_context: Large groups, funds and tax-efficient structures can be complex for lawful
      reasons.
    controls:
    - CTL-008
    - CTL-005
    - CTL-023
  - ref: IND-BEH-002
    legacy_id: XC-CUSTOMER-005
    context: Customer delays, refuses or gives evasive answers to KYC or refresh requests, or withdraws
      when questioned.
    name_in_typology: Unwillingness or inability to provide information
    false_positive_context: Customers may be privacy-conscious, unfamiliar with requirements or have genuinely
      lost documents.
    controls:
    - CTL-016
    - CTL-014
  - ref: IND-CUS-003
    legacy_id: XC-CUSTOMER-006
    context: Credible negative news links the customer or associated parties to financial crime, corruption
      or regulatory action.
    severity_in_typology: medium
    false_positive_context: Name matches, old or unproven allegations and unrelated namesakes are common.
    controls:
    - CTL-032
    - CTL-033
  - ref: IND-BEH-001
    legacy_id: XC-CUSTOMER-007
    context: Customer is vague about who ultimately benefits from the account or the intended use of funds.
    name_in_typology: Customer reluctant to disclose beneficial owner or purpose
    false_positive_context: Trustees, professionals and privacy-sensitive clients may need time to supply
      details.
    controls:
    - CTL-006
    - CTL-170
  - ref: IND-CUS-004
    legacy_id: XC-CUSTOMER-008
    context: Customer or principal has previous convictions, enforcement action, or has been exited by
      another institution.
    name_in_typology: Customer with prior regulatory, criminal or sanctions history
    false_positive_context: Spent or unrelated histories may not indicate current risk.
    controls:
    - CTL-004
    - CTL-025
  - ref: IND-BEH-028
    legacy_id: XC-CUSTOMER-009
    context: Declared occupation, age or business does not plausibly explain the scale of assets or funds.
    false_positive_context: Inheritance, windfalls or undeclared secondary income can explain gaps.
    controls:
    - CTL-013
    - CTL-042
  - ref: IND-CUS-018
    legacy_id: XC-CUSTOMER-010
    context: Customer operates in a sector with elevated misuse risk, such as precious metals, gambling,
      crypto, arms, or money transfer.
    false_positive_context: Most firms in these sectors are regulated and compliant.
    controls:
    - CTL-015
    - CTL-116
  - ref: IND-BEH-016
    legacy_id: XC-CUSTOMER-011
    context: Customer repeatedly changes name, address, contact, signatories or ownership shortly after
      onboarding.
    name_in_typology: Customer frequently changes details
    false_positive_context: Life events, relocations and restructures legitimately change details.
    controls:
    - CTL-088
    - CTL-014
