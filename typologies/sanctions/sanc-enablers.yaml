typology:
  id: SANC-ENABLERS
  name: Sanctions Facilitators and Professional Enablers
  domain: sanctions
  description: Lawyers, accountants, trust and company service providers, brokers and other professionals
    may knowingly or unknowingly structure transactions, set up entities or move funds to help designated
    persons avoid sanctions. Indicators focus on unusual service patterns, pass-through behaviour and
    the enabler's own risk profile.
  sectors:
  - corporate_services
  - dnfbp
  - banking
  sources:
  - FATF, Guidance on Beneficial Ownership of Legal Persons (2023) [unverified]
  - FATF, Professional Money Laundering (2018) [unverified]
  - OFAC and UK government advisories on sanctions evasion enablers (general reference) [replacement suggested,
    unverified]
  indicators:
  - ref: IND-CPT-051
    legacy_id: SANC-ENABLERS-001
    context: Same provider sets up numerous similar entities for linked beneficial owners.
    name_in_typology: Service provider incorporates many entities for related clients with shared structures
    false_positive_context: TCSPs create many entities legitimately.
    controls:
    - CTL-117
    - CTL-049
    - CTL-048
  - ref: IND-TXN-035
    legacy_id: SANC-ENABLERS-002
    context: Funds enter and leave client accounts of an adviser with no related service.
    name_in_typology: Professional's client account used as pass-through
    false_positive_context: Client accounts are used for legitimate settlements.
    controls:
    - CTL-040
    - CTL-011
  - ref: IND-BEH-107
    legacy_id: SANC-ENABLERS-003
    context: Request for restructuring after adverse news or risk of designation.
    false_positive_context: Restructuring has many reasons.
    controls:
    - CTL-014
    - CTL-102
  - ref: IND-PRD-059
    legacy_id: SANC-ENABLERS-004
    context: Payments for clients via netting, barter or unrecorded transfers.
    false_positive_context: Informal systems are used in some communities.
    controls:
    - CTL-047
    - CTL-061
  - ref: IND-CUS-004
    legacy_id: SANC-ENABLERS-005
    context: Adverse regulatory or enforcement actions concerning sanctions handling.
    name_in_typology: Provider with disciplinary history or enforcement exposure
    severity_in_typology: medium
    false_positive_context: Past findings may be remediated.
    controls:
    - CTL-029
    - CTL-161
  - ref: IND-GEO-029
    legacy_id: SANC-ENABLERS-006
    context: Concentration of high-risk clients.
    false_positive_context: Specialist niche providers.
    controls:
    - CTL-117
    - CTL-023
  - ref: IND-TXN-133
    legacy_id: SANC-ENABLERS-007
    context: Unusually high or opaque fees.
    false_positive_context: Specialist work attracts high fees.
    controls:
    - CTL-060
    - CTL-046
  - ref: IND-DOC-061
    legacy_id: SANC-ENABLERS-008
    context: Applications or licence reliance appear inconsistent or altered.
    false_positive_context: Administrative errors occur.
    controls:
    - CTL-116
    - CTL-002
