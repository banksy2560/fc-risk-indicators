typology:
  id: CY-NEOBANK
  name: Neobank and Fintech Account Abuse via Rapid Onboarding
  domain: cyber_enabled
  description: Digital-only providers compete on fast, remote onboarding, which criminals exploit to open
    large numbers of accounts for fraud proceeds, pass-through and layering. Fraud rings use stolen or
    synthetic identities, bulk registration and automation, then operate accounts as mules or shell receptacles.
  exposure:
    channels:
    - mobile_app
    - online_banking
    payment_rails:
    - fast_payments
    customer_segments:
    - new_to_bank
    - student_youth
    - retail
    - fintech_psp
    products:
    - transaction_account
    basis: ai_inferred
    rationale: Rapid remote onboarding at digital-only providers used for mule accounts.
  stage:
  - placement
  - layering
  sectors:
  - fintech
  - banking
  - payments
  sources:
  - FATF, Guidance on Digital ID (2020) <https://www.fatf-gafi.org/content/fatf-gafi/en/publications/Financialinclusionandnpoissues/Digital-identity-guidance.html>
    [agent-reviewed]
  - FATF, Opportunities and Challenges of New Technologies for AML/CFT (2021) <https://www.fatf-gafi.org/content/fatf-gafi/en/publications/Digitaltransformation/Opportunities-challenges-new-technologies-for-aml-cft.html>
    [agent-reviewed]
  - FinCEN, Advisory to Financial Institutions on Cyber-Events and Cyber-Enabled Crime (FIN-2016-A005,
    2016) [unverified]
  indicators:
  - ref: IND-BEH-012
    legacy_id: CY-NEOBANK-001
    context: Many sign-ups arrive in a short period with common device fingerprints or phone/email patterns.
    name_in_typology: Burst of applications sharing devices, IPs or contact data
    false_positive_context: Marketing campaigns; shared public Wi-Fi.
    controls:
    - CTL-091
    - CTL-004
    - CTL-048
  - ref: IND-TXN-011
    legacy_id: CY-NEOBANK-002
    context: Account opens, idles, then moves large funds quickly in a pass-through pattern.
    name_in_typology: Account dormant then suddenly high-velocity inflows and outflows
    false_positive_context: Seasonal use.
    controls:
    - CTL-051
    - CTL-037
    - CTL-103
  - ref: IND-TXN-004
    legacy_id: CY-NEOBANK-003
    context: Accounts act as aggregation points for third-party funds, then pay out to exchanges.
    name_in_typology: Inbound payments from many unrelated sources, outbound to crypto or abroad
    false_positive_context: Freelancers and marketplace sellers.
    controls:
    - CTL-051
    - CTL-048
    - CTL-093
  - ref: IND-DOC-010
    legacy_id: CY-NEOBANK-004
    context: Same image or template appears under multiple names or with minor edits.
    name_in_typology: Identity documents or selfies reused across applicants
    false_positive_context: Resubmission after failed attempts.
    controls:
    - CTL-002
    - CTL-001
    - CTL-004
  - ref: IND-CUS-002
    legacy_id: CY-NEOBANK-005
    context: Student or unemployed applicant sees large volumes.
    name_in_typology: Declared occupation or income inconsistent with account turnover
    false_positive_context: Gig earnings and gifts.
    controls:
    - CTL-023
    - CTL-037
    - CTL-012
  - ref: IND-BEH-007
    legacy_id: CY-NEOBANK-006
    context: Sessions show remote-control tools, emulators or automation scripts.
    name_in_typology: Remote access or emulator use during onboarding
    severity_in_typology: medium
    false_positive_context: Accessibility tools.
    controls:
    - CTL-091
    - CTL-001
    - CTL-092
  - ref: IND-CUS-020
    legacy_id: CY-NEOBANK-007
    context: Behaviour and device suggest a controller other than the account holder.
    false_positive_context: Guardianship or carer arrangements.
    controls:
    - CTL-091
    - CTL-093
    - CTL-023
  - ref: IND-BEH-046
    legacy_id: CY-NEOBANK-008
    context: Many new beneficiaries added in a short period, often to unrelated accounts.
    false_positive_context: Payroll set-up.
    controls:
    - CTL-073
    - CTL-037
    - CTL-051
  - ref: IND-OWN-007
    legacy_id: CY-NEOBANK-009
    context: Newly formed companies open accounts with vague descriptions and no web presence.
    name_in_typology: Business account for newly created entity with generic purpose
    severity_in_typology: medium
    false_positive_context: Early-stage start-ups.
    controls:
    - CTL-023
    - CTL-002
    - CTL-093
  - ref: IND-BEH-047
    legacy_id: CY-NEOBANK-010
    context: Clusters of accounts claiming rewards and withdrawing promptly.
    false_positive_context: Promotion participants.
    controls:
    - CTL-048
    - CTL-004
    - CTL-037
