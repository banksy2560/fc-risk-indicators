typology:
  id: SANC-DIVERSION
  name: Trade Diversion and Third-Country Transshipment
  domain: sanctions
  description: Restricted goods or restricted-destination trade may be rerouted through third countries
    whose trade statistics, parties or documents show sudden shifts. Financial institutions can detect
    diversion by comparing customer activity with country-level trade patterns, end-use information and
    common high-priority items.
  exposure:
    channels:
    - broker_intermediary
    payment_rails:
    - trade_instruments
    - wire_swift
    customer_segments:
    - corporate
    - sme
    - non_resident
    products:
    - trade_finance
    - transaction_account
    basis: ai_inferred
    rationale: Third-country transshipment through newly active traders and trade finance.
    consumer:
      relevant: false
      products: []
      channels: []
      basis: ai_inferred
      rationale: Trade diversion and transshipment of restricted goods is commercial trade activity outside
        consumer products.
  sectors:
  - banking
  - trade_finance
  - all
  sources:
  - 'FinCEN and BIS, Joint Alert: FinCEN and the US Department of Commerce''s BIS Urge Increased Vigilance
    for Potential Russian and Belarusian Export Control Evasion Attempts (FIN-2022-Alert003, June 2022)
    [corrected, unverified]'
  - BIS and FinCEN, Joint Alert on Newly Identified Efforts by Russia to Evade Export Controls (2023)
    [unverified]
  - 'FATF/Egmont Group, Trade-Based Money Laundering: Trends and Developments (2020) [corrected, unverified]'
  indicators:
  - ref: IND-CUS-050
    legacy_id: SANC-DIVERSION-001
    context: A firm with a different history begins importing restricted items for resale.
    false_positive_context: Market expansion and new product lines occur.
    controls:
    - CTL-133
    - CTL-014
    - CTL-130
  - ref: IND-GEO-027
    legacy_id: SANC-DIVERSION-002
    context: Items ordered and shipped to mailbox or warehouse addresses without a visible business.
    name_in_typology: Orders from addresses in transit zones with no storage or sales operations
    false_positive_context: Fulfilment centres are common.
    controls:
    - CTL-003
    - CTL-126
  - ref: IND-DOC-054
    legacy_id: SANC-DIVERSION-003
    context: Buyer will not confirm end use or sign re-export undertakings.
    name_in_typology: End-user information absent, or customer declines re-export commitments
    false_positive_context: Some buyers resist paperwork.
    controls:
    - CTL-129
    - CTL-016
  - ref: IND-GEO-028
    legacy_id: SANC-DIVERSION-004
    context: Aggregate trade data shows spikes in categories of concern to particular countries.
    false_positive_context: Demand shifts are normal.
    controls:
    - CTL-139
    - CTL-154
  - ref: IND-TXN-131
    legacy_id: SANC-DIVERSION-005
    context: Funds arrive from or return to parties in the restricted jurisdiction.
    false_positive_context: Group treasury flows.
    controls:
    - CTL-045
    - CTL-103
  - ref: IND-DOC-060
    legacy_id: SANC-DIVERSION-006
    context: Descriptions change between stages of the supply chain.
    false_positive_context: Classification errors are common.
    controls:
    - CTL-123
  - ref: IND-OWN-025
    legacy_id: SANC-DIVERSION-007
    context: Directors or addresses link to the restricted country while located elsewhere.
    false_positive_context: Diaspora businesses are common.
    controls:
    - CTL-029
    - CTL-005
  - ref: IND-TXN-132
    legacy_id: SANC-DIVERSION-008
    context: Orders split into smaller consignments to stay below review thresholds.
    false_positive_context: Just-in-time practices are common.
    controls:
    - CTL-039
    - CTL-159
