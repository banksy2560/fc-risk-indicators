typology:
  id: EC-WASTE
  name: Waste Trafficking and Illegal Dumping
  domain: environmental_crime
  description: Illegal collection, export, treatment or dumping of hazardous or regulated waste, often
    disguised as second-hand goods or recyclables and shipped to countries with weak controls. Profits
    come from avoided disposal costs and falsified treatment records.
  exposure:
    channels: []
    payment_rails:
    - wire_swift
    - trade_instruments
    - cash
    customer_segments:
    - sme
    - corporate
    products:
    - trade_finance
    - transaction_account
    basis: ai_inferred
    rationale: Waste firms, shippers and brokers disguising waste as used goods; cash to informal tippers
      and rotating shell operators.
  sectors:
  - banking
  - corporate_services
  - payments
  sources:
  - FATF, Money Laundering from Environmental Crime (2021) <https://www.fatf-gafi.org/content/fatf-gafi/en/publications/Environmentalcrime/Money-laundering-from-environmental-crime.html>
    [agent-reviewed]
  - Basel Convention on the Control of Transboundary Movements of Hazardous Wastes and their Disposal
    <https://www.basel.int> [agent-reviewed]
  - 'UNEP and INTERPOL, The Rise of Environmental Crime: A Growing Threat to Natural Resources, Peace,
    Development and Security (2016) <https://wedocs.unep.org/20.500.11822/7662> [corrected, agent-reviewed]'
  - Europol, public material on environmental crime and waste trafficking [too vague, unverified]
  indicators:
  - ref: IND-DOC-022
    legacy_id: EC-WASTE-001
    context: Containers described as used electronics, vehicles, plastics or metal scrap with signs of
      unsorted waste.
    false_positive_context: Second-hand trade is huge and legitimate.
    controls:
    - CTL-131
    - CTL-123
  - ref: IND-TXN-061
    legacy_id: EC-WASTE-002
    context: Waste firm bills clients far below market disposal rates.
    false_positive_context: Efficiency or subsidies may lower prices.
    controls:
    - CTL-124
    - CTL-134
  - ref: IND-CUS-005
    legacy_id: EC-WASTE-003
    context: Operator lacks the permit or uses another firm's permit for different waste.
    name_in_typology: Licence or permit lacking or misused
    false_positive_context: Permits may be pending renewal.
    controls:
    - CTL-134
    - CTL-116
    - CTL-136
  - ref: IND-GEO-007
    legacy_id: EC-WASTE-004
    context: Exports to destinations known as dumping sites.
    false_positive_context: Some destinations have lawful recyclers.
    controls:
    - CTL-154
    - CTL-133
  - ref: IND-TXN-022
    legacy_id: EC-WASTE-005
    context: Payments to farmers, quarry owners or drivers for tipping.
    name_in_typology: Cash payments to landowners or drivers for dumping
    false_positive_context: Land-fill fees exist.
    controls:
    - CTL-064
    - CTL-173
  - ref: IND-OWN-009
    legacy_id: EC-WASTE-006
    context: Companies appear, accumulate waste and vanish leaving liabilities.
    name_in_typology: Short-lived waste companies with common directors
    false_positive_context: Contractors may fail for commercial reasons.
    controls:
    - CTL-050
    - CTL-032
  - ref: IND-BEH-057
    legacy_id: EC-WASTE-007
    context: Legitimate recycler also receives mislabelled loads and commingled revenue.
    false_positive_context: Mixed streams happen in recycling.
    controls:
    - CTL-139
    - CTL-010
  - ref: IND-CUS-003
    legacy_id: EC-WASTE-008
    context: Fines, seizures, or investigations tied to firm or owners.
    name_in_typology: Adverse media or enforcement action over waste crime
    false_positive_context: Cases may be disputed.
    controls:
    - CTL-032
    - CTL-024
