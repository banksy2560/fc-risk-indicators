typology:
  id: TF-EXTORT
  name: Extortion and Kidnap-for-Ransom Funding of Terrorist Groups
  domain: terrorist_financing
  description: Terrorist and insurgent groups raise funds through ransom, extortion of businesses and
    diaspora communities, and illicit taxation in areas they control. Payments often appear as unexplained
    transfers, cash movements by third parties or emergency borrowing.
  sectors:
  - banking
  - mvts
  - insurance
  - corporate_services
  sources:
  - FATF, Organised Maritime Piracy and Related Kidnapping for Ransom (2011) [unverified]
  - UN Security Council Resolution 2133 (2014) on kidnapping for ransom by terrorist groups [unverified]
  indicators:
  - ref: IND-TXN-146
    legacy_id: TF-EXTORT-001
    context: Customer receives or sends sudden large transfers framed as emergencies, to unfamiliar parties
      or accounts abroad.
    false_positive_context: Genuine medical and legal emergencies produce similar urgency.
    controls:
    - CTL-068
    - CTL-052
  - ref: IND-TYP-055
    legacy_id: TF-EXTORT-002
    context: Operators in conflict-affected areas make periodic payments to individuals labelled as security,
      fees or consultants.
    false_positive_context: Private security and facilitation fees can be lawful but need documentation.
    controls:
    - CTL-022
    - CTL-167
    - CTL-042
    - CTL-060
  - ref: IND-TXN-147
    legacy_id: TF-EXTORT-003
    context: Collection of funds across diaspora members or business owners followed by consolidated cross-border
      transfer.
    false_positive_context: Community fundraising for family and festivals is common.
    controls:
    - CTL-041
    - CTL-012
  - ref: IND-CPT-054
    legacy_id: TF-EXTORT-004
    context: Payments to intermediaries described as negotiators or consultants with limited contracts
      or oversight.
    false_positive_context: Professional crisis response firms exist and are lawful.
    controls:
    - CTL-112
    - CTL-036
  - ref: IND-PRD-064
    legacy_id: TF-EXTORT-005
    context: Claims paid to third parties or in cash with limited verification of the event.
    false_positive_context: Claim handling often involves confidential intermediaries.
    controls:
    - CTL-085
  - ref: IND-GEO-032
    legacy_id: TF-EXTORT-006
    context: Payments from relatives or employers rise coincident with publicly reported kidnappings or
      extortion campaigns.
    false_positive_context: Remittance spikes occur around disasters and conflicts for many reasons.
    controls:
    - CTL-045
    - CTL-083
  - ref: IND-PRD-065
    legacy_id: TF-EXTORT-007
    context: Funds delivered via cash couriers or informal agents into regions where armed groups operate.
    name_in_typology: Payments routed through informal or non-bank agents in affected areas
    false_positive_context: Informal channels are often the only access in fragile regions.
    controls:
    - CTL-021
    - CTL-061
    - CTL-063
  - ref: IND-DOC-067
    legacy_id: TF-EXTORT-008
    context: Documents reference levies, tolls or taxes payable to non-state bodies or local commanders.
    false_positive_context: Poor translation and informal local terminology may be misleading.
    controls:
    - CTL-030
    - CTL-102
