typology:
  id: HT-FORCEDLAB
  name: Forced Labour in Supply Chains and Employment
  domain: human_trafficking_modern_slavery
  description: Labour obtained through coercion, deception, debt bondage, wage withholding, document retention
    or threats. Businesses and financial institutions encounter risks via labour intermediaries, suppliers
    in high-risk sectors and unusual wage patterns. Controls combine supply-chain due diligence with worker-centred
    escalation.
  sectors:
  - banking
  - payments
  - corporate_services
  sources:
  - 'ILO, Profits and Poverty: The Economics of Forced Labour (2014)'
  - ILO, Indicators of Forced Labour (2012)
  - OECD, Due Diligence Guidance for Responsible Business Conduct (2018)
  - FATF and APG, Financial Flows from Human Trafficking (2018)
  indicators:
  - ref: IND-TXN-088
    legacy_id: HT-FORCEDLAB-001
    context: Payments from workers to recruiters or employers for placement, visas or training, creating
      debt.
    false_positive_context: Fees may be legitimately borne by employers in compliant models.
    controls:
    - CTL-122
    - CTL-056
  - ref: IND-BEH-005
    legacy_id: HT-FORCEDLAB-002
    context: Workers' pay lands in accounts accessed by employer, with cards held by employer or agent.
    name_in_typology: Wages paid to accounts controlled by employer or agent
    false_positive_context: Some employers manage accounts for migrant workers with consent.
    controls:
    - CTL-056
    - CTL-163
  - ref: IND-DOC-039
    legacy_id: HT-FORCEDLAB-003
    context: Pay after deductions is far below minimum wage standards; heavy deductions for housing, food
      and transport.
    false_positive_context: Statutory deductions and employer housing are lawful.
    controls:
    - CTL-137
    - CTL-120
  - ref: IND-GEO-012
    legacy_id: HT-FORCEDLAB-004
    context: Sourcing from sectors such as agriculture, fishing, garments or mining in regions flagged
      by credible reports.
    false_positive_context: Most suppliers in these areas comply.
    controls:
    - CTL-136
  - ref: IND-OWN-020
    legacy_id: HT-FORCEDLAB-005
    context: Unlicensed gangmaster supplying workers, with nominee owners and frequent name changes.
    false_positive_context: Small agencies may be informal.
    controls:
    - CTL-122
    - CTL-005
  - ref: IND-BEH-085
    legacy_id: HT-FORCEDLAB-006
    context: Audit or customer information indicates passports withheld, workers housed on site or unable
      to leave.
    false_positive_context: Employers may safeguard documents at workers' request in limited cases.
    controls:
    - CTL-137
    - CTL-016
  - ref: IND-CPT-059
    legacy_id: HT-FORCEDLAB-007
    context: Credible allegations or customs detentions connected with forced labour.
    name_in_typology: Adverse media or import bans related to supplier
    false_positive_context: Allegations may be contested.
    controls:
    - CTL-032
    - CTL-137
  - ref: IND-TXN-089
    legacy_id: HT-FORCEDLAB-008
    context: Large cash payroll withdrawals with no tax or social contributions.
    false_positive_context: Informal economy may lawfully include cash wages.
    controls:
    - CTL-056
  - ref: IND-TXN-090
    legacy_id: HT-FORCEDLAB-009
    context: Many workers all send funds to one recipient in home country.
    false_positive_context: Workers from one village may send to a single trusted agent.
    controls:
    - CTL-041
    - CTL-172
