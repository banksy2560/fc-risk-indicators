typology:
  id: CY-RANSOM
  name: Ransomware Payment Laundering
  domain: cyber_enabled
  description: Ransomware operators demand payment in virtual assets and then launder proceeds through
    chains of wallets, mixers, exchanges and over-the-counter brokers. Victims and their facilitators,
    such as incident response firms and insurers, also create exposure. Institutions may detect either
    victim payments or operator cash-out.
  stage:
  - layering
  - integration
  sectors:
  - crypto
  - banking
  - fintech
  - insurance
  sources:
  - FATF, Countering Ransomware Financing (2023)
  - FinCEN, Advisory on Ransomware and the Use of the Financial System to Facilitate Ransom Payments (FIN-2021-A004,
    2021)
  - 'FATF, Virtual Assets: Red Flag Indicators of Money Laundering and Terrorist Financing (2020)'
  indicators:
  - ref: IND-TXN-055
    legacy_id: CY-RANSOM-001
    context: A first-time or unsophisticated buyer buys a large amount and withdraws it all to an unfamiliar
      address, consistent with a victim ransom payment.
    false_positive_context: Legitimate first-time investors.
    controls:
    - CTL-037
    - CTL-072
    - CTL-068
  - ref: IND-CUS-022
    legacy_id: CY-RANSOM-002
    context: Business customer suddenly funds a crypto purchase beyond normal activity, with mention of
      an IT incident or urgent deadline.
    false_positive_context: Genuine treasury diversification.
    controls:
    - CTL-023
    - CTL-037
    - CTL-068
  - ref: IND-TYP-019
    legacy_id: CY-RANSOM-003
    context: Destination or source wallet is attributed to ransomware affiliates or flagged in published
      designations.
    name_in_typology: Withdrawal address attributed to ransomware actors
    false_positive_context: Attribution may be outdated.
    controls:
    - CTL-029
    - CTL-145
    - CTL-103
  - ref: IND-TXN-003
    legacy_id: CY-RANSOM-004
    context: Account collects payments of similar sizes from unrelated first-time wallets and moves them
      on within a short period.
    name_in_typology: Inbound funds from many victim-like wallets then rapid layering
    false_positive_context: Fundraising campaigns.
    controls:
    - CTL-145
    - CTL-048
    - CTL-093
  - ref: IND-TYP-005
    legacy_id: CY-RANSOM-005
    context: Receipts are converted into privacy-enhanced assets or sent to mixing services before exit.
    name_in_typology: Large conversion into privacy coins or mixer use after receipt
    false_positive_context: Privacy-focused users.
    controls:
    - CTL-145
    - CTL-037
    - CTL-093
  - ref: IND-CPT-015
    legacy_id: CY-RANSOM-006
    context: Large OTC trades for customers that avoid identity verification or pay via third parties.
    name_in_typology: Use of OTC desks or brokers with minimal due diligence
    false_positive_context: Legitimate large OTC investors.
    controls:
    - CTL-023
    - CTL-012
    - CTL-149
  - ref: IND-CUS-023
    legacy_id: CY-RANSOM-007
    context: Incident response firm, broker or insurer funds crypto on behalf of a client, with unclear
      client identity or authorisation.
    false_positive_context: Legitimate professional ransom-negotiation services, subject to sanctions
      checks.
    controls:
    - CTL-023
    - CTL-029
    - CTL-162
  - ref: IND-TXN-018
    legacy_id: CY-RANSOM-008
    context: Funds are moved across chains and wrapped tokens shortly after receipt to break attribution.
    name_in_typology: Chain-hopping or bridge usage after a large inbound payment
    severity_in_typology: medium
    false_positive_context: Multi-chain users.
    controls:
    - CTL-145
    - CTL-037
    - CTL-093
  - ref: IND-GEO-018
    legacy_id: CY-RANSOM-009
    context: Final withdrawals go to exchanges or accounts in jurisdictions with poor AML supervision
      or known to shelter cybercriminals.
    name_in_typology: Cash-out in jurisdictions with weak controls
    false_positive_context: Customers legitimately resident there.
    controls:
    - CTL-149
    - CTL-145
    - CTL-092
  - ref: IND-BEH-049
    legacy_id: CY-RANSOM-010
    context: Dormant or low-activity account abruptly receives or sends large volumes in a pattern tied
      to publicised ransomware campaigns.
    false_positive_context: Seasonal or one-off events.
    controls:
    - CTL-037
    - CTL-083
    - CTL-093
