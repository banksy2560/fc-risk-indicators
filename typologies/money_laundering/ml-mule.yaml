typology:
  id: ML-MULE
  name: Money Mules
  domain: money_laundering
  description: Individuals, witting or unwitting, whose accounts or identities are used to receive and
    move criminal proceeds on behalf of others, often recruited via fake job offers, romance scams or
    social media. Mule activity is a key layering and cash-out step for fraud and other crime proceeds.
  exposure:
    channels:
    - mobile_app
    - online_banking
    payment_rails:
    - fast_payments
    - crypto_onramp_offramp
    - cash
    - loan_disbursement
    customer_segments:
    - student_youth
    - new_to_bank
    - vulnerable_elderly
    products:
    - transaction_account
    basis: ai_inferred
    rationale: Mule accounts receive and forward funds rapidly, often young or new customers.
    consumer:
      relevant: true
      products:
      - transaction_account
      - savings_account
      channels:
      - mobile_app
      - online_banking
      - branch
      - call_centre
      basis: ai_inferred
      rationale: 'Core consumer typology: mule accounts receive and forward fraud proceeds via digital
        channels, with handler-accompanied branch and phone contact.'
  stage:
  - placement
  - layering
  sectors:
  - banking
  - payments
  - fintech
  - crypto
  sources:
  - Europol, EU Money Mule Action (EMMA) campaign press releases [replacement suggested, unverified]
  - FATF, Money Laundering from Fraud typology guidance (general) [too vague, unverified]
  - FinCEN, advisories on money mule activity (general) [too vague, unverified]
  indicators:
  - ref: IND-TXN-001
    legacy_id: ML-MULE-001
    context: Account receives credits from unrelated payers and sends most funds onward within hours or
      days, retaining a small amount.
    name_in_typology: Inbound third-party payments followed by rapid outbound transfers
    false_positive_context: Marketplace sellers, agents and family support flows may pass funds on quickly.
    controls:
    - CTL-051
    - CTL-103
  - ref: IND-BEH-020
    legacy_id: ML-MULE-002
    context: Account shows little history then abruptly receives many payments unrelated to the profile.
    name_in_typology: New or recently opened account with sudden high activity
    false_positive_context: Students or new arrivals may receive lump sums such as loans or grants.
    controls:
    - CTL-054
    - CTL-072
  - ref: IND-CUS-002
    legacy_id: ML-MULE-003
    context: Young, unemployed or newly arrived customers with high flows inconsistent with their stated
      circumstances.
    name_in_typology: Account holder profile matches common recruitment demographics
    false_positive_context: Profile alone is not suspicious and must not drive discrimination.
    controls:
    - CTL-042
    - CTL-165
  - ref: IND-BEH-004
    legacy_id: ML-MULE-004
    context: In branch or in contact, the customer cannot explain transactions, reads from scripts, or
      is accompanied by a handler.
    name_in_typology: Customer follows instructions or is coached
    false_positive_context: Vulnerable or elderly customers may need help for genuine reasons.
    controls:
    - CTL-170
    - CTL-100
  - ref: IND-CPT-037
    legacy_id: ML-MULE-005
    context: Multiple unrelated accounts share devices, phone numbers, email or addresses.
    false_positive_context: Households and shared workplaces share details.
    controls:
    - CTL-049
    - CTL-095
  - ref: IND-TXN-029
    legacy_id: ML-MULE-006
    context: Inbound payments with references typical of fraud, e.g. invoice, loan fee, investment or
      romance context.
    name_in_typology: Payments carrying scam-related references
    false_positive_context: Free-text references vary legitimately.
    controls:
    - CTL-030
    - CTL-083
  - ref: IND-PRD-048
    legacy_id: ML-MULE-007
    context: Logins from foreign IPs or remote-access tools soon after opening.
    false_positive_context: Travel and VPN use are common.
    controls:
    - CTL-091
    - CTL-073
  - ref: IND-TXN-002
    legacy_id: ML-MULE-008
    context: Funds exit via overseas transfers, gift cards or crypto purchases after receipt.
    name_in_typology: International transfers or cryptocurrency purchases following credits
    severity_in_typology: medium
    false_positive_context: International students and migrants send money abroad.
    controls:
    - CTL-040
    - CTL-070
  - ref: IND-CUS-008
    legacy_id: ML-MULE-009
    context: One person or intermediary opens accounts at several institutions or products.
    name_in_typology: Multiple accounts opened for same individual or by same agent
    false_positive_context: Customers hold multiple accounts normally.
    controls:
    - CTL-004
    - CTL-083
