typology:
  id: CY-DARKNET
  name: Darknet Marketplace Proceeds Laundering
  domain: cyber_enabled
  description: Vendors and administrators of darknet markets receive payment in virtual assets for illicit
    goods and services, then move proceeds through intermediaries, mixers and exchanges to reach fiat.
    Customers also fund purchases through regulated platforms. Indicators appear in blockchain exposure,
    funnelling behaviour and cash-out patterns.
  exposure:
    channels:
    - online_platform
    - digital_onboarding
    payment_rails:
    - crypto_onramp_offramp
    - stored_value_wallet
    customer_segments:
    - retail
    products:
    - crypto_custody
    - transaction_account
    basis: ai_inferred
    rationale: Darknet vendors and buyers fund and cash out through crypto platforms and P2P sellers,
      with Tor/burner-based onboarding and gift-card/prepaid cash-out.
  stage:
  - placement
  - layering
  sectors:
  - crypto
  - fintech
  - payments
  sources:
  - 'FATF, Virtual Assets: Red Flag Indicators of Money Laundering and Terrorist Financing (2020) <https://www.fatf-gafi.org/content/fatf-gafi/en/publications/Methodsandtrends/Virtual-assets-red-flag-indicators.html>
    [agent-reviewed]'
  - FATF, Updated Guidance for a Risk-Based Approach to Virtual Assets and Virtual Asset Service Providers
    (2021) [unverified]
  - FinCEN, Advisory on Illicit Activity Involving Convertible Virtual Currency (FIN-2019-A003, 2019)
    [unverified]
  - Europol, Internet Organised Crime Threat Assessment (IOCTA) (annual; specify edition year) [replacement
    suggested, unverified]
  indicators:
  - ref: IND-TYP-004
    legacy_id: CY-DARKNET-001
    context: Customer deposits or withdrawals have direct or near-direct exposure to addresses attributed
      to darknet markets or their escrow wallets.
    false_positive_context: Exposure through very diluted chains; researchers and journalists.
    controls:
    - CTL-145
    - CTL-029
    - CTL-093
  - ref: IND-TXN-046
    legacy_id: CY-DARKNET-002
    context: Repeated low-value withdrawals to wallets clustering with market deposit infrastructure,
      consistent with buyer activity.
    false_positive_context: False cluster attribution.
    controls:
    - CTL-145
    - CTL-037
    - CTL-093
  - ref: IND-TXN-004
    legacy_id: CY-DARKNET-003
    context: Account receives numerous small transfers from unconnected wallets then consolidates and
      sends onward in large amounts.
    name_in_typology: Vendor-style inflows from many unrelated senders
    false_positive_context: Merchants, creators and fundraisers accepting crypto.
    controls:
    - CTL-145
    - CTL-048
    - CTL-037
  - ref: IND-TYP-005
    legacy_id: CY-DARKNET-004
    context: Funds from market clusters pass through mixers or privacy coins before arriving at the platform.
    name_in_typology: Use of privacy tools between market exposure and exchange deposit
    false_positive_context: Genuine privacy preference.
    controls:
    - CTL-145
    - CTL-029
    - CTL-093
  - ref: IND-BEH-042
    legacy_id: CY-DARKNET-005
    context: Use of Tor, disposable email, burner phones and rotated devices alongside high-volume trading.
    false_positive_context: Privacy-minded customers.
    controls:
    - CTL-091
    - CTL-092
    - CTL-004
  - ref: IND-CPT-008
    legacy_id: CY-DARKNET-006
    context: Proceeds are routed to several accounts sharing devices or beneficiaries and cashed out in
      fiat by different parties.
    false_positive_context: Family members sharing devices.
    controls:
    - CTL-048
    - CTL-004
    - CTL-093
  - ref: IND-CUS-002
    legacy_id: CY-DARKNET-007
    context: Large virtual asset turnover for a customer who declared minimal income or no source of wealth.
    name_in_typology: Income level unsupported by declared profile
    false_positive_context: Gifts, inheritances and capital gains.
    controls:
    - CTL-012
    - CTL-023
    - CTL-037
  - ref: IND-TYP-006
    legacy_id: CY-DARKNET-008
    context: Card and bank transactions to shipping supplies and anonymous mailbox services coincide with
      virtual asset sales or purchases.
    false_positive_context: Online sellers and small businesses.
    controls:
    - CTL-093
    - CTL-171
    - CTL-083
  - ref: IND-PRD-022
    legacy_id: CY-DARKNET-009
    context: Fiat-conversion occurs through informal P2P sellers paid by cash deposit or gift cards soon
      after receiving crypto.
    false_positive_context: Legitimate P2P use in underbanked regions.
    controls:
    - CTL-037
    - CTL-145
    - CTL-093
  - ref: IND-TYP-007
    legacy_id: CY-DARKNET-010
    context: Third-party intelligence links the customer or addresses to marketplace activity.
    false_positive_context: Reporting errors or name matches.
    controls:
    - CTL-083
    - CTL-093
    - CTL-103
