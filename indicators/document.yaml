indicators:
- id: IND-DOC-001
  name: Vague invoices for unspecified services
  description: Invoices describe 'consulting', 'marketing support' or 'liaison services' without deliverables,
    timesheets or reports.
  category: document
  severity: medium
  detection_type:
  - document_review
  - investigator_judgement
  data_sources:
  - invoices
  - contracts
  false_positive_notes: Early-stage or informal advisers may keep thin paperwork.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-DOC-002
  name: Frequent contract variations or change orders
  description: Scope and price rise significantly through repeated amendments shortly after award.
  category: document
  severity: medium
  detection_type:
  - document_review
  - investigator_judgement
  data_sources:
  - contract_amendments
  false_positive_notes: Genuine scope changes are common in construction and IT.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-DOC-003
  name: Emergency or single-source award with weak justification
  description: Use of urgency or sole-source exceptions for non-urgent purchases.
  category: document
  severity: medium
  detection_type:
  - document_review
  data_sources:
  - procurement_records
  false_positive_notes: Real emergencies exist and justify fast awards.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-DOC-004
  name: Remote onboarding with weak verification
  description: Onboarding relies on a single image or unverified selfie, with no database check.
  category: document
  severity: high
  detection_type:
  - kyc_review
  data_sources:
  - onboarding_logs
  false_positive_notes: Quality devices vary.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-DOC-005
  name: Identity document tampering or forensic failure
  description: Identity document or selfie shows alteration, font or layout anomalies, or fails security-feature
    or forensic checks (including deepfake or injection artefacts).
  category: document
  severity: high
  detection_type:
  - document_review
  data_sources:
  - id_documents
  - id_images
  false_positive_notes: Worn or poorly scanned genuine documents can fail checks.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-DOC-006
  name: Inconsistent personal details across documents or sources
  description: Names, dates of birth, addresses or national ID numbers differ between documents, bureaux
    or the application.
  category: document
  severity: high
  detection_type:
  - document_review
  - kyc_review
  data_sources:
  - id_documents
  - application_data
  - bureau_data
  false_positive_notes: Transliteration, marriage name changes and typos are common.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-DOC-007
  name: Fictitious or unverifiable address
  description: Address does not exist, is a mail drop, or fails verification against authoritative data.
  category: document
  severity: medium
  detection_type:
  - kyc_review
  data_sources:
  - address_data
  false_positive_notes: New builds and rural addresses may not be in databases.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-DOC-008
  name: Shared identifiers across unrelated customers
  description: Same phone, email, address, device or ID number appears across multiple unrelated customers
    or users.
  category: document
  severity: high
  detection_type:
  - kyc_review
  - transaction_monitoring
  data_sources:
  - customer_master
  - device_data
  - kiosk_logs
  - id_documents
  false_positive_notes: Families and shared households legitimately share details.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-DOC-009
  name: Synthetic identity with thin or newly created footprint
  description: Thin or recently created credit and digital footprint, with mixed attributes suggesting
    a fabricated identity.
  category: document
  severity: high
  detection_type:
  - kyc_review
  data_sources:
  - bureau_data
  - digital_footprint
  - identity_bureaus
  false_positive_notes: Young or recently arrived people have thin files.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-DOC-010
  name: Documents or images reused or templated across applicants
  description: Same document image, selfie, template, font or background appears across different applicants
    or after rejection.
  category: document
  severity: high
  detection_type:
  - document_review
  data_sources:
  - document_images
  - onboarding_images
  false_positive_notes: Resubmission after a poor-quality upload is legitimate.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-DOC-011
