typology:
  id: ML-BULKCASH
  name: Cash Couriers and Bulk Cash Smuggling
  domain: money_laundering
  description: Physical movement of banknotes across borders or within a country, by couriers, vehicles,
    freight, mail or hidden in goods, to place proceeds in or move them to jurisdictions with weak controls.
    Flows may reappear as deposits, exchange house transactions or trade.
  stage:
  - placement
  - layering
  sectors:
  - banking
  - mvts
  - dnfbp
  sources:
  - FATF, Money Laundering through the Physical Transportation of Cash (2015)
  - FATF, Best Practices on Cross-Border Declaration and Disclosure (general)
  - 'FATF, Cash Couriers: Interpretive Note to Recommendation 32 (general)'
  indicators:
  - ref: IND-TXN-098
    legacy_id: ML-BULKCASH-001
    context: Discrepancies between declared and found cash or declarations lacking purpose.
    false_positive_context: Honest errors.
    controls:
    - CTL-063
    - CTL-097
  - ref: IND-TXN-099
    legacy_id: ML-BULKCASH-002
    context: Deposits follow trips to cash-prone jurisdictions.
    false_positive_context: Tourism earnings.
    controls:
    - CTL-063
    - CTL-012
  - ref: IND-PRD-041
    legacy_id: ML-BULKCASH-003
    context: Large foreign notes exchanged or deposited.
    false_positive_context: Travellers.
    controls:
    - CTL-063
  - ref: IND-TYP-029
    legacy_id: ML-BULKCASH-004
    context: Cash found hidden in goods, freight or mail.
    false_positive_context: Rare.
    controls:
    - CTL-063
    - CTL-062
    - CTL-064
  - ref: IND-CUS-036
    legacy_id: ML-BULKCASH-005
    context: Cash collected or delivered without commercial need.
    false_positive_context: Genuine retail.
    controls:
    - CTL-064
  - ref: IND-PRD-042
    legacy_id: ML-BULKCASH-006
    context: Cash used to buy portable assets for transport.
    false_positive_context: Normal retail.
    controls:
    - CTL-062
  - ref: IND-GEO-013
    legacy_id: ML-BULKCASH-007
    context: Frequent deposits near borders with matching cross-border transfers.
    name_in_typology: Account holders in border regions with cross-border flows
    false_positive_context: Cross-border workers.
    controls:
    - CTL-045
    - CTL-023
  - ref: IND-BEH-003
    legacy_id: ML-BULKCASH-008
    context: Gives inconsistent accounts or refuses declarations.
    name_in_typology: Customer or courier evasive about cash origin
    false_positive_context: Nervous.
    controls:
    - CTL-098
    - CTL-062
