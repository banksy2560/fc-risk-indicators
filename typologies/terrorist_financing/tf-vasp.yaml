typology:
  id: TF-VASP
  name: Virtual Assets for Terrorist Financing
  domain: terrorist_financing
  description: Terrorist supporters may solicit and move small to moderate amounts through virtual assets,
    using self-hosted wallets, privacy-enhanced assets, mixers or decentralised services. Risks are driven
    by pseudonymity and cross-border speed, balanced against traceability on public blockchains.
  sectors:
  - crypto
  - fintech
  - banking
  sources:
  - 'FATF, Virtual Assets: Targeted Update on Implementation of the FATF Standards (annual, 2019 onward)'
  - FATF, Updated Guidance for a Risk-Based Approach to Virtual Assets and Virtual Asset Service Providers
    (2021)
  - FATF, Emerging Terrorist Financing Risks (2015)
  indicators:
  - ref: IND-CPT-050
    legacy_id: TF-VASP-001
    context: On-chain analytics link counterparty addresses to published designations or documented fundraising
      campaigns.
    name_in_typology: Deposits from or withdrawals to wallets attributed to terrorist fundraising
    false_positive_context: Attribution can be incorrect or outdated; shared services create indirect
      exposure.
    controls:
    - CTL-145
    - CTL-147
    - CTL-103
  - ref: IND-TXN-005
    legacy_id: TF-VASP-002
    context: Frequent low-value outbound transfers to different external wallets after small incoming
      crowd-sourced payments.
    name_in_typology: Retail users with repeated small transfers to many new addresses
    false_positive_context: Tipping, gaming and DeFi use produce similar patterns.
    controls:
    - CTL-041
    - CTL-146
  - ref: IND-PRD-056
    legacy_id: TF-VASP-003
    context: Conversion to privacy-enhanced assets or routing through mixers, paired with geographic indicators.
    name_in_typology: Use of privacy coins or mixing services with higher-risk geographies
    false_positive_context: Privacy preference is lawful for many users.
    controls:
    - CTL-147
    - CTL-162
  - ref: IND-GEO-034
    legacy_id: TF-VASP-004
    context: IP or device signals suggest access from conflict-adjacent regions while KYC indicates elsewhere.
    false_positive_context: Travel, expatriates and VPNs cause mismatches.
    controls:
    - CTL-092
    - CTL-073
  - ref: IND-TYP-060
    legacy_id: TF-VASP-005
    context: Publicly advertised wallet addresses appear in extremist channels or campaigns.
    false_positive_context: Open-source attribution may be unreliable.
    controls:
    - CTL-145
    - CTL-097
  - ref: IND-TXN-155
    legacy_id: TF-VASP-006
    context: Funds are converted and cashed out using unregulated peer-to-peer exchanges.
    false_positive_context: P2P trading is a common legitimate on-ramp in some regions.
    controls:
    - CTL-040
    - CTL-072
  - ref: IND-CUS-009
    legacy_id: TF-VASP-007
    context: Multiple accounts opened with synthetic or inconsistent identity data from common devices.
    name_in_typology: Onboarding with weak identity evidence and shared devices
    false_positive_context: Households and shared devices are common.
    controls:
    - CTL-090
    - CTL-027
  - ref: IND-TXN-156
    legacy_id: TF-VASP-008
    context: Large first deposits from unhosted wallets with no history, followed by immediate transfers
      out.
    false_positive_context: Users migrating between platforms behave this way.
    controls:
    - CTL-148
    - CTL-040
