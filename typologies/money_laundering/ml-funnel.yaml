typology:
  id: ML-FUNNEL
  name: Funnel Accounts
  domain: money_laundering
  description: Accounts that collect deposits from many locations, often in different geographic areas,
    and funnel the money onward, frequently to another jurisdiction, so as to avoid direct links with
    the criminal source. They are commonly used in drug trafficking and fraud cash networks.
  stage:
  - placement
  - layering
  sectors:
  - banking
  - payments
  sources:
  - FATF, Money Laundering through the Physical Transportation of Cash (2015) <https://www.fatf-gafi.org/en/publications/Methodsandtrends/money-laundering-through-physical-transportation-of-cash.html>
    [agent-reviewed]
  - FFIEC, BSA/AML Examination Manual (FinCEN is not publisher) <https://bsaaml.ffiec.gov/manual> [corrected,
    agent-reviewed]
  indicators:
  - ref: IND-GEO-014
    legacy_id: ML-FUNNEL-001
    context: Account receives cash deposits across geographically distant locations from the account holder's
      home area.
    false_positive_context: Travelling customers and national businesses.
    controls:
    - CTL-045
    - CTL-064
    - CTL-041
  - ref: IND-TXN-030
    legacy_id: ML-FUNNEL-002
    context: Funds credited in one area are withdrawn quickly elsewhere, often by ATM.
    name_in_typology: Rapid withdrawals following deposits in different location
    severity_in_typology: high
    false_positive_context: Remote workers or family support.
    controls:
    - CTL-045
    - CTL-103
  - ref: IND-BEH-090
    legacy_id: ML-FUNNEL-003
    context: No salary, bills, or everyday spending, only deposits and withdrawals.
    false_positive_context: New or secondary accounts have limited use.
    controls:
    - CTL-051
    - CTL-011
  - ref: IND-CUS-037
    legacy_id: ML-FUNNEL-004
    context: Account holder profile shows no business or family ties in places where deposits occur.
    false_positive_context: Customers may be mobile or have remote clients.
    controls:
    - CTL-042
    - CTL-022
  - ref: IND-CPT-035
    legacy_id: ML-FUNNEL-005
    context: Numerous third parties deposit into one account, sometimes with slips or reference.
    name_in_typology: Multiple unrelated depositors to same account
    false_positive_context: Collections and community groups.
    controls:
    - CTL-041
    - CTL-046
  - ref: IND-GEO-015
    legacy_id: ML-FUNNEL-006
    context: Aggregated funds are wired or sent through remittance to foreign jurisdictions.
    false_positive_context: International students and migrants send funds abroad.
    controls:
    - CTL-040
    - CTL-023
  - ref: IND-CUS-038
    legacy_id: ML-FUNNEL-007
    context: Account holders include students, unemployed people or newcomers sharing similar addresses.
    false_positive_context: Vulnerable groups legitimately bank.
    controls:
    - CTL-049
    - CTL-048
  - ref: IND-PRD-045
    legacy_id: ML-FUNNEL-008
    context: Debit cards or deposit tokens shared or sent to others to deposit.
    false_positive_context: Family members share cards sometimes.
    controls:
    - CTL-045
    - CTL-072
