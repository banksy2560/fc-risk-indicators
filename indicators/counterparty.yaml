- id: IND-CPT-057
  name: Use of intermediaries who market secrecy
  description: Customer introduced by advisers or promoters advertising confidentiality or tax-free outcomes.
  category: counterparty
  severity: high
  detection_type:
  - investigator_judgement
  - external_intel
  data_sources:
  - kyc_files
  - adverse_media
