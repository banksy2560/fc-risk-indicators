typology:
  id: CY-ATOMULE
  name: Account Takeover and Money Mule Account Networks (Cyber Angle)
  domain: cyber_enabled
  description: Criminals take over legitimate accounts through phishing, malware, credential stuffing
    and SIM swaps, or recruit and trick people into acting as money mules, in order to receive and move
    proceeds of cyber-enabled fraud. Networks of mule accounts layer funds quickly to cash-out channels,
    often across institutions.
  exposure:
    channels:
    - online_banking
    - mobile_app
    payment_rails:
    - fast_payments
    - cash
    customer_segments:
    - retail
    - student_youth
    - vulnerable_elderly
    - new_to_bank
    products:
    - transaction_account
    basis: ai_inferred
    rationale: Account takeover and mule accounts moving scam proceeds quickly to cash-out.
  stage:
  - layering
  sectors:
  - banking
  - payments
  - fintech
  sources:
  - FinCEN, Advisory to Financial Institutions on Cyber-Events and Cyber-Enabled Crime (FIN-2016-A005,
    2016) [unverified]
  - FATF, Illicit Financial Flows from Cyber-Enabled Fraud (2023) [unverified]
  - Europol, European Money Mule Action (EMMA) press releases (annual editions, e.g. EMMA 9, 2023) [replacement
    suggested, unverified]
  indicators:
  - ref: IND-BEH-011
    legacy_id: CY-ATOMULE-001
    context: Password, email or phone change then new payee and payment in the same session or day.
    name_in_typology: Credential, device or contact detail change followed by payments
    false_positive_context: Customer changing devices.
    controls:
    - CTL-073
    - CTL-091
    - CTL-037
  - ref: IND-BEH-007
    legacy_id: CY-ATOMULE-002
    context: Session uses remote-desktop or screen-sharing applications at payment time.
    name_in_typology: Login from new device with remote-access tooling
    false_positive_context: IT support use.
    controls:
    - CTL-091
    - CTL-073
    - CTL-068
  - ref: IND-BEH-009
    legacy_id: CY-ATOMULE-003
    context: Credential stuffing pattern with later successful access.
    name_in_typology: Many failed logins across accounts from one source
    false_positive_context: Shared NAT.
    controls:
    - CTL-091
    - CTL-092
    - CTL-083
  - ref: IND-TXN-001
    legacy_id: CY-ATOMULE-004
    context: Pass-through behaviour with minimal retained balance.
    name_in_typology: Inbound funds quickly forwarded out in near-equal amounts
    false_positive_context: Business pass-through.
    controls:
    - CTL-051
    - CTL-037
    - CTL-048
  - ref: IND-TXN-003
    legacy_id: CY-ATOMULE-005
    context: New account collects scam receipts from varied sources.
    name_in_typology: Recently opened account receiving payments from multiple unrelated victims
    false_positive_context: Marketplace sellers.
    controls:
    - CTL-051
    - CTL-048
    - CTL-093
  - ref: IND-CUS-002
    legacy_id: CY-ATOMULE-006
    context: Student, pensioner or unemployed customer processes large flows.
    name_in_typology: Account holder profile mismatches activity
    false_positive_context: Gifts and benefits.
    controls:
    - CTL-023
    - CTL-051
    - CTL-093
  - ref: IND-CPT-006
    legacy_id: CY-ATOMULE-007
    context: Funds sent to exchanges, gift-card merchants or remittance providers immediately.
    false_positive_context: Active traders.
    controls:
    - CTL-037
    - CTL-145
    - CTL-069
  - ref: IND-CPT-007
    legacy_id: CY-ATOMULE-008
    context: Graph shows many accounts paying the same ultimate beneficiary.
    false_positive_context: Landlord or merchant.
    controls:
    - CTL-048
    - CTL-051
    - CTL-083
  - ref: IND-DOC-014
    legacy_id: CY-ATOMULE-009
    context: Names mismatch or accounts recently created for the payee.
    false_positive_context: Trading names.
    controls:
    - CTL-069
    - CTL-068
    - CTL-037
  - ref: IND-BEH-041
    legacy_id: CY-ATOMULE-010
    context: Customer describes job ads asking to receive and forward funds.
    false_positive_context: Genuine payment-agent roles.
    controls:
    - CTL-068
    - CTL-171
    - CTL-083
