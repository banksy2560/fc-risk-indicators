typology:
  id: CY-UNHOSTED
  name: Unhosted Wallets and Peer-to-Peer Exchange Abuse
  domain: cyber_enabled
  description: 'Value moves between self-custodied wallets and informal P2P sellers outside regulated
    intermediaries, limiting identity information and supervision. Offenders use these channels to receive,
    hold and exchange illicit funds. Regulated platforms see the risk at the edges: transfers to or from
    unhosted wallets and P2P advertisers.'
  stage:
  - placement
  - layering
  sectors:
  - crypto
  - fintech
  sources:
  - 'FATF, Virtual Assets: Red Flag Indicators of Money Laundering and Terrorist Financing (2020) <https://www.fatf-gafi.org/content/fatf-gafi/en/publications/Methodsandtrends/Virtual-assets-red-flag-indicators.html>
    [agent-reviewed]'
  - FATF, Updated Guidance for a Risk-Based Approach to Virtual Assets and Virtual Asset Service Providers
    (2021) [unverified]
  - FATF, Targeted Update on Implementation of the FATF Standards on Virtual Assets and Virtual Asset
    Service Providers (specify year, annual since 2020) [replacement suggested, unverified]
  indicators:
  - ref: IND-TXN-056
    legacy_id: CY-UNHOSTED-001
    context: High-value transfers involve self-hosted addresses where the customer has not demonstrated
      control.
    false_positive_context: Customers who self-custody for security.
    controls:
    - CTL-146
    - CTL-145
    - CTL-023
  - ref: IND-TYP-020
    legacy_id: CY-UNHOSTED-002
    context: Self-hosted address has prior exposure to illicit services, scams or sanctioned addresses.
    false_positive_context: Inherited exposure from dusting.
    controls:
    - CTL-145
    - CTL-029
    - CTL-103
  - ref: IND-TYP-001
    legacy_id: CY-UNHOSTED-003
    context: Same external address is whitelisted by several unrelated customers.
    name_in_typology: Wallet shared across multiple customer accounts
    false_positive_context: Shared family or corporate wallets.
    controls:
    - CTL-048
    - CTL-004
    - CTL-093
  - ref: IND-CUS-024
    legacy_id: CY-UNHOSTED-004
    context: Seller trades large volume with numerous buyers across payment methods and accounts, resembling
      unlicensed money transmission.
    false_positive_context: Registered small traders.
    controls:
    - CTL-037
    - CTL-048
    - CTL-023
  - ref: IND-TXN-057
    legacy_id: CY-UNHOSTED-005
    context: Buyers pay from accounts not in the buyer's name, or sellers receive from unknown payers.
    false_positive_context: Family-funded purchases.
    controls:
    - CTL-069
    - CTL-051
    - CTL-093
  - ref: IND-TXN-030
    legacy_id: CY-UNHOSTED-006
    context: Fiat deposits are converted and sent to external wallets within minutes, leaving no balance.
    name_in_typology: Rapid cash-in then withdrawal to unhosted wallet
    false_positive_context: Customers who dislike custodial risk.
    controls:
    - CTL-037
    - CTL-072
    - CTL-145
  - ref: IND-BEH-053
    legacy_id: CY-UNHOSTED-007
    context: Refusal to sign a message, microtransaction or provide proof of control when requested.
    false_positive_context: Technical difficulty.
    controls:
    - CTL-146
    - CTL-023
    - CTL-093
  - ref: IND-GEO-018
    legacy_id: CY-UNHOSTED-008
    context: Trades routed through P2P markets in jurisdictions lacking VASP supervision.
    name_in_typology: Use of non-compliant jurisdictions' P2P channels
    false_positive_context: Residents in those places.
    controls:
    - CTL-092
    - CTL-149
    - CTL-023
  - ref: IND-TXN-008
    legacy_id: CY-UNHOSTED-009
    context: Multiple transfers sized to remain beneath thresholds that trigger data collection or review.
    name_in_typology: Transfers just under reporting or travel-rule thresholds
    false_positive_context: Pricing tiers or budget limits.
    controls:
    - CTL-037
    - CTL-146
    - CTL-093
  - ref: IND-BEH-054
    legacy_id: CY-UNHOSTED-010
    context: Customer explanations indicate trades arranged through messaging apps rather than regulated
      venues, with irregular settlement.
    false_positive_context: Common in some communities.
    controls:
    - CTL-023
    - CTL-171
    - CTL-093
