typology:
  id: OP-EXTORT
  name: Organised Crime Extortion and Loan-Sharking
  domain: other_predicate
  description: Coercive collection of 'protection' money or repayments on high-interest illegal loans
    by organised crime groups, usually from small businesses and vulnerable individuals. Victims often
    show regular payments that do not match any invoice or service, sometimes via third parties or cash.
  exposure:
    channels:
    - branch
    - online_banking
    payment_rails:
    - cash
    - fast_payments
    - loan_disbursement
    customer_segments:
    - sme
    - vulnerable_elderly
    - sole_trader
    products:
    - transaction_account
    basis: ai_inferred
    rationale: Regular unexplained payments and cash withdrawals by small businesses/vulnerable victims.
    consumer:
      relevant: true
      products:
      - transaction_account
      - savings_account
      - personal_loan
      channels:
      - branch
      - call_centre
      - mobile_app
      - online_banking
      basis: ai_inferred
      rationale: Victims pay protection or loan-shark money from personal accounts, with coerced cash
        withdrawals, accompanied visits and collector accounts; personal loans taken to pay.
  sectors:
  - banking
  - payments
  - mvts
  sources:
  - FATF, Professional Money Laundering (2018) [unverified]
  - UN Convention against Transnational Organized Crime (2000) [unverified]
  - UNODC, public material on organised crime and extortion [replacement suggested, unverified]
  - Europol, European Union Serious and Organised Crime Threat Assessment (EU SOCTA) (specify year, e.g.
    2021 or 2025) [corrected, unverified]
  indicators:
  - ref: IND-TXN-123
    legacy_id: OP-EXTORT-001
    context: Payments at regular intervals to a person or company with no service provided.
    false_positive_context: Rent and retainers also recur.
    controls:
    - CTL-042
    - CTL-100
  - ref: IND-BEH-102
    legacy_id: OP-EXTORT-002
    context: Customer withdraws cash and appears distressed or accompanied.
    false_positive_context: Cash needs are varied.
    controls:
    - CTL-170
    - CTL-100
  - ref: IND-TXN-124
    legacy_id: OP-EXTORT-003
    context: Repeated payments with high effective interest rates and rollovers.
    false_positive_context: Family loans are legit.
    controls:
    - CTL-052
    - CTL-100
  - ref: IND-CUS-006
    legacy_id: OP-EXTORT-004
    context: Single account collects from many businesses in a locality.
    name_in_typology: Collector accounts receiving many payments from unrelated small payers
    false_positive_context: Landlords and associations collect.
    controls:
    - CTL-041
    - CTL-051
    - CTL-037
  - ref: IND-GEO-023
    legacy_id: OP-EXTORT-005
    context: Sector-wide complaints in area linked to payments.
    false_positive_context: Economic downturns also close firms.
    controls:
    - CTL-097
    - CTL-052
  - ref: IND-BEH-103
    legacy_id: OP-EXTORT-006
    context: Cash picked up by runners; multiple deposits by apparent intermediaries.
    false_positive_context: Cash-in-transit firms exist.
    controls:
    - CTL-063
    - CTL-038
  - ref: IND-CPT-059
    legacy_id: OP-EXTORT-007
    context: Counterparties in adverse media or law enforcement intelligence.
    name_in_typology: Associates linked to known organised crime groups
    false_positive_context: Namesakes occur.
    controls:
    - CTL-029
    - CTL-095
  - ref: IND-DOC-051
    legacy_id: OP-EXTORT-008
    context: Businesses pay inflated invoices to specific suppliers.
    false_positive_context: Preferred suppliers exist.
    controls:
    - CTL-124
    - CTL-005
