typology:
  id: ML-CORRBANK
  name: Correspondent and Nested Banking
  domain: money_laundering
  description: Abuse of correspondent banking relationships, including nested or downstream use of a respondent's
    account by other institutions, to move illicit funds across borders with limited visibility of the
    underlying customers and purposes. Payable-through accounts and shell bank links add risk.
  exposure:
    channels:
    - api_open_banking
    payment_rails:
    - wire_swift
    - cross_border_remittance
    customer_segments:
    - fintech_psp
    - corporate
    products:
    - correspondent_account
    basis: ai_inferred
    rationale: Respondent and nested bank/PSP flows via correspondent accounts over SWIFT.
    consumer:
      relevant: false
      products: []
      channels: []
      basis: ai_inferred
      rationale: Correspondent and nested banking is an interbank relationship with no retail product
        or channel.
  stage:
  - layering
  sectors:
  - banking
  sources:
  - FATF, Guidance on Correspondent Banking Services (2016) [unverified]
  - Wolfsberg Group, Correspondent Banking Due Diligence Questionnaire (CBDDQ) (current version, specify
    year) <https://wolfsberg-group.org/> [corrected, agent-reviewed]
  - 'Basel Committee on Banking Supervision, Guidelines: Sound management of risks related to money laundering
    and financing of terrorism (2014, rev. 2020) <https://www.bis.org/bcbs/publ/d505.htm> [corrected,
    agent-reviewed]'
  indicators:
  - ref: IND-CPT-034
    legacy_id: ML-CORRBANK-001
    context: Respondent provides access to its account for other banks or payment firms (nesting) without
      disclosure.
    false_positive_context: Group and agency arrangements are disclosed normally.
    controls:
    - CTL-105
    - CTL-104
    - CTL-106
  - ref: IND-GEO-018
    legacy_id: ML-CORRBANK-002
    context: Respondent operates where regulation or supervision is weak.
    name_in_typology: Respondent based in high-risk jurisdiction with weak AML supervision
    severity_in_typology: high
    false_positive_context: Large regional banks in higher-risk countries serve real trade.
    controls:
    - CTL-104
    - CTL-025
  - ref: IND-TXN-104
    legacy_id: ML-CORRBANK-003
    context: Flows far exceed expected levels for the respondent's balance sheet or footprint.
    false_positive_context: Business growth or new products.
    controls:
    - CTL-106
  - ref: IND-DOC-015
    legacy_id: ML-CORRBANK-004
    context: Messages lack originator or beneficiary data or use unclear references.
    name_in_typology: Missing or poor-quality payment message information
    false_positive_context: Legacy systems and truncation.
    controls:
    - CTL-110
    - CTL-107
  - ref: IND-TXN-105
    legacy_id: ML-CORRBANK-005
    context: Large round-value payments or repeated amounts for multiple unrelated beneficiaries.
    false_positive_context: Settlement batches.
    controls:
    - CTL-044
    - CTL-175
  - ref: IND-BEH-002
    legacy_id: ML-CORRBANK-006
    context: Slow, evasive or incomplete responses to RFIs.
    name_in_typology: Respondent refuses or delays information requests
    false_positive_context: Time-zone and legal confidentiality limits.
    controls:
    - CTL-107
    - CTL-016
    - CTL-023
    - CTL-106
  - ref: IND-OWN-021
    legacy_id: ML-CORRBANK-007
    context: Respondent has relationships with shell or unlicensed institutions.
    false_positive_context: Naming confusion.
    controls:
    - CTL-108
    - CTL-116
  - ref: IND-PRD-017
    legacy_id: ML-CORRBANK-008
    context: Respondent's customers transact directly through the account.
    name_in_typology: Payable-through account use by respondent's customers
    false_positive_context: Intended features of some products.
    controls:
    - CTL-109
    - CTL-104
    - CTL-106
  - ref: IND-CPT-059
    legacy_id: ML-CORRBANK-009
    context: Respondent has regulatory action, sanctions or ML scandals.
    name_in_typology: Adverse media or enforcement on respondent
    severity_in_typology: medium
    false_positive_context: Past issues may be remediated.
    controls:
    - CTL-032
    - CTL-106
