typology:
  id: TX-OFFSHORE
  name: Offshore Tax Evasion and Undeclared Accounts
  domain: tax_evasion
  description: Concealment of income and assets from tax authorities through foreign accounts, opaque
    entities, nominee arrangements and cash or asset movements that avoid automatic information exchange.
    Financial institutions see inconsistent tax residency claims, structures with no clear purpose and
    attempts to evade reporting regimes.
  sectors:
  - banking
  - securities
  - insurance
  - corporate_services
  - dnfbp
  sources:
  - FATF, Money Laundering from Tax Crimes (2021)
  - 'OECD, Standard for Automatic Exchange of Financial Account Information: Common Reporting Standard'
  - OECD, Model Mandatory Disclosure Rules for CRS Avoidance Arrangements and Opaque Offshore Structures
    (2018)
  - FATF and OECD, Money Laundering Awareness Handbook for Tax Examiners and Tax Auditors (2012)
  indicators:
  - ref: IND-CUS-051
    legacy_id: TX-OFFSHORE-001
    context: Customer self-certifies residence in one jurisdiction while mailing address, phone, spending
      or travel point to another.
    false_positive_context: Expatriates and frequent travellers may have complex but genuine residency.
    controls:
    - CTL-066
    - CTL-014
  - ref: IND-BEH-109
    legacy_id: TX-OFFSHORE-002
    context: Customer asks for hold-mail, numbered accounts or avoids providing tax identification numbers.
    false_positive_context: Privacy or security concerns can motivate such requests.
    controls:
    - CTL-066
    - CTL-170
  - ref: IND-TXN-139
    legacy_id: TX-OFFSHORE-003
    context: Customer deposits foreign-sourced cash or cheques or receives funds from unrelated individuals,
      avoiding visible foreign accounts.
    false_positive_context: Gifts and family support can cause third-party transfers.
    controls:
    - CTL-012
    - CTL-046
  - ref: IND-OWN-004
    legacy_id: TX-OFFSHORE-004
    context: Passive entity in a low-transparency jurisdiction holds the customer's investments, property
      or accounts.
    name_in_typology: Shell company or foundation with no commercial purpose holding personal assets
    false_positive_context: Entities can serve estate planning or asset protection legitimately.
    controls:
    - CTL-008
    - CTL-066
  - ref: IND-OWN-001
    legacy_id: TX-OFFSHORE-005
    context: Entity officers appear to be professional nominees with no real decision-making role.
    severity_in_typology: medium
    false_positive_context: Nominees are lawful in some jurisdictions for privacy.
    controls:
    - CTL-007
    - CTL-142
  - ref: IND-GEO-035
    legacy_id: TX-OFFSHORE-006
    context: Funds shifted to non-participating or low-transparency jurisdictions around the introduction
      of reporting obligations or voluntary-disclosure windows.
    false_positive_context: Business or investment reasons may exist for moves.
    controls:
    - CTL-045
    - CTL-166
  - ref: IND-PRD-060
    legacy_id: TX-OFFSHORE-007
    context: Customer borrows locally but repays from or secured on foreign undeclared accounts, or uses
      offshore-issued cards for domestic spend.
    false_positive_context: Foreign-currency collateral lending is common in private banking.
    controls:
    - CTL-151
    - CTL-045
  - ref: IND-CPT-057
    legacy_id: TX-OFFSHORE-008
    context: Customer introduced by advisers or promoters advertising confidentiality or tax-free outcomes.
    false_positive_context: Wealth advisers legitimately offer privacy and tax planning within the law.
    controls:
    - CTL-019
    - CTL-032
