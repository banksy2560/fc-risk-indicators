typology:
  id: EC-CARBON
  name: Carbon-Credit Fraud
  domain: environmental_crime
  description: Fraudulent creation, sale or claiming of carbon credits and emissions allowances, including
    double counting, non-existent projects, inflated baselines, VAT fraud on allowance trading and misleading
    offset claims. Fraud harms climate goals and investors.
  sectors:
  - banking
  - securities
  - crypto
  - corporate_services
  - payments
  sources:
  - FATF, Money Laundering from Environmental Crime (2021) <https://www.fatf-gafi.org/content/fatf-gafi/en/publications/Environmentalcrime/Money-laundering-from-environmental-crime.html>
    [agent-reviewed]
  - Integrity Council for the Voluntary Carbon Market, Core Carbon Principles (2023) <https://icvcm.org/the-core-carbon-principles/>
    [agent-reviewed]
  - Europol, public material on emissions trading fraud [too vague, unverified]
  - 'IOSCO, Voluntary Carbon Markets: Final Report (2024) <https://www.iosco.org/library/pubdocs/pdf/IOSCOPD774.pdf>
    [agent-reviewed]'
  indicators:
  - ref: IND-DOC-018
    legacy_id: EC-CARBON-001
    context: Credits sold from a project with no registry listing, uncertified verifier or conflicting
      documents.
    false_positive_context: New projects may still be in registration.
    controls:
    - CTL-144
    - CTL-138
    - CTL-128
  - ref: IND-TXN-058
    legacy_id: EC-CARBON-002
    context: Serial numbers appear in more than one transaction or after retirement.
    false_positive_context: Registry timing issues can show duplicate records.
    controls:
    - CTL-144
    - CTL-087
    - CTL-142
  - ref: IND-TXN-020
    legacy_id: EC-CARBON-003
    context: Offers significantly diverge from benchmark prices for the project type.
    name_in_typology: Credits priced far below or above market with no quality basis
    severity_in_typology: medium
    false_positive_context: Quality and vintage cause price variation.
    controls:
    - CTL-124
    - CTL-144
  - ref: IND-CPT-016
    legacy_id: EC-CARBON-004
    context: New broker promises guaranteed returns or urgent allocation.
    false_positive_context: Start-ups can be genuine.
    controls:
    - CTL-112
    - CTL-032
  - ref: IND-TXN-015
    legacy_id: EC-CARBON-005
    context: Allowances bought and sold quickly among connected firms across borders with VAT unpaid.
    name_in_typology: Round-trip trading and VAT fraud in allowance markets
    false_positive_context: Active traders turn over positions fast.
    controls:
    - CTL-047
    - CTL-065
  - ref: IND-GEO-002
    legacy_id: EC-CARBON-006
    context: Payments to developers in remote regions without site evidence.
    false_positive_context: Rural projects have limited footprint.
    controls:
    - CTL-138
    - CTL-024
  - ref: IND-TYP-021
    legacy_id: EC-CARBON-007
    context: Reduction claims implausible versus public data or comparable projects.
    false_positive_context: Methodologies are technical and contested.
    controls:
    - CTL-144
    - CTL-032
  - ref: IND-BEH-055
    legacy_id: EC-CARBON-008
    context: Companies or traders claim offsets via documents that do not match retirement records.
    false_positive_context: Delays between retirement and posting occur.
    controls:
    - CTL-144
    - CTL-167
