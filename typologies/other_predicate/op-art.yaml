typology:
  id: OP-ART
  name: Art and Antiquities Trafficking
  domain: other_predicate
  description: Looting, theft, forgery and illicit trade of cultural property, and use of art as a store
    of value to launder funds. Opaque transactions, free ports, falsified provenance and anonymous buyers
    are common features.
  exposure:
    channels:
    - face_to_face_professional
    - broker_intermediary
    payment_rails:
    - wire_swift
    - cash
    customer_segments:
    - regulated_nonbank_dnfbp
    - private_wealth
    - pep_related
    - non_resident
    products:
    - real_assets
    - safe_deposit_custody
    basis: ai_inferred
    rationale: Art and antiquities dealers, auction houses and agents settle by wire or cash; artworks
      are stored in free ports or custody and sometimes used as loan collateral.
  sectors:
  - art_luxury
  - banking
  - dnfbp
  sources:
  - FATF, Money Laundering and Terrorist Financing in the Art and Antiquities Market (2023) [unverified]
  - UNESCO, Convention on the Means of Prohibiting and Preventing the Illicit Import, Export and Transfer
    of Ownership of Cultural Property (1970) [unverified]
  - UNIDROIT, Convention on Stolen or Illegally Exported Cultural Objects (1995) [unverified]
  - INTERPOL, Stolen Works of Art Database [replacement suggested, unverified]
  indicators:
  - ref: IND-DOC-049
    legacy_id: OP-ART-001
    context: Missing ownership chain, 1970-era gap or fake certificates.
    false_positive_context: Old works often have gaps.
    controls:
    - CTL-135
    - CTL-141
    - CTL-142
  - ref: IND-TXN-020
    legacy_id: OP-ART-002
    context: Sales at far off valuations or back-to-back trades.
    name_in_typology: Price inconsistent with market or sudden value jumps
    false_positive_context: Valuation of art is subjective.
    controls:
    - CTL-141
    - CTL-047
  - ref: IND-OWN-003
    legacy_id: OP-ART-003
    context: Buyer identity concealed by agents.
    name_in_typology: Anonymous buyers through intermediaries, trusts or shell companies
    false_positive_context: Privacy is normal in collecting.
    controls:
    - CTL-005
    - CTL-112
  - ref: IND-PRD-053
    legacy_id: OP-ART-004
    context: Artworks stored for long without movement.
    name_in_typology: Storage in free ports without display or trade
    false_positive_context: Storage is normal.
    controls:
    - CTL-127
  - ref: IND-TXN-021
    legacy_id: OP-ART-005
    context: Large unusual settlement.
    name_in_typology: Cash or crypto payment for high-value works
    false_positive_context: Some buyers like crypto.
    controls:
    - CTL-062
    - CTL-052
  - ref: IND-GEO-021
    legacy_id: OP-ART-006
    context: Antiquities exported from affected regions with new papers.
    false_positive_context: Legal exports exist.
    controls:
    - CTL-035
    - CTL-134
  - ref: IND-CPT-044
    legacy_id: OP-ART-007
    context: Unknown or suspect dealer.
    false_positive_context: New dealers exist.
    controls:
    - CTL-029
    - CTL-024
  - ref: IND-PRD-054
    legacy_id: OP-ART-008
    context: Loans secured on art with inflated valuations.
    false_positive_context: Art-secured lending is lawful.
    controls:
    - CTL-141
    - CTL-169
