indicators:
- id: IND-GEO-001
  name: Loads immediately followed by foreign ATM withdrawals
  description: Funds are drawn down in cash overseas or in high-risk locations soon after loading.
  category: geographic
  severity: high
  detection_type:
  - transaction_monitoring
  data_sources:
  - card_transactions
  - atm_logs
  false_positive_notes: Travellers.
- id: IND-GEO-002
  name: Funds routed to project developers in high-risk jurisdictions with no activity
  description: Payments to developers in remote regions without site evidence.
  category: geographic
  severity: medium
  detection_type:
  - transaction_monitoring
  - external_intel
  data_sources:
  - payment_records
  - satellite_data
  false_positive_notes: Rural projects have limited footprint.
- id: IND-GEO-003
  name: Port calls in ports of low inspection standards
  description: Frequent landings at ports with weak controls or non-parties to port state measures.
  category: geographic
  severity: medium
  detection_type:
  - external_intel
  - transaction_monitoring
  data_sources:
  - port_data
  false_positive_notes: Ports may be the only option for some fleets.
- id: IND-GEO-004
  name: Origin country is a transit-only processor with no forests
  description: Exports declared from a country with little domestic timber supply, indicating laundering
    of origin.
  category: geographic
  severity: medium
  detection_type:
  - investigator_judgement
  - transaction_monitoring
  data_sources:
  - trade_data
  false_positive_notes: Processing hubs import and re-export timber lawfully.
- id: IND-GEO-005
  name: Operation in or adjacent to protected areas or indigenous lands
  description: Customer's supply is sourced from areas with legal restrictions or conflicts reported.
  category: geographic
  severity: medium
  detection_type:
  - external_intel
  - kyc_review
  data_sources:
  - satellite_data
  - ngo_reports
  false_positive_notes: Boundaries can be disputed.
- id: IND-GEO-006
  name: Armed-group territory or sanctioned parties in conflict areas
  description: Trade, production or payments involve territories controlled by armed groups or parties
    linked to them.
  category: geographic
  severity: high
  detection_type:
  - transaction_monitoring
  - external_intel
  data_sources:
  - trade_data
  - shipping_records
  - external_intelligence
  false_positive_notes: Legitimate suppliers and humanitarian actors operate in affected regions.
- id: IND-GEO-007
  name: Shipments to countries with weak controls and few recycling facilities
  description: Exports to destinations known as dumping sites.
  category: geographic
  severity: medium
  detection_type:
  - external_intel
  - transaction_monitoring
  data_sources:
  - customs_data
  - ngo_reports
  false_positive_notes: Some destinations have lawful recyclers.
- id: IND-GEO-008
  name: Wildlife-related payments between source, transit and consumer countries
  description: Flows between countries known as supply, transit and demand points linked to a small business.
  category: geographic
  severity: medium
  detection_type:
  - transaction_monitoring
  - external_intel
  data_sources:
  - swift_messages
  - payment_records
  false_positive_notes: Legitimate trade also uses these corridors.
- id: IND-GEO-009
  name: Payments to money transfer services overseas
  description: Money services used for ad hoc transfers to unknown beneficiaries.
  category: geographic
  severity: medium
  detection_type:
  - transaction_monitoring
  data_sources:
  - mvts_data
  false_positive_notes: Remittances.
- id: IND-GEO-010
  name: First payment to a new beneficiary in a different jurisdiction
  description: 'Victim-side: payment to a new account, often foreign, unrelated to the supplier''s usual
    country.'
  category: geographic
  severity: high
  detection_type:
  - transaction_monitoring
  data_sources:
  - payment_data
  - vendor_master
  false_positive_notes: New suppliers or overseas expansion.
- id: IND-GEO-011
  name: Address is mail-drop, virtual or shared by many applicants
  description: Multiple unrelated applicants share an address with no occupancy history.
  category: geographic
  severity: medium
  detection_type:
  - kyc_review
  data_sources:
  - address_data
  false_positive_notes: Student halls, care homes.
- id: IND-GEO-012
  name: Suppliers in sectors or regions with high forced-labour risk
  description: Sourcing from sectors such as agriculture, fishing, garments or mining in regions flagged
    by credible reports.
  category: geographic
  severity: medium
  detection_type:
  - external_intel
  - kyc_review
  data_sources:
  - supplier_lists
  - risk_indexes
  false_positive_notes: Most suppliers in these areas comply.
- id: IND-GEO-013
  name: Accounts or flows in border regions with cross-border movement
  description: Accounts in border or transit areas show frequent deposits with matching cross-border transfers
    or rapid withdrawals.
  category: geographic
  severity: medium
  detection_type:
  - transaction_monitoring
  data_sources:
  - transaction_records
  - branch_location_data
  false_positive_notes: Border communities have genuine cross-border trade and family flows.
- id: IND-GEO-014
  name: Cash deposits from many states or regions
  description: Account receives cash deposits across geographically distant locations from the account
    holder's home area.
  category: geographic
  severity: high
  detection_type:
  - transaction_monitoring
  data_sources:
  - transaction_data
  - branch_atm_locations
  false_positive_notes: Travelling customers and national businesses.
- id: IND-GEO-015
  name: Funds sent offshore soon after collection
  description: Aggregated funds are wired or sent through remittance to foreign jurisdictions.
  category: geographic
  severity: high
  detection_type:
  - transaction_monitoring
  - screening
  data_sources:
  - transaction_data
  - wire_data
  false_positive_notes: International students and migrants send funds abroad.
- id: IND-GEO-016
  name: Customer geography far from the professional's practice
  description: No reason to use this adviser.
  category: geographic
  severity: low
  detection_type:
  - kyc_review
  data_sources:
  - client_data
  false_positive_notes: Specialist advice.
- id: IND-GEO-017
  name: Funds return from offshore as foreign investment
  description: Money sent abroad reappears as shareholder investment or loan.
  category: geographic
  severity: high
  detection_type:
  - transaction_monitoring
  - investigator_judgement
  data_sources:
  - wire_data
  false_positive_notes: Real diaspora investment.
- id: IND-GEO-018
  name: Counterparty or flows in higher-risk jurisdictions with weak AML controls
  description: Funds, counterparties or institutions are located in jurisdictions with weak AML supervision,
    sanctions exposure or limited VASP regulation.
  category: geographic
  severity: medium
  detection_type:
  - transaction_monitoring
  - kyc_review
  - screening
  data_sources:
  - transaction_records
  - jurisdiction_risk_ratings
  - customer_profile
  false_positive_notes: Customers with genuine ties to such jurisdictions, such as diaspora remittances
    or aid delivery, produce many alerts.
- id: IND-GEO-019
  name: Payments or activity in jurisdictions unrelated to the customer's business or goods
  description: Payments, counterparties or sales originate in or go to countries with no link to the customer,
    declared business, services or goods.
  category: geographic
  severity: medium
  detection_type:
  - transaction_monitoring
  - kyc_review
  data_sources:
  - transaction_records
  - customer_profile
  - trade_documents
  false_positive_notes: Customers with growing international business or diaspora links may produce this
    pattern legitimately.
- id: IND-GEO-020
  name: Shipping through high-risk transit hubs with changed destinations
  description: Arms shipments change consignee or route.
  category: geographic
  severity: high
  detection_type:
  - document_review
  - external_intel
  data_sources:
  - bills_of_lading
  - tracking_data
  false_positive_notes: Re-routing occurs for lawful cargo.
- id: IND-GEO-021
  name: Objects from conflict zones or countries with looting
  description: Antiquities exported from affected regions with new papers.
  category: geographic
  severity: high
  detection_type:
  - external_intel
  - screening
  data_sources:
  - export_docs
  - ngo_reports
  false_positive_notes: Legal exports exist.
- id: IND-GEO-022
  name: Shipments transiting free zones and repackaged
  description: Goods relabelled in transit hubs.
  category: geographic
  severity: medium
  detection_type:
  - document_review
  - external_intel
  data_sources:
  - customs_data
  false_positive_notes: Transit hubs are legitimate.
- id: IND-GEO-023
  name: Businesses closing or reporting threats alongside payment spikes
  description: Sector-wide complaints in area linked to payments.
  category: geographic
  severity: medium
  detection_type:
  - external_intel
  - investigator_judgement
  data_sources:
  - community_intel
  false_positive_notes: Economic downturns also close firms.
- id: IND-GEO-024
  name: Payments to or from free-trade zones and tax-free ports
  description: Transfers linked to zones known for tobacco diversion.
  category: geographic
  severity: medium
  detection_type:
  - transaction_monitoring
  - external_intel
  data_sources:
  - swift_messages
  false_positive_notes: Zones host legitimate trade.
- id: IND-GEO-025
  name: Port calls at locations of concern followed by false next port
  description: Vessel declares destinations inconsistent with subsequent movements.
  category: geographic
  severity: medium
  detection_type:
  - external_intel
  - document_review
  data_sources:
  - voyage_data
  false_positive_notes: Cargo routing changes frequently.
- id: IND-GEO-026
  name: Access from sanctioned jurisdictions via VPN or proxy
  description: Technical indicators suggest the user is located in a comprehensively sanctioned area.
  category: geographic
  severity: high
  detection_type:
  - transaction_monitoring
  - kyc_review
  data_sources:
  - ip_data
  - device_data
  false_positive_notes: Privacy tools are widely used.
- id: IND-GEO-027
  name: Delivery to forwarder, mailbox or address unrelated to buyer
  description: Goods or cards are shipped to freight forwarders, reshippers, mail drops or addresses with
    no storage or sales operations or link to the buyer.
  category: geographic
  severity: medium
  detection_type:
  - document_review
  - transaction_monitoring
  - kyc_review
  data_sources:
  - order_records
  - shipping_addresses
  - fraud_data
  false_positive_notes: Expatriates and online shoppers legitimately use forwarding services.
- id: IND-GEO-028
  name: Sharp rise in exports to specific transit countries of restricted items
  description: Aggregate trade data shows spikes in categories of concern to particular countries.
  category: geographic
  severity: medium
  detection_type:
  - external_intel
  - transaction_monitoring
  data_sources:
  - trade_statistics
  false_positive_notes: Demand shifts are normal.
- id: IND-GEO-029
  name: Provider acts for many clients from the same higher-risk jurisdiction
  description: Concentration of high-risk clients.
  category: geographic
  severity: medium
  detection_type:
  - kyc_review
  data_sources:
  - client_lists
  false_positive_notes: Specialist niche providers.
- id: IND-GEO-030
  name: Payments routed through banks in jurisdictions with weak controls for no clear reason
  description: Routing does not follow normal correspondent paths.
  category: geographic
  severity: medium
  detection_type:
  - transaction_monitoring
  data_sources:
  - payment_routing
  false_positive_notes: Routes vary.
- id: IND-GEO-031
  name: Cash or card use in border and transit areas near conflict zones
  description: Cash withdrawals, ATM or card use occur at transit points or border regions near conflict
    zones.
  category: geographic
  severity: high
  detection_type:
  - transaction_monitoring
  data_sources:
  - card_transactions
  - atm_data
  - geolocation_data
  false_positive_notes: Residents, workers and travellers legitimately use these locations.
- id: IND-GEO-032
  name: Transfers following threat or abduction reports from region
  description: Payments from relatives or employers rise coincident with publicly reported kidnappings
    or extortion campaigns.
  category: geographic
  severity: medium
  detection_type:
  - external_intel
  - transaction_monitoring
  data_sources:
  - news_feeds
  - transfers
  false_positive_notes: Remittance spikes occur around disasters and conflicts for many reasons.
- id: IND-GEO-033
  name: Travel and accommodation spending to conflict-adjacent regions
  description: Spending on flights, border-area hotels or overland transport near conflict zones inconsistent
    with known occupation or history.
  category: geographic
  severity: medium
  detection_type:
  - transaction_monitoring
  - kyc_review
  data_sources:
  - card_transactions
  - travel_data
  false_positive_notes: Tourism, aid work, journalism and family visits explain most such spending.
- id: IND-GEO-034
  name: Customer location inconsistent with declared residence
  description: IP or device signals suggest access from conflict-adjacent regions while KYC indicates
    elsewhere.
  category: geographic
  severity: medium
  detection_type:
  - kyc_review
  - transaction_monitoring
  data_sources:
  - ip_data
  - device_data
  false_positive_notes: Travel, expatriates and VPNs cause mismatches.
- id: IND-GEO-035
  name: Transfers to jurisdictions with weak transparency soon after reporting changes
  description: Funds shifted to non-participating or low-transparency jurisdictions around the introduction
    of reporting obligations or voluntary-disclosure windows.
  category: geographic
  severity: high
  detection_type:
  - transaction_monitoring
  - external_intel
  data_sources:
  - payment_records
  - jurisdiction_lists
  false_positive_notes: Business or investment reasons may exist for moves.
- id: IND-GEO-036
  name: Nexus to FATF black-listed jurisdiction
  description: Customer, owner or counterparty is connected to a jurisdiction subject to a FATF call for
    action.
  category: geographic
  severity: high
  detection_type:
  - screening
  - transaction_monitoring
  data_sources:
  - fatf_lists
  - country_data
  false_positive_notes: Humanitarian, diaspora and long-standing commercial links exist.
- id: IND-GEO-037
  name: Nexus to FATF grey-listed jurisdiction
  description: Connection to a jurisdiction under increased monitoring for strategic deficiencies.
  category: geographic
  severity: medium
  detection_type:
  - screening
  - transaction_monitoring
  data_sources:
  - fatf_lists
  - country_data
  false_positive_notes: Listed jurisdictions change and many controls are improving.
- id: IND-GEO-038
  name: Secrecy or low-transparency jurisdiction nexus
  description: Entities, accounts or assets are booked in jurisdictions offering strong secrecy or limited
    transparency, including where unrelated to the entity's operations.
  category: geographic
  severity: high
  detection_type:
  - kyc_review
  - transaction_monitoring
  data_sources:
  - corporate_registry
  - transaction_records
  - jurisdiction_risk_ratings
  false_positive_notes: Legitimate holding structures and funds use such jurisdictions for tax neutrality
    or legal reasons.
- id: IND-GEO-039
  name: Conflict zone or fragile state exposure
  description: Activity involves regions with armed conflict, weak governance or active terrorist groups.
  category: geographic
  severity: high
  detection_type:
  - transaction_monitoring
  - screening
  data_sources:
  - country_data
  - payment_messages
  false_positive_notes: Aid agencies, journalists and remittance senders operate there lawfully.
- id: IND-GEO-040
  name: High-corruption jurisdiction nexus
  description: Funds or wealth are linked to or transferred to and from jurisdictions with high perceived
    corruption.
  category: geographic
  severity: medium
  detection_type:
  - transaction_monitoring
  - kyc_review
  data_sources:
  - transaction_records
  - corruption_indices
  - source_of_wealth_records
  false_positive_notes: Many customers have legitimate commercial ties to such jurisdictions.
- id: IND-GEO-041
  name: Routing through trade-diversion or transshipment hubs
  description: Goods or payments route through third-country hubs or ports with no commercial rationale,
    or hubs known for rerouting.
  category: geographic
  severity: medium
  detection_type:
  - document_review
  - transaction_monitoring
  data_sources:
  - shipping_documents
  - trade_finance_records
  - port_data
  false_positive_notes: Major hubs are used legitimately for logistics efficiency.
- id: IND-GEO-042
  name: Sanctioned country proximity
  description: Customer or flows are located in or adjacent to comprehensively sanctioned areas.
  category: geographic
  severity: high
  detection_type:
  - screening
  - transaction_monitoring
  data_sources:
  - sanctions_lists
  - ip_data
  false_positive_notes: Border communities lawfully trade.
- id: IND-GEO-043
  name: Offshore financial centre use for non-resident clients
  description: Funds booked or routed via offshore centres with minimal client ties.
  category: geographic
  severity: medium
  detection_type:
  - kyc_review
  data_sources:
  - country_data
  - kyc_profile
  false_positive_notes: Offshore centres serve legitimate wealth planning.
- id: IND-GEO-044
  name: Cross-border corridor with known abuse typologies
  description: Payments use corridors identified in typology reports as high risk, including regions where
    informal value transfer is prevalent.
  category: geographic
  severity: medium
  detection_type:
  - transaction_monitoring
  - external_intel
  data_sources:
  - transaction_records
  - typology_reports
  false_positive_notes: Corridors are used mainly by legitimate remittance senders.
