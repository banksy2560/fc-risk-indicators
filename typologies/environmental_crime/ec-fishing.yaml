typology:
  id: EC-FISHING
  name: Illegal, Unreported and Unregulated Fishing
  domain: environmental_crime
  description: Fishing in breach of licence, quota or location rules, often with transhipment at sea,
    vessel identity changes and forced labour on board. The catch is mixed into legal supply and sold
    via processors, traders and retailers.
  exposure:
    channels: []
    payment_rails:
    - wire_swift
    - trade_instruments
    - payroll_expense
    customer_segments:
    - corporate
    - sme
    - professional_intermediary
    products:
    - trade_finance
    - transaction_account
    - insurance_pension
    basis: ai_inferred
    rationale: Vessel owners, traders and processors with seafood trade finance, vessel insurance and
      crew payments through agencies.
    consumer:
      relevant: false
      products: []
      channels: []
      basis: ai_inferred
      rationale: IUU fishing involves vessel owners, seafood trade and trade finance; no retail expression.
  sectors:
  - banking
  - corporate_services
  - payments
  - insurance
  sources:
  - UNODC, Transnational Organized Crime in the Fishing Industry (2011) <https://www.unodc.org/unodc/en/human-trafficking/2011/issue-paper-transnational-organized-crime-in-the-fishing-industry.html>
    [agent-reviewed]
  - FATF, Money Laundering from Environmental Crime (2021) <https://www.fatf-gafi.org/content/fatf-gafi/en/publications/Environmentalcrime/Money-laundering-from-environmental-crime.html>
    [agent-reviewed]
  - FAO, Agreement on Port State Measures to Prevent, Deter and Eliminate Illegal, Unreported and Unregulated
    Fishing (2009, in force 2016) [replacement suggested, unverified]
  - Interpol, public material on fisheries crime [too vague, unverified]
  indicators:
  - ref: IND-CUS-025
    legacy_id: EC-FISHING-001
    context: Vessel switches off position tracking, changes names or flags often and is on IUU lists.
    false_positive_context: Technical faults and legitimate re-flagging occur.
    controls:
    - CTL-143
    - CTL-126
    - CTL-032
  - ref: IND-TXN-059
    legacy_id: EC-FISHING-002
    context: Payments to reefer ships or bunker suppliers in remote waters.
    false_positive_context: Transhipment is lawful under authorised conditions.
    controls:
    - CTL-126
    - CTL-143
  - ref: IND-DOC-019
    legacy_id: EC-FISHING-003
    context: Landing volumes or species exceed capacity, quota or fishing area.
    false_positive_context: Reporting varies by flag.
    controls:
    - CTL-134
    - CTL-139
  - ref: IND-OWN-002
    legacy_id: EC-FISHING-004
    context: Vessels owned via shell companies in secrecy jurisdictions with unclear controllers.
    name_in_typology: Ownership by layered offshore companies and flags of convenience
    false_positive_context: Shipping uses complex structures lawfully.
    controls:
    - CTL-005
    - CTL-154
  - ref: IND-BEH-056
    legacy_id: EC-FISHING-005
    context: Crew recruited by agencies with fees, wages held back, or payments to agents.
    false_positive_context: Seafarers' remittance patterns are variable.
    controls:
    - CTL-122
    - CTL-100
  - ref: IND-CPT-017
    legacy_id: EC-FISHING-006
    context: Processors or exporters cannot show the vessel or catch origin.
    false_positive_context: Smaller traders may lack digital records.
    controls:
    - CTL-136
    - CTL-137
  - ref: IND-GEO-003
    legacy_id: EC-FISHING-007
    context: Frequent landings at ports with weak controls or non-parties to port state measures.
    false_positive_context: Ports may be the only option for some fleets.
    controls:
    - CTL-154
    - CTL-143
  - ref: IND-CUS-003
    legacy_id: EC-FISHING-008
    context: Vessel, owner or manager in sanction or prosecution lists.
    name_in_typology: Adverse media or enforcement for IUU activity
    false_positive_context: Past cases may be resolved.
    controls:
    - CTL-032
    - CTL-097
