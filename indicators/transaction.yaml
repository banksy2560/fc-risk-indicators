indicators:
- id: IND-TXN-001
  name: Rapid pass-through of received funds
  description: Funds received into an account are forwarded onward within a very short period, often in
    near-equal amounts and leaving minimal balance.
  category: transaction
  severity: high
  detection_type:
  - transaction_monitoring
  - investigator_judgement
  data_sources:
  - transaction_data
  - ledger_data
  - account_data
  - payment_data
  - account_activity
  - counterparty_data
  false_positive_notes: Legitimate payment intermediaries, treasury sweeps and agents routinely pass funds
    through quickly.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-002
  name: Rapid movement offshore or to crypto after receipt
  description: Incoming funds are quickly sent abroad or converted to virtual assets soon after being
    credited.
  category: transaction
  severity: high
  detection_type:
  - transaction_monitoring
  data_sources:
  - account_data
  - transaction_data
  false_positive_notes: Genuine international payments or planned crypto purchases by established customers.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-003
  name: Account receiving funds from multiple apparent fraud victims
  description: A new or low-activity account receives payments from several unrelated individuals who
    appear to be victims of fraud or phishing, followed by onward movement or cash-out.
  category: transaction
  severity: high
  detection_type:
  - transaction_monitoring
  data_sources:
  - ledger_data
  - payment_references
  - blockchain_analytics
  - payment_records
  - account_data
  - atm_data
  false_positive_notes: Legitimate sales, crowdfunding or refunds can look similar; check payment references
    and account history.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-004
  name: Many unrelated senders paying a single account or recipient
  description: Numerous unrelated payers send frequent, often small, payments to one account, wallet or
    beneficiary, or one funder pays many beneficiaries, with no clear commercial relationship.
  category: transaction
  severity: high
  detection_type:
  - transaction_monitoring
  - investigator_judgement
  data_sources:
  - blockchain_analytics
  - ledger_data
  - account_data
  - payment_data
  - remittance_data
  - payment_records
  - game_logs
  - account_records
  - load_records
  - bank_transactions
  - counterparty_data
  false_positive_notes: Legitimate retailers, charities, marketplaces and payroll can show high payer
    counts.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-005
  name: Transfers to many newly created crypto addresses
  description: Repeated small or fixed-amount transfers to many fresh or new crypto addresses.
  category: transaction
  severity: medium
  detection_type:
  - transaction_monitoring
  data_sources:
  - withdrawal_addresses
  - blockchain_analytics
  - transaction_data
  false_positive_notes: Privacy-conscious users and wallet software that rotates addresses can produce
    this pattern.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-006
  name: Cash deposits just below reporting or identification threshold
  description: Repeated cash deposits kept just under a reporting, identification or monitoring threshold.
  category: transaction
  severity: high
  detection_type:
  - transaction_monitoring
  data_sources:
  - kiosk_logs
  - phone_numbers
  - transaction_data
  - cash_deposit_records
  false_positive_notes: Customers may deposit regular round sums that coincidentally sit below thresholds.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-007
  name: Cash deposits split across branches, ATMs or accounts
  description: Cash is deposited in several locations, channels or accounts on the same day or over a
    short period so that no single deposit stands out.
  category: transaction
  severity: high
  detection_type:
  - transaction_monitoring
  data_sources:
  - transaction_data
  - channel_logs
  - cash_deposit_data
  - atm_data
  - cash_deposits
  - wire_data
  false_positive_notes: Businesses with multiple outlets may deposit locally at different branches.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-008
  name: Non-cash transfers or loads just below identification or reporting thresholds
  description: Repeated transfers, remittances or card/wallet loads kept just below an identification,
    record-keeping or travel-rule threshold.
  category: transaction
  severity: medium
  detection_type:
  - transaction_monitoring
  data_sources:
  - remittance_data
  - load_records
  - transfer_records
  - transaction_data
  false_positive_notes: Customers may use standard amounts or product limits that happen to sit just under
    thresholds.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-009
  name: Payments or claims split to stay below internal approval limits
  description: Payments, claims or contracts are broken into amounts just under internal authorisation
    limits.
  category: transaction
  severity: medium
  detection_type:
  - transaction_monitoring
  data_sources:
  - payment_records
  - approval_logs
  - expense_data
  - purchasing_data
  false_positive_notes: Routine small recurring purchases and budget-driven phasing can resemble this.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-010
  name: Repeated round-value transactions
  description: Transactions are repeatedly in round or unusually uniform amounts that do not fit the stated
    purpose.
  category: transaction
  severity: medium
  detection_type:
  - transaction_monitoring
  data_sources:
  - transaction_data
  false_positive_notes: Rents, salaries, loan instalments and fees are commonly round amounts.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-011
  name: Dormant account suddenly reactivated or high-velocity activity
  description: A dormant or low-activity account suddenly shows high-velocity inflows and outflows.
  category: transaction
  severity: high
  detection_type:
  - transaction_monitoring
  data_sources:
  - account_status
  - transaction_data
  - ledger_data
  false_positive_notes: Seasonal use, life events or a customer returning after absence.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-012
  name: Sudden large increase in transaction volume
  description: Transaction volume or value rises abruptly well beyond historical levels, including through
    a respondent or reactivated account.
  category: transaction
  severity: medium
  detection_type:
  - transaction_monitoring
  data_sources:
  - transaction_data
  - account_activity
  false_positive_notes: Business growth, seasonality, acquisitions or one-off events.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-013
  name: Activity inconsistent with customer profile
  description: Transactions or withdrawals are uncharacteristic of, or inconsistent with, the customer's
    known profile, income or expected activity.
  category: transaction
  severity: high
  detection_type:
  - transaction_monitoring
  - customer_behaviour
  - kyc_review
  data_sources:
  - transaction_data
  - kyc_profile
  - account_data
  - financial_statements
  false_positive_notes: Life events, windfalls or changed circumstances may explain the change.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-014
  name: Volumes exceed documented production or capacity
  description: Exports or output reported exceed documented production, concession or capacity limits.
  category: transaction
  severity: high
  detection_type:
  - transaction_monitoring
  - investigator_judgement
  - external_intel
  data_sources:
  - export_records
  - concession_data
  - trade_statistics
  - customs_data
  false_positive_notes: Stockpiles, undocumented but legitimate sources or reporting lags.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-015
  name: Circular or round-trip flows among related parties
  description: Funds or goods-linked payments loop back to the originator or between related counterparties,
    or are traded back and forth.
  category: transaction
  severity: high
  detection_type:
  - transaction_monitoring
  - investigator_judgement
  data_sources:
  - transaction_data
  - network_data
  - payment_records
  - link_analysis
  - registry_data
  false_positive_notes: Group treasury arrangements and legitimate back-to-back trading.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-016
  name: Mirror or offsetting transactions between jurisdictions
  description: Reciprocal or offsetting payments occur between counterparties or operators in different
    countries with no direct value transfer.
  category: transaction
  severity: medium
  detection_type:
  - transaction_monitoring
  - investigator_judgement
  data_sources:
  - transaction_data
  - wire_data
  - payment_records
  false_positive_notes: Netting and reciprocal arrangements between related businesses.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-017
  name: Workers paid to third-party or multiple accounts
  description: Wages are paid to accounts not held by the worker or split across several accounts.
  category: transaction
  severity: high
  detection_type:
  - transaction_monitoring
  - investigator_judgement
  - kyc_review
  data_sources:
  - payment_records
  - payroll_files
  - payment_data
  - wallet_data
  false_positive_notes: Workers may have family accounts or split pay by choice.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-018
  name: Chain-hopping through bridges shortly after receipt
  description: Virtual assets are moved across chains or bridges and converted soon after being received.
  category: transaction
  severity: high
  detection_type:
  - transaction_monitoring
  - external_intel
  data_sources:
  - blockchain_analytics
  - withdrawal_addresses
  false_positive_notes: Legitimate DeFi users bridge assets for fees or liquidity.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-019
  name: Refund and chargeback abuse
  description: Unusual refund or chargeback volumes or cycles relative to sales.
  category: transaction
  severity: high
  detection_type:
  - transaction_monitoring
  data_sources:
  - payment_data
  - chargeback_data
  false_positive_notes: Seasonal returns, disputes or product quality issues.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-020
  name: Transaction price materially different from market value
  description: Price paid differs sharply from market value, comparable sales or estimates without commercial
    justification.
  category: transaction
  severity: high
  detection_type:
  - document_review
  - investigator_judgement
  - transaction_monitoring
  data_sources:
  - valuation_reports
  - land_registry
  - trade_documents
  - price_databases
  - sale_records
  - valuation_data
  - marketplace_data
  - price_history
  - price_data
  - tender_documents
  - price_benchmarks
  false_positive_notes: Distressed sales, rare items, quality differences or volatile markets.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-021
  name: High-value purchases paid in cash, crypto or non-standard funds
  description: High-value assets are bought with cash, crypto, third-party or otherwise non-standard funding.
  category: transaction
  severity: high
  detection_type:
  - transaction_monitoring
  - document_review
  - customer_behaviour
  - kyc_review
  data_sources:
  - payment_records
  - payment_data
  false_positive_notes: Some buyers legitimately pay with cash or crypto; verify source of funds.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-022
  name: Cash payments to informal suppliers or ground-level operators
  description: Large or repeated cash payments to informal traders, producers or workers in extraction
    or supply chains.
  category: transaction
  severity: medium
  detection_type:
  - transaction_monitoring
  - investigator_judgement
  data_sources:
  - cash_data
  - payment_records
  - deposit_records
  - invoices
  false_positive_notes: Informal markets often transact in cash.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-023
  name: Payments from or for third parties unrelated to the underlying trade
  description: Payments are made by parties with no apparent link to the underlying transaction, goods
    or services.
  category: transaction
  severity: medium
  detection_type:
  - transaction_monitoring
  - document_review
  data_sources:
  - payment_messages
  - invoices
  - payment_data
  false_positive_notes: Group companies, agents or financiers may pay on behalf of the principal.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-024
  name: Payment directed to personal or third-party account
  description: Payment is requested to, or credited to, a personal, third-party or differently named account
    rather than the contracted payee.
  category: transaction
  severity: high
  detection_type:
  - transaction_monitoring
  - customer_behaviour
  data_sources:
  - payment_instructions
  - bank_data
  - vendor_master
  - payment_data
  false_positive_notes: Factoring, assignment, or legitimate account changes.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-025
  name: Sudden liquidation of savings or assets
  description: Savings, investments or assets are sold abruptly, followed by withdrawal or transfer.
  category: transaction
  severity: medium
  detection_type:
  - transaction_monitoring
  - investigator_judgement
  data_sources:
  - account_history
  - payment_data
  - account_activity
  - asset_records
  false_positive_notes: Planned purchases, retirement or genuine need for funds.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-026
  name: Sudden credit utilisation spike then bust-out
  description: Credit builds up and is then rapidly utilised to limit or cashed out after a period of
    low use.
  category: transaction
  severity: high
  detection_type:
  - transaction_monitoring
  data_sources:
  - account_data
  - ledger_data
  - credit_data
  false_positive_notes: Large planned purchases or seasonal spending.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-027
  name: Large buy-in or deposits with little underlying activity
  description: Substantial funds are deposited or bought in with minimal gambling or betting activity
    before withdrawal.
  category: transaction
  severity: high
  detection_type:
  - transaction_monitoring
  - customer_behaviour
  data_sources:
  - casino_floor_records
  - gambling_account_data
  false_positive_notes: Players who deposit but pause play.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-028
  name: Fee or tax payment demanded to release funds
  description: Payments are made as fees or taxes supposedly needed to release a prize, loan, inheritance
    or gains.
  category: transaction
  severity: high
  detection_type:
  - transaction_monitoring
  - customer_behaviour
  data_sources:
  - payment_data
  false_positive_notes: Genuine release fees exist but are rare and verifiable.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-029
  name: Payment references suggesting scam scripts
  description: Payment narratives or references contain wording linked to scams such as safe accounts
    or investment schemes.
  category: transaction
  severity: medium
  detection_type:
  - transaction_monitoring
  data_sources:
  - payment_data
  - narratives
  - payment_references
  false_positive_notes: Innocuous use of similar words.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-030
  name: Rapid onward movement after cash credits
  description: Cash deposited is quickly withdrawn or transferred onward, including to another location
    or to unhosted wallets.
  category: transaction
  severity: medium
  detection_type:
  - transaction_monitoring
  data_sources:
  - transaction_data
  - atm_logs
  - cash_deposit_data
  - payment_records
  - ledger_data
  false_positive_notes: Customers may use cash deposits for immediate bills.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-031
  name: Large credit followed by prompt withdrawals
  description: A cheque deposit or refund is credited and quickly withdrawn or transferred before it clears
    or is verified.
  category: transaction
  severity: high
  detection_type:
  - transaction_monitoring
  data_sources:
  - deposit_data
  - account_data
  false_positive_notes: Customers needing urgent access to funds.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-032
  name: Rapid stored-value or wallet hops then cash-out
  description: Stored value or funds move quickly between wallets or cards and are then cashed out.
  category: transaction
  severity: medium
  detection_type:
  - transaction_monitoring
  data_sources:
  - wallet_transfers
  - ledger_data
  - wallet_data
  false_positive_notes: Normal wallet top-ups and withdrawals.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-033
  name: Bulk purchase or sale of cards or vouchers
  description: Large volumes of prepaid cards or gift cards are purchased or sold.
  category: transaction
  severity: high
  detection_type:
  - transaction_monitoring
  data_sources:
  - card_orders
  - payment_data
  - order_data
  false_positive_notes: Corporate gifting or promotions.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-034
  name: Cash or anonymous donations
  description: Donations are made through cash, anonymous collections or structured amounts.
  category: transaction
  severity: medium
  detection_type:
  - transaction_monitoring
  - kyc_review
  data_sources:
  - donation_records
  - cash_deposits
  - collection_logs
  false_positive_notes: Legitimate fundraising events often use cash.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-035
  name: Professional client account used as pass-through
  description: A professional's client account is used to move funds with no underlying legal or advisory
    work.
  category: transaction
  severity: high
  detection_type:
  - transaction_monitoring
  - investigator_judgement
  data_sources:
  - client_account_data
  false_positive_notes: Legitimate client-money handling.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-036
  name: Recurring small cash payments to border, customs or permit agents
  description: Repeated low-value cash disbursements or petty cash entries labelled 'expediting', 'facilitation'
    or 'processing' at ports, borders or ministries.
  category: transaction
  severity: medium
  detection_type:
  - transaction_monitoring
  - document_review
  data_sources:
  - petty_cash
  - expense_reports
  false_positive_notes: Some official fees are legitimately paid in cash with receipts.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-037
  name: Fees to distributors well above market margin
  description: Distributor discounts or rebates are unusually large without commercial rationale, leaving
    room for onward payments.
  category: transaction
  severity: medium
  detection_type:
  - transaction_monitoring
  - investigator_judgement
  data_sources:
  - pricing_data
  - contracts
  false_positive_notes: Volume discounts and market entry may justify higher margins.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-038
  name: Success fee paid to consultant in a high-corruption market
  description: Large success-based or commission payments to a consultant or agent tied to winning a contract
    with a state body in a high-corruption-risk jurisdiction.
  category: transaction
  severity: high
  detection_type:
  - transaction_monitoring
  - investigator_judgement
  data_sources:
  - payment_records
  - contract_files
  - corruption_indices
  false_positive_notes: Genuine commercial agents are commonly paid success fees; rates in some sectors
    are legitimately high.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-039
  name: Gifts, travel or hospitality for officials paid through third parties
  description: Payments for luxury travel, tuition, medical treatment or property for officials or relatives,
    booked via a vendor or card.
  category: transaction
  severity: medium
  detection_type:
  - transaction_monitoring
  - investigator_judgement
  data_sources:
  - expense_reports
  - card_data
  - payments
  false_positive_notes: Official delegations legitimately receive modest hospitality and reasonable travel
    for site visits.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-040
  name: Post-award payments from supplier to buyer-linked accounts
  description: Winning supplier transfers funds to persons or companies connected to the procuring official
    shortly after payment.
  category: transaction
  severity: high
  detection_type:
  - transaction_monitoring
  - investigator_judgement
  data_sources:
  - payment_records
  - corporate_registries
  false_positive_notes: Supplier subcontracting may pay related parties innocently.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-041
  name: Large inflows from state-owned entities or ministries to private accounts
  description: Funds from government bodies or state enterprises arrive at private or personal accounts
    with no apparent contractual basis.
  category: transaction
  severity: high
  detection_type:
  - transaction_monitoring
  - investigator_judgement
  data_sources:
  - payment_records
  - sector_intelligence
  false_positive_notes: State suppliers and contractors receive government funds legitimately.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-042
  name: Rapid movement through correspondent or private banking channels
  description: Large sums move quickly through several banks and jurisdictions after arrival, with no
    hold period.
  category: transaction
  severity: medium
  detection_type:
  - transaction_monitoring
  data_sources:
  - payment_records
  - swift_messages
  false_positive_notes: Treasury and liquidity management can cause fast movements.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-043
  name: No apparent economic or lawful rationale
  description: Transactions lack commercial logic given the customer's business or relationship.
  category: transaction
  severity: high
  detection_type:
  - investigator_judgement
  - transaction_monitoring
  data_sources:
  - transaction_data
  - kyc_profile
  false_positive_notes: Atypical but genuine one-off deals occur.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-044
  name: Use of multiple accounts to move funds
  description: Customer spreads activity across many accounts, products or institutions.
  category: transaction
  severity: medium
  detection_type:
  - transaction_monitoring
  data_sources:
  - account_data
  false_positive_notes: Customers separate budgets legitimately.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-045
  name: Cash from bulk notes in poor condition or unusual denominations
  description: Large volumes of small or bundled notes deposited in sequence.
  category: transaction
  severity: low
  detection_type:
  - investigator_judgement
  data_sources:
  - kiosk_logs
  false_positive_notes: Cash-based businesses.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-046
  name: Frequent small purchases to marketplace-linked addresses
  description: Repeated low-value withdrawals to wallets clustering with market deposit infrastructure,
    consistent with buyer activity.
  category: transaction
  severity: medium
  detection_type:
  - transaction_monitoring
  data_sources:
  - blockchain_analytics
  - withdrawal_addresses
  false_positive_notes: False cluster attribution.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-TXN-047
  name: Layered swaps through multiple DEX pools and bridges
  description: On-chain history shows repeated swaps and bridge crossings with no yield or trading logic
    before arrival at the platform.
  category: transaction
  severity: high
  detection_type:
  - transaction_monitoring
