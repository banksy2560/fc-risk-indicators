typology:
  id: CY-PREPAID
  name: Prepaid Cards and Stored Value Abuse
  domain: cyber_enabled
  description: Prepaid cards and digital stored-value products can be loaded, transferred and cashed out
    quickly, sometimes with limited customer identification. Criminals use them to move small amounts
    at scale, convert cash, receive fraud proceeds and fund illicit purchases, often via many cards or
    mule holders.
  stage:
  - placement
  - layering
  sectors:
  - payments
  - fintech
  - banking
  sources:
  - FATF, Guidance for a Risk-Based Approach to Prepaid Cards, Mobile Payments and Internet-Based Payment
    Services (2013)
  - FATF, Opportunities and Challenges of New Technologies for AML/CFT (2021)
  indicators:
  - ref: IND-TXN-033
    legacy_id: CY-PREPAID-001
    context: One buyer acquires many cards, often in cash, with a common funding source or shipping address.
    name_in_typology: Bulk purchase of cards by one person or entity
    false_positive_context: Corporate gifting or incentive programmes.
    controls:
    - CTL-037
    - CTL-004
    - CTL-072
  - ref: IND-TXN-004
    legacy_id: CY-PREPAID-002
    context: Multiple unconnected payers load one card or small set of cards.
    name_in_typology: Cards funded by many unrelated third parties
    severity_in_typology: medium
    false_positive_context: Family contributions.
    controls:
    - CTL-048
    - CTL-037
    - CTL-093
  - ref: IND-GEO-001
    legacy_id: CY-PREPAID-003
    context: Funds are drawn down in cash overseas or in high-risk locations soon after loading.
    false_positive_context: Travellers.
    controls:
    - CTL-037
    - CTL-092
    - CTL-072
  - ref: IND-TXN-008
    legacy_id: CY-PREPAID-004
    context: Multiple loads sized to avoid enhanced verification.
    name_in_typology: Repeated loads just below identification thresholds
    false_positive_context: Budget-based usage.
    controls:
    - CTL-037
    - CTL-072
    - CTL-004
  - ref: IND-CUS-007
    legacy_id: CY-PREPAID-005
    context: Different cardholders share phone, address, email or device.
    name_in_typology: Multiple cards sharing identifiers
    false_positive_context: Households.
    controls:
    - CTL-004
    - CTL-048
    - CTL-091
  - ref: IND-PRD-013
    legacy_id: CY-PREPAID-006
    context: Cards without full ID show large inflows and outflows inconsistent with low-limit design.
    name_in_typology: Anonymous or minimally verified cards with high turnover
    false_positive_context: Misapplied product tiers.
    controls:
    - CTL-072
    - CTL-002
    - CTL-162
  - ref: IND-CPT-014
    legacy_id: CY-PREPAID-007
    context: Spend concentrates at gambling, darknet-adjacent or unlicensed merchants.
    false_positive_context: Legal entertainment spend.
    controls:
    - CTL-057
    - CTL-083
    - CTL-037
  - ref: IND-TXN-032
    legacy_id: CY-PREPAID-008
    context: Funds hop across stored-value accounts to peer wallets, then to cash or crypto.
    name_in_typology: Rapid transfers of stored value between wallets then cash-out
    false_positive_context: Peer payments.
    controls:
    - CTL-048
    - CTL-051
    - CTL-093
  - ref: IND-GEO-027
    legacy_id: CY-PREPAID-009
    context: Cards shipped to freight forwarders or mail drops, then used elsewhere.
    name_in_typology: Cards received by mules and redirected abroad
    false_positive_context: Expatriates.
    controls:
    - CTL-004
    - CTL-093
    - CTL-092
  - ref: IND-TYP-018
    legacy_id: CY-PREPAID-010
    context: Loads via cards or accounts reported stolen, followed by cash-out.
    false_positive_context: Disputed genuine charges.
    controls:
    - CTL-091
    - CTL-037
    - CTL-103
