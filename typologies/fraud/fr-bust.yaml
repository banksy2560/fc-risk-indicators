typology:
  id: FR-BUST
  name: First-Party and Bust-Out Fraud
  domain: fraud
  description: Customers or organised groups obtain credit with no intent to repay, or build up credit
    lines and then max them out and vanish. First-party fraud may also include exaggerated hardship or
    false disputes.
  sectors:
  - banking
  - payments
  - fintech
  sources:
  - UK Finance, Annual Fraud Report (specify year, e.g. 2025) <https://www.ukfinance.org.uk/> [corrected,
    agent-reviewed]
  - FinCEN, advisories on loan and credit fraud (general) [too vague, unverified]
  - FATF, guidance on proceeds of fraud (general) [too vague, unverified]
  indicators:
  - ref: IND-TXN-026
    legacy_id: FR-BUST-001
    context: Balances move from low to maximum across cards or lines within days.
    name_in_typology: Sudden utilisation spike to limit after a period of low use
    false_positive_context: Seasonal spending.
    controls:
    - CTL-037
    - CTL-091
    - CTL-049
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-TXN-065
    legacy_id: FR-BUST-002
    context: Heavy use of cash advances, gift cards and high-resale items near the credit limit.
    false_positive_context: Genuine purchases.
    controls:
    - CTL-037
    - CTL-067
    - CTL-091
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-TXN-066
    legacy_id: FR-BUST-003
    context: Payments that bounce or are reversed after credit is restored.
    false_positive_context: Genuine payment errors.
    controls:
    - CTL-037
    - CTL-079
    - CTL-049
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-BEH-012
    legacy_id: FR-BUST-004
    context: Shared addresses or phones across applicants hitting many lenders.
    name_in_typology: Multiple linked accounts opened across lenders
    false_positive_context: Family members.
    controls:
    - CTL-049
    - CTL-083
    - CTL-090
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-BEH-063
    legacy_id: FR-BUST-005
    context: Contact details become invalid and the customer ceases engagement.
    false_positive_context: Genuine change of circumstances.
    controls:
    - CTL-091
    - CTL-094
    - CTL-083
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-DOC-027
    legacy_id: FR-BUST-006
    context: Application cites employer or income that cannot be confirmed.
    false_positive_context: Self-employed.
    controls:
    - CTL-084
    - CTL-002
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-CPT-022
    legacy_id: FR-BUST-007
    context: Use at merchants with risky profiles suggesting cash-out.
    name_in_typology: Increased use of merchants known for transaction laundering
    severity_in_typology: medium
    false_positive_context: Legitimate shops.
    controls:
    - CTL-067
    - CTL-057
    - CTL-037
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-BEH-064
    legacy_id: FR-BUST-008
    context: Repeated and quickly sought limit increases soon after account opening.
    false_positive_context: Genuine need.
    controls:
    - CTL-084
    - CTL-091
    - CTL-037
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-BEH-021
    legacy_id: FR-BUST-009
    context: False claims of non-receipt or unauthorised use.
    name_in_typology: Customer disputes legitimate transactions after use
    false_positive_context: Genuine disputes.
    controls:
    - CTL-057
    - CTL-083
    - CTL-094
    references:
    - UK Finance, Annual Fraud Report (published annually)
