typology:
  id: ML-LOANBACK
  name: Loan-Back and Round-Tripping
  domain: money_laundering
  description: Schemes in which criminals lend their own illicit funds to themselves or their entities
    through apparently legitimate loans, or send funds abroad and return them as investment, loans or
    trade receipts. Documentation creates a credible-looking origin for the money.
  exposure:
    channels:
    - branch
    payment_rails:
    - wire_swift
    - loan_disbursement
    - loan_early_payout
    customer_segments:
    - private_wealth
    - sme
    - sole_trader
    - third_party_funder
    products:
    - personal_loan
    - home_loan_fixed
    - home_loan_variable
    - savings_account
    - term_deposit
    basis: ai_inferred
    rationale: Self-funded loans, cash-collateralised lending and offshore round-tripping.
    consumer:
      relevant: true
      products:
      - personal_loan
      - home_loan_fixed
      - home_loan_variable
      - term_deposit
      channels:
      - branch
      - online_banking
      - call_centre
      basis: ai_inferred
      rationale: Self-lending and rapid or third-party loan repayment, or term deposit collateral, to
        give funds a lawful-looking origin.
  stage:
  - layering
  - integration
  sectors:
  - banking
  - corporate_services
  sources:
  - 'FATF, Money Laundering Typologies: loan-back schemes (general) [too vague, unverified]'
  - FATF and Egmont Group, Concealment of Beneficial Ownership (2018) <https://www.fatf-gafi.org/en/publications/Methodsandtrends/FATF-Egmont-Concealment-beneficial-ownership.html>
    [corrected, agent-reviewed]
  - JMLSG Guidance, lending and sector guidance (general) [too vague, unverified]
  indicators:
  - ref: IND-TXN-112
    legacy_id: ML-LOANBACK-001
    context: Borrower receives loan from an entity linked to themselves and repays rapidly.
    false_positive_context: Group financing.
    controls:
    - CTL-151
    - CTL-084
    - CTL-047
  - ref: IND-TXN-113
    legacy_id: ML-LOANBACK-002
    context: Collateral is cash deposit or asset funded by unknown source.
    false_positive_context: Cash-secured lending is common.
    controls:
    - CTL-012
    - CTL-072
  - ref: IND-GEO-017
    legacy_id: ML-LOANBACK-003
    context: Money sent abroad reappears as shareholder investment or loan.
    false_positive_context: Real diaspora investment.
    controls:
    - CTL-047
    - CTL-151
  - ref: IND-DOC-042
    legacy_id: ML-LOANBACK-004
    context: Interest-free, no repayments, or terms inconsistent with market.
    false_positive_context: Family loans.
    controls:
    - CTL-151
  - ref: IND-DOC-043
    legacy_id: ML-LOANBACK-005
    context: Dates, signatures or amounts inconsistent.
    false_positive_context: Errors happen.
    controls:
    - CTL-002
    - CTL-142
  - ref: IND-CPT-058
    legacy_id: ML-LOANBACK-006
    context: Repayments from unexpected accounts.
    name_in_typology: Borrower repays from unrelated third-party sources
    false_positive_context: Guarantors.
    controls:
    - CTL-046
    - CTL-134
  - ref: IND-BEH-015
    legacy_id: ML-LOANBACK-007
    context: Accepts poor terms or fees.
    name_in_typology: Customer indifferent to cost of credit
    false_positive_context: Convenience.
    controls:
    - CTL-011
    - CTL-169
  - ref: IND-TYP-036
    legacy_id: ML-LOANBACK-008
    context: Invoices cycled among related firms, returning funds to origin.
    false_positive_context: Group trading.
    controls:
    - CTL-047
    - CTL-048
    - CTL-140
