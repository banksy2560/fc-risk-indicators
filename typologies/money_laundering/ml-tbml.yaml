typology:
  id: ML-TBML
  name: Trade-Based Money Laundering
  domain: money_laundering
  description: Disguising proceeds of crime and moving value through trade transactions by manipulating
    invoicing, quantity, quality or description of goods and services. Techniques include over- and under-invoicing,
    multiple invoicing, phantom shipments and use of unrelated third parties.
  stage:
  - layering
  - integration
  sectors:
  - banking
  - trade_finance
  - corporate_services
  sources:
  - FATF, Trade-Based Money Laundering (2006) <https://www.fatf-gafi.org/en/publications/Methodsandtrends/Trade-basedmoneylaundering.html>
    [agent-reviewed]
  - 'FATF and Egmont Group, Trade-Based Money Laundering: Trends and Developments (2020) <https://www.fatf-gafi.org/en/publications/Methodsandtrends/Trade-based-money-laundering-trends-and-developments.html>
    [agent-reviewed]'
  - ICC, BAFT and Wolfsberg Group, Trade Finance Principles (2019 update) <https://wolfsberg-group.org/>
    [corrected, agent-reviewed]
  indicators:
  - ref: IND-TXN-020
    legacy_id: ML-TBML-001
    context: Unit prices are well above or below the normal market range for the goods without a commercial
      rationale.
    name_in_typology: Invoice price significantly differs from market value
    false_positive_context: Discounts, grade differences, and volatile commodities can explain variance.
    controls:
    - CTL-124
    - CTL-123
    - CTL-086
  - ref: IND-DOC-020
    legacy_id: ML-TBML-002
    context: Bill of lading, invoice and letter of credit describe quantity, goods or parties differently.
    name_in_typology: Goods description vague or inconsistent across documents
    false_positive_context: Clerical errors or HS-code variations occur.
    controls:
    - CTL-123
    - CTL-086
    - CTL-140
  - ref: IND-DOC-038
    legacy_id: ML-TBML-003
    context: The same goods are invoiced or financed more than once, or payment references repeat.
    name_in_typology: Multiple invoicing for the same shipment
    false_positive_context: Partial shipments and amendments may seem like duplicates.
    controls:
    - CTL-087
    - CTL-123
    - CTL-140
  - ref: IND-GEO-041
    legacy_id: ML-TBML-004
    context: Goods travel through jurisdictions with no commercial reason or known risk of trade abuse.
    name_in_typology: Shipping route illogical or via high-risk transshipment
    false_positive_context: Route changes follow port congestion or carrier network design.
    controls:
    - CTL-126
    - CTL-127
  - ref: IND-CPT-058
    legacy_id: ML-TBML-005
    context: Payments for goods come from parties not named in the contract or documentation.
    name_in_typology: Payment from or to unrelated third parties
    severity_in_typology: high
    false_positive_context: Group treasury centres and factoring can legitimately pay.
    controls:
    - CTL-046
    - CTL-086
    - CTL-133
  - ref: IND-CUS-041
    legacy_id: ML-TBML-006
    context: Quantities or values are out of proportion to the size, history or industry of trading parties.
    false_positive_context: Start-ups may broker large deals.
    controls:
    - CTL-133
  - ref: IND-PRD-050
    legacy_id: ML-TBML-007
    context: Trade in goods commonly abused for value transfer (used cars, electronics, gold, scrap) lacks
      usual licences or logistics.
    false_positive_context: Licence regimes vary.
    controls:
    - CTL-131
    - CTL-134
  - ref: IND-TYP-040
    legacy_id: ML-TBML-008
    context: 'No verifiable movement of goods: missing tracking, inspection or insurance evidence.'
    false_positive_context: Smaller shipments may lack tracking.
    controls:
    - CTL-125
    - CTL-086
  - ref: IND-BEH-097
    legacy_id: ML-TBML-009
    context: Repeated changes to beneficiaries, payment terms or amounts shortly before payment.
    false_positive_context: Negotiating changes are common.
    controls:
    - CTL-132
