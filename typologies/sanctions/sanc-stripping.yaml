typology:
  id: SANC-STRIPPING
  name: Wire Stripping and Payment-Message Manipulation
  domain: sanctions
  description: Payment messages can be altered or structured so that names, addresses or purpose fields
    that would trigger sanctions screening are omitted, truncated or replaced. Controls focus on message
    integrity, intermediary practices and unusual patterns in message content.
  exposure:
    channels:
    - api_open_banking
    payment_rails:
    - wire_swift
    customer_segments:
    - corporate
    products:
    - correspondent_account
    - transaction_account
    basis: ai_inferred
    rationale: Payment-message manipulation in SWIFT and correspondent routing.
  sectors:
  - banking
  - payments
  sources:
  - Basel Committee on Banking Supervision, Due diligence and transparency regarding cover payment messages
    related to cross-border wire transfers (2009) [unverified]
  - FATF Recommendation 16 and Interpretive Note on wire transfers [unverified]
  - OFAC, Enforcement Release guidance on payment processing (general reference) [replacement suggested,
    unverified]
  indicators:
  - ref: IND-DOC-015
    legacy_id: SANC-STRIPPING-001
    context: Payments carry placeholders such as 'customer' or incomplete addresses for parties in higher-risk
      jurisdictions.
    name_in_typology: Originator or beneficiary fields missing, generic or truncated
    false_positive_context: Legacy systems truncate data.
    controls:
    - CTL-110
    - CTL-107
  - ref: IND-TXN-138
    legacy_id: SANC-STRIPPING-002
    context: Cover message shows only the banks, with details of ultimate parties absent.
    false_positive_context: Cover method is used for ordinary correspondent business.
    controls:
    - CTL-111
    - CTL-107
  - ref: IND-DOC-064
    legacy_id: SANC-STRIPPING-003
    context: Messages instruct downstream banks not to reference parties or contain unusual remarks.
    false_positive_context: Poor wording may be innocent.
    controls:
    - CTL-030
    - CTL-102
  - ref: IND-BEH-108
    legacy_id: SANC-STRIPPING-004
    context: Rejected payments are resubmitted with altered details.
    false_positive_context: Repair of ordinary errors happens.
    controls:
    - CTL-110
    - CTL-030
    - CTL-111
  - ref: IND-GEO-030
    legacy_id: SANC-STRIPPING-005
    context: Routing does not follow normal correspondent paths.
    false_positive_context: Routes vary.
    controls:
    - CTL-045
    - CTL-106
  - ref: IND-DOC-065
    legacy_id: SANC-STRIPPING-006
    context: Payment shows one remitter while documents show another.
    false_positive_context: Third-party payers exist.
    controls:
    - CTL-123
    - CTL-174
  - ref: IND-CPT-053
    legacy_id: SANC-STRIPPING-007
    context: Peer institution frequently sends payments with data gaps.
    false_positive_context: Technical problems may be systemic.
    controls:
    - CTL-110
    - CTL-102
  - ref: IND-TYP-052
    legacy_id: SANC-STRIPPING-008
    context: Internal indicator of weak alert handling that may mask manipulation.
    false_positive_context: Genuine recurrent false positives.
    controls:
    - CTL-033
    - CTL-159
    - CTL-175
    - CTL-029
