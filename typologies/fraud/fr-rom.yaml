typology:
  id: FR-ROM
  name: Romance and Pig-Butchering Investment Scams
  domain: fraud
  description: Offenders build online trust over weeks or months, then steer the victim into sending money
    for an emergency or into a fake investment platform that shows fabricated gains. Funds typically flow
    through exchanges, mule accounts and offshore networks.
  exposure:
    channels:
    - online_banking
    - mobile_app
    payment_rails:
    - fast_payments
    - crypto_onramp_offramp
    - cross_border_remittance
    - loan_disbursement
    customer_segments:
    - retail
    - vulnerable_elderly
    products:
    - transaction_account
    - crypto_custody
    basis: ai_inferred
    rationale: Victim payments to exchanges and offshore accounts.
    consumer:
      relevant: true
      products:
      - transaction_account
      - savings_account
      - personal_loan
      channels:
      - mobile_app
      - online_banking
      - branch
      basis: ai_inferred
      rationale: Victims send repeated payments to fake partners or platforms, sometimes funded by personal
        loans; branch staff may spot coercion.
  sectors:
  - banking
  - payments
  - crypto
  - fintech
  sources:
  - FinCEN, Alert on prevalent virtual currency investment scam commonly known as pig butchering (2023)
    <https://www.fincen.gov/resources/advisoriesbulletinsfact-sheets/advisories> [agent-reviewed]
  - FATF, Interpol and Egmont Group, Illicit Financial Flows from Cyber-enabled Fraud (2023) <https://www.fatf-gafi.org/en/publications/Methodsandtrends/illicit-financial-flows-cyber-enabled-fraud.html>
    [corrected, agent-reviewed]
  - UK Finance, Annual Fraud Report (specify year, e.g. 2025) <https://www.ukfinance.org.uk/> [corrected,
    agent-reviewed]
  indicators:
  - ref: IND-TXN-078
    legacy_id: FR-ROM-001
    context: 'Victim-side: a customer with no crypto history makes repeated, rising purchases and onward
      transfers to external wallets within weeks.'
    false_positive_context: Genuine retail interest in crypto.
    controls:
    - CTL-145
    - CTL-068
    - CTL-091
    references:
    - FinCEN, Alert on prevalent virtual currency investment scam commonly known as pig butchering (2023)
  - ref: IND-BEH-078
    legacy_id: FR-ROM-002
    context: 'Victim-side: explanations of payment mention a recent online relationship, overseas partner,
      military or offshore worker who cannot meet.'
    false_positive_context: Genuine long-distance relationships.
    controls:
    - CTL-170
    - CTL-068
    - CTL-075
    references:
    - FinCEN, Alert on prevalent virtual currency investment scam commonly known as pig butchering (2023)
  - ref: IND-CPT-026
    legacy_id: FR-ROM-003
    context: 'Victim-side: payments go to a platform that lacks regulatory authorisation, imitates a legitimate
      firm or is hosted on a recently registered domain.'
    name_in_typology: Investment platform with unlicensed or cloned identity
    false_positive_context: New but legitimate fintech brands.
    controls:
    - CTL-082
    - CTL-032
    - CTL-068
    references:
    - FinCEN, Alert on prevalent virtual currency investment scam commonly known as pig butchering (2023)
  - ref: IND-TXN-079
    legacy_id: FR-ROM-004
    context: 'Mule-side: scam proceeds are split across many personal and corporate accounts before consolidation
      and cash-out.'
    false_positive_context: Payroll or marketplace payouts with similar structure.
    controls:
    - CTL-051
    - CTL-083
    - CTL-049
    references:
    - FinCEN, Alert on prevalent virtual currency investment scam commonly known as pig butchering (2023)
  - ref: IND-TXN-028
    legacy_id: FR-ROM-005
    context: 'Victim-side: after a seemingly profitable period, the customer sends further funds to unlock
      profits.'
    name_in_typology: Large 'withdrawal fee' or 'tax' payment to release gains
    false_positive_context: Genuine exit fees at regulated platforms.
    controls:
    - CTL-068
    - CTL-170
    - CTL-074
    references:
    - FinCEN, Alert on prevalent virtual currency investment scam commonly known as pig butchering (2023)
  - ref: IND-PRD-038
    legacy_id: FR-ROM-006
    context: 'Victim-side: the customer draws credit or equity shortly before sending money away, often
      citing a vague purpose.'
    false_positive_context: Legitimate refinancing for investment.
    controls:
    - CTL-068
    - CTL-170
    - CTL-071
    references:
    - FinCEN, Alert on prevalent virtual currency investment scam commonly known as pig butchering (2023)
  - ref: IND-TXN-080
    legacy_id: FR-ROM-007
    context: 'Victim-side: regular payments or vouchers sent to one beneficiary overseas with emotional
      narratives.'
    false_positive_context: Family support abroad.
    controls:
    - CTL-068
    - CTL-091
    - CTL-074
    references:
    - FinCEN, Alert on prevalent virtual currency investment scam commonly known as pig butchering (2023)
  - ref: IND-BEH-079
    legacy_id: FR-ROM-008
    context: 'Mule-side: recruited accounts receive victim funds and convert quickly to stablecoins or
      wire abroad.'
    false_positive_context: Cross-border workers sending remittances.
    controls:
    - CTL-051
    - CTL-145
    - CTL-083
    references:
    - FinCEN, Alert on prevalent virtual currency investment scam commonly known as pig butchering (2023)
  - ref: IND-BEH-080
    legacy_id: FR-ROM-009
    context: 'Victim-side: customer insists on completing payments, becomes upset with questions or states
      friends and family do not understand.'
    false_positive_context: Customers valuing privacy.
    controls:
    - CTL-170
    - CTL-075
    - CTL-068
    references:
    - FinCEN, Alert on prevalent virtual currency investment scam commonly known as pig butchering (2023)
