  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-CPT-056
  name: Transactions involving entities tied to state support for designated groups
  description: Counterparties publicly linked, by credible reports, to government support for terrorist
    organisations.
  category: counterparty
  severity: high
  detection_type:
  - screening
  - external_intel
  data_sources:
  - sanctions_lists
  - adverse_media
  false_positive_notes: Government-owned entities are widely used in legitimate trade.
