typology:
  id: FR-IDT
  name: Identity Theft and Synthetic Identity
  domain: fraud
  description: Offenders use stolen personal data or blend real and fabricated data to open accounts and
    credit. Synthetic identities are nurtured over time before large drawdowns, making them hard to link
    to a real victim.
  sectors:
  - banking
  - payments
  - fintech
  sources:
  - FATF, Guidance on Digital Identity (2020) <https://www.fatf-gafi.org/en/publications/Fatfrecommendations/Guidance-digital-identity.html>
    [agent-reviewed]
  - UK Finance, Annual Fraud Report (specify year, e.g. 2025) <https://www.ukfinance.org.uk/> [corrected,
    agent-reviewed]
  - FinCEN, advisories on identity-related fraud (general) [too vague, unverified]
  indicators:
  - ref: IND-DOC-006
    legacy_id: FR-IDT-001
    context: Name, address, date of birth or SSN/national ID disagree across bureaux and documents.
    name_in_typology: Application data inconsistent across sources
    false_positive_context: Data entry errors and recent moves.
    controls:
    - CTL-001
    - CTL-049
    - CTL-084
    references:
    - FATF, Guidance on Digital Identity (2020)
  - ref: IND-CUS-031
    legacy_id: FR-IDT-002
    context: 'Synthetic: little history yet applications seek large lines or multiple facilities.'
    false_positive_context: Young adults or new arrivals.
    controls:
    - CTL-084
    - CTL-049
    - CTL-083
    references:
    - FATF, Guidance on Digital Identity (2020)
  - ref: IND-BEH-012
    legacy_id: FR-IDT-003
    context: Shared phone, email or device fingerprint appears across applications with different identities.
    name_in_typology: Same device or contact data across many applicants
    false_positive_context: Shared family devices.
    controls:
    - CTL-090
    - CTL-049
    - CTL-083
    references:
    - FATF, Guidance on Digital Identity (2020)
  - ref: IND-DOC-005
    legacy_id: FR-IDT-004
    context: Document or selfie fails forensic checks, shows reuse or injection attack signs.
    name_in_typology: Identity document shows tampering or deepfake artefacts
    false_positive_context: Poor image quality.
    controls:
    - CTL-001
    - CTL-002
    - CTL-090
    references:
    - FATF, Guidance on Digital Identity (2020)
  - ref: IND-GEO-011
    legacy_id: FR-IDT-005
    context: Multiple unrelated applicants share an address with no occupancy history.
    false_positive_context: Student halls, care homes.
    controls:
    - CTL-049
    - CTL-083
    - CTL-084
    references:
    - FATF, Guidance on Digital Identity (2020)
  - ref: IND-PRD-031
    legacy_id: FR-IDT-006
    context: 'Synthetic: new identity added as authorised user to build a credit score.'
    false_positive_context: Family arrangements.
    controls:
    - CTL-049
    - CTL-084
    - CTL-083
    references:
    - FATF, Guidance on Digital Identity (2020)
  - ref: IND-BEH-068
    legacy_id: FR-IDT-007
    context: 'Victim-side: customer discovers accounts opened in their name through alerts or reports.'
    false_positive_context: Forgotten own accounts.
    controls:
    - CTL-083
    - CTL-094
    - CTL-074
    references:
    - FATF, Guidance on Digital Identity (2020)
  - ref: IND-TXN-026
    legacy_id: FR-IDT-008
    context: 'Perpetrator-side: sudden max utilisation and non-payment after months of good conduct.'
    name_in_typology: Bust-out of newly seasoned account
    false_positive_context: Genuine hardship.
    controls:
    - CTL-037
    - CTL-091
    - CTL-049
    references:
    - FATF, Guidance on Digital Identity (2020)
  - ref: IND-PRD-032
    legacy_id: FR-IDT-009
    context: Identity is used for several products in a short window.
    false_positive_context: Rate shopping.
    controls:
    - CTL-083
    - CTL-001
    - CTL-037
    references:
    - FATF, Guidance on Digital Identity (2020)
