typology:
  id: EC-WILDLIFE
  name: Illegal Wildlife Trade
  domain: environmental_crime
  description: Poaching and trafficking of protected animals and plants and their products, such as ivory,
    rhino horn, pangolin scales, timber species and live animals. Financial signs include front companies
    mixing legal and illegal trade, payments across source, transit and demand countries, and use of trade
    documents falsified to pass inspection.
  sectors:
  - banking
  - payments
  - mvts
  - corporate_services
  sources:
  - FATF, Money Laundering and the Illegal Wildlife Trade (2020) [unverified]
  - FATF, Money Laundering from Environmental Crime (2021) <https://www.fatf-gafi.org/content/fatf-gafi/en/publications/Environmentalcrime/Money-laundering-from-environmental-crime.html>
    [agent-reviewed]
  - 'UNODC, World Wildlife Crime Report: Trafficking in Protected Species (2016, 2020 and 2024 editions)
    [replacement suggested, unverified]'
  - CITES, Convention on International Trade in Endangered Species of Wild Fauna and Flora <https://cites.org>
    [agent-reviewed]
  indicators:
  - ref: IND-DOC-023
    legacy_id: EC-WILDLIFE-001
    context: Customer exports or imports listed species with permits that do not verify, repeat or conflict
      with quantities.
    false_positive_context: Licensed breeders and traders deal in listed species.
    controls:
    - CTL-134
    - CTL-131
  - ref: IND-GEO-008
    legacy_id: EC-WILDLIFE-002
    context: Flows between countries known as supply, transit and demand points linked to a small business.
    false_positive_context: Legitimate trade also uses these corridors.
    controls:
    - CTL-045
    - CTL-011
  - ref: IND-CUS-026
    legacy_id: EC-WILDLIFE-003
    context: Import-export firm in furniture, traditional medicine or seafood with unusually high-value
      shipments or inconsistent product descriptions.
    false_positive_context: Product descriptions may be imprecise.
    controls:
    - CTL-010
    - CTL-124
  - ref: IND-CPT-018
    legacy_id: EC-WILDLIFE-004
    context: Payments to officials or low-income individuals around reserves and ports.
    name_in_typology: Payments to wildlife rangers, border officials or couriers
    severity_in_typology: medium
    false_positive_context: Payroll and local payments are normal.
    controls:
    - CTL-028
    - CTL-094
  - ref: IND-PRD-027
    legacy_id: EC-WILDLIFE-005
    context: Sales of rare animals or carved items with payments through apps and unlabelled products.
    name_in_typology: Use of online marketplaces and social media payments for exotic animals or ivory
    severity_in_typology: medium
    false_positive_context: Antique and pet markets exist lawfully.
    controls:
    - CTL-032
    - CTL-097
  - ref: IND-TXN-022
    legacy_id: EC-WILDLIFE-006
    context: Large cash buys from breeders, farms or auctions, then export.
    name_in_typology: Cash intensive purchases by wholesalers at auctions or farms
    false_positive_context: Farms are cash-heavy in some regions.
    controls:
    - CTL-055
    - CTL-134
  - ref: IND-DOC-024
    legacy_id: EC-WILDLIFE-007
    context: Reconsignment or splits in transit with different declared contents.
    false_positive_context: Transhipment is routine for logistics.
    controls:
    - CTL-123
    - CTL-112
  - ref: IND-CUS-003
    legacy_id: EC-WILDLIFE-008
    context: Customer or associates named in prosecutions, seizures or NGO investigations.
    name_in_typology: Adverse media or enforcement links to wildlife trafficking
    false_positive_context: Allegations may involve different parties.
    controls:
    - CTL-032
    - CTL-097
