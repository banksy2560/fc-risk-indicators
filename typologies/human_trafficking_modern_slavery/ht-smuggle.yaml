typology:
  id: HT-SMUGGLE
  name: Migrant Smuggling
  domain: human_trafficking_modern_slavery
  description: Facilitation of illegal border crossings for payment, typically organised by networks which
    collect fees from migrants or their families, often through informal value transfer, and spend on
    transport, documents and accommodation. Unlike trafficking, consent is initial, but exploitation and
    abuse are common risks.
  sectors:
  - banking
  - mvts
  - payments
  - fintech
  sources:
  - FATF, Money Laundering Risks from Migrant Smuggling (2022)
  - UNODC, Global Study on Smuggling of Migrants
  - FATF, Money Laundering Risks Arising from Trafficking in Human Beings and Smuggling of Migrants (2011)
  - Europol and Interpol, public material on migrant smuggling networks
  indicators:
  - id: HT-SMUGGLE-001
    name: Family remittances for 'travel arrangements' to unfamiliar counterparties
    description: Repeated transfers from diaspora senders to third-country individuals with messages about
      journeys or guarantees.
    category: transaction
    severity: medium
    detection_type:
    - transaction_monitoring
    - investigator_judgement
    data_sources:
    - remittance_data
    - payment_references
    false_positive_notes: Families fund legitimate travel and relocation.
    controls:
    - id: HT-SMUGGLE-001-C1
      name: Reference text analytics
      type: detective
      description: Analyse payment references for smuggling-related language.
      implementation: model
      effectiveness: low
    - id: HT-SMUGGLE-001-C2
      name: Corridor and recipient clustering
      type: detective
      description: Cluster recipients receiving funds from many unrelated senders in transit routes.
      implementation: rule
      effectiveness: medium
  - id: HT-SMUGGLE-002
    name: Guarantee or escrow payments through informal value transfer
    description: Funds held by an agent and released only upon arrival, sometimes via hawala-type providers.
    category: product_channel
    severity: medium
    detection_type:
    - transaction_monitoring
    - external_intel
    data_sources:
    - mvts_data
    - intelligence_reports
    false_positive_notes: Informal remittance is used widely for legitimate reasons.
    controls:
    - id: HT-SMUGGLE-002-C1
      name: MVTS agent due diligence
      type: preventive
      description: Screen and monitor agents and informal providers for risk.
      implementation: process
      effectiveness: medium
    - id: HT-SMUGGLE-002-C2
      name: Informal transfer typology updates
      type: governance
      description: Incorporate typology reports into monitoring.
      implementation: process
      effectiveness: medium
  - id: HT-SMUGGLE-003
    name: Purchase of vessels, vehicles or boats and cash payments to boat suppliers
    description: Purchases of inflatable boats, engines, vans or lorries paid in cash by individuals with
      no business purpose.
    category: transaction
    severity: high
    detection_type:
    - transaction_monitoring
    - investigator_judgement
    data_sources:
    - card_data
    - merchant_data
    false_positive_notes: Hobbyists and small businesses buy boats and engines.
    controls:
    - id: HT-SMUGGLE-003-C1
      name: Merchant red-flag reporting
      type: preventive
      description: Encourage retailers to report bulk purchases consistent with smuggling.
      implementation: process
      effectiveness: medium
    - id: HT-SMUGGLE-003-C2
      name: Purchase pattern rules
      type: detective
      description: Flag grouped purchases of marine equipment by unrelated customers.
      implementation: rule
      effectiveness: medium
  - id: HT-SMUGGLE-004
    name: Accounts receiving numerous small deposits then immediate withdrawals near borders
    description: Account in border or transit area receives funds from multiple foreign senders and cash
      is withdrawn within hours.
    category: geographic
    severity: medium
    detection_type:
    - transaction_monitoring
    data_sources:
    - atm_data
    - payment_records
    false_positive_notes: Cross-border traders and workers may cluster.
    controls:
    - id: HT-SMUGGLE-004-C1
      name: Border region transaction scenarios
      type: detective
      description: Tune scenarios by geography and sender-recipient diversity.
      implementation: rule
      effectiveness: medium
    - id: HT-SMUGGLE-004-C2
      name: Cash withdrawal profiling
      type: detective
      description: Profile ATM withdrawals in border towns.
      implementation: model
      effectiveness: medium
  - id: HT-SMUGGLE-005
    name: Hotel, safe house or apartment payments for groups in transit hubs
    description: Short stays booked for many persons, paid by one individual or cash.
    category: transaction
    severity: medium
    detection_type:
    - transaction_monitoring
    - investigator_judgement
    data_sources:
    - card_data
    - booking_data
    false_positive_notes: Tourism, events and tour operators.
    controls:
    - id: HT-SMUGGLE-005-C1
      name: Accommodation payment monitoring
      type: detective
      description: Flag repeated group accommodation by unrelated payers.
      implementation: rule
      effectiveness: low
    - id: HT-SMUGGLE-005-C2
      name: Hospitality sector awareness
      type: preventive
      description: Train sector partners to share indicators.
      implementation: training
      effectiveness: medium
  - id: HT-SMUGGLE-006
    name: Document fraud service payments
    description: Payments to document brokers, translators and forged document suppliers.
    category: counterparty
    severity: high
    detection_type:
    - investigator_judgement
    - external_intel
    data_sources:
    - adverse_media
    - payment_records
    false_positive_notes: Legitimate translation and visa agencies exist.
    controls:
    - id: HT-SMUGGLE-006-C1
      name: Visa agent licensing checks
      type: preventive
      description: Verify immigration advice providers are licensed.
      implementation: process
      effectiveness: medium
    - id: HT-SMUGGLE-006-C2
      name: Law enforcement liaison
      type: governance
      description: Establish rapid contact for suspected document fraud networks.
      implementation: process
      effectiveness: high
  - id: HT-SMUGGLE-007
    name: Individuals receiving funds from many senders without family relation
    description: A single recipient collects funds from many unrelated senders in different countries.
    category: customer
    severity: medium
    detection_type:
    - transaction_monitoring
    - kyc_review
    data_sources:
    - payment_records
    - kyc_files
    false_positive_notes: Community leaders and aid groups may collect donations.
    controls:
    - id: HT-SMUGGLE-007-C1
      name: Many-to-one recipient rule
      type: detective
      description: Detect recipients with high sender diversity inconsistent with profile.
      implementation: rule
      effectiveness: medium
    - id: HT-SMUGGLE-007-C2
      name: Recipient purpose enquiry
      type: preventive
      description: Ask recipients about source and purpose with careful, non-discriminatory process.
      implementation: process
      effectiveness: medium
  - id: HT-SMUGGLE-008
    name: Social-media-advertised travel services using payment apps
    description: Informal operators promote crossing services and collect fees through payment apps or
      crypto.
    category: product_channel
    severity: medium
    detection_type:
    - external_intel
    - transaction_monitoring
    data_sources:
    - open_source
    - crypto_data
    false_positive_notes: Genuine travel agents use social platforms.
    controls:
    - id: HT-SMUGGLE-008-C1
      name: Open-source monitoring
      type: detective
      description: Monitor platforms for smuggling advertisements linked to payment identifiers.
      implementation: technology
      effectiveness: medium
    - id: HT-SMUGGLE-008-C2
      name: Crypto address screening
      type: detective
      description: Screen addresses against shared intelligence.
      implementation: technology
      effectiveness: medium
  - id: HT-SMUGGLE-009
    name: Exit fees or debt bondage reports from customer
    description: Customer reveals owing large sums to a facilitator, or being pressured to repay.
    category: behavioural
    severity: high
    detection_type:
    - customer_behaviour
    - investigator_judgement
    data_sources:
    - branch_observations
    - call_notes
    false_positive_notes: Customers may be owing legitimate loans.
    controls:
    - id: HT-SMUGGLE-009-C1
      name: Safeguarding and referral protocol
      type: governance
      description: Provide staff with referral routes to victim support and law enforcement.
      implementation: process
      effectiveness: high
    - id: HT-SMUGGLE-009-C2
      name: Staff awareness training
      type: preventive
      description: Train staff on bondage and smuggling-debt signals.
      implementation: training
      effectiveness: medium
