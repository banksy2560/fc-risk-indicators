typology:
  id: SANC-CRYPTO
  name: Crypto Sanctions Evasion
  domain: sanctions
  description: Designated persons and sanctioned jurisdictions may use virtual assets to hold or move
    value outside the traditional banking system, via exchanges with weak controls, unhosted wallets,
    mixers and cross-chain swaps. Blockchain analytics, geolocation and travel rule data are the core
    detection tools.
  sectors:
  - crypto
  - fintech
  - banking
  sources:
  - OFAC, Updated Guidance for the Virtual Currency Industry (Sanctions Compliance Guidance for the Virtual
    Currency Industry, 2021)
  - 'FATF, Virtual Assets: Targeted Updates (annual)'
  - OFSI, Cryptoasset guidance (general reference)
  indicators:
  - id: SANC-CRYPTO-001
    name: Wallet addresses attributed to designated persons
    description: Customer transacts with addresses published in sanctions lists or attributed by analytics.
    category: counterparty
    severity: high
    detection_type:
    - screening
    - transaction_monitoring
    data_sources:
    - blockchain_analytics
    - designation_lists
    false_positive_notes: Address clustering errors occur.
    controls:
    - id: SANC-CRYPTO-001-C1
      name: Address screening
      type: preventive
      description: Screen addresses on deposit and withdrawal.
      implementation: technology
      effectiveness: high
    - id: SANC-CRYPTO-001-C2
      name: Block and freeze playbook
      type: corrective
      description: Apply designated-party blocks consistent with legal duties.
      implementation: process
      effectiveness: high
    - id: SANC-CRYPTO-001-C3
      name: List update synchronisation
      type: preventive
      description: Update address lists promptly.
      implementation: rule
      effectiveness: medium
  - id: SANC-CRYPTO-002
    name: Access from sanctioned jurisdictions via VPN or proxy
    description: Technical indicators suggest the user is located in a comprehensively sanctioned area.
    category: geographic
    severity: high
    detection_type:
    - transaction_monitoring
    - kyc_review
    data_sources:
    - ip_data
    - device_data
    false_positive_notes: Privacy tools are widely used.
    controls:
    - id: SANC-CRYPTO-002-C1
      name: IP and device geoblocking
      type: preventive
      description: Block access using layered signals.
      implementation: technology
      effectiveness: medium
    - id: SANC-CRYPTO-002-C2
      name: Behavioural geolocation review
      type: detective
      description: Review behavioural cues of location.
      implementation: model
      effectiveness: medium
  - id: SANC-CRYPTO-003
    name: Exposure to non-compliant exchanges in sanctioned or high-risk locations
    description: Funds flow to or from VASPs known for weak sanctions controls.
    category: counterparty
    severity: high
    detection_type:
    - transaction_monitoring
    - external_intel
    data_sources:
    - blockchain_analytics
    false_positive_notes: Indirect exposure is difficult to assess.
    controls:
    - id: SANC-CRYPTO-003-C1
      name: VASP due diligence
      type: preventive
      description: Assess counterparties' controls.
      implementation: process
      effectiveness: medium
    - id: SANC-CRYPTO-003-C2
      name: Exposure thresholds
      type: detective
      description: Set direct and indirect exposure limits.
      implementation: rule
      effectiveness: medium
  - id: SANC-CRYPTO-004
    name: Use of mixers or privacy services after inbound transfers from higher-risk sources
    description: Funds are obfuscated shortly after arrival.
    category: product_channel
    severity: medium
    detection_type:
    - transaction_monitoring
    data_sources:
    - blockchain_analytics
    false_positive_notes: Privacy use is lawful.
    controls:
    - id: SANC-CRYPTO-004-C1
      name: Obfuscation exposure rule
      type: detective
      description: Flag mixing and privacy-service exposure.
      implementation: rule
      effectiveness: medium
    - id: SANC-CRYPTO-004-C2
      name: Customer explanation
      type: preventive
      description: Seek rationale.
      implementation: process
      effectiveness: medium
  - id: SANC-CRYPTO-005
    name: Ransom or stolen funds paid to addresses linked to designated actors
    description: Wallets receive funds from ransomware or theft with attribution.
    category: typology_specific
    severity: high
    detection_type:
    - external_intel
    - screening
    data_sources:
    - threat_intelligence
    false_positive_notes: Victims pay without knowing attribution.
    controls:
    - id: SANC-CRYPTO-005-C1
      name: Threat intel integration
      type: preventive
      description: Integrate intelligence feeds.
      implementation: technology
      effectiveness: high
    - id: SANC-CRYPTO-005-C2
      name: Victim payment guidance
      type: governance
      description: Provide guidance on sanctions risk of ransom payments.
      implementation: policy
      effectiveness: medium
  - id: SANC-CRYPTO-006
    name: Large OTC or peer-to-peer purchases paid in cash or non-bank rails
    description: Purchases with limited traceability to source of funds.
    category: transaction
    severity: medium
    detection_type:
    - transaction_monitoring
    - kyc_review
    data_sources:
    - otc_records
    false_positive_notes: Cash purchase happens in some markets.
    controls:
    - id: SANC-CRYPTO-006-C1
      name: Source-of-funds checks
      type: preventive
      description: Verify source of large purchases.
      implementation: process
      effectiveness: medium
    - id: SANC-CRYPTO-006-C2
      name: P2P limits
      type: preventive
      description: Set limits.
      implementation: policy
      effectiveness: medium
  - id: SANC-CRYPTO-007
    name: Stablecoin use to hold value of designated person's funds
    description: Large stablecoin balances held with limited stated purpose by customers linked to designated
      persons.
    category: transaction
    severity: medium
    detection_type:
    - kyc_review
    - transaction_monitoring
    data_sources:
    - wallet_data
    false_positive_notes: Stablecoins are widely used for savings.
    controls:
    - id: SANC-CRYPTO-007-C1
      name: Beneficial owner screening
      type: preventive
      description: Screen customers and owners.
      implementation: rule
      effectiveness: medium
    - id: SANC-CRYPTO-007-C2
      name: Large-balance review
      type: detective
      description: Review large balances for source.
      implementation: rule
      effectiveness: medium
  - id: SANC-CRYPTO-008
    name: Account sharing or intermediary accounts used by third parties
    description: Customer account is used for third-party funds.
    category: behavioural
    severity: medium
    detection_type:
    - transaction_monitoring
    - customer_behaviour
    data_sources:
    - account_activity
    false_positive_notes: Family sharing occurs.
    controls:
    - id: SANC-CRYPTO-008-C1
      name: Device and behaviour analytics
      type: detective
      description: Detect shared use.
      implementation: model
      effectiveness: medium
    - id: SANC-CRYPTO-008-C2
      name: Terms of use enforcement
      type: corrective
      description: Close accounts for violations.
      implementation: process
      effectiveness: low
