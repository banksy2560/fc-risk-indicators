typology:
  id: FR-SCOMP
  name: Scam compounds and end-to-end scam-proceeds flows
  domain: fraud
  description: 'Industrialised online-fraud operations (investment, romance and impersonation scams, including
    pig-butchering) run from compound-style premises, often staffed by people recruited under false pretences
    and held in forced labour. The financial footprint spans victim payments, recruited receiving accounts,
    consolidation, crypto conversion and cash-out, plus corporate fronts and infrastructure spending that
    sustain the operation. Defensive framing: this entry lists observable financial signals for institutions,
    not operating methods. See FR-ROM (victim journey) and HT-FORCEDLAB (labour exploitation) for context
    only.'
  exposure:
    channels:
    - online_platform
    - remote_contact
    - online_banking
    - mobile_app
    payment_rails:
    - fast_payments
    - crypto_onramp_offramp
    - wire_swift
    - cross_border_remittance
    customer_segments:
    - retail
    - sme
    - fintech_psp
    products:
    - transaction_account
    - crypto_custody
    basis: ai_inferred
    rationale: Victims approached via social and messaging platforms; mule accounts collect and consolidate,
      then crypto off-ramps or wires abroad.
    consumer:
      relevant: true
      products:
      - transaction_account
      - savings_account
      channels:
      - mobile_app
      - online_banking
      - branch
      basis: ai_inferred
      rationale: Recruited mule everyday and savings accounts collect and consolidate scam proceeds before
        crypto or offshore cash-out.
  sectors:
  - banking
  - payments
  - crypto
  - fintech
  - mvts
  sources:
  - FATF, INTERPOL and Egmont Group, Illicit Financial Flows from Cyber-enabled Fraud (2023) [unverified]
  - FinCEN, Alert on Prevalent Virtual Currency Investment Scam Commonly Known as Pig Butchering (2023)
    [unverified]
  - UNODC, Transnational Organized Crime and the Convergence of Cyber-Enabled Fraud, Underground Banking
    and Technological Innovation in Southeast Asia (2024) [unverified]
  - 'FATF, Combating End-to-End Illicit Financial Flows Linked to Scam Compounds: Applying the FATF Toolkit
    to the Fraud Epidemic (2026-11-05) <https://www.fatf-gafi.org/en/publications/Methodsandtrends/combating-illicit-financial-flows-linked-to-scam-compounds.html>
    [agent-retrieved 2026-11-27]'
  - FinCEN (US Treasury), FinCEN Alert on Money Laundering Activity Associated with Digital Asset Investment
    Scam Centers (FIN-2026-Alert005) (2026-09-03) <https://www.fincen.gov/system/files/2026-08/FinCEN-Alert-Scam-Centers.pdf>
    [agent-retrieved 2026-11-27]
  indicators:
  - ref: IND-BEH-079
    context: Recruited or complicit account holders receive victim funds and quickly convert to stablecoins
      or wire abroad, the core mule step in the compound payment chain.
    controls:
    - CTL-051
    - CTL-095
    - CTL-103
  - ref: IND-TXN-003
    context: A low-activity account receives payments from several apparent investment or romance scam
      victims, sometimes with narratives referencing a "platform" or "trading".
    controls:
    - CTL-051
    - CTL-041
    - CTL-054
  - ref: IND-CUS-028
    context: New or reactivated receiving accounts collect payments from unrelated individuals, matching
      the collection tier that feeds a compound's consolidation accounts.
    controls:
    - CTL-054
    - CTL-051
  - ref: IND-TXN-079
    context: Victim payments are split across many personal and corporate accounts then consolidated to
      a small number of accounts or exchange deposits.
    controls:
    - CTL-041
    - CTL-048
  - ref: IND-TYP-002
    context: Victim deposits or onward transfers reach wallet addresses attributed by analytics providers
      to fake investment platforms or scam clusters.
    controls:
    - CTL-145
    - CTL-149
  - ref: IND-CPT-037
    context: Dozens of apparently unrelated receiving or onboarding accounts share devices, IP ranges,
      phone numbers or documents, indicating one operating group behind many accounts.
    controls:
    - CTL-049
    - CTL-090
  - ref: IND-TXN-002
    context: Scam proceeds leave rapidly to offshore accounts or are converted to virtual assets within
      hours of credit, the cash-out end of the chain.
    controls:
    - CTL-040
    - CTL-145
  - ref: IND-CPT-011
    context: Consolidated proceeds are sent to exchanges, OTC desks or platforms with weak licensing or
      AML controls, enabling off-ramp into fiat or further layering.
    controls:
    - CTL-149
    - CTL-147
  - ref: IND-CUS-054
    context: Front or service companies that fund the physical and technical operation of a compound appear
      as customers whose spending profile fits infrastructure rather than their declared business.
    controls:
    - CTL-042
    - CTL-053
    - CTL-010
  - ref: IND-TYP-061
    context: Families of people held in forced labour at a compound may pay demanded sums; the customer
      can be a victim of coercion and needs a referral path rather than an exit.
    controls:
    - CTL-100
    - CTL-170
    - CTL-052
  - ref: IND-CPT-067
    context: 'Upstream footprint of the operation: payments for phone numbers, connectivity, hosting,
      cloud or computing capacity, advertising and unusually high electricity or internet bills.'
    controls:
    - CTL-178
    - CTL-042
    references:
    - 'FATF, Combating End-to-End Illicit Financial Flows Linked to Scam Compounds: Applying the FATF
      Toolkit to the Fraud Epidemic (2026-11-05) <https://www.fatf-gafi.org/en/publications/Methodsandtrends/combating-illicit-financial-flows-linked-to-scam-compounds.html>
      [agent-retrieved 2026-11-27]'
  - ref: IND-PRD-071
    context: Victim payments are collected through virtual account numbers (e.g. virtual IBANs) that hide
      the underlying account or institution.
    controls:
    - CTL-109
    - CTL-053
    references:
    - 'FATF, Combating End-to-End Illicit Financial Flows Linked to Scam Compounds: Applying the FATF
      Toolkit to the Fraud Epidemic (2026-11-05) <https://www.fatf-gafi.org/en/publications/Methodsandtrends/combating-illicit-financial-flows-linked-to-scam-compounds.html>
      [agent-retrieved 2026-11-27]'
  - ref: IND-CUS-008
    context: Bought, sold or stolen identities used to open multiple accounts or wallets across providers,
      defeating name matching.
    controls:
    - CTL-004
    - CTL-049
    references:
    - 'FATF, Combating End-to-End Illicit Financial Flows Linked to Scam Compounds: Applying the FATF
      Toolkit to the Fraud Epidemic (2026-11-05) <https://www.fatf-gafi.org/en/publications/Methodsandtrends/combating-illicit-financial-flows-linked-to-scam-compounds.html>
      [agent-retrieved 2026-11-27]'
  - ref: IND-TXN-164
    context: Proceeds pass through DeFi services without AML controls and come back as stablecoins that
      are cashed out.
    controls:
    - CTL-145
    - CTL-147
    references:
    - FinCEN (US Treasury), FinCEN Alert on Money Laundering Activity Associated with Digital Asset Investment
      Scam Centers (FIN-2026-Alert005) (2026-09-03) <https://www.fincen.gov/system/files/2026-08/FinCEN-Alert-Scam-Centers.pdf>
      [agent-retrieved 2026-11-27]
  - ref: IND-TYP-069
    context: Laundering through guarantee-marketplace infrastructure linked to scam centres.
    controls:
    - CTL-145
    - CTL-149
    references:
    - FinCEN (US Treasury), FinCEN Alert on Money Laundering Activity Associated with Digital Asset Investment
      Scam Centers (FIN-2026-Alert005) (2026-09-03) <https://www.fincen.gov/system/files/2026-08/FinCEN-Alert-Scam-Centers.pdf>
      [agent-retrieved 2026-11-27]
  - ref: IND-CPT-064
    context: Victim funds sent to a remitter or exchange advertising 'no KYC' or a false regulator approval.
    controls:
    - CTL-116
    - CTL-068
    references:
    - FinCEN (US Treasury), FinCEN Alert on Money Laundering Activity Associated with Digital Asset Investment
      Scam Centers (FIN-2026-Alert005) (2026-09-03) <https://www.fincen.gov/system/files/2026-08/FinCEN-Alert-Scam-Centers.pdf>
      [agent-retrieved 2026-11-27]
