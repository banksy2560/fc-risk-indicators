typology:
  id: XC-ONBOARDING-DOC
  name: Onboarding Documentation and Identity Integrity
  domain: cross_cutting
  description: Inherent-risk factors seen during onboarding and refresh that suggest false, altered or
    reused identity information. Covers document fraud, inconsistent details, fictitious addresses and
    identifiers shared across unrelated customers.
  sectors:
  - all
  sources:
  - FATF, Guidance for a Risk-Based Approach (sector-specific guidance series, general principles)
  - FATF Recommendations, Recommendation 1 and Interpretive Note (assessing risks and applying a risk-based
    approach)
  - Wolfsberg Group, Guidance on a Risk Based Approach for Managing Money Laundering Risks
  indicators:
  - ref: IND-DOC-005
    legacy_id: XC-ONBOARDING-DOC-001
    context: Document shows signs of tampering, font or layout anomalies, or fails security-feature checks.
    name_in_typology: Suspected forged or altered identity document
    false_positive_context: Worn or poorly scanned genuine documents can fail checks.
    controls:
    - CTL-002
    - CTL-001
    - CTL-004
  - ref: IND-DOC-006
    legacy_id: XC-ONBOARDING-DOC-002
    context: Names, dates of birth or addresses differ between documents or from the application.
    name_in_typology: Inconsistent personal details across documents
    severity_in_typology: medium
    false_positive_context: Transliteration, marriage name changes and typos are common.
    controls:
    - CTL-002
  - ref: IND-DOC-007
    legacy_id: XC-ONBOARDING-DOC-003
    context: Address does not exist, is a mail drop, or fails verification against authoritative data.
    false_positive_context: New builds and rural addresses may not be in databases.
    controls:
    - CTL-003
  - ref: IND-DOC-008
    legacy_id: XC-ONBOARDING-DOC-004
    context: Same phone, email, address, device or ID number appears across multiple unrelated customers.
    false_positive_context: Families and shared households legitimately share details.
    controls:
    - CTL-049
    - CTL-004
  - ref: IND-DOC-009
    legacy_id: XC-ONBOARDING-DOC-005
    context: Thin or newly created credit and digital footprint, mixed attributes from different real
      persons.
    name_in_typology: Synthetic or fabricated identity indicators
    false_positive_context: Young or recently arrived people have thin files.
    controls:
    - CTL-004
    - CTL-083
  - ref: IND-DOC-010
    legacy_id: XC-ONBOARDING-DOC-006
    context: Same image or document submitted for different applicants or after previous rejection.
    name_in_typology: Documents reused across applications
    false_positive_context: Resubmission after a poor-quality upload is legitimate.
    controls:
    - CTL-002
    - CTL-004
  - ref: IND-DOC-011
    legacy_id: XC-ONBOARDING-DOC-007
    context: Applicant offers documents of limited reliability or unusual types without explanation.
    false_positive_context: Some populations lack standard documents.
    controls:
    - CTL-002
  - ref: IND-DOC-012
    legacy_id: XC-ONBOARDING-DOC-008
    context: Application data matches known fraud, mule or exited-customer records.
    false_positive_context: Common names cause false matches.
    controls:
    - CTL-029
    - CTL-033
  - ref: IND-BEH-018
    legacy_id: XC-ONBOARDING-DOC-009
    context: Customer or intermediary urges bypassing checks or relies on personal connections.
    name_in_typology: Pressure to complete onboarding quickly
    false_positive_context: Commercial deadlines are common.
    controls:
    - CTL-025
    - CTL-170
  - ref: IND-DOC-013
    legacy_id: XC-ONBOARDING-DOC-010
    context: Later instructions carry signatures or contact details that depart from onboarding records.
    false_positive_context: Signatures naturally vary.
    controls:
    - CTL-070
