typology:
  id: CY-MVTS
  name: Mobile Money and Remittance (MVTS) Abuse
  domain: cyber_enabled
  description: Money or value transfer services and mobile money wallets move funds quickly across borders,
    often to cash-based endpoints. Offenders use them to send scam proceeds, structure payments through
    many senders and receivers, and operate unlicensed or complicit agents. Cyber-enabled aspects include
    compromised wallets, SIM swaps and automated account farms.
  exposure:
    channels:
    - agent_network
    - mobile_app
    payment_rails:
    - cross_border_remittance
    - stored_value_wallet
    - cash
    customer_segments:
    - retail
    - new_to_bank
    - fintech_psp
    products:
    - prepaid_stored_value
    basis: ai_inferred
    rationale: Mobile money and remittance with agent cash endpoints and SIM-swap abuse.
    consumer:
      relevant: false
      products: []
      channels: []
      basis: ai_inferred
      rationale: Mobile money and remittance operator abuse with agent cash endpoints; out of scope for
        consumer deposit and credit products.
  stage:
  - layering
  sectors:
  - mvts
  - payments
  - fintech
  sources:
  - FATF, Guidance for a Risk-Based Approach to Money or Value Transfer Services (2016) [unverified]
  - FATF, Guidance for a Risk-Based Approach to Prepaid Cards, Mobile Payments and Internet-Based Payment
    Services (2013) <https://www.fatf-gafi.org/content/fatf-gafi/en/publications/Fatfrecommendations/Rba-npps-2013.html>
    [agent-reviewed]
  - FATF, Recommendation 16 and Interpretive Note on payment transparency [unverified]
  indicators:
  - ref: IND-TXN-004
    legacy_id: CY-MVTS-001
    context: Fan-in or fan-out structures with no family or business link.
    name_in_typology: Many senders paying one beneficiary or many beneficiaries paid by one sender
    false_positive_context: Diaspora family support or charity collection.
    controls:
    - CTL-048
    - CTL-037
    - CTL-093
  - ref: IND-TXN-008
    legacy_id: CY-MVTS-002
    context: Repeated sends sized to avoid additional checks.
    name_in_typology: Transfers just under identification or reporting thresholds
    false_positive_context: Small recurring family remittances.
    controls:
    - CTL-037
    - CTL-072
    - CTL-093
  - ref: IND-CUS-002
    legacy_id: CY-MVTS-003
    context: Low-income or newly joined sender moves large sums with vague purpose.
    name_in_typology: Sender profile does not match volume or purpose
    false_positive_context: Pooled family funds.
    controls:
    - CTL-023
    - CTL-012
    - CTL-037
  - ref: IND-BEH-010
    legacy_id: CY-MVTS-004
    context: Number is ported or SIM replaced, then funds drained to new payees.
    name_in_typology: Wallet SIM swap followed by outbound transfers
    false_positive_context: Genuine phone replacements.
    controls:
    - CTL-073
    - CTL-091
    - CTL-103
  - ref: IND-CPT-012
    legacy_id: CY-MVTS-005
    context: Agent location processes volumes far above peers, with suspicious customer splitting.
    false_positive_context: High-footfall locations.
    controls:
    - CTL-057
    - CTL-093
    - CTL-162
  - ref: IND-GEO-018
    legacy_id: CY-MVTS-006
    context: Receiving corridors are known for weak controls or sanctions risk.
    name_in_typology: Beneficiary account in high-risk or uncooperative jurisdiction
    false_positive_context: Legitimate corridors for diaspora.
    controls:
    - CTL-029
    - CTL-149
    - CTL-023
  - ref: IND-BEH-012
    legacy_id: CY-MVTS-007
    context: Single device initiates transfers for multiple apparent customers.
    name_in_typology: Same device or phone used by many senders
    severity_in_typology: medium
    false_positive_context: Shared household or shop devices.
    controls:
    - CTL-091
    - CTL-048
    - CTL-004
  - ref: IND-TXN-032
    legacy_id: CY-MVTS-008
    context: Value passes through several mobile wallets within hours before cash-out.
    name_in_typology: Rapid wallet-to-wallet hops then cash-out at agent
    false_positive_context: Peer-to-peer payments.
    controls:
    - CTL-051
    - CTL-048
    - CTL-037
  - ref: IND-DOC-015
    legacy_id: CY-MVTS-009
    context: Payment messages incomplete, inconsistent or use placeholder data.
    name_in_typology: Missing or inconsistent originator and beneficiary information
    severity_in_typology: medium
    false_positive_context: Poor data from correspondent partners.
    controls:
    - CTL-146
    - CTL-149
    - CTL-093
  - ref: IND-TYP-013
    legacy_id: CY-MVTS-010
    context: Individuals operate collection points or chat-app based services with no licence.
    false_positive_context: Informal community services without profit.
    controls:
    - CTL-083
    - CTL-093
    - CTL-103
