typology:
  id: ML-HVG
  name: High-Value Goods (Art, Jewellery, Precious Metals, Luxury Vehicles)
  domain: money_laundering
  description: Purchase, trade and storage of portable, high-value assets, often with cash, to convert
    and store proceeds. Price subjectivity and confidentiality make valuation and origin hard to verify.
  stage:
  - placement
  - layering
  - integration
  sectors:
  - dnfbp
  - art_luxury
  sources:
  - FATF, Money Laundering and Terrorist Financing in the Art and Antiquities Market (2023) [unverified]
  - FATF, Money Laundering and Terrorist Financing Risks and Vulnerabilities Associated with Gold (2015)
    <https://www.fatf-gafi.org/en/publications/Methodsandtrends/ml-tf-risks-vulnerabilities-gold.html>
    [agent-reviewed]
  - FATF, Guidance on the Risk-Based Approach for Dealers in Precious Metals and Stones (2008) <https://www.fatf-gafi.org/>
    [agent-reviewed]
  indicators:
  - ref: IND-TXN-021
    legacy_id: ML-HVG-001
    context: Payments in cash, or from unrelated parties.
    name_in_typology: Cash or third-party payments for high-value items
    false_positive_context: Cash sales are legal in some places.
    controls:
    - CTL-062
    - CTL-046
  - ref: IND-TXN-020
    legacy_id: ML-HVG-002
    context: Price above or below a credible valuation.
    name_in_typology: Price disproportionate to value
    false_positive_context: Subjective art value.
    controls:
    - CTL-141
    - CTL-124
    - CTL-123
  - ref: IND-BEH-015
    legacy_id: ML-HVG-003
    context: Little interest in provenance or negotiation.
    name_in_typology: Buyer indifferent to quality, authenticity or price
    false_positive_context: Collectors vary.
    controls:
    - CTL-170
    - CTL-135
  - ref: IND-BEH-014
    legacy_id: ML-HVG-004
    context: Item bought then resold or returned for different payment form.
    name_in_typology: Rapid resale or return for refund by cheque
    false_positive_context: Genuine returns.
    controls:
    - CTL-150
    - CTL-089
  - ref: IND-OWN-003
    legacy_id: ML-HVG-005
    context: Items held through opaque vehicles or storage.
    name_in_typology: Use of freeports or offshore storage and shell owners
    false_positive_context: Tax-neutral storage used by collectors.
    controls:
    - CTL-005
    - CTL-127
  - ref: IND-DOC-021
    legacy_id: ML-HVG-006
    context: Gold or stones from unverified origin or recycled scrap.
    name_in_typology: Unclear provenance or sourcing of metals and stones
    false_positive_context: Informal supply chains.
    controls:
    - CTL-135
    - CTL-136
    - CTL-131
  - ref: IND-TYP-035
    legacy_id: ML-HVG-007
    context: Luxury cars bought and shipped abroad soon after.
    false_positive_context: Exporters operate.
    controls:
    - CTL-134
    - CTL-024
  - ref: IND-CUS-001
    legacy_id: ML-HVG-008
    context: Spend exceeds known means.
    name_in_typology: Purchases inconsistent with customer profile
    severity_in_typology: medium
    false_positive_context: Wealth events.
    controls:
    - CTL-012
    - CTL-043
  - ref: IND-CPT-036
    legacy_id: ML-HVG-009
    context: Agents or anonymous bidding.
    false_positive_context: Privacy requests.
    controls:
    - CTL-021
    - CTL-024
