- id: IND-CPT-058
  name: Payments from or to unrelated third parties
  description: Funds are paid or received, or instructions are given to pay, through parties with no evident
    link to the customer, contract, debt or insured interest. Includes third-party cheques, loan repayments,
    premiums, gaming funds and goods payments not matching the documentation.
  category: counterparty
  severity: medium
  detection_type:
  - transaction_monitoring
  - kyc_review
  data_sources:
  - transaction_records
  - customer_profile
  - contract_documents
  false_positive_notes: Legitimate third-party payers exist, such as family members, parents, guarantors,
    payment agents or corporate treasury entities, and are usually explainable with documentation.
