typology:
  id: OP-DRUGS
  name: Drug Trafficking and Precursor Chemicals (incl. Synthetic Opioids)
  domain: other_predicate
  description: Production and trafficking of illicit drugs, diversion of precursor chemicals and sale
    of synthetic opioids, generating cash proceeds that are placed and moved through retail accounts,
    trade, couriers and professional money launderers. Chemical and equipment purchases, online sales
    and pill-press activity are additional signals.
  exposure:
    channels:
    - branch
    - atm
    payment_rails:
    - cash
    - crypto_onramp_offramp
    - cross_border_remittance
    - trade_instruments
    customer_segments:
    - retail
    - sole_trader
    - sme
    products:
    - transaction_account
    basis: ai_inferred
    rationale: Cash deposits from multiple locations, precursor purchases and IVTS/trade.
    consumer:
      relevant: true
      products:
      - transaction_account
      - savings_account
      channels:
      - branch
      - mobile_app
      - online_banking
      basis: ai_inferred
      rationale: Drug cash placed as many small deposits into retail accounts then moved on digitally;
        lifestyle spend funded by cash.
  sectors:
  - banking
  - payments
  - mvts
  - crypto
  - fintech
  sources:
  - FATF, Professional Money Laundering (2018) [unverified]
  - UNODC, World Drug Report (annual; specify year) [corrected, unverified]
  - INCB, Precursors and Chemicals Frequently Used in the Illicit Manufacture of Narcotic Drugs and Psychotropic
    Substances (annual report; specify year) [corrected, unverified]
  - FinCEN, Advisory to Financial Institutions on Illicit Financial Schemes and Methods Related to the
    Trafficking of Fentanyl and Other Synthetic Opioids (FIN-2019-A006, 2019) [replacement suggested,
    unverified]
  indicators:
  - ref: IND-TXN-007
    legacy_id: OP-DRUGS-001
    context: Many low-value cash deposits into one account from different locations, often followed by
      wires out.
    name_in_typology: Structured cash deposits across many branches by multiple people
    false_positive_context: Retail businesses deposit cash daily.
    controls:
    - CTL-041
    - CTL-024
  - ref: IND-PRD-057
    legacy_id: OP-DRUGS-002
    context: Customer buys large chemical quantities, pill presses or glassware inconsistent with stated
      business.
    false_positive_context: Industrial and academic buyers legitimately purchase chemicals.
    controls:
    - CTL-128
    - CTL-029
  - ref: IND-CPT-046
    legacy_id: OP-DRUGS-003
    context: Importers deal with unfamiliar overseas parties in high-risk corridors for precursor sources.
    false_positive_context: Chemical trade is large and lawful.
    controls:
    - CTL-130
    - CTL-045
  - ref: IND-BEH-100
    legacy_id: OP-DRUGS-004
    context: Customer or associates tied to seized cash or declarations.
    false_positive_context: Cash is legal to carry within limits.
    controls:
    - CTL-096
    - CTL-095
    - CTL-063
    - CTL-062
  - ref: IND-TXN-016
    legacy_id: OP-DRUGS-005
    context: Payments settled by matching transactions in different countries without cross-border transfers.
    name_in_typology: Chinese-underground-banking or mirror-transaction style offsets
    false_positive_context: Peer-to-peer exchanges may match.
    controls:
    - CTL-047
    - CTL-171
  - ref: IND-BEH-101
    legacy_id: OP-DRUGS-006
    context: Lifestyle spending and asset purchases funded by cash.
    false_positive_context: Lifestyle may come from legitimate income.
    controls:
    - CTL-043
  - ref: IND-PRD-027
    legacy_id: OP-DRUGS-007
    context: Receipt of numerous small payments from unrelated persons and crypto conversions to cash.
    name_in_typology: Dark-web or social media sales with crypto or payment app proceeds
    false_positive_context: Peer-to-peer marketplaces are common.
    controls:
    - CTL-145
    - CTL-051
  - ref: IND-CUS-046
    legacy_id: OP-DRUGS-008
    context: Dispensing, imports or payments exceeding peers for controlled substances.
    false_positive_context: Specialist clinics may have high volumes.
    controls:
    - CTL-042
    - CTL-024
  - ref: IND-OWN-007
    legacy_id: OP-DRUGS-009
    context: New firm purchases machines and packaging with no production site.
    name_in_typology: Shell companies buying pill presses or tableting equipment
    false_positive_context: Start-ups source equipment.
    controls:
    - CTL-128
    - CTL-057
