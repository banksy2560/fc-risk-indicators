typology:
  id: TF-HAWALA
  name: Hawala and Money or Value Transfer Services for Terrorist Financing
  domain: terrorist_financing
  description: Informal value transfer systems and unregulated or poorly supervised MVTS can move funds
    across borders using settlement by trade, netting or cash, leaving limited records. They are important
    to many legitimate communities but can be abused to transfer money to terrorist actors in regions
    with limited banking access.
  sectors:
  - mvts
  - banking
  - payments
  sources:
  - FATF, The Role of Hawala and Other Similar Service Providers in Money Laundering and Terrorist Financing
    (2013) [unverified]
  - 'FATF, Guidance for a Risk-Based Approach: Money or Value Transfer Services (2016) [corrected, unverified]'
  - FATF Recommendation 14 [unverified]
  indicators:
  - ref: IND-CUS-053
    legacy_id: TF-HAWALA-001
    context: Business accounts of an MVTS or agent receive large pooled deposits and send bulk payments
      to a small set of foreign counterparties.
    false_positive_context: Genuine MVTS legitimately pool funds.
    controls:
    - CTL-116
    - CTL-061
    - CTL-024
  - ref: IND-CUS-005
    legacy_id: TF-HAWALA-002
    context: Customer offers transfers but cannot evidence registration or supervision.
    name_in_typology: Unlicensed operator or no evidence of registration
    false_positive_context: Small agents of licensed principals may hold no own licence.
    controls:
    - CTL-116
    - CTL-016
  - ref: IND-TXN-007
    legacy_id: TF-HAWALA-003
    context: Numerous cash deposits below thresholds by different people into one account, then wires
      to settlement partners.
    name_in_typology: Structured cash deposits across branches followed by overseas settlement
    severity_in_typology: medium
    false_positive_context: Cash-heavy communities and retail trades show similar patterns.
    controls:
    - CTL-038
    - CTL-046
  - ref: IND-TXN-151
    legacy_id: TF-HAWALA-004
    context: Offsetting flows are arranged through trade payments unrelated to the underlying goods.
    false_positive_context: Genuine trade can be netted among related firms.
    controls:
    - CTL-140
    - CTL-124
  - ref: IND-GEO-019
    legacy_id: TF-HAWALA-005
    context: Transfers to recipients in conflict-affected areas with no documented relationship or stated
      purpose.
    name_in_typology: Payments to or from higher-risk jurisdictions without clear relationship
    false_positive_context: Many families lack documentation but have genuine needs.
    controls:
    - CTL-027
    - CTL-041
  - ref: IND-DOC-015
    legacy_id: TF-HAWALA-006
    context: Payment messages lack complete originator or beneficiary details.
    name_in_typology: Poor or missing sender and recipient information in transfers
    severity_in_typology: medium
    false_positive_context: Systems limitations may cause incomplete data.
    controls:
    - CTL-110
    - CTL-107
  - ref: IND-PRD-066
    legacy_id: TF-HAWALA-007
    context: Operator adds agents quickly in areas with terrorist presence without strengthened oversight.
    false_positive_context: Growth in diaspora markets is common.
    controls:
    - CTL-021
  - ref: IND-OWN-011
    legacy_id: TF-HAWALA-008
    context: Operator, owners or agents match prior reports, adverse media or designation lists.
    name_in_typology: Linked parties with previous suspicious reports or designation
    false_positive_context: Name similarities create false matches.
    controls:
    - CTL-029
    - CTL-101
