typology:
  id: HT-TRAFFICK
  name: Human Trafficking
  domain: human_trafficking_modern_slavery
  description: Recruitment, transport or harbouring of people by force, fraud or coercion for exploitation,
    including sexual exploitation, labour exploitation and domestic servitude. Financial footprints include
    accounts controlled by third parties, payments for advertising, accommodation and travel, and cash
    proceeds moved through money mules. Indicators are signals for victim-centred escalation, not proof.
  exposure:
    channels:
    - branch
    - online_banking
    - mobile_app
    payment_rails:
    - cash
    - card
    - cross_border_remittance
    - loan_disbursement
    customer_segments:
    - retail
    - new_to_bank
    - student_youth
    - sme
    products:
    - transaction_account
    - prepaid_stored_value
    basis: ai_inferred
    rationale: Controlled accounts, cash deposits, adverts and short-stay bookings; front businesses (e.g.
      massage, car-wash, restaurant) with poor payroll evidence.
    consumer:
      relevant: true
      products:
      - transaction_account
      - credit_card
      - personal_loan
      channels:
      - branch
      - mobile_app
      - online_banking
      basis: ai_inferred
      rationale: Third-party controlled accounts, cash deposits, adverts and travel/accommodation spend,
        plus coerced credit.
  sectors:
  - banking
  - payments
  - mvts
  - fintech
  sources:
  - FATF and APG, Financial Flows from Human Trafficking (2018) <https://www.fatf-gafi.org/en/publications/Methodsandtrends/Human-trafficking.html>
    [agent-reviewed]
  - FATF, Money Laundering Risks Arising from Trafficking in Human Beings and Smuggling of Migrants (2011)
    <https://www.fatf-gafi.org/en/publications/Methodsandtrends/Trafficking-human-beings-smuggling-migrants.html>
    [agent-reviewed]
  - UNODC, Global Report on Trafficking in Persons (biennial; specify edition e.g. 2024) <https://www.unodc.org/unodc/en/data-and-analysis/glotip.html>
    [corrected, agent-reviewed]
  - Egmont Group, public material on financial intelligence and human trafficking [too vague, unverified]
  indicators:
  - ref: IND-BEH-005
    legacy_id: HT-TRAFFICK-001
    context: Someone other than the account holder appears to hold the card, PIN or online credentials,
      accompanying the holder or accessing from a shared device.
    name_in_typology: Account controlled by a third party
    false_positive_context: Family members, carers and partners may legitimately help with banking.
    controls:
    - CTL-170
    - CTL-090
  - ref: IND-CUS-007
    legacy_id: HT-TRAFFICK-002
    context: Several new customers share contact details, often in accommodation used to house workers.
    name_in_typology: Multiple unrelated accounts opened with the same address or phone
    severity_in_typology: high
    false_positive_context: Shared households, student housing and hostels create shared addresses.
    controls:
    - CTL-049
    - CTL-100
  - ref: IND-TXN-096
    legacy_id: HT-TRAFFICK-003
    context: Frequent purchases of escort or commercial sex adverts, bulk hotel bookings and short-term
      rentals paid by the same card or account.
    false_positive_context: Hospitality and legitimate escort or event businesses exist.
    controls:
    - CTL-052
  - ref: IND-TXN-030
    legacy_id: HT-TRAFFICK-004
    context: Multiple low-value cash deposits by different people into one account, then rapid onward
      transfer or ATM withdrawal.
    name_in_typology: Cash deposits followed by quick transfers to a handler in another city
    false_positive_context: Group business or family collections can resemble this.
    controls:
    - CTL-041
  - ref: IND-TXN-097
    legacy_id: HT-TRAFFICK-005
    context: Salary, welfare or loan proceeds are withdrawn in full by someone not the account holder
      or sent to a third party on receipt.
    false_positive_context: Remittance to family is common after payday.
    controls:
    - CTL-040
    - CTL-100
  - ref: IND-BEH-004
    legacy_id: HT-TRAFFICK-006
    context: Customer accompanied by a person who speaks for them, avoids eye contact, lacks access to
      documents or appears coached.
    name_in_typology: Customer appears fearful, unable to speak freely, or lacks own ID
    false_positive_context: Language barriers and shyness have other explanations.
    controls:
    - CTL-100
    - CTL-170
    - CTL-171
  - ref: IND-CPT-033
    legacy_id: HT-TRAFFICK-007
    context: Bulk payments for flights, visas and recruitment fees to a labour recruiter, sometimes debt-financed.
    false_positive_context: Genuine recruitment agencies charge fees in some corridors.
    controls:
    - CTL-122
    - CTL-056
  - ref: IND-CUS-012
    legacy_id: HT-TRAFFICK-008
    context: Massage, nail, car-wash, restaurant or agricultural entity with cash patterns and many resident
      staff but poor payroll evidence.
    name_in_typology: Business front for exploitation with revenue not matching staff
    false_positive_context: Small businesses in these sectors are overwhelmingly legitimate.
    controls:
    - CTL-011
    - CTL-056
  - ref: IND-CPT-059
    legacy_id: HT-TRAFFICK-009
    context: Customer or counterparties named in credible reports or law enforcement requests relating
      to trafficking.
    name_in_typology: Adverse media or intelligence on trafficking network associations
    false_positive_context: Reports may involve unrelated namesakes.
    controls:
    - CTL-032
    - CTL-097
