typology:
  id: CY-PAYFAC
  name: Payment Facilitator, High-Risk Merchant and Transaction Laundering
  domain: cyber_enabled
  description: Unauthorised or concealed merchants route card or bank payments through another merchant's
    account (transaction laundering) or use payment facilitators with weak sub-merchant oversight. This
    disguises illegal or high-risk goods and moves funds from fraud, gambling or illicit trade into the
    legitimate system.
  stage:
  - layering
  - integration
  sectors:
  - payments
  - fintech
  - banking
  sources:
  - FATF, Guidance for a Risk-Based Approach to Prepaid Cards, Mobile Payments and Internet-Based Payment
    Services (2013) <https://www.fatf-gafi.org/content/fatf-gafi/en/publications/Fatfrecommendations/Rba-npps-2013.html>
    [agent-reviewed]
  - Card scheme rules on merchant and payment facilitator monitoring (general reference) [too vague, unverified]
  indicators:
  - ref: IND-TYP-016
    legacy_id: CY-PAYFAC-001
    context: Card data show goods or services unrelated to the merchant's declared activity or website.
    false_positive_context: Diversified merchants.
    controls:
    - CTL-057
    - CTL-067
    - CTL-083
  - ref: IND-TXN-010
    legacy_id: CY-PAYFAC-002
    context: Average ticket differs sharply from the merchant category or is repetitive and rounded.
    name_in_typology: Unusual ticket sizes or round amounts
    false_positive_context: Subscription pricing.
    controls:
    - CTL-057
    - CTL-037
    - CTL-093
  - ref: IND-TXN-019
    legacy_id: CY-PAYFAC-003
    context: Chargebacks or refunds exceed scheme thresholds or peer averages.
    name_in_typology: High chargeback and refund ratios
    false_positive_context: Seasonal returns.
    controls:
    - CTL-057
    - CTL-067
    - CTL-103
  - ref: IND-OWN-010
    legacy_id: CY-PAYFAC-004
    context: Many sub-merchants link to the same individuals or accounts.
    name_in_typology: Sub-merchants sharing owners, devices or bank accounts
    false_positive_context: Franchise groups.
    controls:
    - CTL-048
    - CTL-067
    - CTL-093
  - ref: IND-PRD-025
    legacy_id: CY-PAYFAC-005
    context: Live site sells restricted products, redirects or has cloned or hidden pages.
    false_positive_context: Website redesign.
    controls:
    - CTL-067
    - CTL-083
    - CTL-057
  - ref: IND-CPT-013
    legacy_id: CY-PAYFAC-006
    context: Settlement funds are sent immediately to unrelated accounts, often offshore.
    false_positive_context: Group treasury.
    controls:
    - CTL-037
    - CTL-149
    - CTL-093
  - ref: IND-GEO-019
    legacy_id: CY-PAYFAC-007
    context: Sales volume arises from countries unrelated to the merchant's market.
    name_in_typology: Traffic spikes outside merchant geography
    false_positive_context: Export-oriented merchants.
    controls:
    - CTL-057
    - CTL-092
    - CTL-037
  - ref: IND-BEH-048
    legacy_id: CY-PAYFAC-008
    context: Many small authorisations from varied cards, consistent with card testing then fraud.
    false_positive_context: Prepaid micro-purchases.
    controls:
    - CTL-091
    - CTL-037
    - CTL-057
  - ref: IND-OWN-018
    legacy_id: CY-PAYFAC-009
    context: Sub-merchants onboarded without full ownership or identity checks.
    false_positive_context: Low-risk micro-merchants under threshold.
    controls:
    - CTL-067
    - CTL-023
    - CTL-162
  - ref: IND-TYP-017
    legacy_id: CY-PAYFAC-010
    context: Volumes distributed across many accounts to stay below monitoring thresholds.
    false_positive_context: Business structure choices.
    controls:
    - CTL-048
    - CTL-057
    - CTL-093
