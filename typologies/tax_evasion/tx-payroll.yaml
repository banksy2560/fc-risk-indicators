typology:
  id: TX-PAYROLL
  name: Payroll and Ghost-Employer Tax Fraud
  domain: tax_evasion
  description: Employers or labour providers underreport wages, create phantom workers, or operate short-lived
    'ghost' companies that collect payroll funds and never remit social insurance or withholding tax.
    Common in labour-intensive sectors using subcontracting chains and agency labour.
  exposure:
    channels:
    - online_banking
    - branch
    payment_rails:
    - cash
    - payroll_expense
    - fast_payments
    customer_segments:
    - sme
    - professional_intermediary
    - employee_internal
    products:
    - transaction_account
    basis: ai_inferred
    rationale: Labour providers and ghost employers withdrawing cash payroll, paying workers via shared
      accounts, and bogus self-employment; employees are the payees.
    consumer:
      relevant: false
      products: []
      channels: []
      basis: ai_inferred
      rationale: Ghost-employer payroll fraud is an employer/business scheme; consumer accounts are only
        incidental wage recipients.
  sectors:
  - banking
  - payments
  - corporate_services
  sources:
  - 'OECD, Shining Light on the Shadow Economy: Opportunities and Threats (2017) [unverified]'
  - FATF/OECD, Money Laundering Awareness Handbook for Tax Examiners and Tax Auditors (2012) [replacement
    suggested, unverified]
  - ILO and tax authority guidance on undeclared work and bogus self-employment [replacement suggested,
    unverified]
  - FATF and OECD, Money Laundering Awareness Handbook for Tax Examiners and Tax Auditors (2012) [unverified]
  indicators:
  - ref: IND-TXN-140
    legacy_id: TX-PAYROLL-001
    context: Large cash withdrawals shortly after receiving client funds, close to total weekly wages,
      with no matching payroll tax payments.
    false_positive_context: Genuine cash-in-hand wages exist in some sectors.
    controls:
    - CTL-056
    - CTL-065
  - ref: IND-OWN-009
    legacy_id: TX-PAYROLL-002
    context: Company wound up or abandoned within one to two years, with successor firm at same address,
      same workers and clients.
    name_in_typology: Short-lived labour supplier with rotating entities
    false_positive_context: Contractors may restructure for commercial reasons.
    controls:
    - CTL-050
    - CTL-122
  - ref: IND-TXN-017
    legacy_id: TX-PAYROLL-003
    context: Salaries are paid into accounts that control multiple 'employees' or into one account for
      numerous workers.
    name_in_typology: Workers paid to multiple accounts or via third parties
    false_positive_context: Family or agency pooling can legitimately concentrate payments.
    controls:
    - CTL-041
    - CTL-056
  - ref: IND-CUS-012
    legacy_id: TX-PAYROLL-004+TX-PAYROLL-007
    context: 'Wages paid or invoiced greatly exceed declared staff and reported payroll tax.

      Labour provider shows no pension, insurance, equipment or accommodation costs.'
    name_in_typology: Payroll volume inconsistent with declared headcount
    severity_in_typology: high
    false_positive_context: Seasonal hires may inflate volumes. New firms may have lean cost bases.
    controls:
    - CTL-056
    - CTL-097
    - CTL-042
    - CTL-122
  - ref: IND-BEH-110
    legacy_id: TX-PAYROLL-005
    context: Many workers treated as independent contractors despite working under direction for one client.
    false_positive_context: Contracting is lawful where genuinely independent.
    controls:
    - CTL-056
    - CTL-169
  - ref: IND-TXN-141
    legacy_id: TX-PAYROLL-006
    context: Pay split into amounts staying below withholding or reporting thresholds.
    false_positive_context: Part-time work may legitimately fall below thresholds.
    controls:
    - CTL-038
    - CTL-056
  - ref: IND-OWN-010
    legacy_id: TX-PAYROLL-008
    context: A group of firms pooling workers share control and registered details with no group disclosed.
    name_in_typology: Multiple businesses sharing addresses, phones and bank signatories
    false_positive_context: Business parks and accountants' addresses are shared.
    controls:
    - CTL-049
    - CTL-008
