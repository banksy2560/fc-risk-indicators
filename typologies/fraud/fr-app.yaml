typology:
  id: FR-APP
  name: Authorised Push Payment Scams
  domain: fraud
  description: Victims are deceived or coerced into authorising a payment to an account controlled by
    a criminal, often under a false pretext such as a safe-account request, a fake invoice or an invented
    purchase. Because the customer authorises the payment, controls rely on spotting behavioural change
    and mule receiving accounts.
  exposure:
    channels:
    - online_banking
    - mobile_app
    - call_centre
    payment_rails:
    - fast_payments
    customer_segments:
    - retail
    - vulnerable_elderly
    - sme
    products:
    - transaction_account
    - savings_deposit
    basis: ai_inferred
    rationale: Customer-authorised push payments in digital channels with live-call and remote-access
      signals.
  sectors:
  - banking
  - payments
  - fintech
  sources:
  - UK Finance, Annual Fraud Report (specify year, e.g. 2025) <https://www.ukfinance.org.uk/> [corrected,
    agent-reviewed]
  - 'Payment Systems Regulator, APP scams: Requirement for reimbursement, Policy Statement PS23/4 (Dec
    2023) (see also PS23/3, June 2023; PS24/7, Oct 2024) <https://www.psr.org.uk/media/kwlgyzti/ps23-4-app-scams-policy-statement-dec-2023.pdf>
    [corrected, agent-reviewed]'
  - FATF, INTERPOL and Egmont Group, Illicit Financial Flows from Cyber-enabled Fraud (2023) [replacement
    suggested, unverified]
  indicators:
  - ref: IND-TXN-063
    legacy_id: FR-APP-001
    context: 'Victim-side: a first payment of unusually high value to a newly created payee, made quickly
      after a phone call or message and often outside normal patterns.'
    false_positive_context: Genuine house purchases, one-off large bills or planned gifts to new payees.
    controls:
    - CTL-069
    - CTL-068
    - CTL-071
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-BEH-006
    legacy_id: FR-APP-002
    context: 'Victim-side: session signals show the customer is on a live phone call, navigating hesitantly,
      or following dictation during online banking.'
    name_in_typology: Customer on an active call while paying
    false_positive_context: Customers legitimately on hand-free calls with family or advisers.
    controls:
    - CTL-091
    - CTL-068
    - CTL-170
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-BEH-003
    legacy_id: FR-APP-003
    context: 'Victim-side: when asked about the payment, the customer gives rehearsed, inconsistent or
      irritated answers, or says they were told to mislead the bank.'
    name_in_typology: Evasive or scripted answers about payment purpose
    false_positive_context: Privacy-minded customers or those unsure of terminology.
    controls:
    - CTL-170
    - CTL-068
    - CTL-074
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-BEH-007
    legacy_id: FR-APP-004
    context: 'Victim-side: remote desktop or screen-sharing tools detected while the customer logs in
      or pays.'
    name_in_typology: Remote-access software present during banking session
    false_positive_context: IT support or family helping a customer with consent.
    controls:
    - CTL-091
    - CTL-068
    - CTL-170
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-TXN-025
    legacy_id: FR-APP-005
    context: 'Victim-side: movement of long-held savings, fixed deposits or investments into the current
      account followed by outbound transfers.'
    name_in_typology: Sudden liquidation of savings or investments to fund payments
    false_positive_context: Home deposits, life events or planned purchases.
    controls:
    - CTL-037
    - CTL-068
    - CTL-170
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-CPT-019
    legacy_id: FR-APP-006
    context: 'Victim-side: confirmation-of-payee check returns no match or close match and the customer
      proceeds regardless.'
    false_positive_context: Typos, trading names or joint accounts producing benign mismatches.
    controls:
    - CTL-069
    - CTL-068
    - CTL-083
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-TXN-001
    legacy_id: FR-APP-007
    context: 'Mule-side: funds credited by multiple unrelated individuals are moved out within minutes
      or hours to other accounts, cash or crypto.'
    name_in_typology: Receiving account rapidly forwards incoming credits
    false_positive_context: Pass-through for legitimate marketplace sellers or agents.
    controls:
    - CTL-051
    - CTL-083
    - CTL-014
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-CUS-028
    legacy_id: FR-APP-008
    context: 'Mule-side: a recently opened or reactivated account receives payments from many unrelated
      people with narratives that do not fit the stated profile.'
    false_positive_context: Fundraising, club accounts or small traders with genuine many-to-one inflows.
    controls:
    - CTL-051
    - CTL-083
    - CTL-001
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-TXN-029
    legacy_id: FR-APP-009
    context: 'Victim-side: references such as ''safe account'', ''HMRC'', ''fees'' or crypto platform
      names appear alongside atypical transfers.'
    name_in_typology: Payment narrative or reference suggests safe-account or investment script
    false_positive_context: Genuine references to tax or investment platforms.
    controls:
    - CTL-068
    - CTL-091
    - CTL-170
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-CUS-029
    legacy_id: FR-APP-010
    context: 'Victim-side: the customer previously reported or was warned of fraud and is again sending
      payments to new payees.'
    false_positive_context: Customers who have since become aware and are genuinely transacting.
    controls:
    - CTL-075
    - CTL-068
    - CTL-094
    references:
    - UK Finance, Annual Fraud Report (published annually)
