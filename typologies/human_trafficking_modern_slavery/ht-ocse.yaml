typology:
  id: HT-OCSE
  name: Online Child Sexual Exploitation (Financial Indicators)
  domain: human_trafficking_modern_slavery
  description: Financial footprints of the purchase, sale or live-streaming of child sexual abuse material
    and related exploitation. Indicators are limited to payment patterns and account behaviour so that
    institutions can file reports promptly; staff must never access, view or retain the material and should
    escalate to specialist teams and law enforcement.
  sectors:
  - banking
  - payments
  - crypto
  - fintech
  sources:
  - Egmont Group and FIU public bulletins on online child sexual exploitation [too vague, unverified]
  - FATF and APG, Financial Flows from Human Trafficking (2018) <https://www.fatf-gafi.org/en/publications/Methodsandtrends/Human-trafficking.html>
    [agent-reviewed]
  - WeProtect Global Alliance, Global Threat Assessment (2023 edition; earlier 2019, 2021) <https://www.weprotect.org/global-threat-assessment-23/>
    [corrected, agent-reviewed]
  - UNODC and ECPAT public material on online child sexual exploitation [too vague, unverified]
  indicators:
  - ref: IND-TXN-091
    legacy_id: HT-OCSE-001
    context: Small recurring transfers to individuals in jurisdictions of known high-risk, with references
      to live shows or streaming.
    false_positive_context: Remittances to family and creator payments are common.
    controls:
    - CTL-030
    - CTL-093
  - ref: IND-CPT-031
    legacy_id: HT-OCSE-002
    context: Payments to websites, hosting or payment accounts identified in intelligence as selling abuse
      material.
    false_positive_context: Domain intelligence can include false matches.
    controls:
    - CTL-029
    - CTL-057
  - ref: IND-TXN-092
    legacy_id: HT-OCSE-003
    context: Customer sends virtual assets to wallets clustered with abuse-related services.
    false_positive_context: Mixed-use services create indirect exposure.
    controls:
    - CTL-145
    - CTL-093
  - ref: IND-TXN-004
    legacy_id: HT-OCSE-004
    context: Facilitator receives many micro-payments from unrelated senders.
    name_in_typology: Pattern of many small payments from many accounts to one recipient
    severity_in_typology: medium
    false_positive_context: Content creators receive many small tips.
    controls:
    - CTL-041
    - CTL-093
  - ref: IND-BEH-086
    legacy_id: HT-OCSE-005
    context: Account shows payments in return for introductions or access, plus use of prepaid cards and
      anonymous payment methods.
    false_positive_context: Unrelated legitimate activity can resemble these flows.
    controls:
    - CTL-150
    - CTL-100
  - ref: IND-CUS-008
    legacy_id: HT-OCSE-006
    context: Same user holds several e-wallets under various identities, funded with cash vouchers.
    name_in_typology: Use of multiple payment apps and e-wallets with different names
    false_positive_context: Privacy-conscious users may split wallets.
    controls:
    - CTL-049
    - CTL-001
  - ref: IND-BEH-087
    legacy_id: HT-OCSE-007
    context: Customer uses deceptive references or asks to avoid records on payments.
    false_positive_context: Privacy reasons are common.
    controls:
    - CTL-170
    - CTL-098
  - ref: IND-CUS-003
    legacy_id: HT-OCSE-008
    context: Customer appears in credible reports or sanctions of offences against children.
    name_in_typology: Payments from or to persons with prior convictions or adverse media relating to
      child exploitation
    false_positive_context: Records may be old or mismatched.
    controls:
    - CTL-032
    - CTL-103
