typology:
  id: OP-COUNTER
  name: Counterfeit and Pirated Goods
  domain: other_predicate
  description: Manufacture, import and sale of fake goods such as apparel, pharmaceuticals, electronics
    and auto parts, infringing intellectual property and often endangering consumers. Proceeds pass through
    online marketplaces, small importers and shell traders.
  exposure:
    channels:
    - merchant_acquiring
    - online_banking
    payment_rails:
    - card
    - wire_swift
    - trade_instruments
    customer_segments:
    - sme
    - corporate
    - fintech_psp
    products:
    - merchant_services
    - transaction_account
    basis: ai_inferred
    rationale: Online marketplace sellers, small importers and shell traders.
    consumer:
      relevant: false
      products: []
      channels: []
      basis: ai_inferred
      rationale: Counterfeit goods proceeds flow through merchants, marketplaces and importers, which
        is merchant acquiring and business banking.
  sectors:
  - banking
  - payments
  - fintech
  - corporate_services
  sources:
  - OECD and EUIPO, Trends in Trade in Counterfeit and Pirated Goods (2019) [unverified]
  - 'OECD, Illicit Trade: Converging Criminal Networks (2016) [unverified]'
  - World Customs Organization, public material on IP enforcement [replacement suggested, unverified]
  - FATF, Money Laundering Vulnerabilities of Free Trade Zones (2010) [unverified]
  indicators:
  - ref: IND-PRD-055
    legacy_id: OP-COUNTER-001
    context: Prices implausible for authentic products.
    name_in_typology: Branded goods at prices far below genuine retail
    false_positive_context: Discounts and grey market exist.
    controls:
    - CTL-124
    - CTL-097
  - ref: IND-CPT-045
    legacy_id: OP-COUNTER-002
    context: No authorisation or licence from brand owner.
    false_positive_context: Parallel imports are lawful in places.
    controls:
    - CTL-134
    - CTL-032
  - ref: IND-DOC-050
    legacy_id: OP-COUNTER-003
    context: Generic descriptions of brand goods.
    name_in_typology: Trade documents with imprecise descriptions or mismatched HS codes
    severity_in_typology: medium
    false_positive_context: Descriptions vary.
    controls:
    - CTL-123
  - ref: IND-GEO-022
    legacy_id: OP-COUNTER-004
    context: Goods relabelled in transit hubs.
    false_positive_context: Transit hubs are legitimate.
    controls:
    - CTL-139
    - CTL-127
  - ref: IND-CUS-045
    legacy_id: OP-COUNTER-005
    context: Network of shops sharing accounts.
    false_positive_context: Same owner may run several shops.
    controls:
    - CTL-049
    - CTL-067
  - ref: IND-TXN-121
    legacy_id: OP-COUNTER-006
    context: Payments to factories lacking licences.
    false_positive_context: Contract manufacturers exist.
    controls:
    - CTL-112
    - CTL-045
  - ref: IND-TYP-042
    legacy_id: OP-COUNTER-007
    context: Medicines or auto parts from unlicensed sources.
    false_positive_context: Generics are lawful.
    controls:
    - CTL-029
    - CTL-094
  - ref: IND-BEH-098
    legacy_id: OP-COUNTER-008
    context: High consumer complaints.
    false_positive_context: Complaints occur.
    controls:
    - CTL-057
