typology:
  id: CY-NFTGAME
  name: NFT and Online Gaming / In-Game Currency Laundering
  domain: cyber_enabled
  description: Non-fungible tokens and in-game currencies can be bought, sold or transferred with subjective
    or opaque values, enabling wash trading, self-dealing and conversion of illicit funds into items that
    are later resold. Gaming platforms also host cross-border micro-transfers that hide value movement.
  exposure:
    channels:
    - online_platform
    payment_rails:
    - crypto_onramp_offramp
    - stored_value_wallet
    - card
    customer_segments:
    - retail
    - student_youth
    - fintech_psp
    products:
    - crypto_custody
    - prepaid_stored_value
    - onchain_defi
    basis: ai_inferred
    rationale: NFT marketplaces and game economies; wash trading between wallets, in-game currency cash-out
      and stolen-card funding.
    consumer:
      relevant: false
      products: []
      channels: []
      basis: ai_inferred
      rationale: NFT wash trading and in-game currency economies sit on external platforms and wallets.
  stage:
  - placement
  - layering
  sectors:
  - crypto
  - payments
  - fintech
  sources:
  - US Department of the Treasury, Illicit Finance Risk Assessment of Non-Fungible Tokens (2024) <https://home.treasury.gov/system/files/136/Illicit-Finance-Risk-Assessment-of-Non-Fungible-Tokens.pdf>
    [agent-reviewed]
  - FATF, Updated Guidance for a Risk-Based Approach to Virtual Assets and Virtual Asset Service Providers
    (2021) [unverified]
  - FATF, Money Laundering and Terrorist Financing in the Art and Antiquities Market (2023) [unverified]
  indicators:
  - ref: IND-TYP-014
    legacy_id: CY-NFTGAME-001
    context: NFTs are sold repeatedly between linked wallets at rising prices without genuine third-party
      demand.
    name_in_typology: Wash trading between wallets controlled by the same party
    false_positive_context: Collectors moving assets between own wallets.
    controls:
    - CTL-145
    - CTL-048
    - CTL-093
  - ref: IND-TXN-020
    legacy_id: CY-NFTGAME-002
    context: A buyer pays a large premium for an item without supporting valuation.
    name_in_typology: Purchase price far above comparable floor or last sale
    false_positive_context: Rare or celebrity items.
    controls:
    - CTL-145
    - CTL-037
    - CTL-093
  - ref: IND-TXN-053
    legacy_id: CY-NFTGAME-003
    context: Creator mints and sells quickly to a single buyer funded by a cluster with no history.
    false_positive_context: Primary sales by established artists.
    controls:
    - CTL-145
    - CTL-048
    - CTL-093
  - ref: IND-TXN-054
    legacy_id: CY-NFTGAME-004
    context: Large currency amounts earned or received are cashed out through third-party sites within
      a short period.
    false_positive_context: Professional players and streamers.
    controls:
    - CTL-037
    - CTL-072
    - CTL-093
  - ref: IND-TXN-004
    legacy_id: CY-NFTGAME-005
    context: Fan-in of small gifts or trades into a single collector, then withdrawal.
    name_in_typology: Many low-value in-game transfers from unrelated accounts to one account
    severity_in_typology: medium
    false_positive_context: Gifting in communities.
    controls:
    - CTL-048
    - CTL-037
    - CTL-093
  - ref: IND-TYP-015
    legacy_id: CY-NFTGAME-006
    context: Chargebacks on purchases of currency or items followed by transfer to other accounts.
    false_positive_context: Genuine friendly fraud.
    controls:
    - CTL-057
    - CTL-048
    - CTL-093
  - ref: IND-CUS-021
    legacy_id: CY-NFTGAME-007
    context: Pseudonymous sellers withdraw significant proceeds to fiat or exchange wallets.
    false_positive_context: Verified under-threshold sellers.
    controls:
    - CTL-076
    - CTL-012
    - CTL-023
  - ref: IND-TYP-005
    legacy_id: CY-NFTGAME-008
    context: Purchase funding traces through obfuscation services.
    name_in_typology: Use of mixers or privacy tools before purchasing NFTs
    severity_in_typology: medium
    false_positive_context: Privacy-minded buyers.
    controls:
    - CTL-145
    - CTL-029
    - CTL-093
  - ref: IND-GEO-018
    legacy_id: CY-NFTGAME-009
    context: Transfers or sales involve users in sanctioned regions, detected via geolocation or wallet
      data.
    name_in_typology: Sanctioned or high-risk jurisdiction counterparties in game economies
    false_positive_context: VPN or travelling users.
    controls:
    - CTL-029
    - CTL-092
    - CTL-103
  - ref: IND-PRD-024
    legacy_id: CY-NFTGAME-010
    context: Operator permits unlimited withdrawal and trade, ignores abuse reports and does not verify
      high-value users.
    false_positive_context: Small operators.
    controls:
    - CTL-162
    - CTL-076
    - CTL-083
