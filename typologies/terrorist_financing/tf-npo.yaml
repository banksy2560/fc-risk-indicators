typology:
  id: TF-NPO
  name: Abuse of Non-Profit Organisations and Charities for Terrorist Financing
  domain: terrorist_financing
  description: Terrorist groups or their supporters may exploit charities and other non-profit organisations
    by diverting funds, using them as cover for transfers to conflict areas, or infiltrating their governance.
    Most non-profits are low risk, so controls must be proportionate and avoid de-risking legitimate humanitarian
    work.
  exposure:
    channels:
    - branch
    - online_banking
    - agent_network
    payment_rails:
    - cash
    - cross_border_remittance
    - wire_swift
    - fast_payments
    customer_segments:
    - nonprofit
    - retail
    products:
    - transaction_account
    - savings_account
    - term_deposit
    basis: ai_inferred
    rationale: Charities collecting cash and sending funds to conflict areas.
    consumer:
      relevant: true
      products:
      - transaction_account
      - savings_account
      channels:
      - branch
      - online_banking
      - mobile_app
      basis: ai_inferred
      rationale: Charity or community group accounts at a consumer bank receiving collections and forwarding
        funds offshore; mostly retail-held accounts.
  sectors:
  - banking
  - mvts
  - payments
  sources:
  - FATF, Risk of Terrorist Abuse in Non-Profit Organisations (2014) [unverified]
  - FATF, Best Practices on Combating the Abuse of Non-Profit Organisations (Recommendation 8) (2015;
    revised Nov 2023) [corrected, unverified]
  - FATF Recommendation 8 and its Interpretive Note [unverified]
  indicators:
  - ref: IND-TYP-058
    legacy_id: TF-NPO-001
    context: Organisation sends funds to areas with active terrorist presence but cannot evidence projects,
      beneficiaries, partners or auditable delivery.
    false_positive_context: Humanitarian actors in crisis zones often work through informal channels and
      face real documentation barriers.
    controls:
    - CTL-024
    - CTL-128
    - CTL-165
  - ref: IND-OWN-011
    legacy_id: TF-NPO-002
    context: Officers, trustees or major donors appear in adverse media, sanctions or terrorist designation
      data, or share details with previously reported entities.
    name_in_typology: Beneficial owners, trustees or signatories linked to concerning persons
    false_positive_context: Common names and community roles produce coincidental matches.
    controls:
    - CTL-029
    - CTL-005
  - ref: IND-TXN-034
    legacy_id: TF-NPO-003
    context: Large volumes of cash collection boxes, bucket collections or anonymous donations deposited
      with no collection records.
    name_in_typology: Donations structured through cash or anonymous collections
    false_positive_context: Street collections and community events are cash heavy and lawful.
    controls:
    - CTL-064
    - CTL-055
  - ref: IND-TXN-001
    legacy_id: TF-NPO-004
    context: Charity account receives donations and immediately forwards most funds to individuals, personal
      accounts or businesses unrelated to stated objects.
    name_in_typology: Funds pass through quickly to personal accounts or unrelated entities
    false_positive_context: Some charities grant to individuals or use procurement agents.
    controls:
    - CTL-040
    - CTL-022
  - ref: IND-BEH-118
    legacy_id: TF-NPO-005
    context: Transactions, geographies or counterparties do not match the objects declared in the registration
      or constitution.
    false_positive_context: Charities evolve and respond to emergencies outside their normal remit.
    controls:
    - CTL-042
    - CTL-142
  - ref: IND-CUS-005
    legacy_id: TF-NPO-006
    context: Entity collects donations without evidence of registration, or continues after loss of status,
      regulatory warning or inquiry.
    name_in_typology: Unregistered or recently de-registered organisation soliciting funds
    severity_in_typology: medium
    false_positive_context: Small community groups may be exempt from registration thresholds.
    controls:
    - CTL-116
    - CTL-032
  - ref: IND-PRD-065
    legacy_id: TF-NPO-007
    context: Charity uses third-party agents, MVTS or cash couriers to reach recipients where regulated
      banking is limited, with limited visibility of the final recipient.
    name_in_typology: Funds routed through intermediaries or informal value transfer in conflict zones
    severity_in_typology: medium
    false_positive_context: Banking access is genuinely restricted in some crisis settings.
    controls:
    - CTL-112
    - CTL-027
  - ref: IND-BEH-119
    legacy_id: TF-NPO-008
    context: Public appeals describe one cause while expenditure patterns show little programme spending
      or large payments to connected parties.
    false_positive_context: Overhead ratios vary and appeals may legitimately change focus.
    controls:
    - CTL-065
    - CTL-032
