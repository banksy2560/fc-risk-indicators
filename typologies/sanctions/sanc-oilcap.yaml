typology:
  id: SANC-OILCAP
  name: Oil and Commodity Price-Cap and Ship-to-Ship Evasion
  domain: sanctions
  description: Where price caps or embargoes apply to oil and other commodities, attempts to circumvent
    them may involve inflated or opaque attestations, intermediary traders, undisclosed ship-to-ship transfers
    and ageing or unusual tankers. Detection draws on trade documents, pricing, vessel data and the quality
    of attestations from counterparties.
  exposure:
    channels:
    - broker_intermediary
    payment_rails:
    - trade_instruments
    - wire_swift
    - insurance_premium_claim
    customer_segments:
    - corporate
    products:
    - trade_finance
    - correspondent_account
    - insurance_pension
    basis: ai_inferred
    rationale: Commodity traders, attestations, tanker insurance and ship-to-ship transfers.
    consumer:
      relevant: false
      products: []
      channels: []
      basis: ai_inferred
      rationale: Oil price-cap and ship-to-ship evasion is commodity trade finance and insurance, no consumer
        exposure.
  sectors:
  - banking
  - trade_finance
  - insurance
  - securities
  sources:
  - 'FinCEN and BIS, Joint Alert: FinCEN and the US Department of Commerce''s BIS Urge Increased Vigilance
    for Potential Russian and Belarusian Export Control Evasion Attempts (FIN-2022-Alert003, June 2022)
    [corrected, unverified]'
  - Price Cap Coalition, Advisory for the Maritime Oil Industry and Related Sectors (2023) [unverified]
  - OFSI/HM Government, UK Maritime Services Ban and Oil Price Cap Industry Guidance [replacement suggested,
    unverified]
  indicators:
  - ref: IND-DOC-062
    legacy_id: SANC-OILCAP-001
    context: Counterparties provide generic declarations but cannot supply itemised contracts and invoices
      showing the price of oil and services.
    false_positive_context: Commercial confidentiality may limit disclosures.
    controls:
    - CTL-124
    - CTL-174
    - CTL-175
  - ref: IND-TXN-135
    legacy_id: SANC-OILCAP-002
    context: Separately invoiced services carry unusually high costs.
    false_positive_context: Market volatility and war-risk premiums raise costs.
    controls:
    - CTL-124
    - CTL-123
    - CTL-086
  - ref: IND-TYP-051
    legacy_id: SANC-OILCAP-003
    context: Vessels outside mainstream commercial insurance and class regimes carry the cargo.
    false_positive_context: Older vessels trade lawfully.
    controls:
    - CTL-143
  - ref: IND-TYP-049
    legacy_id: SANC-OILCAP-004
    context: Cargo transferred at sea off the route and followed by a different declared destination.
    name_in_typology: Ship-to-ship transfers with no clear commercial purpose
    false_positive_context: STS is normal in oil trade.
    controls:
    - CTL-143
    - CTL-135
  - ref: IND-CUS-010
    legacy_id: SANC-OILCAP-005
    context: Recently incorporated traders with little track record buying and reselling restricted-origin
      cargo.
    name_in_typology: Newly established trading intermediaries in hub jurisdictions
    false_positive_context: New traders enter the market regularly.
    controls:
    - CTL-112
    - CTL-025
  - ref: IND-TXN-136
    legacy_id: SANC-OILCAP-006
    context: Payments denominated or routed to avoid mainstream channels.
    false_positive_context: Currency diversification is common.
    controls:
    - CTL-045
    - CTL-104
  - ref: IND-DOC-063
    legacy_id: SANC-OILCAP-007
    context: Declared origin differs from vessel tracking and port records.
    false_positive_context: Port calls vary with operational changes.
    controls:
    - CTL-135
    - CTL-103
  - ref: IND-BEH-017
    legacy_id: SANC-OILCAP-008
    context: Cargo ownership shifts while at sea without clear commercial reason.
    name_in_typology: Repeated changes of buyer or consignee mid-voyage
    false_positive_context: Cargo is often traded afloat.
    controls:
    - CTL-143
    - CTL-029
