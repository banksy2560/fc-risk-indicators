typology:
  id: FR-TAX
  name: Tax Refund and Identity-Based Benefit Fraud
  domain: fraud
  description: Offenders file false returns or benefit claims using stolen or fabricated identities and
    direct refunds to accounts they control. Banks see inbound refunds to unrelated accounts and mule
    behaviour.
  sectors:
  - banking
  - payments
  - fintech
  sources:
  - IRS and HMRC public guidance on refund and identity fraud (general) [too vague, unverified]
  - FinCEN, advisories on tax-refund fraud (general) [too vague, unverified]
  - UK Finance, Annual Fraud Report (specify year, e.g. 2025) <https://www.ukfinance.org.uk/> [corrected,
    checked]
  indicators:
  - ref: IND-TXN-024
    legacy_id: FR-TAX-001
    context: Payee name does not match the recipient listed.
    name_in_typology: Refund or benefit credited to account of different name
    false_positive_context: Joint or agent accounts.
    controls:
    - CTL-089
    - CTL-069
    - CTL-051
    references:
    - IRS and HMRC public guidance on refund and identity fraud (general)
  - ref: IND-TXN-081
    legacy_id: FR-TAX-002
    context: Unrelated refunds converge on one account or card.
    false_positive_context: Tax preparers.
    controls:
    - CTL-037
    - CTL-051
    - CTL-083
    references:
    - IRS and HMRC public guidance on refund and identity fraud (general)
  - ref: IND-BEH-081
    legacy_id: FR-TAX-003
    context: 'Victim-side: customer discovers a fraudulent return in their name.'
    false_positive_context: Forgotten claims.
    controls:
    - CTL-083
    - CTL-094
    - CTL-074
    references:
    - IRS and HMRC public guidance on refund and identity fraud (general)
  - ref: IND-CUS-034
    legacy_id: FR-TAX-004
    context: New accounts used to receive claims.
    false_positive_context: New customers.
    controls:
    - CTL-001
    - CTL-089
    - CTL-037
    references:
    - IRS and HMRC public guidance on refund and identity fraud (general)
  - ref: IND-TXN-031
    legacy_id: FR-TAX-005
    context: Cash-out immediately after credit.
    name_in_typology: Rapid withdrawals or transfers after refund
    false_positive_context: Needs for cash.
    controls:
    - CTL-051
    - CTL-103
    - CTL-083
    references:
    - IRS and HMRC public guidance on refund and identity fraud (general)
  - ref: IND-BEH-012
    legacy_id: FR-TAX-006
    context: Same device, IP or address in many claims.
    name_in_typology: Application data shared across many claimants
    severity_in_typology: medium
    false_positive_context: Tax software.
    controls:
    - CTL-090
    - CTL-049
    - CTL-083
    references:
    - IRS and HMRC public guidance on refund and identity fraud (general)
  - ref: IND-PRD-039
    legacy_id: FR-TAX-007
    context: Refunds sent to prepaid products.
    false_positive_context: Unbanked customers.
    controls:
    - CTL-089
    - CTL-037
    - CTL-051
    references:
    - IRS and HMRC public guidance on refund and identity fraud (general)
  - ref: IND-DOC-037
    legacy_id: FR-TAX-008
    context: Claim data diverges from account history.
    name_in_typology: Income or dependants inconsistent with profile
    false_positive_context: Life changes.
    controls:
    - CTL-014
    - CTL-084
    - CTL-089
    references:
    - IRS and HMRC public guidance on refund and identity fraud (general)
