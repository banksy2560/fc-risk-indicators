typology:
  id: ML-STRUCT
  name: Structuring / Smurfing
  domain: money_laundering
  description: Breaking up cash or other value into amounts kept below reporting, identification or internal
    review thresholds, often using many deposits, branches, accounts or individuals. It is mainly a placement
    technique and is commonly paired with rapid onward movement of funds.
  stage:
  - placement
  sectors:
  - banking
  - payments
  - mvts
  - casino_gaming
  sources:
  - FATF, Money Laundering Typologies and Methods (general placement guidance) [too vague, unverified]
  - FinCEN, Guidance on structuring and Suspicious Activity Report (SAR) reporting (general) [too vague,
    unverified]
  - AUSTRAC, Guidance on structuring and threshold transaction reports (general) [too vague, unverified]
  indicators:
  - ref: IND-TXN-006
    legacy_id: ML-STRUCT-001
    context: Multiple cash deposits or exchanges sized just under a regulatory reporting or internal review
      threshold over a short period.
    name_in_typology: Repeated cash deposits just below reporting threshold
    false_positive_context: Customers with stable habits (e.g. fixed daily takings or standard float sizes)
      can legitimately generate similar amounts.
    controls:
    - CTL-038
    - CTL-039
  - ref: IND-TXN-007
    legacy_id: ML-STRUCT-002
    context: Cash is paid in at several branches, ATMs or agents within hours, with total value well above
      the amount at any one location.
    name_in_typology: Same-day deposits across multiple branches or ATMs
    false_positive_context: Travelling workers or customers with several workplaces may use many locations.
    controls:
    - CTL-039
    - CTL-045
  - ref: IND-CPT-035
    legacy_id: ML-STRUCT-003
    context: Several unrelated individuals make cash deposits into the same account, often in similar
      amounts and at similar times.
    name_in_typology: Multiple depositors paying into one account
    false_positive_context: Collections for clubs, rent, fundraising or family contributions may fit.
    controls:
    - CTL-041
    - CTL-046
  - ref: IND-TXN-030
    legacy_id: ML-STRUCT-004
    context: Funds credited in cash are quickly transferred out, withdrawn elsewhere or used for purchases
      leaving a low balance.
    false_positive_context: Customers paying bills or suppliers on receipt of cash may do the same.
    controls:
    - CTL-040
    - CTL-093
  - ref: IND-BEH-096
    legacy_id: ML-STRUCT-005
    context: Customer reduces a transaction, splits it, or leaves when asked for ID, source of funds or
      told a report may be filed.
    false_positive_context: Privacy concerns or lack of documents with the customer may explain some cases.
    controls:
    - CTL-170
    - CTL-098
  - ref: IND-CUS-002
    legacy_id: ML-STRUCT-006
    context: Cash volumes far exceed expected activity for the customer's declared occupation, income
      or business.
    name_in_typology: Deposit volumes inconsistent with customer profile
    false_positive_context: Windfalls, asset sales or seasonal income may be genuine.
    controls:
    - CTL-042
    - CTL-012
  - ref: IND-PRD-049
    legacy_id: ML-STRUCT-007
    context: Multiple money orders, drafts, prepaid cards or cheques purchased with cash in sub-threshold
      amounts.
    false_positive_context: Some customers lack bank accounts and use instruments for rent or bills.
    controls:
    - CTL-039
    - CTL-038
  - ref: IND-TYP-039
    legacy_id: ML-STRUCT-008
    context: Cash arrives in unusual bundles, rubber-banded small notes, or mixed denominations inconsistent
      with the stated source.
    false_positive_context: Retail cash is often in small notes; condition varies by source.
    controls:
    - CTL-098
    - CTL-170
