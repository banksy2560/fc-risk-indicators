indicators:
- id: IND-CUS-001
  name: Wealth or spending inconsistent with known means
  description: Assets, lifestyle spending or purchases clearly exceed the customer's known legitimate
    income or declared wealth, with no verifiable source.
  category: customer
  severity: high
  detection_type:
  - kyc_review
  - investigator_judgement
  data_sources:
  - kyc_profile
  - asset_registers
  - kyc_files
  - adverse_media
  false_positive_notes: Legitimate inheritance, windfalls or undeclared but lawful income may explain
    the gap; verify before escalating.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-CUS-002
  name: Account activity inconsistent with declared occupation or income
  description: Turnover or volumes materially exceed what the customer's declared occupation, income,
    age or circumstances would support.
  category: customer
  severity: medium
  detection_type:
  - kyc_review
  - transaction_monitoring
  - investigator_judgement
  data_sources:
  - customer_profile
  - ledger_data
  - kyc_profile
  - remittance_data
  false_positive_notes: Life events, gifts or a recent change of employment can explain higher activity;
    compare with updated KYC data.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-CUS-003
  name: Adverse media on customer or associates
  description: Credible negative news, enforcement notices or investigations link the customer, its owners
    or associates to criminal, corrupt or regulated-sector misconduct.
  category: customer
  severity: high
  detection_type:
  - screening
  - external_intel
  - kyc_review
  data_sources:
  - adverse_media
  - enforcement_notices
  - law_enforcement_requests
  - adverse_media_feeds
  false_positive_notes: Name matches with unrelated individuals and old or unproven allegations are common;
    confirm identity and source credibility.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-CUS-004
  name: Prior regulatory, criminal or enforcement history
  description: Customer or principal has previous convictions, enforcement or disciplinary action, or
    has been exited by another institution.
  category: customer
  severity: high
  detection_type:
  - screening
  - external_intel
  - kyc_review
  data_sources:
  - adverse_media_feeds
  - internal_exit_list
  - regulator_notices
  false_positive_notes: Spent or minor historic matters may not be relevant to current risk; assess recency
    and relevance.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-CUS-005
  name: Missing, misused or unverifiable licence or registration
  description: Customer offering a regulated or permitted activity cannot evidence the required licence
    or registration, or operates under a licence held by another party.
  category: customer
  severity: high
  detection_type:
  - kyc_review
  - external_intel
  - investigator_judgement
  data_sources:
  - kyc_files
  - registry_data
  - licence_registers
  - permit_registers
  false_positive_notes: Registration data may be out of date or held under a group entity; request documentary
    evidence.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-CUS-006
  name: Account collecting funds from many unrelated payers
  description: A single account receives payments from numerous unrelated senders with no evident commercial
    or family link to the holder.
  category: customer
  severity: high
  detection_type:
  - transaction_monitoring
  - kyc_review
  - investigator_judgement
  data_sources:
  - payment_records
  - kyc_files
  - transaction_data
  - licence_registers
  false_positive_notes: Legitimate collection accounts such as clubs, landlords or small traders may show
    this pattern; check stated purpose.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-CUS-007
  name: Multiple customers sharing contact details or addresses
  description: Unrelated customers or applicants share the same phone, email, address, device or bank
    account, including mail drops and shared accommodation.
  category: customer
  severity: medium
  detection_type:
  - kyc_review
  - transaction_monitoring
  data_sources:
  - customer_records
  - device_data
  - address_data
  - kyc_files
  false_positive_notes: Family members, flatmates, student housing and shared workplaces legitimately
    share details.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-CUS-008
  name: One person holding multiple identities or accounts
  description: The same individual appears under different names or opens several accounts or wallets,
    directly or through an intermediary.
  category: customer
  severity: medium
  detection_type:
  - kyc_review
  - transaction_monitoring
  - customer_behaviour
  data_sources:
  - kyc_files
  - wallet_data
  - player_data
  - onboarding_data
  false_positive_notes: Customers may legitimately hold several products or use name variants; look for
    deliberate inconsistency.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-CUS-009
  name: Inconsistent or synthetic identity data at onboarding
  description: Identity documents, contact details, geolocation or device data do not align, suggesting
    fabricated, stolen or misrepresented identity.
  category: customer
  severity: medium
  detection_type:
  - kyc_review
  - customer_behaviour
  - screening
  data_sources:
  - identity_data
  - device_data
  - onboarding_data
  - ip_data
  false_positive_notes: Travel, VPN use and data-entry errors can create benign mismatches; seek corroborating
    documents.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-CUS-010
  name: Newly established customer with rapid high-value activity
  description: A recently formed customer with little history or track record quickly records large turnover
    or trades in high-value or restricted goods.
  category: customer
  severity: high
  detection_type:
  - kyc_review
  - transaction_monitoring
  - investigator_judgement
  data_sources:
  - registry_data
  - seller_records
  - company_registry
  - vat_registration
  false_positive_notes: Genuine start-ups or fast-growing businesses can scale quickly; test against business
    plan and evidence of operations.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-CUS-011
  name: No evidence of real operations
  description: Business shows little or no staff, premises, web presence or client base consistent with
    its stated activities and turnover.
  category: customer
  severity: high
  detection_type:
  - kyc_review
  - transaction_monitoring
  - investigator_judgement
  data_sources:
  - kyc_file
  - transaction_data
  - open_source_data
  - corporate_data
  false_positive_notes: Small consultancies or home-based businesses may have a light footprint; request
    supporting contracts and invoices.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-CUS-012
  name: Business revenue inconsistent with staffing or operating costs
  description: Reported revenue, payroll or resident staff do not match the typical costs and workforce
    of the stated business model.
  category: customer
  severity: medium
  detection_type:
  - kyc_review
  - investigator_judgement
  - transaction_monitoring
  data_sources:
  - payment_records
  - tax_filings
  - kyc_files
  - financial_statements
  false_positive_notes: Outsourcing, seasonal staffing and informal-sector norms can explain gaps; benchmark
    against peers.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-CUS-013
  name: Cash-intensive business
  description: Customer's business relies heavily on cash receipts, making revenue difficult to verify
    against stock, costs or card use.
  category: customer
  severity: medium
  detection_type:
  - kyc_review
  - transaction_monitoring
  data_sources:
  - kyc_profile
  - cash_transaction_data
  - cash_data
  - stock_invoices
  false_positive_notes: Many legitimate retail and hospitality businesses are cash-heavy; compare takings
    to sector norms.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-CUS-014
  name: Recent change of contact or delivery details
  description: Email, phone, address or statement delivery details are changed, especially shortly before
    unusual activity or redirecting mail to a third party.
  category: customer
  severity: high
  detection_type:
  - customer_behaviour
  - transaction_monitoring
  data_sources:
  - customer_change_logs
  - payment_data
  false_positive_notes: Customers move or change providers routinely; assess timing relative to subsequent
    activity.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-CUS-015
  name: Accounts held via family members or associates
  description: Funds and assets move through spouses, children, in-laws or business partners who have
    no obvious independent source of wealth.
  category: customer
  severity: high
  detection_type:
  - kyc_review
  - screening
  data_sources:
  - kyc_files
  - pep_lists
  - corporate_registries
  false_positive_notes: Families commonly share finances and businesses.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-CUS-016
  name: Politically exposed person as customer or controller
  description: The customer, a beneficial owner or a controller is a domestic or foreign PEP, or a family
    member or close associate of one.
  category: customer
  severity: high
  detection_type:
  - screening
  - kyc_review
  data_sources:
  - pep_lists
  - kyc_profile
  false_positive_notes: Many PEPs, particularly domestic or low-level officials, are lawfully wealthy
    and low risk once source of wealth is understood.
  status: draft
  provenance: ai_drafted
  evidence_basis: ai_draft_unreviewed
  confidence: unassessed
- id: IND-CUS-017
  name: Non-resident customer without clear rationale
  description: Customer resides outside the institution's market and cannot explain why they need an account
