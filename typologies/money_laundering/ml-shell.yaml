typology:
  id: ML-SHELL
  name: Shell and Front Companies
  domain: money_laundering
  description: Use of companies with no or minimal real operations to hold, move or obscure criminal funds,
    or of operating businesses used as a front to mix illicit and legitimate income. Complex structures
    and nominee arrangements hide beneficial ownership.
  stage:
  - layering
  - integration
  sectors:
  - banking
  - corporate_services
  - dnfbp
  sources:
  - FATF and Egmont Group, Concealment of Beneficial Ownership (2018) <https://www.fatf-gafi.org/en/publications/Methodsandtrends/FATF-Egmont-Concealment-beneficial-ownership.html>
    [corrected, agent-reviewed]
  - FATF, Guidance on Transparency and Beneficial Ownership (2014) <https://www.fatf-gafi.org/en/publications/Fatfrecommendations/Guidance-transparency-beneficial-ownership.html>
    [agent-reviewed]
  indicators:
  - ref: IND-CUS-011
    legacy_id: ML-SHELL-001
    context: Company lacks staff, premises, website, supplier payments or payroll despite substantial
      turnover.
    false_positive_context: Holding companies and start-ups have little activity.
    controls:
    - CTL-010
    - CTL-017
  - ref: IND-OWN-008
    legacy_id: ML-SHELL-002
    context: Address is a mass-registration or virtual office used by large numbers of entities.
    name_in_typology: Registered address shared with many companies
    false_positive_context: Formation agents' offices are legitimate hosts.
    controls:
    - CTL-003
    - CTL-010
  - ref: IND-OWN-001
    legacy_id: ML-SHELL-003
    context: Directors or shareholders appear to act for undisclosed principals.
    false_positive_context: Nominees are lawful in some jurisdictions for privacy or administration.
    controls:
    - CTL-007
    - CTL-005
  - ref: IND-OWN-002
    legacy_id: ML-SHELL-004
    context: Chains of entities in secrecy or low-transparency jurisdictions without commercial need.
    name_in_typology: Layered ownership across multiple jurisdictions
    false_positive_context: Tax-neutral fund or group structures may be normal.
    controls:
    - CTL-008
    - CTL-005
    - CTL-010
  - ref: IND-TXN-001
    legacy_id: ML-SHELL-005
    context: Funds enter and leave quickly in similar amounts with no operating cost.
    name_in_typology: Pass-through flows with minimal balance
    false_positive_context: Payment intermediaries and agents have pass-through flows.
    controls:
    - CTL-040
    - CTL-042
  - ref: IND-GEO-019
    legacy_id: ML-SHELL-006
    context: Payments involve countries with no link to declared business.
    name_in_typology: Payments to or from unrelated high-risk jurisdictions
    false_positive_context: Diaspora and project-specific payments occur.
    controls:
    - CTL-045
    - CTL-027
  - ref: IND-DOC-046
    legacy_id: ML-SHELL-007
    context: Vague business descriptions such as consulting or general trading; documents inconsistent
      with the activity.
    false_positive_context: Genuine small consultancies are common.
    controls:
    - CTL-011
    - CTL-002
  - ref: IND-BEH-020
    legacy_id: ML-SHELL-008
    context: Rapid account use shortly after incorporation, with no history.
    name_in_typology: Company formed very recently before large transactions
    severity_in_typology: medium
    false_positive_context: New ventures start quickly.
    controls:
    - CTL-054
    - CTL-012
  - ref: IND-DOC-047
    legacy_id: ML-SHELL-009
    context: Intercompany loans or invoices with no agreements, interest or repayment.
    name_in_typology: Loans or invoices with related parties lacking documentation
    false_positive_context: Informal group funding is common in small groups.
    controls:
    - CTL-047
    - CTL-151
