typology:
  id: TF-CROWDFUND
  name: Crowdfunding and Social Media Fundraising for Terrorist Financing
  domain: terrorist_financing
  description: Online fundraising platforms, social media appeals and messaging channels can be used to
    solicit small donations across many jurisdictions for violent groups, often presenting as humanitarian
    or community causes. Detection combines campaign content intelligence with payment patterns across
    payment processors, banks and platforms.
  sectors:
  - payments
  - fintech
  - crypto
  - banking
  sources:
  - FATF, Crowdfunding for Terrorism Financing (2023)
  - FATF, Emerging Terrorist Financing Risks (2015)
  - FATF, Terrorist Financing Risk Assessment Guidance (2019)
  indicators:
  - id: TF-CROWDFUND-001
    name: Campaign narrative linked to extremist content or designated groups
    description: Fundraising page, post or channel references violent groups, glorifies violence or is
      linked to accounts removed for extremism.
    category: typology_specific
    severity: high
    detection_type:
    - external_intel
    - investigator_judgement
    data_sources:
    - platform_content
    - open_source_intel
    false_positive_notes: Political or religious speech, and news reporting, may reference the same topics
      lawfully.
    controls:
    - id: TF-CROWDFUND-001-C1
      name: Content-informed risk review
      type: detective
      description: Pair payment-side monitoring with platform trust-and-safety signals and public-private
        feeds.
      implementation: process
      effectiveness: medium
    - id: TF-CROWDFUND-001-C2
      name: Campaign onboarding checks
      type: preventive
      description: Verify organiser identity, stated purpose and beneficiary before enabling withdrawals.
      implementation: process
      effectiveness: medium
    - id: TF-CROWDFUND-001-C3
      name: Takedown and referral process
      type: corrective
      description: Define steps for suspending campaigns and referring concerns to authorities.
      implementation: process
      effectiveness: medium
  - id: TF-CROWDFUND-002
    name: Many small donations from geographically diverse donors to a single organiser
    description: Large numbers of low-value contributions from many countries into one recipient account
      that then withdraws promptly.
    category: transaction
    severity: medium
    detection_type:
    - transaction_monitoring
    data_sources:
    - donation_data
    - payout_data
    false_positive_notes: Viral humanitarian appeals and memorial funds show similar patterns.
    controls:
    - id: TF-CROWDFUND-002-C1
      name: Donor dispersion analytics
      type: detective
      description: Detect unusual donor count, geography spread and quick pay-out combinations.
      implementation: model
      effectiveness: medium
    - id: TF-CROWDFUND-002-C2
      name: Payout hold on new campaigns
      type: preventive
      description: Apply risk-based payout delays for new or anomalous campaigns.
      implementation: policy
      effectiveness: medium
  - id: TF-CROWDFUND-003
    name: Payout to account unrelated to organiser or declared beneficiary
    description: Funds are paid to third-party accounts, prepaid cards or wallets that do not match the
      organiser's verified identity.
    category: counterparty
    severity: medium
    detection_type:
    - kyc_review
    - transaction_monitoring
    data_sources:
    - payout_instructions
    - identity_data
    false_positive_notes: Campaigns for medical treatment are often paid to relatives or institutions.
    controls:
    - id: TF-CROWDFUND-003-C1
      name: Payee-to-organiser matching
      type: preventive
      description: Require explanation and documentary link where payee differs from verified organiser.
      implementation: rule
      effectiveness: medium
    - id: TF-CROWDFUND-003-C2
      name: Payout account re-verification
      type: preventive
      description: Re-verify accounts on change of payout details.
      implementation: process
      effectiveness: medium
  - id: TF-CROWDFUND-004
    name: Use of coded language, rapid channel migration or deleted campaigns
    description: Organiser moves between platforms or handles, closes campaigns and restarts under new
      names after scrutiny.
    category: behavioural
    severity: medium
    detection_type:
    - external_intel
    - investigator_judgement
    data_sources:
    - platform_signals
    - device_data
    false_positive_notes: Privacy-conscious users and harassment victims also change handles.
    controls:
    - id: TF-CROWDFUND-004-C1
      name: Cross-platform entity resolution
      type: detective
      description: Link organisers by device, payment instrument and contact data.
      implementation: technology
      effectiveness: medium
    - id: TF-CROWDFUND-004-C2
      name: Repeat-organiser flagging
      type: preventive
      description: Maintain internal lists of organisers removed for policy violations.
      implementation: rule
      effectiveness: medium
  - id: TF-CROWDFUND-005
    name: Donations routed to cryptocurrency addresses or messaging-app collection points
    description: Appeal asks for crypto transfers or direct contact on encrypted channels instead of regulated
      payment methods.
    category: product_channel
    severity: medium
    detection_type:
    - external_intel
    - transaction_monitoring
    data_sources:
    - blockchain_analytics
    - platform_content
    false_positive_notes: Crypto donations are legitimate in some communities.
    controls:
    - id: TF-CROWDFUND-005-C1
      name: Blockchain address screening
      type: detective
      description: Screen advertised addresses against attribution data and prior reporting.
      implementation: technology
      effectiveness: medium
    - id: TF-CROWDFUND-005-C2
      name: Policy limiting unverified solicitation
      type: governance
      description: Define acceptable fundraising channels for onboarded organisers.
      implementation: policy
      effectiveness: medium
  - id: TF-CROWDFUND-006
    name: Campaigns exploiting a crisis event with unverified beneficiaries
    description: Appeals created immediately after conflict or disaster events with no known organisation
      behind them and no verifiable delivery route.
    category: behavioural
    severity: medium
    detection_type:
    - external_intel
    - kyc_review
    data_sources:
    - campaign_data
    - news_feeds
    false_positive_notes: Genuine rapid-response efforts frequently emerge informally.
    controls:
    - id: TF-CROWDFUND-006-C1
      name: Event-driven heightened review
      type: preventive
      description: Increase review of new campaigns during major crisis events.
      implementation: process
      effectiveness: medium
    - id: TF-CROWDFUND-006-C2
      name: Trusted-partner routing
      type: preventive
      description: Encourage donations through vetted charities with verified delivery.
      implementation: policy
      effectiveness: medium
  - id: TF-CROWDFUND-007
    name: Funds withdrawn as cash or via ATM in higher-risk border regions
    description: Collected funds are cashed out near conflict zones or high-risk borders shortly after
      payout.
    category: geographic
    severity: high
    detection_type:
    - transaction_monitoring
    data_sources:
    - atm_data
    - card_transactions
    false_positive_notes: Residents and aid workers also transact in those regions.
    controls:
    - id: TF-CROWDFUND-007-C1
      name: Cash-out geography alert
      type: detective
      description: Flag payouts followed by cash use in higher-risk areas.
      implementation: rule
      effectiveness: medium
    - id: TF-CROWDFUND-007-C2
      name: Prepaid card issuer limits
      type: preventive
      description: Apply geographic and value limits to prepaid card payouts.
      implementation: policy
      effectiveness: medium
  - id: TF-CROWDFUND-008
    name: Organiser account shows identity inconsistencies
    description: Organiser identity documents, contact details or IP geolocation do not align with claimed
      location or purpose.
    category: customer
    severity: medium
    detection_type:
    - kyc_review
    - document_review
    data_sources:
    - identity_data
    - ip_geolocation
    false_positive_notes: VPN use and travel create geolocation mismatches.
    controls:
    - id: TF-CROWDFUND-008-C1
      name: Identity verification with liveness
      type: preventive
      description: Use document and biometric verification for organisers.
      implementation: technology
      effectiveness: medium
    - id: TF-CROWDFUND-008-C2
      name: IP and device anomaly checks
      type: detective
      description: Flag inconsistent geolocation with identity data.
      implementation: rule
      effectiveness: low
