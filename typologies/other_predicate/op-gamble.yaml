typology:
  id: OP-GAMBLE
  name: Illegal Gambling and Match-Fixing
  domain: other_predicate
  description: Operation of unlicensed betting, underground casinos and online gambling, and manipulation
    of sporting events for betting profit. Money is laundered through bets, payment processors and agents,
    with corruption of athletes or officials.
  sectors:
  - banking
  - payments
  - casino_gaming
  - crypto
  - fintech
  sources:
  - FATF and APG, Vulnerabilities of Casinos and Gaming Sector (2009) [unverified]
  - FATF, Money Laundering through the Football Sector (2009) [corrected, unverified]
  - Council of Europe, Convention on the Manipulation of Sports Competitions (2014) [unverified]
  - 'Closest: FATF/APG, Vulnerabilities of Casinos and Gaming Sector (2009); FATF, Risks of Gaming and
    Gambling (2026) [replacement suggested, unverified]'
  indicators:
  - ref: IND-CPT-026
    legacy_id: OP-GAMBLE-001
    context: Card or bank payments to merchants disguised under other categories.
    name_in_typology: Payments to unlicensed gambling operators or via nested processors
    false_positive_context: Offshore operators can look similar.
    controls:
    - CTL-057
    - CTL-029
  - ref: IND-TXN-004
    legacy_id: OP-GAMBLE-002
    context: Pooling of funds to bookmakers or agents.
    name_in_typology: Many accounts funding a few betting accounts or agents
    false_positive_context: Agents for horse racing exist.
    controls:
    - CTL-021
    - CTL-153
    - CTL-041
  - ref: IND-BEH-104
    legacy_id: OP-GAMBLE-003
    context: Low-risk betting and quick withdrawals to launder.
    false_positive_context: Arbitrage bettors exist.
    controls:
    - CTL-153
    - CTL-097
  - ref: IND-TYP-043
    legacy_id: OP-GAMBLE-004
    context: Large late stakes on obscure markets.
    false_positive_context: Sharp bettors exist.
    controls:
    - CTL-097
    - CTL-153
  - ref: IND-CPT-047
    legacy_id: OP-GAMBLE-005
    context: Payments to athletes, referees from unrelated parties.
    false_positive_context: Sponsorships and fees exist.
    controls:
    - CTL-024
    - CTL-153
  - ref: IND-TXN-027
    legacy_id: OP-GAMBLE-006
    context: Account used as e-wallet with minimal play.
    name_in_typology: Deposits and withdrawals with little betting activity
    severity_in_typology: medium
    false_positive_context: Players may deposit and cash out.
    controls:
    - CTL-153
    - CTL-152
  - ref: IND-CUS-047
    legacy_id: OP-GAMBLE-007
    context: Cash-heavy venue with transfers by chat apps.
    false_positive_context: Private games may be legal.
    controls:
    - CTL-153
    - CTL-012
  - ref: IND-PRD-058
    legacy_id: OP-GAMBLE-008
    context: Layering via crypto into betting accounts.
    false_positive_context: Crypto betting is legal in places.
    controls:
    - CTL-145
    - CTL-012
