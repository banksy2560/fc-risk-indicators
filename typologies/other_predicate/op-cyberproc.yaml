typology:
  id: OP-CYBERPROC
  name: Cybercrime Proceeds
  domain: other_predicate
  description: Laundering of funds from ransomware, business email compromise, investment and romance
    scams, hacking and account takeover. Money mules, rapid cross-border transfers, crypto conversion
    and cash-out services are typical.
  exposure:
    channels:
    - mobile_app
    - online_banking
    payment_rails:
    - fast_payments
    - crypto_onramp_offramp
    - cross_border_remittance
    - loan_disbursement
    customer_segments:
    - retail
    - vulnerable_elderly
    - new_to_bank
    products:
    - transaction_account
    - crypto_custody
    basis: ai_inferred
    rationale: Scam, BEC and ransomware proceeds via mules, instant payments and crypto.
    consumer:
      relevant: true
      products:
      - transaction_account
      - savings_account
      - credit_card
      - personal_loan
      channels:
      - mobile_app
      - online_banking
      - call_centre
      basis: ai_inferred
      rationale: Cybercrime proceeds, ATO, scams and mule cash-out on retail accounts, card fraud and
        loan fraud, via digital and phone social engineering.
  sectors:
  - banking
  - payments
  - crypto
  - fintech
  - mvts
  sources:
  - FATF, Illicit Financial Flows from Cyber-Enabled Fraud (2023) [unverified]
  - FATF, Countering Ransomware Financing (2023) [unverified]
  - FATF, Updated Guidance for a Risk-Based Approach to Virtual Assets and Virtual Asset Service Providers
    (2021) [corrected, unverified]
  - Europol, Internet Organised Crime Threat Assessment (IOCTA) (annual; specify year) [corrected, unverified]
  indicators:
  - ref: IND-TXN-003
    legacy_id: OP-CYBERPROC-001
    context: Incoming payments from unrelated individuals followed by transfers abroad or to crypto.
    name_in_typology: New account receives funds from many victims then moves them out
    false_positive_context: Marketplace sellers receive many payments.
    controls:
    - CTL-051
    - CTL-079
  - ref: IND-BEH-013
    legacy_id: OP-CYBERPROC-002
    context: Business email compromise signals.
    name_in_typology: Payment-instruction changes and urgent transfers to new beneficiaries
    false_positive_context: Suppliers change banks.
    controls:
    - CTL-070
    - CTL-037
  - ref: IND-BEH-099
    legacy_id: OP-CYBERPROC-003
    context: Scam victims transferring under pressure.
    false_positive_context: People invest in crypto.
    controls:
    - CTL-170
    - CTL-068
  - ref: IND-CPT-050
    legacy_id: OP-CYBERPROC-004
    context: Payments to wallets attributed to ransomware.
    name_in_typology: Ransomware-linked wallet exposure
    false_positive_context: Attribution can be wrong.
    controls:
    - CTL-145
    - CTL-036
  - ref: IND-BEH-011
    legacy_id: OP-CYBERPROC-005
    context: Login anomaly then transfers.
    name_in_typology: Account takeover indicators with immediate credential change and large outflows
    false_positive_context: Travel changes logins.
    controls:
    - CTL-091
    - CTL-073
  - ref: IND-PRD-056
    legacy_id: OP-CYBERPROC-006
    context: Funds move across tokens and chains.
    name_in_typology: Rapid chain-hopping, mixers and privacy coin conversion
    severity_in_typology: medium
    false_positive_context: Privacy can be lawful.
    controls:
    - CTL-145
    - CTL-149
  - ref: IND-CUS-009
    legacy_id: OP-CYBERPROC-007
    context: Onboarding with mismatched data.
    name_in_typology: Accounts opened with synthetic or stolen identities
    severity_in_typology: high
    false_positive_context: Data errors occur.
    controls:
    - CTL-001
    - CTL-090
  - ref: IND-TXN-122
    legacy_id: OP-CYBERPROC-008
    context: Funds converted into hard-to-trace instruments.
    false_positive_context: Gift cards are bought legitimately.
    controls:
    - CTL-052
    - CTL-074
