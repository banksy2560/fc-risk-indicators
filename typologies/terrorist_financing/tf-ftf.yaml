typology:
  id: TF-FTF
  name: Foreign Terrorist Fighter Travel and Support Financing
  domain: terrorist_financing
  description: Individuals who travel to join terrorist groups abroad, and networks that support them,
    finance their journeys through personal funds, loans, family transfers and cash. Financial signals
    typically cluster around the preparatory period before travel and continue through remittances to
    the destination region.
  exposure:
    channels:
    - branch
    - atm
    - mobile_app
    payment_rails:
    - card
    - cash
    - cross_border_remittance
    - loan_disbursement
    customer_segments:
    - retail
    - student_youth
    - third_party_funder
    products:
    - transaction_account
    - credit_card
    - personal_loan
    - home_loan_fixed
    - home_loan_variable
    basis: ai_inferred
    rationale: Pre-travel account emptying, borrowing and ATM use abroad.
    consumer:
      relevant: true
      products:
      - transaction_account
      - savings_account
      - credit_card
      - personal_loan
      channels:
      - mobile_app
      - online_banking
      - branch
      basis: ai_inferred
      rationale: Pre-travel account run-down, cash withdrawals, card use on transit routes and borrowing
        before departure.
  sectors:
  - banking
  - payments
  - mvts
  sources:
  - FATF, Financing of the Terrorist Organisation Islamic State in Iraq and the Levant (ISIL) (2015) [unverified]
  - FATF, Emerging Terrorist Financing Risks (2015) [unverified]
  - UN Security Council Resolution 2178 (2014) on foreign terrorist fighters [unverified]
  indicators:
  - ref: IND-BEH-116
    legacy_id: TF-FTF-001
    context: Customer empties accounts, cancels commitments or sells possessions in a short interval without
      clear purpose.
    false_positive_context: Emigration, study abroad and relocation are common legitimate reasons.
    controls:
    - CTL-040
    - CTL-022
  - ref: IND-GEO-031
    legacy_id: TF-FTF-002
    context: Card or ATM activity in locations commonly used as transit routes to conflict areas, followed
      by cessation of usage.
    name_in_typology: Card and ATM use at transit points near conflict zones
    false_positive_context: Tourism, trade, humanitarian and diaspora travel produce overlapping footprints.
    controls:
    - CTL-045
    - CTL-166
  - ref: IND-TXN-148
    legacy_id: TF-FTF-003
    context: Recurrent small transfers to recipients in or near conflict zones with no clear family relationship
      or humanitarian need.
    false_positive_context: Diaspora families routinely support relatives in affected regions.
    controls:
    - CTL-045
    - CTL-022
  - ref: IND-TXN-149
    legacy_id: TF-FTF-004
    context: Customer obtains borrowing and then leaves the jurisdiction, defaulting.
    false_positive_context: Job loss and financial trouble cause defaults.
    controls:
    - CTL-151
    - CTL-084
  - ref: IND-TYP-056
    legacy_id: TF-FTF-005
    context: Retail purchases of outdoor, protective, communication or medical gear in unusual quantity
      shortly before travel.
    false_positive_context: Hiking, camping and humanitarian volunteering generate the same purchases.
    controls:
    - CTL-052
    - CTL-172
  - ref: IND-CPT-055
    legacy_id: TF-FTF-006
    context: Customer transacts with parties identified in public or law enforcement material as facilitators
      of travel.
    name_in_typology: Connections to known facilitators or recruiters
    false_positive_context: Social contacts and shared community groups cause innocent links.
    controls:
    - CTL-101
    - CTL-102
  - ref: IND-TXN-150
    legacy_id: TF-FTF-007
    context: Itineraries with unusual routing, one-way tickets and short-notice booking inconsistent with
      customer profile.
    false_positive_context: Budget travellers, migrants and workers regularly use multi-leg routes.
    controls:
    - CTL-052
    - CTL-097
  - ref: IND-CUS-052
    legacy_id: TF-FTF-008
    context: Accounts of young customers receive small repeated funds from unrelated adults, followed
      by cash-out.
    false_positive_context: Gifting from relatives and part-time work are normal.
    controls:
    - CTL-046
    - CTL-100
