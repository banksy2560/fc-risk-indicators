typology:
  id: FR-LOAN
  name: Loan and Mortgage Fraud
  domain: fraud
  description: Applicants or insiders misstate income, assets, identity or property value to obtain credit,
    or use straw buyers and inflated appraisals. Mortgage fraud may involve collusion with brokers, valuers
    or conveyancers.
  exposure:
    channels:
    - broker_intermediary
    - branch
    - digital_onboarding
    payment_rails: []
    customer_segments:
    - retail
    - sme
    - professional_intermediary
    products:
    - loan_mortgage
    basis: ai_inferred
    rationale: Mortgage and loan applications via brokers, valuers and conveyancers, including remote
      applications; proceeds diversion is secondary so no single rail tagged.
  sectors:
  - banking
  - fintech
  - real_estate
  sources:
  - FinCEN, advisories on mortgage and real-estate fraud (general) [too vague, unverified]
  - FATF, guidance on real-estate sector risks (general) [too vague, unverified]
  - 'ACFE, Occupational Fraud 2024: A Report to the Nations (2024) <https://www.acfe.com/report-to-the-nations/2024>
    [corrected, agent-reviewed]'
  indicators:
  - ref: IND-DOC-032
    legacy_id: FR-LOAN-001
    context: Payslips, tax forms or bank statements display template reuse or inconsistent fonts.
    false_positive_context: Scans of low quality.
    controls:
    - CTL-002
    - CTL-084
    references:
    - FinCEN, advisories on mortgage and real-estate fraud (general)
  - ref: IND-DOC-033
    legacy_id: FR-LOAN-002
    context: Valuation inflated relative to recent transactions in the area.
    false_positive_context: Rapidly rising markets.
    controls:
    - CTL-084
    - CTL-002
    - CTL-175
    references:
    - FinCEN, advisories on mortgage and real-estate fraud (general)
  - ref: IND-CUS-032
    legacy_id: FR-LOAN-003
    context: Applicant's profile does not match purchase, with another party funding or controlling.
    false_positive_context: Family support.
    controls:
    - CTL-014
    - CTL-084
    - CTL-049
    references:
    - FinCEN, advisories on mortgage and real-estate fraud (general)
  - ref: IND-CUS-033
    legacy_id: FR-LOAN-004
    context: Same borrower applies at several lenders before bureaux update.
    false_positive_context: Rate shopping.
    controls:
    - CTL-083
    - CTL-084
    references:
    - FinCEN, advisories on mortgage and real-estate fraud (general)
  - ref: IND-CPT-025
    legacy_id: FR-LOAN-005
    context: Applications from one source show disproportionate early payment default or document anomalies.
    false_positive_context: Higher-risk niche lenders.
    controls:
    - CTL-175
    - CTL-085
    - CTL-163
    references:
    - FinCEN, advisories on mortgage and real-estate fraud (general)
  - ref: IND-TXN-074
    legacy_id: FR-LOAN-006
    context: Large deposit credited from unrelated accounts.
    false_positive_context: Gifts from relatives.
    controls:
    - CTL-014
    - CTL-084
    references:
    - FinCEN, advisories on mortgage and real-estate fraud (general)
  - ref: IND-TXN-075
    legacy_id: FR-LOAN-007
    context: Funds leave to accounts unrelated to the purpose.
    false_positive_context: Legitimate property or business payments.
    controls:
    - CTL-037
    - CTL-103
    - CTL-083
    references:
    - FinCEN, advisories on mortgage and real-estate fraud (general)
  - ref: IND-BEH-075
    legacy_id: FR-LOAN-008
    context: Staff-approved exceptions or rapid decisions with limited verification.
    false_positive_context: Preferred clients.
    controls:
    - CTL-077
    - CTL-175
    - CTL-163
    references:
    - FinCEN, advisories on mortgage and real-estate fraud (general)
  - ref: IND-DOC-034
    legacy_id: FR-LOAN-009
    context: Owner-occupier application where property is let or used differently.
    false_positive_context: Changed circumstances.
    controls:
    - CTL-084
    - CTL-175
    references:
    - FinCEN, advisories on mortgage and real-estate fraud (general)
