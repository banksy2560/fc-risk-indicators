typology:
  id: ML-REALESTATE
  name: Real Estate
  domain: money_laundering
  description: Purchase, sale, development or financing of property to integrate illicit funds, taking
    advantage of high values, price opacity and the involvement of intermediaries. Techniques include
    buying with cash or via complex structures, rapid flipping, and mortgage fraud.
  stage:
  - layering
  - integration
  sectors:
  - real_estate
  - banking
  - dnfbp
  sources:
  - FATF, Money Laundering and Terrorist Financing in the Real Estate Sector (2007)
  - FATF and Egmont Group, Concealment of Beneficial Ownership (2018)
  - 'FATF, Guidance for a Risk-Based Approach: Real Estate Sector (2022)'
  indicators:
  - ref: IND-CUS-001
    legacy_id: ML-REALESTATE-001
    context: Property acquired is far beyond the buyer's declared income or wealth, with no verifiable
      source.
    name_in_typology: Purchase price inconsistent with buyer's known means
    false_positive_context: Inheritance, business sale or gifts may explain.
    controls:
    - CTL-013
    - CTL-043
  - ref: IND-OWN-003
    legacy_id: ML-REALESTATE-002
    context: Buyer is an offshore company, nominee or trust with hidden beneficial owners.
    name_in_typology: Purchase through opaque company or trust
    false_positive_context: Tax and estate planning vehicles are used.
    controls:
    - CTL-005
    - CTL-008
  - ref: IND-TXN-020
    legacy_id: ML-REALESTATE-003
    context: Declared price differs from valuation, followed by resale or loan at different value.
    name_in_typology: Price materially above or below market
    false_positive_context: Distressed sales and developer incentives.
    controls:
    - CTL-141
    - CTL-124
    - CTL-142
  - ref: IND-BEH-014
    legacy_id: ML-REALESTATE-004
    context: Property bought and sold in a short time at changing prices or with no apparent reason.
    name_in_typology: Rapid resale or flipping with no improvement
    false_positive_context: Developers and investors flip legitimately.
    controls:
    - CTL-150
    - CTL-022
  - ref: IND-TXN-021
    legacy_id: ML-REALESTATE-005
    context: Part of purchase paid in cash, third-party transfers or unexplained funding routes.
    name_in_typology: Large cash component or non-standard funding
    false_positive_context: Some sellers accept cash legitimately.
    controls:
    - CTL-062
    - CTL-046
  - ref: IND-TXN-116
    legacy_id: ML-REALESTATE-006
    context: Loan quickly settled in lump sum or by third parties.
    false_positive_context: Windfalls trigger early repayment.
    controls:
    - CTL-151
    - CTL-012
  - ref: IND-OWN-024
    legacy_id: ML-REALESTATE-007
    context: Portfolio built through different names or relatives.
    false_positive_context: Landlords build portfolios.
    controls:
    - CTL-048
    - CTL-023
  - ref: IND-BEH-095
    legacy_id: ML-REALESTATE-008
    context: Parties avoid face-to-face contact, deal via representatives or insist on speed.
    false_positive_context: Remote deals are common.
    controls:
    - CTL-021
    - CTL-001
  - ref: IND-GEO-018
    legacy_id: ML-REALESTATE-009
    context: Funds or buyers come from jurisdictions with weak controls or sanctions exposure.
    name_in_typology: High-risk jurisdiction funds or buyer connections
    false_positive_context: Overseas buyers are many.
    controls:
    - CTL-027
    - CTL-025
