typology:
  id: FR-CNP
  name: Card-Not-Present and Chargeback Fraud
  domain: fraud
  description: Stolen card details are used online or by phone where the physical card is not checked,
    and some customers or merchants abuse the chargeback system. Fraud rings test cards at low value before
    large purchases.
  sectors:
  - payments
  - banking
  - fintech
  sources:
  - UK Finance, Annual Fraud Report (specify year, e.g. 2025) <https://www.ukfinance.org.uk/> [corrected,
    agent-reviewed]
  - EMVCo and card scheme guidance on 3-D Secure and chargebacks (general) [too vague, unverified]
  - FinCEN, advisories on cyber-enabled fraud (general) [too vague, unverified]
  indicators:
  - ref: IND-TXN-069
    legacy_id: FR-CNP-001
    context: Bursts of low-value attempts across cards, many declined, followed by a successful larger
      purchase.
    false_positive_context: Merchant retries.
    controls:
    - CTL-037
    - CTL-080
    - CTL-090
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-GEO-027
    legacy_id: FR-CNP-002
    context: Goods sent to a freight forwarder or address linked to previous fraud.
    name_in_typology: Shipping address differs from billing and is a reshipper
    false_positive_context: Gifts.
    controls:
    - CTL-080
    - CTL-090
    - CTL-083
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-BEH-066
    legacy_id: FR-CNP-003
    context: One endpoint presents many card numbers.
    false_positive_context: Shared devices in shops.
    controls:
    - CTL-090
    - CTL-083
    - CTL-037
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-TXN-070
    legacy_id: FR-CNP-004
    context: Electronics, gift cards or digital goods with quick delivery.
    false_positive_context: Genuine retail demand.
    controls:
    - CTL-037
    - CTL-080
    - CTL-091
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-BEH-021
    legacy_id: FR-CNP-005
    context: 'Friendly fraud: cardholder denies a transaction made from their own device.'
    name_in_typology: Cardholder disputes shortly after delivery despite genuine session
    false_positive_context: Genuine disputes.
    controls:
    - CTL-057
    - CTL-090
    - CTL-094
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-CPT-021
    legacy_id: FR-CNP-006
    context: 'Merchant-side: high disputes and refunds.'
    false_positive_context: Seasonal peaks.
    controls:
    - CTL-057
    - CTL-067
    - CTL-094
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-CPT-022
    legacy_id: FR-CNP-007
    context: Merchant processes sales for undisclosed businesses.
    name_in_typology: Transaction laundering via a front merchant
    false_positive_context: Aggregators.
    controls:
    - CTL-067
    - CTL-057
    - CTL-083
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-BEH-067
    legacy_id: FR-CNP-008
    context: New account follows rapid purchase flow.
    false_positive_context: Impulse buys.
    controls:
    - CTL-090
    - CTL-091
    - CTL-001
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-PRD-030
    legacy_id: FR-CNP-009
    context: Attempts changed to non-authenticated channels.
    false_positive_context: Technical failure.
    controls:
    - CTL-080
    - CTL-037
    - CTL-091
    references:
    - UK Finance, Annual Fraud Report (published annually)
