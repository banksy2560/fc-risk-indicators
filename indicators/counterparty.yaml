- id: IND-CPT-055
  name: Dealings with known facilitators or persons on investigative watch lists
  description: Customer transacts, including in small amounts, with persons identified in public or law-enforcement
    material as facilitators or subjects of prior reports.
  category: counterparty
  severity: high
  detection_type:
  - screening
  - external_intel
  - transaction_monitoring
  data_sources:
  - law_enforcement_requests
  - prior_reports
