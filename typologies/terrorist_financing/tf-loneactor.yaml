typology:
  id: TF-LONEACTOR
  name: Lone Actor and Small-Value Terrorist Funding
  domain: terrorist_financing
  description: Individuals or very small cells fund attacks, travel or equipment from personal income,
    savings, consumer credit or small gifts, producing low-value activity that blends into normal retail
    banking. Detection relies on combinations of weak signals and on external intelligence rather than
    any single threshold.
  sectors:
  - banking
  - payments
  - fintech
  sources:
  - FATF, Terrorist Financing Risk Assessment Guidance (2019)
  - FATF, Ethnically or Racially Motivated Terrorism Financing (2021)
  indicators:
  - ref: IND-TXN-152
    legacy_id: TF-LONEACTOR-001
    context: Customer takes several unsecured loans, credit cards or overdraft limits in a short window
      and withdraws or transfers the proceeds quickly, then ceases repayment.
    false_positive_context: Common in financial distress, gambling or fraud victimisation; most such patterns
      are not terrorism related.
    controls:
    - CTL-037
    - CTL-039
  - ref: IND-TXN-025
    legacy_id: TF-LONEACTOR-002
    context: Customer liquidates property, vehicle or investments and withdraws cash or moves funds abroad
      without an evident life event.
    name_in_typology: Sale of assets and liquidation of savings followed by withdrawal
    false_positive_context: Relocation, divorce, bereavement and business downturn are frequent legitimate
      drivers.
    controls:
    - CTL-037
    - CTL-022
  - ref: IND-TYP-057
    legacy_id: TF-LONEACTOR-003
    context: Spending on items or services that match typologies shared by law enforcement or public-private
      partnerships, such as particular combinations of retail goods, vehicle hire and reconnaissance-type
      travel.
    false_positive_context: Individual purchases are lawful; only the combination, timing and external
      intel make it meaningful.
    controls:
    - CTL-052
    - CTL-097
  - ref: IND-CUS-003
    legacy_id: TF-LONEACTOR-004
    context: Customer is named in credible reporting or intelligence-led alerts for extremist advocacy,
      associations or prior convictions linked to violence.
    name_in_typology: Adverse media or open-source concern about extremist engagement
    false_positive_context: Media can be wrong, outdated or about a namesake; association alone is not
      proof of funding intent.
    controls:
    - CTL-032
    - CTL-023
    - CTL-102
  - ref: IND-BEH-117
    legacy_id: TF-LONEACTOR-005
    context: Customer shifts from stable spending to minimal discretionary spend, repeated cash withdrawals,
      closing of long-standing products or giving away assets.
    false_positive_context: Religious observance, health events, job loss or emigration plans can look
      identical.
    controls:
    - CTL-042
    - CTL-172
  - ref: IND-CPT-055
    legacy_id: TF-LONEACTOR-006
    context: Low-value payments with parties linked to previously reported subjects or to persons arrested
      in connection with violent extremism.
    name_in_typology: Small transfers to or from a person on a watch or investigative list
    false_positive_context: Family, employment or community connections to a subject can be innocent.
    controls:
    - CTL-101
    - CTL-031
  - ref: IND-GEO-033
    legacy_id: TF-LONEACTOR-007
    context: Spending on flights, border-area hotels or overland transport near conflict zones inconsistent
      with known occupation or history.
    false_positive_context: Tourism, aid work, journalism and family visits explain most such spending.
    controls:
    - CTL-045
    - CTL-011
  - ref: IND-PRD-067
    legacy_id: TF-LONEACTOR-008
    context: Funds spread across several accounts, prepaid cards or wallets at the same or different providers,
      each carrying small balances before consolidated cash-out.
    false_positive_context: Students, migrants and unbanked users frequently use multiple small products.
    controls:
    - CTL-049
    - CTL-072
