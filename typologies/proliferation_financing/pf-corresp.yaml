typology:
  id: PF-CORRESP
  name: Correspondent Banking and Joint Ventures in Proliferation Financing
  domain: proliferation_financing
  description: Proliferation-linked entities may reach the international financial system via correspondent
    relationships, nested accounts or joint ventures that mask the involvement of restricted parties.
    Respondent due diligence and payment-message review are the main tools for detecting this exposure.
  exposure:
    channels:
    - api_open_banking
    payment_rails:
    - wire_swift
    - trade_instruments
    customer_segments:
    - corporate
    products:
    - correspondent_account
    - trade_finance
    basis: ai_inferred
    rationale: Respondent banks, nested accounts and SWIFT message review.
  sectors:
  - banking
  - payments
  sources:
  - FATF, Guidance on Counter Proliferation Financing (2018) [unverified]
  - Wolfsberg Group, Correspondent Banking Due Diligence Questionnaire (CBDDQ) [unverified]
  - FATF, Guidance on Correspondent Banking Services (2016) [unverified]
  indicators:
  - ref: IND-CUS-048
    legacy_id: PF-CORRESP-001
    context: Respondent holds accounts or branches in higher-risk countries without strong controls.
    false_positive_context: Global banks operate in many markets.
    controls:
    - CTL-104
    - CTL-106
    - CTL-016
  - ref: IND-TXN-127
    legacy_id: PF-CORRESP-002
    context: Payment messages show names, addresses or vessels linked to restricted lists.
    false_positive_context: Partial name matches generate false hits.
    controls:
    - CTL-030
    - CTL-033
  - ref: IND-TYP-044
    legacy_id: PF-CORRESP-003
    context: Respondent processes payments for other banks without disclosure.
    false_positive_context: Some nested arrangements are legitimate and permitted.
    controls:
    - CTL-105
    - CTL-104
    - CTL-106
  - ref: IND-OWN-005
    legacy_id: PF-CORRESP-004
    context: Joint venture entity has partners or beneficial owners that cannot be verified.
    name_in_typology: Joint venture with opaque ownership involving state-affiliated partner in higher-risk
      country
    severity_in_typology: medium
    false_positive_context: State partners are common in JV structures.
    controls:
    - CTL-005
    - CTL-048
  - ref: IND-DOC-015
    legacy_id: PF-CORRESP-005
    context: Messages omit key details or show inconsistent data.
    name_in_typology: Payments with missing, truncated or inconsistent ordering or beneficiary information
    severity_in_typology: medium
    false_positive_context: Technical limitations cause some gaps.
    controls:
    - CTL-110
    - CTL-107
  - ref: IND-TYP-045
    legacy_id: PF-CORRESP-006
    context: Payments relate to goods on control lists or to parties on alerts.
    false_positive_context: Generic words can create false hits.
    controls:
    - CTL-030
    - CTL-036
  - ref: IND-TXN-012
    legacy_id: PF-CORRESP-007
    context: Significant, unexplained increase in activity from a respondent.
    name_in_typology: Sudden increase in volume through a respondent or dormant account reactivation
    false_positive_context: Business growth or market shifts.
    controls:
    - CTL-106
    - CTL-022
  - ref: IND-CPT-049
    legacy_id: PF-CORRESP-008
    context: Respondent's customers appear in prior internal or external reports.
    false_positive_context: Coincidental overlap.
    controls:
    - CTL-101
    - CTL-097
