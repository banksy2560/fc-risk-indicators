typology:
  id: XC-OWNERSHIP
  name: Opaque Ownership and Control
  domain: cross_cutting
  description: Inherent-risk factors where the real owners or controllers of a customer cannot be readily
    identified or verified. Includes nominee arrangements, bearer instruments, layered offshore entities
    and mismatches between declared and observed control.
  sectors:
  - banking
  - corporate_services
  - securities
  - dnfbp
  - fintech
  sources:
  - FATF, Guidance for a Risk-Based Approach (sector-specific guidance series, general principles) [too
    vague, unverified]
  - FATF Recommendations, Recommendation 1 and Interpretive Note (assessing risks and applying a risk-based
    approach) <https://www.fatf-gafi.org/en/publications/Fatfrecommendations/Fatf-recommendations.html>
    [agent-reviewed]
  - Wolfsberg Group, Guidance on a Risk Based Approach for Managing Money Laundering Risks (2006) <https://wolfsberg-group.org/resources/rba>
    [corrected, agent-reviewed]
  indicators:
  - ref: IND-OWN-005
    legacy_id: XC-OWNERSHIP-001
    context: Ownership chain ends in an entity, trust or foundation with no natural person identified
      after reasonable effort.
    name_in_typology: Beneficial owner cannot be identified
    false_positive_context: Some widely held or publicly listed entities have no controlling individual.
    controls:
    - CTL-005
    - CTL-006
  - ref: IND-OWN-001
    legacy_id: XC-OWNERSHIP-002
    context: Registered shareholders or directors act on behalf of undisclosed principals.
    name_in_typology: Nominee shareholders or directors
    false_positive_context: Professional nominees are lawful when disclosed and regulated.
    controls:
    - CTL-007
    - CTL-005
    - CTL-006
  - ref: IND-OWN-014
    legacy_id: XC-OWNERSHIP-003
    context: Entity has issued, or may issue, bearer shares or warrants transferable without registration.
    false_positive_context: Legacy bearer shares may be immobilised or custodied under regulation.
    controls:
    - CTL-007
    - CTL-005
    - CTL-006
  - ref: IND-OWN-002
    legacy_id: XC-OWNERSHIP-004
    context: Several tiers of entities across secrecy or low-tax jurisdictions sit between the customer
      and its owners.
    name_in_typology: Layered offshore holding structure
    false_positive_context: Multinational groups and fund structures can be layered for tax neutrality.
    controls:
    - CTL-008
    - CTL-005
    - CTL-023
  - ref: IND-OWN-015
    legacy_id: XC-OWNERSHIP-005
    context: Registry, media or documents show owners different from those declared by the customer.
    false_positive_context: Registries lag and may be outdated.
    controls:
    - CTL-005
    - CTL-014
  - ref: IND-OWN-016
    legacy_id: XC-OWNERSHIP-006
    context: Trust, foundation or similar arrangement where settlor, protector or beneficiaries are not
      disclosed.
    false_positive_context: Discretionary trusts may have class-defined beneficiaries.
    controls:
    - CTL-009
    - CTL-005
    - CTL-023
  - ref: IND-OWN-006
    legacy_id: XC-OWNERSHIP-007
    context: Entity has no staff, premises, operations or revenue consistent with its stated activities.
    name_in_typology: Shell or no-substance entity
    false_positive_context: Start-ups, SPVs and holding companies lawfully have few operations.
    controls:
    - CTL-010
    - CTL-040
  - ref: IND-OWN-008
    legacy_id: XC-OWNERSHIP-008
    context: Customer shares registered address, agent or phone with numerous unrelated companies.
    name_in_typology: Common address or agent for many entities
    false_positive_context: Registered agent and virtual office addresses are very common.
    controls:
    - CTL-049
    - CTL-003
  - ref: IND-OWN-017
    legacy_id: XC-OWNERSHIP-009
    context: Powers of attorney, side letters or signatories give control to persons not in the ownership
      chain.
    false_positive_context: Family, lawyers and fiduciaries often hold legitimate powers.
    controls:
    - CTL-005
    - CTL-018
  - ref: IND-OWN-007
    legacy_id: XC-OWNERSHIP-010
    context: New company shows significant turnover or funding soon after formation with no track record.
    name_in_typology: Recently incorporated entity with large flows
    severity_in_typology: medium
    false_positive_context: Genuine start-ups may scale quickly.
    controls:
    - CTL-054
    - CTL-012
