typology:
  id: FR-PONZ
  name: Investment, Ponzi and Pyramid Schemes
  domain: fraud
  description: Operators promise unusually high or guaranteed returns, paying earlier investors from new
    deposits or recruitment fees rather than genuine profits. Collapse leaves many victims and often a
    trail of commingled funds and layered transfers.
  exposure:
    channels:
    - online_banking
    - mobile_app
    payment_rails:
    - fast_payments
    - crypto_onramp_offramp
    - wire_swift
    customer_segments:
    - retail
    - vulnerable_elderly
    products:
    - transaction_account
    - investment_securities
    basis: ai_inferred
    rationale: Investor deposits to operators; crypto and securities variants.
    consumer:
      relevant: true
      products:
      - transaction_account
      - savings_account
      - term_deposit
      channels:
      - mobile_app
      - online_banking
      - branch
      basis: ai_inferred
      rationale: Victims send savings, including broken term deposits, to scheme operators; operators
        and mules receive in everyday accounts.
  sectors:
  - banking
  - securities
  - payments
  - crypto
  sources:
  - FATF, guidance on risk-based approach and proceeds of fraud (general) [too vague, unverified]
  - IOSCO, investor alerts on unregistered investment offerings (general) [too vague, unverified]
  - 'ACFE, Occupational Fraud 2024: A Report to the Nations (2024) <https://www.acfe.com/report-to-the-nations/2024>
    [corrected, agent-reviewed]'
  indicators:
  - ref: IND-TYP-028
    legacy_id: FR-PONZ-001
    context: Operator marketing guarantees consistently high returns, often with testimonials and urgency;
      victims relay these claims when transferring.
    false_positive_context: Genuine high-risk, high-return products clearly disclosed.
    controls:
    - CTL-032
    - CTL-170
    - CTL-082
    references:
    - FATF, guidance on risk-based approach and proceeds of fraud (general)
  - ref: IND-TXN-004
    legacy_id: FR-PONZ-002
    context: 'Operator-side: numerous retail credits referencing the ''investment'' or a referral code,
      inconsistent with the stated business.'
    name_in_typology: Many small inflows from unrelated individuals into one account
    false_positive_context: Crowdfunding, clubs or bonafide pooled schemes.
    controls:
    - CTL-037
    - CTL-051
    - CTL-014
    references:
    - FATF, guidance on risk-based approach and proceeds of fraud (general)
  - ref: IND-TXN-076
    legacy_id: FR-PONZ-003
    context: 'Operator-side: credits are followed by payments to prior investors in neat sums, plus cash-outs
      to insiders.'
    false_positive_context: Legitimate coupon or dividend payments.
    controls:
    - CTL-037
    - CTL-049
    - CTL-014
    references:
    - FATF, guidance on risk-based approach and proceeds of fraud (general)
  - ref: IND-PRD-037
    legacy_id: FR-PONZ-004
    context: Payments reward introducing new participants rather than selling goods or services.
    false_positive_context: Standard multi-level marketing with genuine retail sales.
    controls:
    - CTL-032
    - CTL-082
    - CTL-014
    references:
    - FATF, guidance on risk-based approach and proceeds of fraud (general)
  - ref: IND-CPT-026
    legacy_id: FR-PONZ-005
    context: Operator is absent from regulator registers or holds a licence unrelated to the activity
      offered.
    name_in_typology: Unregistered or unlicensed operator
    false_positive_context: New firms awaiting authorisation.
    controls:
    - CTL-032
    - CTL-014
    - CTL-083
    references:
    - FATF, guidance on risk-based approach and proceeds of fraud (general)
  - ref: IND-BEH-076
    legacy_id: FR-PONZ-006
    context: 'Victim-side: customers report blocked withdrawals or demands for charges and taxes; complaints
      rise.'
    false_positive_context: Genuine liquidity gates in funds.
    controls:
    - CTL-082
    - CTL-094
    - CTL-170
    references:
    - FATF, guidance on risk-based approach and proceeds of fraud (general)
  - ref: IND-TXN-077
    legacy_id: FR-PONZ-007
    context: 'Operator-side: lifestyle spending, property or vehicle purchases funded from investor accounts.'
    false_positive_context: High-net-worth operators with separate wealth.
    controls:
    - CTL-014
    - CTL-037
    - CTL-049
    references:
    - FATF, guidance on risk-based approach and proceeds of fraud (general)
  - ref: IND-BEH-077
    legacy_id: FR-PONZ-008
    context: 'Victim-side: customer takes credit or rolls over supposed profits and refers friends.'
    false_positive_context: Active investors.
    controls:
    - CTL-170
    - CTL-068
    - CTL-074
    references:
    - FATF, guidance on risk-based approach and proceeds of fraud (general)
  - ref: IND-OWN-019
    legacy_id: FR-PONZ-009
    context: Accounts are repeatedly opened and closed under front companies to receive deposits.
    false_positive_context: Group structures with real subsidiaries.
    controls:
    - CTL-049
    - CTL-083
    - CTL-014
    references:
    - FATF, guidance on risk-based approach and proceeds of fraud (general)
