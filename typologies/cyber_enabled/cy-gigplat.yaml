typology:
  id: CY-GIGPLAT
  name: Online Marketplace and Gig-Economy Platform Misuse
  domain: cyber_enabled
  description: Online marketplaces, freelance and ride or delivery platforms offer payments between strangers
    and large seller or worker populations. Criminals use fake listings, collusive purchases, refund cycling
    or fake workers to launder funds, receive scam proceeds or rent out accounts. Platforms see anomalies
    in seller behaviour and payout flows.
  exposure:
    channels:
    - online_platform
    - mobile_app
    - api_open_banking
    payment_rails:
    - fast_payments
    - stored_value_wallet
    - card
    customer_segments:
    - retail
    - sme
    - fintech_psp
    products:
    - merchant_services
    - prepaid_stored_value
    basis: ai_inferred
    rationale: Marketplace and gig platforms with seller payouts, refund and chargeback cycling, vouchers
      and account rental; platforms act as PSPs/merchants.
  stage:
  - layering
  sectors:
  - payments
  - fintech
  sources:
  - FATF, Opportunities and Challenges of New Technologies for AML/CFT (2021) <https://www.fatf-gafi.org/content/fatf-gafi/en/publications/Digitaltransformation/Opportunities-challenges-new-technologies-for-aml-cft.html>
    [agent-reviewed]
  - FATF, Illicit Financial Flows from Cyber-Enabled Fraud (2023) [unverified]
  indicators:
  - ref: IND-TYP-010
    legacy_id: CY-GIGPLAT-001
    context: Accounts sharing devices or funding sources transact with each other to create revenue.
    false_positive_context: Family businesses.
    controls:
    - CTL-048
    - CTL-091
    - CTL-076
  - ref: IND-TXN-051
    legacy_id: CY-GIGPLAT-002
    context: Orders marked complete without tracking, or delivered to unrelated addresses.
    false_positive_context: Digital goods.
    controls:
    - CTL-057
    - CTL-076
    - CTL-093
  - ref: IND-TXN-019
    legacy_id: CY-GIGPLAT-003
    context: Repeated purchase and refund flows to move value between accounts.
    name_in_typology: Refund and chargeback cycling
    severity_in_typology: medium
    false_positive_context: Return-heavy categories.
    controls:
    - CTL-057
    - CTL-037
    - CTL-048
  - ref: IND-CUS-010
    legacy_id: CY-GIGPLAT-004
    context: Rapid revenue growth for new accounts with sparse listings or reviews.
    name_in_typology: Newly registered seller reaching high sales immediately
    severity_in_typology: medium
    false_positive_context: Viral products.
    controls:
    - CTL-076
    - CTL-037
    - CTL-093
  - ref: IND-BEH-005
    legacy_id: CY-GIGPLAT-005
    context: Mismatched face, device or location against the verified worker.
    name_in_typology: Gig worker account operated by someone else
    severity_in_typology: medium
    false_positive_context: Legitimate substitutes where permitted.
    controls:
    - CTL-001
    - CTL-091
    - CTL-076
  - ref: IND-CPT-010
    legacy_id: CY-GIGPLAT-006
    context: Seller payout accounts do not match verified identity.
    name_in_typology: Payouts to bank accounts in third-party names
    false_positive_context: Business accounts under trade names.
    controls:
    - CTL-069
    - CTL-076
    - CTL-023
  - ref: IND-PRD-023
    legacy_id: CY-GIGPLAT-007
    context: Listings use extreme or placeholder prices likely used to move amounts.
    false_positive_context: Price errors.
    controls:
    - CTL-057
    - CTL-076
    - CTL-093
  - ref: IND-TXN-033
    legacy_id: CY-GIGPLAT-008
    context: Gift-card heavy activity that is cashed out through marketplaces.
    name_in_typology: Large volumes of gift cards or vouchers sold or purchased
    severity_in_typology: medium
    false_positive_context: Seasonal peaks.
    controls:
    - CTL-057
    - CTL-037
    - CTL-083
  - ref: IND-BEH-044
    legacy_id: CY-GIGPLAT-009
    context: Credential changes, new device and region shifts for an established seller.
    false_positive_context: Travel.
    controls:
    - CTL-091
    - CTL-073
    - CTL-092
  - ref: IND-TYP-011
    legacy_id: CY-GIGPLAT-010
    context: Messaging encourages payment via transfer or crypto outside platform protections.
    false_positive_context: Local community norms.
    controls:
    - CTL-083
    - CTL-076
    - CTL-068
