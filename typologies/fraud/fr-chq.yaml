typology:
  id: FR-CHQ
  name: Cheque and Deposit Fraud
  domain: fraud
  description: Counterfeit, altered or stolen cheques, and deposits of items later returned, can be used
    to obtain funds before the fraud is discovered. Mule accounts and overpayment scams are common.
  sectors:
  - banking
  sources:
  - UK Finance, Annual Fraud Report (published annually)
  - FinCEN, advisories on check fraud (general)
  - Industry guidance on funds availability and check clearing (general)
  indicators:
  - ref: IND-TXN-031
    legacy_id: FR-CHQ-001
    context: Funds are drawn before the cheque clears.
    name_in_typology: Large cheque deposited followed by prompt withdrawals
    false_positive_context: Genuine large cheques.
    controls:
    - CTL-079
    - CTL-081
    - CTL-037
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-DOC-028
    legacy_id: FR-CHQ-002
    context: Image shows alterations, mismatched MICR or font.
    false_positive_context: Poor scans.
    controls:
    - CTL-081
    - CTL-002
    - CTL-079
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-CPT-058
    legacy_id: FR-CHQ-003
    context: Payee and depositor have no relationship.
    name_in_typology: Deposit of third-party cheque from unknown payer
    false_positive_context: Family gifts.
    controls:
    - CTL-081
    - CTL-014
    - CTL-079
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-BEH-022
    legacy_id: FR-CHQ-004
    context: 'Victim-side: seller is asked to refund an overpayment before the cheque clears.'
    name_in_typology: Overpayment request after receiving cheque
    false_positive_context: Genuine mistake.
    controls:
    - CTL-074
    - CTL-170
    - CTL-079
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-TXN-067
    legacy_id: FR-CHQ-005
    context: Duplicate presentment.
    false_positive_context: Technical retries.
    controls:
    - CTL-081
    - CTL-083
    - CTL-037
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-CUS-030
    legacy_id: FR-CHQ-006
    context: Account opened and quickly funded by cheques.
    false_positive_context: Genuine new customers.
    controls:
    - CTL-079
    - CTL-001
    - CTL-037
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-TXN-068
    legacy_id: FR-CHQ-007
    context: Multiple withdrawals after deposit.
    false_positive_context: Cash needs.
    controls:
    - CTL-037
    - CTL-014
    - CTL-091
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-DOC-029
    legacy_id: FR-CHQ-008
    context: Payee name altered; account holder differs.
    false_positive_context: Joint payees.
    controls:
    - CTL-081
    - CTL-079
    - CTL-083
    references:
    - UK Finance, Annual Fraud Report (published annually)
  - ref: IND-BEH-065
    legacy_id: FR-CHQ-009
    context: A ring uses recruited accounts.
    false_positive_context: Business deposits.
    controls:
    - CTL-051
    - CTL-083
    - CTL-049
    references:
    - UK Finance, Annual Fraud Report (published annually)
