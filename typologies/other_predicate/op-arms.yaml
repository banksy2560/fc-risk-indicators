typology:
  id: OP-ARMS
  name: Arms Trafficking and Illicit Firearms
  domain: other_predicate
  description: Illicit supply and diversion of firearms, ammunition and components, including straw purchases,
    illegal manufacturing, end-user certificate fraud and brokering outside licence. Financial indicators
    arise in dealer payments, shipping, brokers and cash purchases.
  exposure:
    channels:
    - face_to_face_professional
    - broker_intermediary
    payment_rails:
    - wire_swift
    - cash
    - trade_instruments
    customer_segments:
    - corporate
    - retail
    - regulated_nonbank_dnfbp
    products:
    - trade_finance
    - transaction_account
    basis: ai_inferred
    rationale: Dealer and broker payments, trade documentation and shipping for transfers, plus cash and
      straw purchases by individuals; arms dealers are regulated non-bank businesses.
    consumer:
      relevant: false
      products: []
      channels: []
      basis: ai_inferred
      rationale: Arms trafficking is mainly dealer, brokering and shipping finance; retail purchases show
        no distinctive consumer product mechanics.
  sectors:
  - banking
  - payments
  - corporate_services
  - mvts
  sources:
  - UN Arms Trade Treaty (2013) [unverified]
  - UN Protocol against the Illicit Manufacturing of and Trafficking in Firearms (2001) [unverified]
  - UNODC, Global Study on Firearms Trafficking 2020 (2020) [corrected, unverified]
  - SIPRI, Trends in International Arms Transfers (annual fact sheet) [replacement suggested, unverified]
  indicators:
  - ref: IND-TXN-119
    legacy_id: OP-ARMS-001
    context: Repeated purchases of guns, parts or ammunition inconsistent with sport use, paid by different
      people.
    false_positive_context: Collectors and ranges buy in volume.
    controls:
    - CTL-052
    - CTL-097
  - ref: IND-CPT-042
    legacy_id: OP-ARMS-002
    context: Intermediary arranges transfers without export licences.
    false_positive_context: Licensing differs by country.
    controls:
    - CTL-116
    - CTL-128
  - ref: IND-GEO-020
    legacy_id: OP-ARMS-003
    context: Arms shipments change consignee or route.
    false_positive_context: Re-routing occurs for lawful cargo.
    controls:
    - CTL-126
    - CTL-035
  - ref: IND-PRD-052
    legacy_id: OP-ARMS-004
    context: Orders for firearm blueprint files, receivers, jigs.
    false_positive_context: Hobbyists and makers exist.
    controls:
    - CTL-043
    - CTL-097
  - ref: IND-CPT-043
    legacy_id: OP-ARMS-005
    context: Counterparties on arms embargo or sanctions lists.
    false_positive_context: Name matches are common.
    controls:
    - CTL-029
    - CTL-035
  - ref: IND-TXN-120
    legacy_id: OP-ARMS-006
    context: Weapons purchased for cash and quickly moved abroad.
    false_positive_context: Collectors may sell.
    controls:
    - CTL-055
    - CTL-024
  - ref: IND-CUS-044
    legacy_id: OP-ARMS-007
    context: Customer's counterparties are tied to armed groups.
    false_positive_context: Reports may be disputed.
    controls:
    - CTL-032
    - CTL-036
  - ref: IND-DOC-048
    legacy_id: OP-ARMS-008
    context: Containers described as machinery or toys with weights conflicting with documents.
    false_positive_context: Weights vary.
    controls:
    - CTL-123
    - CTL-169
