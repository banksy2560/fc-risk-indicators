# Consumer-bank product risk assessment questionnaire, v2 (see questionnaire/README.md "v2: consumer-bank scope").
# Applicability aid only: no scores or ratings. Q01/Q02 map to products and channels; Q03+ map ONLY to payment_rails and customer_segments.
# Profiles are illustrative of a typical Australian-style consumer product; they are not assessments of any real product.
version: 2
scope: consumer
sections:
  - id: product_basics
    title: "Product and channels"
  - id: customers
    title: "Target customers"
  - id: money_movement
    title: "Money movement and payment features"
  - id: product_features
    title: "Product-specific features"
  - id: lending
    title: "Lending features"
  - id: channel_controls
    title: "Channel-specific features"
questions:
  - id: Q01
    section: product_basics
    text: "Which product are you assessing?"
    help: "Pick exactly one. Run the questionnaire once per product; home loans are split into fixed and variable because their features differ."
    type: single
    options:
      - id: Q01-A
        label: "Everyday account"
        maps_to: {"products": ["transaction_account"]}
        note: "Maps to the transaction_account product tag; other questions are filtered to this product."
      - id: Q01-B
        label: "Savings account"
        maps_to: {"products": ["savings_account"]}
        note: "Maps to the savings_account product tag; other questions are filtered to this product."
      - id: Q01-C
        label: "Term deposit"
        maps_to: {"products": ["term_deposit"]}
        note: "Maps to the term_deposit product tag; other questions are filtered to this product."
      - id: Q01-D
        label: "Credit card"
        maps_to: {"products": ["credit_card"]}
        note: "Maps to the credit_card product tag; other questions are filtered to this product."
      - id: Q01-E
        label: "Personal loan"
        maps_to: {"products": ["personal_loan"]}
        note: "Maps to the personal_loan product tag; other questions are filtered to this product."
      - id: Q01-F
        label: "Home loan (fixed rate)"
        maps_to: {"products": ["home_loan_fixed"]}
        note: "Maps to the home_loan_fixed product tag; other questions are filtered to this product."
      - id: Q01-G
        label: "Home loan (variable rate)"
        maps_to: {"products": ["home_loan_variable"]}
        note: "Maps to the home_loan_variable product tag; other questions are filtered to this product."
  - id: Q02
    section: product_basics
    text: "Through which channels is this product available or serviced?"
    help: "Tick every channel customers can use to open, use or service the product, not only the main one."
    type: multi
    options:
      - id: Q02-A
        label: "Mobile app"
        maps_to: {"channels": ["mobile_app"]}
        note: "Maps to the mobile_app channel tag; channel-specific questions are filtered accordingly."
      - id: Q02-B
        label: "Internet banking"
        maps_to: {"channels": ["online_banking"]}
        note: "Maps to the online_banking channel tag; channel-specific questions are filtered accordingly."
      - id: Q02-C
        label: "Phone banking (call centre)"
        maps_to: {"channels": ["call_centre"]}
        note: "Maps to the call_centre channel tag; channel-specific questions are filtered accordingly."
      - id: Q02-D
        label: "Retail network (branches)"
        maps_to: {"channels": ["branch"]}
        note: "Maps to the branch channel tag; channel-specific questions are filtered accordingly."
  - id: Q03
    section: customers
    text: "Who is this product designed for and open to?"
    help: "Tick every group the product is available to, including through exceptions or special offers. Mass-market individuals are the default."
    type: multi
    options:
      - id: Q03-A
        label: "Adult individuals generally (mass market)"
        maps_to: {}
        note: "Mass-market individuals are the baseline; deliberately no retail tag, because most typologies list retail and it would not discriminate between them."
      - id: Q03-B
        label: "Children, teenagers or students (youth or student offers, minor accounts)"
        maps_to: {"customer_segments": ["student_youth"]}
        note: "Youth and student offers map to student_youth, a common mule-recruitment and scam-target group."
      - id: Q03-C
        label: "Older customers, or customers likely to be vulnerable (seniors offers, carers, customers who rely on others to bank)"
        maps_to: {"customer_segments": ["vulnerable_elderly"]}
        note: "Older and vulnerable customers map to vulnerable_elderly (scams, elder financial abuse)."
      - id: Q03-D
        label: "Not sure / not applicable"
        maps_to: {}
        note: "No tags."
  - id: Q04
    section: customers
    text: "Is the product open to customers who live overseas, hold temporary visas, or have links to politically exposed people?"
    help: "Think about eligibility rules and what happens in practice, not just the target market."
    type: multi
    options:
      - id: Q04-A
        label: "Non-residents, temporary visa holders, or customers with overseas income or addresses"
        maps_to: {"customer_segments": ["non_resident"]}
        note: "Maps to non_resident."
      - id: Q04-B
        label: "Customers who are, or are related to or closely associated with, politically exposed persons (PEPs)"
        maps_to: {"customer_segments": ["pep_related"]}
        note: "Maps to pep_related."
      - id: Q04-C
        label: "Not sure / not applicable"
        maps_to: {}
        note: "No tags."
  - id: Q05
    section: customers
    text: "Do sole traders or self-employed customers commonly use this personal product for business purposes?"
    help: "Sole traders (self-employed individuals) often run business receipts and payments through personal products, which blurs personal and business activity and weakens business-customer controls."
    type: single
    options:
      - id: Q05-A
        label: "Yes, this is common or expected"
        maps_to: {"customer_segments": ["sole_trader"]}
        note: "Maps to sole_trader (self-employed individual using a personal product for business), replacing the weaker sme tag."
      - id: Q05-B
        label: "No, business use is excluded or rare"
        maps_to: {}
        note: "No tags."
      - id: Q05-C
        label: "Not sure / not applicable"
        maps_to: {}
        note: "No tags."
  - id: Q06
    section: customers
    text: "Can customers who are new to the bank, or have little or no credit or banking history, open this product?"
    help: "Include customers with a thin file, recent arrivals and customers with no existing relationship."
    type: single
    options:
      - id: Q06-A
        label: "Yes, new-to-bank customers can open it, often with limited history"
        maps_to: {"customer_segments": ["new_to_bank"]}
        note: "Maps to new_to_bank (synthetic identity, mule and first-party fraud exposure)."
      - id: Q06-B
        label: "No, an existing relationship or established history is required"
        maps_to: {}
        note: "No tags."
      - id: Q06-C
        label: "Not sure / not applicable"
        maps_to: {}
        note: "No tags."
  - id: Q07
    section: money_movement
    text: "Can customers send and receive real-time (fast) payments from this account?"
    help: "Real-time payments settle in seconds and cannot be recalled easily, so funds can move out before a scam or mule account is detected."
    type: multi
    applies_to_products: [transaction_account, savings_account]
    options:
      - id: Q07-A
        label: "Yes, send real-time payments to other people (pay anyone)"
        maps_to: {"payment_rails": ["fast_payments"]}
        note: "Maps to fast_payments."
      - id: Q07-B
        label: "Yes, receive real-time payments from other people"
        maps_to: {"payment_rails": ["fast_payments"]}
        note: "Inbound fast payments also map to fast_payments (mule and scam proceeds)."
      - id: Q07-C
        label: "Funds can be paid to external accounts in the customer's own name only"
        maps_to: {}
        note: "Own-name-only restriction: no rail added beyond the above."
      - id: Q07-D
        label: "Not sure / not applicable"
        maps_to: {}
        note: "No tags."
  - id: Q08
    section: money_movement
    text: "How are limits and controls set for payments to new payees?"
    help: "Look at daily limits, first-payment holds, cooling-off periods and confirmation of payee."
    type: single
    applies_to_products: [transaction_account, savings_account]
    options:
      - id: Q08-A
        label: "High or no limits for new payees, funds go immediately"
        maps_to: {"payment_rails": ["fast_payments"]}
        note: "Weak new-payee friction increases fast-payment exposure."
      - id: Q08-B
        label: "Moderate limits with some friction (e.g. lower first-day limit, warning messages)"
        maps_to: {"payment_rails": ["fast_payments"]}
        note: "Fast payments still available, so rail remains relevant."
      - id: Q08-C
        label: "Strict controls (e.g. holds on new payees, step-up authentication, payee name checks)"
        maps_to: {}
        note: "Strong controls: assessed by the institution; no extra rail tag."
      - id: Q08-D
        label: "Not sure / not applicable"
        maps_to: {}
        note: "No tags."
  - id: Q09
    section: money_movement
    text: "How can customers put cash in and take cash out of this account?"
    help: "Cash is anonymous and hard to trace. Include ATMs with deposit capability and branch counters."
    type: multi
    applies_to_products: [transaction_account, savings_account]
    options:
      - id: Q09-A
        label: "Cash deposits at ATMs or intelligent deposit machines"
        maps_to: {"payment_rails": ["cash"]}
        note: "Maps to cash."
      - id: Q09-B
        label: "Cash deposits or withdrawals over the branch counter"
        maps_to: {"payment_rails": ["cash"]}
        note: "Maps to cash."
      - id: Q09-C
        label: "Cash withdrawals at ATMs or via cash-out at retailers"
        maps_to: {"payment_rails": ["cash"]}
        note: "Maps to cash."
      - id: Q09-D
        label: "No cash handling is allowed on this product"
        maps_to: {}
        note: "No tags."
      - id: Q09-E
        label: "Not sure / not applicable"
        maps_to: {}
        note: "No tags."
  - id: Q10
    section: money_movement
    text: "Does this account allow cheques, direct debits or bill payments?"
    help: "Cheques are slow to clear and open to alteration; direct debits can be used to pull funds from unaware third parties; biller-code (BPAY style) payments move value to third-party billers and can be used to settle other people's obligations."
    type: multi
    applies_to_products: [transaction_account]
    options:
      - id: Q10-A
        label: "Cheque deposits or cheque books"
        maps_to: {"payment_rails": ["cheque"]}
        note: "Maps to cheque."
      - id: Q10-B
        label: "Direct debits or recurring batch payments (e.g. regular payment authorities)"
        maps_to: {"payment_rails": ["direct_debit_batch"]}
        note: "Maps to direct_debit_batch."
      - id: Q10-C
        label: "Bill payments using biller codes (e.g. BPAY) or bill-pay services"
        maps_to: {"payment_rails": ["bill_payment"]}
        note: "Maps to bill_payment."
      - id: Q10-D
        label: "No cheques, direct debits or bill payments"
        maps_to: {}
        note: "No tags."
      - id: Q10-E
        label: "Not sure / not applicable"
        maps_to: {}
        note: "No tags."
  - id: Q11
    section: money_movement
    text: "What cards are linked to this account, and where can they be used?"
    help: "Include debit cards, digital wallet provisioning, and overseas use."
    type: multi
    applies_to_products: [transaction_account]
    options:
      - id: Q11-A
        label: "Debit card for in-store, ATM and online (card-not-present) use"
        maps_to: {"payment_rails": ["card"]}
        note: "Maps to card."
      - id: Q11-B
        label: "Digital wallets (e.g. phone or watch tap-and-pay)"
        maps_to: {"payment_rails": ["card"]}
        note: "Wallet tap-and-pay is a card token, so it maps to card only (stored_value_wallet is reserved for prepaid or stored-value accounts, not in scope)."
      - id: Q11-C
        label: "Overseas ATM and card use enabled by default or by request"
        maps_to: {"payment_rails": ["card", "cash"]}
        note: "Overseas card and cash withdrawal map to card and cash."
      - id: Q11-D
        label: "No card is linked"
        maps_to: {}
        note: "No tags."
      - id: Q11-E
        label: "Not sure / not applicable"
        maps_to: {}
        note: "No tags."
  - id: Q12
    section: money_movement
    text: "Can customers make international transfers from this account?"
    help: "Include SWIFT transfers, overseas remittance services and foreign-currency payments, in any channel."
    type: multi
    applies_to_products: [transaction_account, savings_account]
    options:
      - id: Q12-A
        label: "SWIFT or bank-to-bank international transfers"
        maps_to: {"payment_rails": ["wire_swift"]}
        note: "Maps to wire_swift."
      - id: Q12-B
        label: "Remittance or money-transfer service, including to high-risk corridors"
        maps_to: {"payment_rails": ["cross_border_remittance"]}
        note: "Maps to cross_border_remittance."
      - id: Q12-C
        label: "International transfers not offered"
        maps_to: {}
        note: "No tags."
      - id: Q12-D
        label: "Not sure / not applicable"
        maps_to: {}
        note: "No tags."
  - id: Q13
    section: money_movement
    text: "Can the account be held jointly, or can someone else operate it for the customer?"
    help: "Joint holders, power of attorney, authorised signatories and carers all count."
    type: multi
    applies_to_products: [transaction_account, savings_account, term_deposit, credit_card]
    options:
      - id: Q13-A
        label: "Joint accounts with any other person (family, friends, unrelated)"
        maps_to: {}
        note: "Baseline segment: no tag (retail is not used because it does not discriminate between typologies)."
      - id: Q13-B
        label: "Power of attorney, guardianship or authorised third-party operators"
        maps_to: {"customer_segments": ["vulnerable_elderly"]}
        note: "Third-party operators map to vulnerable_elderly (financial abuse, coerced access)."
      - id: Q13-C
        label: "Parent or guardian access to a minor's account"
        maps_to: {"customer_segments": ["student_youth"]}
        note: "Maps to student_youth."
      - id: Q13-D
        label: "Single holder only, no third-party access"
        maps_to: {}
        note: "No tags."
      - id: Q13-E
        label: "Not sure / not applicable"
        maps_to: {}
        note: "No tags."
  - id: Q14
    section: product_features
    text: "How are interest or bonus rates structured, and can customers withdraw freely?"
    help: "Bonus rates that depend on deposits or balances can encourage structuring or parking of funds from third parties."
    type: multi
    applies_to_products: [savings_account]
    options:
      - id: Q14-A
        label: "Bonus interest for monthly deposits or regular transfers into the account"
        maps_to: {"payment_rails": ["fast_payments", "direct_debit_batch"]}
        note: "Deposit-count incentives map to fast_payments and direct_debit_batch (incoming transfers)."
      - id: Q14-B
        label: "Bonus interest for keeping a minimum balance or no withdrawals"
        maps_to: {}
        note: "No rail follows; behaviour-based controls apply."
      - id: Q14-C
        label: "High promotional rate that attracts large new money from other institutions"
        maps_to: {"payment_rails": ["fast_payments", "wire_swift"]}
        note: "Large inbound funds map to fast_payments and wire_swift."
      - id: Q14-D
        label: "Customers can withdraw any amount at any time with no notice or limit"
        maps_to: {"payment_rails": ["fast_payments", "cash"]}
        note: "Instant unrestricted withdrawal maps to fast_payments and cash."
      - id: Q14-E
        label: "Withdrawals are limited by number, amount or notice period, or the rate is flat with no conditions"
        maps_to: {}
        note: "Limits reduce pass-through use; no rail tag."
      - id: Q14-F
        label: "Not sure / not applicable"
        maps_to: {}
        note: "No tags."
  - id: Q15
    section: product_features
    text: "What are the minimum and maximum deposit amounts for this term deposit?"
    help: "Large maximums can be used to place significant funds with a low question-asking threshold. Tick all that apply."
    type: multi
    applies_to_products: [term_deposit]
    options:
      - id: Q15-A
        label: "Large maximum (e.g. above $1 million) or no maximum"
        maps_to: {"payment_rails": ["wire_swift"], "customer_segments": ["private_wealth"]}
        note: "High value placements map to wire_swift and private_wealth."
      - id: Q15-B
        label: "Mid-range maximum (e.g. up to a few hundred thousand dollars)"
        maps_to: {}
        note: "Baseline segment: no tag."
      - id: Q15-C
        label: "Low minimum (e.g. $1,000 or less) used by many small savers"
        maps_to: {}
        note: "Baseline segment: no tag (retail is not used because it does not discriminate between typologies)."
      - id: Q15-D
        label: "Not sure / not applicable"
        maps_to: {}
        note: "No tags."
  - id: Q16
    section: product_features
    text: "How can a term deposit be funded?"
    help: "Consider the source of the initial lump sum and any top-ups at rollover."
    type: multi
    applies_to_products: [term_deposit]
    options:
      - id: Q16-A
        label: "Transfer from a customer's existing account with the bank"
        maps_to: {"payment_rails": ["fast_payments"]}
        note: "Internal transfers map to fast_payments."
      - id: Q16-B
        label: "Transfer from an account at another bank or funded by a third party"
        maps_to: {"payment_rails": ["fast_payments"], "customer_segments": ["third_party_funder"]}
        note: "Funding from another bank or a third party maps to fast_payments and third_party_funder."
      - id: Q16-C
        label: "Cash or cheque deposit at a branch"
        maps_to: {"payment_rails": ["cash", "cheque"]}
        note: "Maps to cash and cheque."
      - id: Q16-D
        label: "Funds from overseas"
        maps_to: {"payment_rails": ["wire_swift", "cross_border_remittance"], "customer_segments": ["non_resident"]}
        note: "Overseas funding maps to wire_swift, cross_border_remittance and non_resident."
      - id: Q16-E
        label: "Not sure / not applicable"
        maps_to: {}
        note: "No tags."
  - id: Q17
    section: product_features
    text: "What happens if a customer wants to break the term deposit early?"
    help: "Early break is the point at which a term deposit becomes liquid again, so early-break rules decide how it could be used to layer funds."
    type: single
    applies_to_products: [term_deposit]
    options:
      - id: Q17-A
        label: "Allowed with notice and a penalty, but paid out to any account the customer nominates"
        maps_to: {"payment_rails": ["fast_payments", "wire_swift"]}
        note: "Liquid early exit to arbitrary accounts maps to fast_payments and wire_swift."
      - id: Q17-B
        label: "Allowed only in exceptional circumstances (hardship, death) and paid to the original account"
        maps_to: {}
        note: "Restricted: no extra rail."
      - id: Q17-C
        label: "Not allowed"
        maps_to: {}
        note: "No tags."
      - id: Q17-D
        label: "Not sure / not applicable"
        maps_to: {}
        note: "No tags."
  - id: Q18
    section: product_features
    text: "Where can maturity proceeds be paid?"
    help: "Third-party and cheque payouts break the link between the customer and the original source of funds."
    type: multi
    applies_to_products: [term_deposit]
    options:
      - id: Q18-A
        label: "To the customer's own account at the same bank only"
        maps_to: {}
        note: "Closed loop: no tags."
      - id: Q18-B
        label: "To an account at another bank in the customer's name"
        maps_to: {"payment_rails": ["fast_payments"]}
        note: "Maps to fast_payments."
      - id: Q18-C
        label: "To a third party's account, or to an account in another name"
        maps_to: {"payment_rails": ["fast_payments"], "customer_segments": ["professional_intermediary"]}
        note: "Third-party payout maps to fast_payments; payouts to other names also hint at intermediary involvement, mapped to professional_intermediary."
      - id: Q18-D
        label: "By cheque"
        maps_to: {"payment_rails": ["cheque"]}
        note: "Maps to cheque."
      - id: Q18-E
        label: "Not sure / not applicable"
        maps_to: {}
        note: "No tags."
  - id: Q19
    section: product_features
    text: "Do term deposits roll over automatically, and can funds be added or the nominated account changed?"
    help: "Automatic rollover with changes to nominated accounts is a common ATO and layering route."
    type: multi
    applies_to_products: [term_deposit]
    options:
      - id: Q19-A
        label: "Automatic rollover with the option to top up"
        maps_to: {"payment_rails": ["fast_payments", "cash"]}
        note: "Top-ups at rollover map to fast_payments and cash."
      - id: Q19-B
        label: "Nominated payout account can be changed by phone, online or in branch"
        maps_to: {"payment_rails": ["fast_payments"], "customer_segments": ["vulnerable_elderly"]}
        note: "Remote changes map to fast_payments; vulnerable customers are targeted for account takeover."
      - id: Q19-C
        label: "Automatic rollover only, no changes without a new application"
        maps_to: {}
        note: "No tags."
      - id: Q19-D
        label: "Not sure / not applicable"
        maps_to: {}
        note: "No tags."
  - id: Q44
    section: product_features
    text: "Can the term deposit be used as security for borrowing?"
    help: "Loans secured on deposits are a classic loan-back route: borrowed funds are paid out while the deposit is broken or liquidated to repay."
    type: single
    applies_to_products: [term_deposit]
    options:
      - id: Q44-A
        label: "Yes, the bank lends against the deposit (lien or loan against deposit)"
        maps_to: {"payment_rails": ["loan_disbursement", "loan_early_payout"]}
        note: "Loan against deposit: loan_disbursement and loan_early_payout."
      - id: Q44-B
        label: "Yes, it can secure borrowing by someone else (third party or other lender)"
        maps_to: {"payment_rails": ["loan_disbursement"], "customer_segments": ["third_party_funder"]}
        note: "Deposit securing a third party's borrowing: loan_disbursement and third_party_funder."
      - id: Q44-C
        label: "No, the deposit cannot be used as security"
        maps_to: {}
        note: "No tags."
      - id: Q44-D
        label: "Not sure / not applicable"
        maps_to: {}
        note: "No tags."
  - id: Q20
    section: product_features
    text: "Can customers take cash advances on the credit card?"
    help: "Cash advances move credit into cash and are a known route for fraud proceeds and gambling."
    type: multi
    applies_to_products: [credit_card]
    options:
      - id: Q20-A
        label: "Cash advance at ATMs or branches"
        maps_to: {"payment_rails": ["cash", "card", "bnpl_cash_like"]}
        note: "Cash advances are cash-like credit: cash, card and bnpl_cash_like."
      - id: Q20-B
        label: "Cash-like transactions (e.g. gambling, money orders, crypto purchases)"
        maps_to: {"payment_rails": ["card", "crypto_onramp_offramp", "bnpl_cash_like"]}
        note: "Cash-like purchases map to card, crypto on/off-ramp and bnpl_cash_like."
      - id: Q20-C
        label: "Cash advances and cash-like transactions are blocked"
        maps_to: {}
        note: "No tags."
      - id: Q20-D
        label: "Not sure / not applicable"
        maps_to: {}
        note: "No tags."
  - id: Q21
    section: product_features
    text: "Can customers transfer balances from other cards or use the card to pay other lenders?"
    help: "Balance transfers and bill-pay can be used to cycle funds between facilities."
    type: multi
    applies_to_products: [credit_card]
    options:
      - id: Q21-A
        label: "Balance transfers from other credit cards or personal loans"
        maps_to: {"payment_rails": ["card", "loan_disbursement"]}
        note: "Balance transfers pay out credit to other lenders: card and loan_disbursement."
      - id: Q21-B
        label: "Bill payments (biller codes) or transfers to third-party accounts from the card"
        maps_to: {"payment_rails": ["bill_payment", "card", "fast_payments"]}
        note: "Bill payments or transfers from the card map to bill_payment, card and fast_payments."
      - id: Q21-C
        label: "Neither"
        maps_to: {}
        note: "No tags."
      - id: Q21-D
        label: "Not sure / not applicable"
        maps_to: {}
        note: "No tags."
  - id: Q22
    section: product_features
    text: "What happens when customers overpay or hold a credit balance on the card?"
    help: "Overpayments can be refunded to a different account, creating a \"clean\" payout."
    type: multi
    applies_to_products: [credit_card]
    options:
      - id: Q22-A
        label: "Credit balances above the limit are allowed and refunded on request"
        maps_to: {"payment_rails": ["fast_payments", "cash"]}
        note: "Maps to fast_payments and cash."
      - id: Q22-B
        label: "Refunds are paid to a different account or by cheque"
        maps_to: {"payment_rails": ["cheque", "wire_swift"]}
        note: "Maps to cheque and wire_swift."
      - id: Q22-C
        label: "Refunds only go back to the account that made the payment"
        maps_to: {}
        note: "Closed loop: no tags."
      - id: Q22-D
        label: "Not sure / not applicable"
