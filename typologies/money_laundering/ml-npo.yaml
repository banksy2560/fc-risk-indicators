typology:
  id: ML-NPO
  name: Charities and Non-Profit Organisations Misuse for Money Laundering
  domain: money_laundering
  description: Use of charities and NPOs, or their accounts and fundraising channels, to hold, mix or
    move illicit funds that appear as donations, grants or program spending. This typology covers the
    money laundering angle only.
  exposure:
    channels:
    - branch
    - online_banking
    payment_rails:
    - cash
    - wire_swift
    - cross_border_remittance
    customer_segments:
    - nonprofit
    products:
    - transaction_account
    basis: ai_inferred
    rationale: Charity accounts and donation channels used for mixing and moving funds.
    consumer:
      relevant: false
      products: []
      channels: []
      basis: ai_inferred
      rationale: Charity and NPO accounts are organisational customers, not retail consumers.
  stage:
  - placement
  - layering
  sectors:
  - banking
  - payments
  - dnfbp
  sources:
  - 'FATF, Best Practices: Combating the Abuse of Non-Profit Organisations (Recommendation 8) (2015; updated
    2023) <https://www.fatf-gafi.org/en/publications/Financialinclusionandnpoissues/Bpp-combating-abuse-npo.html>
    [corrected, agent-reviewed]'
  - FATF, Risk of Terrorist Abuse in Non-Profit Organisations (2014) and related guidance (general) <https://www.fatf-gafi.org/en/publications/Methodsandtrends/Risk-terrorist-abuse-non-profits.html>
    [agent-reviewed]
  - Charity regulators' published guidance on financial crime (general) [too vague, unverified]
  indicators:
  - ref: IND-TXN-013
    legacy_id: ML-NPO-001
    context: Receipts out of line with size, reach or history of the NPO.
    name_in_typology: Donations inconsistent with fundraising profile
    false_positive_context: Appeals and bequests.
    controls:
    - CTL-042
    - CTL-012
  - ref: IND-TXN-034
    legacy_id: ML-NPO-002
    context: Substantial cash donations without donor identity.
    name_in_typology: Large anonymous or cash donations
    false_positive_context: Collections.
    controls:
    - CTL-062
    - CTL-039
  - ref: IND-TXN-001
    legacy_id: ML-NPO-003
    context: Money leaves without program activity.
    name_in_typology: Funds quickly moved to unrelated parties or abroad
    false_positive_context: Overseas projects.
    controls:
    - CTL-022
    - CTL-040
  - ref: IND-OWN-005
    legacy_id: ML-NPO-004
    context: Unclear trustees, control or beneficial owners.
    name_in_typology: Opaque governance or controllers
    false_positive_context: Volunteer boards.
    controls:
    - CTL-009
    - CTL-116
  - ref: IND-TYP-037
    legacy_id: ML-NPO-005
    context: Spending outside charitable purposes.
    false_positive_context: Mission drift.
    controls:
    - CTL-042
    - CTL-014
  - ref: IND-DOC-044
    legacy_id: ML-NPO-006
    context: Raising funds without registration or authority.
    false_positive_context: Small groups.
    controls:
    - CTL-116
    - CTL-032
  - ref: IND-BEH-093
    legacy_id: ML-NPO-007
    context: Transactions of a private nature.
    false_positive_context: Expenses.
    controls:
    - CTL-043
    - CTL-168
  - ref: IND-GEO-018
    legacy_id: ML-NPO-008
    context: Programs in high-risk areas without controls.
    name_in_typology: Connections to high-risk jurisdictions
    false_positive_context: Humanitarian work.
    controls:
    - CTL-023
    - CTL-112
  - ref: IND-DOC-045
    legacy_id: ML-NPO-009
    context: Payments to suppliers with weak evidence.
    false_positive_context: Small suppliers.
    controls:
    - CTL-113
    - CTL-175
