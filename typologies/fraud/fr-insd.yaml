typology:
  id: FR-INSD
  name: Payroll, Employee, Insider Fraud and Collusion
  domain: fraud
  description: Employees or contractors abuse access to divert funds, create ghost employees, falsify
    expenses or collude with outsiders. Weak segregation of duties and unchecked privileged access raise
    risk.
  exposure:
    channels:
    - online_banking
    payment_rails:
    - payroll_expense
    - direct_debit_batch
    customer_segments:
    - employee_internal
    - corporate
    - sme
    products:
    - transaction_account
    basis: ai_inferred
    rationale: Ghost employees, expense and vendor fraud within payroll and procurement flows, committed
      by staff; also bank staff abusing privileged access.
  sectors:
  - all
  sources:
  - 'ACFE, Occupational Fraud 2024: A Report to the Nations (2024) <https://www.acfe.com/report-to-the-nations/2024>
    [corrected, agent-reviewed]'
  - Fraud Advisory Panel (UK), guidance on internal fraud (general) [too vague, unverified]
  - COSO and ACFE, Fraud Risk Management Guide (2016) <https://www.coso.org/> [corrected, agent-reviewed]
  indicators:
  - ref: IND-TYP-027
    legacy_id: FR-INSD-001
    context: Payroll records show employees without HR evidence or shared bank details.
    false_positive_context: Shared family accounts.
    controls:
    - CTL-175
    - CTL-077
    - CTL-083
    references:
    - ACFE, Report to the Nations (published biennially)
  - ref: IND-TXN-009
    legacy_id: FR-INSD-002
    context: Pattern of claims under thresholds or with duplicate receipts.
    name_in_typology: Expense claims just below approval limits
    false_positive_context: Genuine low-value costs.
    controls:
    - CTL-175
    - CTL-037
    - CTL-163
    references:
    - ACFE, Report to the Nations (published biennially)
  - ref: IND-BEH-072
    legacy_id: FR-INSD-003
    context: Behavioural red flag for concealment.
    false_positive_context: Personal preference.
    controls:
    - CTL-077
    - CTL-163
    - CTL-094
    references:
    - ACFE, Report to the Nations (published biennially)
  - ref: IND-BEH-073
    legacy_id: FR-INSD-004
    context: Visible spending beyond known income.
    false_positive_context: Inheritance.
    controls:
    - CTL-163
    - CTL-014
    - CTL-094
    references:
    - ACFE, Report to the Nations (published biennially)
  - ref: IND-BEH-019
    legacy_id: FR-INSD-005
    context: Privileged users bypass approvals or alter records.
    name_in_typology: Excessive access or override of controls
    false_positive_context: Administrators.
    controls:
    - CTL-077
    - CTL-175
    - CTL-091
    references:
    - ACFE, Report to the Nations (published biennially)
  - ref: IND-TXN-072
    legacy_id: FR-INSD-006
    context: Staff accounts credited from customers, vendors or dormant accounts.
    false_positive_context: Salary advances.
    controls:
    - CTL-091
    - CTL-037
    - CTL-163
    references:
    - ACFE, Report to the Nations (published biennially)
  - ref: IND-CPT-005
    legacy_id: FR-INSD-007
    context: Procurement or payment to entity linked to an employee.
    name_in_typology: Vendor with staff-linked address or bank details
    false_positive_context: Coincidence.
    controls:
    - CTL-078
    - CTL-175
    - CTL-059
    references:
    - ACFE, Report to the Nations (published biennially)
  - ref: IND-BEH-074
    legacy_id: FR-INSD-008
    context: Repeated complaints or unauthorised changes by one employee.
    false_positive_context: Difficult customers.
    controls:
    - CTL-163
    - CTL-094
    - CTL-170
    references:
    - ACFE, Report to the Nations (published biennially)
  - ref: IND-TXN-073
    legacy_id: FR-INSD-009
    context: Changes made around pay run by one user.
    false_positive_context: Genuine corrections.
    controls:
    - CTL-077
    - CTL-078
    - CTL-175
    references:
    - ACFE, Report to the Nations (published biennially)
