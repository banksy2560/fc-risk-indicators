typology:
  id: TX-SKIM
  name: Cash-Economy Skimming and Sales Suppression
  domain: tax_evasion
  description: Cash-intensive businesses underreport takings through suppressed sales records, electronic
    sales suppression tools or diverting cash from the till. The unreported cash is spent outside the
    banking system, deposited in structured amounts or moved offshore.
  exposure:
    channels:
    - branch
    - atm
    - merchant_acquiring
    payment_rails:
    - cash
    - card
    - cross_border_remittance
    customer_segments:
    - sme
    products:
    - transaction_account
    - merchant_services
    basis: ai_inferred
    rationale: Cash-intensive business sales suppression, structured deposits.
  sectors:
  - banking
  - payments
  - mvts
  - casino_gaming
  sources:
  - 'OECD, Electronic Sales Suppression: A Threat to Tax Revenues (2013) [unverified]'
  - 'OECD, Shining Light on the Shadow Economy: Opportunities and Threats (2017) [corrected, unverified]'
  - FATF/OECD, Money Laundering Awareness Handbook for Tax Examiners and Tax Auditors (2012) [replacement
    suggested, unverified]
  - FATF and OECD, Money Laundering Awareness Handbook for Tax Examiners and Tax Auditors (2012) [unverified]
  indicators:
  - ref: IND-TXN-142
    legacy_id: TX-SKIM-001
    context: Card acquiring volumes or supplier purchases suggest higher sales than the business reports
      to authorities.
    false_positive_context: Timing differences, refunds and tips affect reconciliation.
    controls:
    - CTL-055
    - CTL-065
    - CTL-042
  - ref: IND-TXN-143
    legacy_id: TX-SKIM-002
    context: A business with high card use but little cash banking, despite sector norms of cash trade.
    false_positive_context: Cash may be used to pay suppliers legitimately.
    controls:
    - CTL-064
    - CTL-055
  - ref: IND-BEH-111
    legacy_id: TX-SKIM-003
    context: Owner pays suppliers, rent or staff in cash taken from takings before banking.
    false_positive_context: Small suppliers sometimes insist on cash.
    controls:
    - CTL-011
    - CTL-169
  - ref: IND-TXN-007
    legacy_id: TX-SKIM-004
    context: Cash banked in many amounts just below reporting thresholds, often across multiple branches
      or personal accounts.
    name_in_typology: Structured cash deposits across branches or accounts
    severity_in_typology: medium
    false_positive_context: Some businesses make routine daily deposits in small sums.
    controls:
    - CTL-038
    - CTL-039
  - ref: IND-PRD-061
    legacy_id: TX-SKIM-005
    context: Use of unfamiliar till software, offline mode usage, or missing sequential receipts.
    false_positive_context: Software glitches or offline trading can cause gaps.
    controls:
    - CTL-057
    - CTL-067
    - CTL-065
  - ref: IND-BEH-112
    legacy_id: TX-SKIM-006
    context: Frequent voids and cash refunds conceal sales.
    false_positive_context: Retail returns drive legitimate refunds.
    controls:
    - CTL-057
    - CTL-010
  - ref: IND-CUS-001
    legacy_id: TX-SKIM-007
    context: Spending, assets and property purchases exceed what reported profits could support.
    name_in_typology: Owner lifestyle inconsistent with declared profits
    false_positive_context: Family wealth or gifts could explain this.
    controls:
    - CTL-043
    - CTL-013
  - ref: IND-PRD-062
    legacy_id: TX-SKIM-008
    context: Cash takings leave the country via money transfer, hawala-style networks or couriers.
    false_positive_context: Diaspora remittance is common and lawful.
    controls:
    - CTL-042
    - CTL-063
