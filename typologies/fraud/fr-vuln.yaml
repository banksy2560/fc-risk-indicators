typology:
  id: FR-VULN
  name: Elder and Vulnerable Customer Financial Abuse
  domain: fraud
  description: Older or vulnerable people are exploited by relatives, carers, scammers or persons holding
    power of attorney. Warning signs include sudden changes in banking behaviour and the presence of third
    parties directing transactions.
  exposure:
    channels:
    - branch
    - call_centre
    - face_to_face_professional
    payment_rails:
    - cash
    - fast_payments
    - card
    - loan_disbursement
    customer_segments:
    - vulnerable_elderly
    products:
    - transaction_account
    - savings_account
    - term_deposit
    - investment_securities
    basis: ai_inferred
    rationale: Third-party directed withdrawals and transfers; branch intervention.
    consumer:
      relevant: true
      products:
      - transaction_account
      - savings_account
      - term_deposit
      - credit_card
      - personal_loan
      channels:
      - branch
      - call_centre
      - online_banking
      basis: ai_inferred
      rationale: Third parties, carers or attorneys directing withdrawals, term deposit breaks and borrowing;
        branch and phone staff are key detection points.
  sectors:
  - banking
  - securities
  - insurance
  sources:
  - FinCEN, Advisory on Elder Financial Exploitation (2022) <https://www.fincen.gov/resources/advisoriesbulletinsfact-sheets/advisories>
    [agent-reviewed]
  - UK Finance, Annual Fraud Report (specify year, e.g. 2025) <https://www.ukfinance.org.uk/> [corrected,
    agent-reviewed]
  - FCA, Guidance for firms on the fair treatment of vulnerable customers (FG21/1, 2021) <https://www.fca.org.uk/publications/finalised-guidance/guidance-firms-fair-treatment-vulnerable-customers>
    [corrected, agent-reviewed]
  indicators:
  - ref: IND-TXN-013
    legacy_id: FR-VULN-001
    context: 'Victim-side: unusual cash or transfers inconsistent with usual pattern.'
    name_in_typology: Uncharacteristic large withdrawals or transfers
    false_positive_context: Planned gifts or care costs.
    controls:
    - CTL-091
    - CTL-075
    - CTL-170
    references:
    - FinCEN, Advisory on Elder Financial Exploitation (2022)
  - ref: IND-BEH-004
    legacy_id: FR-VULN-002
    context: Another person speaks for the customer or dictates instructions.
    name_in_typology: Third party accompanies and directs the customer
    false_positive_context: Helpful relatives.
    controls:
    - CTL-170
    - CTL-075
    - CTL-070
    references:
    - FinCEN, Advisory on Elder Financial Exploitation (2022)
  - ref: IND-CUS-035
    legacy_id: FR-VULN-003
    context: Access given to a new person shortly before unusual activity.
    false_positive_context: Genuine care arrangements.
    controls:
    - CTL-014
    - CTL-088
    - CTL-170
    references:
    - FinCEN, Advisory on Elder Financial Exploitation (2022)
  - ref: IND-BEH-083
    legacy_id: FR-VULN-004
    context: Customer appears unsure of balances, recent transactions or reason for payments.
    false_positive_context: Normal ageing or stress.
    controls:
    - CTL-170
    - CTL-075
    - CTL-074
    references:
    - FinCEN, Advisory on Elder Financial Exploitation (2022)
  - ref: IND-TXN-085
    legacy_id: FR-VULN-005
    context: Frequent payments or purchases benefiting a carer or acquaintance.
    false_positive_context: Genuine family support.
    controls:
    - CTL-091
    - CTL-075
    - CTL-094
    references:
    - FinCEN, Advisory on Elder Financial Exploitation (2022)
  - ref: IND-TXN-086
    legacy_id: FR-VULN-006
    context: Cards used where customer is unlikely to be present.
    false_positive_context: Delegated errands.
    controls:
    - CTL-091
    - CTL-088
    - CTL-075
    references:
    - FinCEN, Advisory on Elder Financial Exploitation (2022)
  - ref: IND-BEH-084
    legacy_id: FR-VULN-007
    context: 'Victim-side: repeated scam payments or telephone contacts.'
    false_positive_context: One-off events.
    controls:
    - CTL-075
    - CTL-068
    - CTL-071
    references:
    - FinCEN, Advisory on Elder Financial Exploitation (2022)
  - ref: IND-CUS-014
    legacy_id: FR-VULN-008
    context: Mail redirected to a third party.
    name_in_typology: Changes to statements delivery, address or contact
    severity_in_typology: medium
    false_positive_context: Moving home.
    controls:
    - CTL-088
    - CTL-070
    - CTL-075
    references:
    - FinCEN, Advisory on Elder Financial Exploitation (2022)
  - ref: IND-TXN-087
    legacy_id: FR-VULN-009
    context: Large assets liquidated with hurried instructions.
    false_positive_context: Downsizing.
    controls:
    - CTL-170
    - CTL-071
    - CTL-075
    references:
    - FinCEN, Advisory on Elder Financial Exploitation (2022)
