typology:
  id: ML-THIRDPARTY
  name: Third-Party Payments and Commingling
  domain: money_laundering
  description: Use of third parties to make or receive payments, and the mixing of illicit funds with
    legitimate funds in business, personal or client accounts, to obscure source and ownership. Includes
    accounts used by someone other than the holder.
  exposure:
    channels:
    - online_banking
    payment_rails:
    - fast_payments
    - wire_swift
    - cash
    - bill_payment
    customer_segments:
    - retail
    - sole_trader
    - third_party_funder
    - professional_intermediary
    products:
    - transaction_account
    basis: ai_inferred
    rationale: Unrelated third-party payers/payees and commingling in personal/business accounts.
    consumer:
      relevant: true
      products:
      - transaction_account
      - savings_account
      - credit_card
      - personal_loan
      channels:
      - mobile_app
      - online_banking
      - branch
      - call_centre
      basis: ai_inferred
      rationale: Third-party payments, shared mandates and account use by non-holders across everyday,
        savings, card repayments and loan funding.
  stage:
  - layering
  sectors:
  - banking
  - payments
  - corporate_services
  sources:
  - 'FATF, Guidance for a Risk-Based Approach: The Banking Sector (2014) [corrected, unverified]'
  - FATF, Professional Money Laundering (2018) [unverified]
  - Wolfsberg Group, Wolfsberg AML Principles / Wolfsberg Guidance on Customer Due Diligence [replacement
    suggested, unverified]
  indicators:
  - ref: IND-CPT-058
    legacy_id: ML-THIRDPARTY-001
    context: Payers or payees have no apparent link to the customer.
    severity_in_typology: high
    false_positive_context: Gifts, gatekeepers, family.
    controls:
    - CTL-046
    - CTL-049
    - CTL-053
  - ref: IND-CUS-043
    legacy_id: ML-THIRDPARTY-002
    context: Business-like volumes in personal account.
    false_positive_context: Sole traders.
    controls:
    - CTL-042
    - CTL-014
  - ref: IND-TXN-117
    legacy_id: ML-THIRDPARTY-003
    context: Business income blended with unexplained inflows.
    false_positive_context: Owner loans.
    controls:
    - CTL-055
    - CTL-065
  - ref: IND-BEH-005
    legacy_id: ML-THIRDPARTY-004
    context: Signs of third-party control such as shared devices, mandates.
    name_in_typology: Account controlled by someone other than holder
    false_positive_context: Carer or agent arrangements.
    controls:
    - CTL-018
    - CTL-090
  - ref: IND-PRD-051
    legacy_id: ML-THIRDPARTY-005
    context: Professionals' client accounts used as banks.
    false_positive_context: Client accounts hold funds.
    controls:
    - CTL-042
    - CTL-024
  - ref: IND-CPT-041
    legacy_id: ML-THIRDPARTY-006
    context: Staff or family accounts used for business flows.
    false_positive_context: Family businesses.
    controls:
    - CTL-046
    - CTL-005
  - ref: IND-TXN-118
    legacy_id: ML-THIRDPARTY-007
    context: Recurring payments to unexplained counterparties.
    false_positive_context: Subscriptions.
    controls:
    - CTL-042
    - CTL-011
  - ref: IND-DOC-047
    legacy_id: ML-THIRDPARTY-008
    context: Directors or others deposit funds without documentation.
    name_in_typology: Loans or deposits from unknown persons into company accounts
    false_positive_context: Capital contributions.
    controls:
    - CTL-151
    - CTL-012
