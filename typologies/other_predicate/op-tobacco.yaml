typology:
  id: OP-TOBACCO
  name: Illicit Tobacco and Excise Evasion
  domain: other_predicate
  description: Smuggling, counterfeit and illegal manufacture of tobacco and other excise goods to avoid
    duty, including diversion from duty suspension, undeclared transit and sale through informal retail.
    Cash proceeds are layered via small shops, wholesalers and cross-border transfers.
  exposure:
    channels:
    - branch
    - merchant_acquiring
    payment_rails:
    - cash
    - cross_border_remittance
    - wire_swift
    - trade_instruments
    customer_segments:
    - sme
    - corporate
    products:
    - transaction_account
    - merchant_services
    - trade_finance
    basis: ai_inferred
    rationale: Cash-heavy retailers and wholesalers, cash deposits and supplier remittances.
  sectors:
  - banking
  - payments
  - mvts
  - corporate_services
  sources:
  - FATF, Illicit Tobacco Trade (2012) [unverified]
  - WHO FCTC, Protocol to Eliminate Illicit Trade in Tobacco Products (2012) [corrected, unverified]
  - OECD and EUIPO, public material on illicit trade [replacement suggested, unverified]
  - World Customs Organization, public material on tobacco smuggling [replacement suggested, unverified]
  indicators:
  - ref: IND-TXN-125
    legacy_id: OP-TOBACCO-001
    context: Volumes of cigarettes or alcohol bought by a retailer or distributor exceed plausible consumption.
    false_positive_context: Border areas and tourism cause higher sales.
    controls:
    - CTL-139
    - CTL-112
  - ref: IND-DOC-052
    legacy_id: OP-TOBACCO-002
    context: Duty-suspended shipments disappear or end up in domestic markets.
    false_positive_context: Documentation delays occur.
    controls:
    - CTL-123
    - CTL-125
    - CTL-140
  - ref: IND-CUS-013
    legacy_id: OP-TOBACCO-003
    context: Convenience stores with cash deposits not matching stock purchases.
    name_in_typology: Cash-heavy small shops with large tobacco turnover and little card use
    false_positive_context: Cash trade is normal.
    controls:
    - CTL-055
    - CTL-024
  - ref: IND-GEO-024
    legacy_id: OP-TOBACCO-004
    context: Transfers linked to zones known for tobacco diversion.
    false_positive_context: Zones host legitimate trade.
    controls:
    - CTL-127
  - ref: IND-PRD-055
    legacy_id: OP-TOBACCO-005
    context: Prices well below duty-paid minimums.
    name_in_typology: Counterfeit or unbranded cigarettes sold with 'cheap' pricing
    false_positive_context: Promotions exist but not below duty.
    controls:
    - CTL-124
    - CTL-173
  - ref: IND-CPT-048
    legacy_id: OP-TOBACCO-006
    context: Orders for tobacco-making machinery, paper, filters.
    false_positive_context: Roll-your-own firms are lawful.
    controls:
    - CTL-128
    - CTL-163
  - ref: IND-TXN-126
    legacy_id: OP-TOBACCO-007
    context: Regular remittances to suppliers in source countries without invoices.
    false_positive_context: Diaspora shops import goods.
    controls:
    - CTL-140
  - ref: IND-BEH-105
    legacy_id: OP-TOBACCO-008
    context: Frequent rental or purchase of vans and containers.
    false_positive_context: Logistics firms rent vehicles.
    controls:
    - CTL-125
    - CTL-097
