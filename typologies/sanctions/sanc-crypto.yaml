typology:
  id: SANC-CRYPTO
  name: Crypto Sanctions Evasion
  domain: sanctions
  description: Designated persons and sanctioned jurisdictions may use virtual assets to hold or move
    value outside the traditional banking system, via exchanges with weak controls, unhosted wallets,
    mixers and cross-chain swaps. Blockchain analytics, geolocation and travel rule data are the core
    detection tools.
  exposure:
    channels:
    - online_banking
    - mobile_app
    payment_rails:
    - crypto_onramp_offramp
    - fast_payments
    customer_segments:
    - retail
    - fintech_psp
    - non_resident
    - designated_person
    products:
    - crypto_custody
    - transaction_account
    basis: ai_inferred
    rationale: Exchanges, unhosted wallets, mixers and stablecoins; VASP exposure.
    consumer:
      relevant: true
      products:
      - transaction_account
      channels:
      - mobile_app
      - online_banking
      basis: ai_inferred
      rationale: Customers send or receive funds to crypto exchanges and wallets from everyday accounts;
        custody itself out of scope.
  sectors:
  - crypto
  - fintech
  - banking
  sources:
  - OFAC, Sanctions Compliance Guidance for the Virtual Currency Industry (2021) [corrected, unverified]
  - FATF, Targeted Update on Implementation of the FATF Standards on Virtual Assets and VASPs (annual,
    2019 onward) [corrected, unverified]
  - OFSI, Cryptoassets Threat Assessment (July 2025); OFSI/FCA/BoE, Joint statement on sanctions and the
    cryptoasset sector (March 2022) [replacement suggested, unverified]
  - FinCEN (US Treasury), FinCEN Alert on the A7 Network (FIN-2026-Alert007) (2026-10-01) <https://www.fincen.gov/system/files/2026-10/FinCEN-Alert-A7-Network.pdf>
    [agent-retrieved 2026-11-27]
  indicators:
  - ref: IND-CPT-050
    legacy_id: SANC-CRYPTO-001
    context: Customer transacts with addresses published in sanctions lists or attributed by analytics.
    name_in_typology: Wallet addresses attributed to designated persons
    false_positive_context: Address clustering errors occur.
    controls:
    - CTL-145
    - CTL-103
    - CTL-031
  - ref: IND-GEO-026
    legacy_id: SANC-CRYPTO-002
    context: Technical indicators suggest the user is located in a comprehensively sanctioned area.
    false_positive_context: Privacy tools are widely used.
    controls:
    - CTL-035
    - CTL-092
  - ref: IND-CPT-011
    legacy_id: SANC-CRYPTO-003
    context: Funds flow to or from VASPs known for weak sanctions controls.
    name_in_typology: Exposure to non-compliant exchanges in sanctioned or high-risk locations
    false_positive_context: Indirect exposure is difficult to assess.
    controls:
    - CTL-149
    - CTL-147
  - ref: IND-PRD-056
    legacy_id: SANC-CRYPTO-004
    context: Funds are obfuscated shortly after arrival.
    name_in_typology: Use of mixers or privacy services after inbound transfers from higher-risk sources
    severity_in_typology: medium
    false_positive_context: Privacy use is lawful.
    controls:
    - CTL-147
    - CTL-022
  - ref: IND-TYP-019
    legacy_id: SANC-CRYPTO-005
    context: Wallets receive funds from ransomware or theft with attribution.
    name_in_typology: Ransom or stolen funds paid to addresses linked to designated actors
    false_positive_context: Victims pay without knowing attribution.
    controls:
    - CTL-083
    - CTL-036
  - ref: IND-TXN-129
    legacy_id: SANC-CRYPTO-006
    context: Purchases with limited traceability to source of funds.
    false_positive_context: Cash purchase happens in some markets.
    controls:
    - CTL-012
    - CTL-072
  - ref: IND-TXN-130
    legacy_id: SANC-CRYPTO-007
    context: Large stablecoin balances held with limited stated purpose by customers linked to designated
      persons.
    false_positive_context: Stablecoins are widely used for savings.
    controls:
    - CTL-029
    - CTL-012
  - ref: IND-BEH-005
    legacy_id: SANC-CRYPTO-008
    context: Customer account is used for third-party funds.
    name_in_typology: Account sharing or intermediary accounts used by third parties
    severity_in_typology: medium
    false_positive_context: Family sharing occurs.
    controls:
    - CTL-090
    - CTL-016
  - ref: IND-TXN-165
    context: Holding or trading a sanctions-linked settlement stablecoin, including wrapped versions on
      other chains.
    controls:
    - CTL-145
    - CTL-029
    references:
    - FinCEN (US Treasury), FinCEN Alert on the A7 Network (FIN-2026-Alert007) (2026-10-01) <https://www.fincen.gov/system/files/2026-10/FinCEN-Alert-A7-Network.pdf>
      [agent-retrieved 2026-11-27]
  - ref: IND-TXN-162
    context: Use of stablecoins advertised as unfreezable to keep value beyond the reach of asset freezes.
    controls:
    - CTL-145
    - CTL-147
    references:
    - FinCEN (US Treasury), FinCEN Alert on Money Laundering Activity Associated with Digital Asset Investment
      Scam Centers (FIN-2026-Alert005) (2026-09-03) <https://www.fincen.gov/system/files/2026-08/FinCEN-Alert-Scam-Centers.pdf>
      [agent-retrieved 2026-11-27]
